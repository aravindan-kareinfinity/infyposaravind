<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Addons / Target &amp; Margins
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="SaveTargetMarginConfig()"><a><i class="fa fa-download"></i>Save Configruation</a></li>
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'Barcode Details', 'barcodedetails')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="ReportTargetMargin()"><a><i class="fa fas fa-search-plus"></i>Report</a></li>
            <li style="cursor:pointer" ng-click="Export()"><a><i class="fa fa-file-excel-o"></i>Download</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3" style="padding-left:0px">

                    <!--<div class="row row-padbot-15">
        <div class="form-group">

                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-4 control-label">LOCATION</label>
                            <div class="col-md-8">
                                <select class="input-sm form-control" select2=""
                                        style="width: 100%;" ng-options="item.id  as item.name for item in Locations track by item.id"
                                        ng-model="SearchCondition.locationid"></select>

                            </div>
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-4 control-label">SECTION</label>
                            <div class="col-md-8">
                                <select class="input-sm form-control" select2=""
                                        ng-change="SectionChanged()"
                                        style="width: 100%;" ng-options="item.id  as item.name for item in SalesCounter track by item.id"
                                        ng-model="SearchCondition.sectionid"></select>
                            </div>
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-4 control-label">Target Range</label>
                            <div class="col-md-8">
                                <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.targetfrom,SearchCondition.targettodate">

                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-4 control-label">Sales Range</label>
                            <div class="col-md-8">
                                <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.salesfromdate,SearchCondition.salestodate">

                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12" id="gridProducts">

                        </div>

                    </div>
                </div>
                
                <div class="col-md-9 no-padding">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12 no-padding" id="gridContainer">
                        </div>
                        <div class="col-md-12 no-padding" ng-show="TargetValue >0 || SaleValue>0">
                            <div class="col-md-2 no-padding">
                                <label>Target Qty</label>
                                <div style="font-size:large;color:orangered">{{TargetQty|number:2}}</div>
                            </div>
                            <div class="col-md-2">
                                <label>Sale Qty</label>
                                <div style="font-size:large;color:orangered">{{SaleQty|number:2}}</div>
                            </div>
                            <div class="col-md-2">
                                <label>Qty %</label>
                                <div style="font-size:large;color:orangered">{{SaleQty/TargetQty*100-100|number:2}}</div>
                            </div>

                            <div class="col-md-2">
                                <label>Target Value</label>
                                <div style="font-size:large;color:orangered">{{TargetValue|number:2}}</div>
                            </div>
                            <div class="col-md-2">
                                <label>Sale Qty</label>
                                <div style="font-size:large;color:orangered">{{SaleValue|number:2}}</div>
                            </div>
                            <div class="col-md-2 no-padding">
                                <label>Value %</label>
                                <div style="font-size:large;color:orangered">{{SaleValue/TargetValue*100-100|number:2}}</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </section>
</div>
