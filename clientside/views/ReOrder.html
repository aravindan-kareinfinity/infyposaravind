
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Settings / Stock Reorder Configuration
        </h1>
        <ol class="breadcrumb" ng-hide="ShowReport">
            <li style="cursor:pointer" ng-show="DisplayMode == 'Matrix'" ng-click="SaveMatrix()"><a><i class="fa fa-save"></i>Save All</a></li>
            <li style="cursor:pointer" ng-show="ReOrder.rules && DisplayMode != 'Matrix'" ng-click="Save()"><a><i class="fa fa-save"></i>Save All</a></li>
            <li style="cursor:pointer" ng-show="ReOrder.rules && ReOrder.rules.length>0 && DisplayMode != 'Matrix'" ng-click="Report(ReOrder.productid,ReOrder.locationid,true)"><a><i class="fa fa-search"></i>Stock Reorder Status</a></li>
            <li style="cursor:pointer" ng-show="ReOrder.rules && ReOrder.rules.length>0 && DisplayMode != 'Matrix'" ng-click="exportExcel(cgrid, 'configuration', 'configuration')"><a><i class="fa fa-download"></i>Download</a></li>
        </ol>
        <ol class="breadcrumb" ng-show="ShowReport">
            <li style="cursor:pointer" ng-show="IsOnCheck" ng-click="Back()"><a><i class="fa fa-search"></i>Back</a></li>
            <li style="cursor:pointer" ng-click="Report()"><a><i class="fa fa-search"></i>Search</a></li>
            <li style="cursor:pointer" ng-click="ReportItems()"><a><i class="fa fa-search"></i>Search Items</a></li>
            <li style="cursor:pointer" ng-click="Convert2PO()"><a><i class="fa fa-search"></i>Convert 2 PO</a></li>
            <li style="cursor:pointer" ng-click="exportExcel(igrid, 'reorder', 'reorder')"><a><i class="fa fa-download"></i>Download</a></li>
        </ol>

    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->
        <div class="box box-success">
            <div class="box-body">
                <div class="col-md-12 no-padding" ng-hide="ShowReport">

                        <div class="col-md-4 no-padding" ng-hide="IsReport || IsOnCheck">
                            <label for="inputEmail3" class="col-md-4 form-group required  control-label" style="color:brown">DISPLAY MODE</label>
                            <div class="col-md-8">
                                <select class="form-control" style="width: 100%;" select2=""
                                        options="item.id as item.name for item in DisplayModeList track by item.id"
                                        ng-model="DisplayMode" ng-required="true"
                                        ng-change="ModeChanged()"></select>
                            </div>
                        </div>

                        <div class="col-md-4 no-padding" ng-show="DisplayMode=='Upload'">
                            <file-upload class="btn-xs file-upload" style="display:inline-block"
                                         resize="true" max-width="1280" uri='File/UploadXLSX/{{UserInfo.OrganizationID}}/'
                                         max-height="1280" preview="false" ng-model="stockadjustmentexcel"
                                         filemodel="stockadjustmentexcel" onuploadcomplete="fileuploadedcomplete"
                                         filetype="DATA"
                                         multiple="false">
                                <i class="fa fa-upload">Upload</i>
                            </file-upload>
                        </div>

                            <label for="inputEmail3" class="col-md-4 form-group required control-label" style="color:brown;padding-left:10px">LOCATION</label>

                                </div>
                            </div>
                        </div>

<script type="text/ng-template" id="ChooseMatrix">
    <div class="ngdialog-message">
        <div class="col-md-12">
            <div class="col-md-5 no-padding">
                <div class="form-group">
                    <label for="inputEmail3" class="control-label">Brand</label>
                    <input type="checkbox" class="pull-right" ng-model="config.brand" />
                </div>
                <div class="form-group">
                    <label for="inputEmail3" class="control-label">Size</label>
                    <input type="checkbox" class="pull-right" ng-model="config.size" />
                </div>
                <div class="form-group">
                    <label for="inputEmail3" class="control-label">Style</label>
                    <input type="checkbox" class="pull-right" ng-model="config.style" />
                </div>
                <div class="form-group">
                    <label for="inputEmail3" class="control-label">Fit</label>
                    <input type="checkbox" class="pull-right" ng-model="config.fit" />
                </div>
                <div class="form-group">
                    <label for="inputEmail3" class="control-label">Sleeve</label>
                    <input type="checkbox" class="pull-right" ng-model="config.sleeve" />
                </div>
                <div class="form-group">
                    <label for="inputEmail3" class="control-label">Colour</label>
                    <input type="checkbox" class="pull-right" ng-model="config.colour" />
                </div>
                <div class="form-group">
                    <label for="inputEmail3" class="control-label">Pattern</label>
                    <input type="checkbox" class="pull-right" ng-model="config.pattern" />
                </div>
                <div class="form-group">
                    <label for="inputEmail3" class="control-label">Design</label>
                    <input type="checkbox" class="pull-right" ng-model="config.design" />
                </div>
            </div>
            <div class="col-md-7">
                <div class="form-group">
                    <label for="inputEmail3" class="control-label">Location</label>
                    <input type="checkbox" class="pull-right" ng-model="config.location" />
                </div>
                <div class="form-group">
                    <label for="inputEmail3" class="control-label">Type</label>
                    <input type="checkbox" class="pull-right" ng-model="config.type" />
                </div>

                <div class="form-group">
                    <label for="inputEmail3" class="control-label">Material</label>
                    <input type="checkbox" class="pull-right" ng-model="config.material" />
                </div>
                <div class="form-group">
                    <label for="inputEmail3" class="control-label">Price Range</label>
                    <input type="checkbox" class="pull-right" ng-model="config.pricerange" />
                </div>
                <div class="form-group">
                    <textarea type="text" style="width:100%" rows="4" ng-model="config.pricelist"></textarea>
                </div>

            </div>

        </div>
        <div class="col-md-12">
            <label for="inputEmail3" class="control-label">Column</label>

            <div class="form-group">
                <select class="input-sm form-control" select2="" style="width: 100%;"
                        options="item.id as item.name for item in ColumnList track by item.id"
                        ng-model="config.column"></select>
            </div>

        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Save</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>
