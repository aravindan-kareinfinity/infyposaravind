<div>
    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
        <!-- Content Header (Page header) -->
        <section class="content-header">
            <h1>
                <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
                Store  /   Transfer Goods {{OutWards.statusdisplay}}
            </h1>
            <ol class="breadcrumb">

                <li style="cursor:pointer">
                    <div style="width:150px;height:25px;padding:0px;margin:0px">

                        <div class="input-group input-group-sm">
                            <input method="text" class="input-sm form-control"
                                   onkeyenter="SearchByCode()" placeholder="Package Code" ng-model="OutWards.code">
                            <span class="input-group-btn">
                                <button class="btn btn-success btn-sm input-sm pull-left"
                                        ng-click="SearchByCode()">
                                    <i class="glyphicon glyphicon-search"> </i>
                                </button>
                            </span>
                        </div>
                    </div>

                </li>

                <li style="cursor:pointer" ng-click="Clear()"><a><i class="fa fa-file"></i>New</a></li>
                <li style="cursor:pointer" ng-show="igrid && igrid != null" ng-click="PrintBarcode()"><a><i class="fa fa-file"></i>Print Barcode</a></li>
                <li ng-hide="OutWards.status>0" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
                <li ng-show="OutWards.id>0 && OutWards.status != 9" style="cursor:pointer" ng-click="Reject()"><a><i class="fa fa-delete"></i>Reject</a></li>
                <li ng-show="OutWards.id>0 && OutWards.status != 9" style="cursor:pointer" ng-click="Print()"><a><i class="fa fa-print"></i>Print Summary</a></li>
                <li ng-show="OutWards.id>0 && OutWards.status != 9" style="cursor:pointer" ng-click="PrintPDF()"><a><i class="fa fa-print"></i>Print PDF</a></li>
                <li ng-show="igrid && igrid != null" style="cursor:pointer" ng-click="exporttoExcel(igrid)"><a><i class="fa fa-download"></i>Download</a></li>
                <li ng-show="igrid && igrid != null" style="cursor:pointer" ng-click="DownloadExcel(igrid)"><a><i class="fa fa-download"></i>Export</a></li>
            </ol>

        </section>
        <!-- Main content -->
        <section class="content" style="margin-top:5px">

                                    </div>

                                            </div>
                                        </div>
                                    </div>
                                    <div class="row row-padbot-15" ng-show="intercompanytransfer">
                                        <div class="form-group">
                                            <label for="inputEmail3" class="col-sm-4 col-md-4 form-group required control-label">From Company</label>

                                            </div>
                                        </div>
                                    </div>
                                    <div class="row row-padbot-15" ng-show="intercompanytransfer">

                                            <label for="inputEmail3" class="col-sm-4 col-md-4 form-group required control-label">To Company</label>

                                                        ng-model="OutWards.tocompanyid"

                                            </div>
                                        </div>

                                            </div>
                                        </div>
                                    </div>

                                            <label for="inputPassword3" class="col-sm-4 col-sm-4 form-group required control-label">To Location</label>
                                            <div class="col-md-8 col-sm-8">
                                                <select class="input-sm form-control" style="width:100%" select2=""

                                                        options="item.id as item.name for item in ToLocations track by item.id"
                                                        ng-change="LocationChanged()"></select>
                                            </div>
                                        </div>
                                        <div class="form-group" ng-show="OutWards.inward2warehouse">
                                            <div class="col-md-4 col-sm-4">
                                            </div>
                                            <div class="col-md-8 col-sm-8" style="text-align:left;font-size:large;color:brown">
                                                Inward to Warehouse
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row row-padbot-15" ng-show="OutWards.fromlocationid>0">
                                        <div class="form-group">
                                            <label for="inputPassword3" class="col-sm-4 col-md-4 control-label">Filename</label>
                                            <div class="col-sm-8 col-md-8">

                                                <div class="col-sm-6 no-padding">
                                                    <file-upload class="btn btn-success btn-rad btn-trans btn-sm file-upload" resize="true" max-width="1280"
                                                                 max-height="1280" preview="true" ng-model="uploadfilename"
                                                                 filemodel="uploadfilename" onuploadcomplete='fileuploadedcomplete'
                                                                 uri='File/UploadXLSX/{{UserInfo.OrganizationID}}/'
                                                                 filetype="DATA"
                                                                 multiple="false">
                                                        <i class="fa fa-upload"></i>
                                                        <span>Upload</span>
                                                    </file-upload>
                                                </div>
                                            </div>


                                        </div>
                                    </div>

                                    <div class="row row-padbot-15">
                                        <div class="form-group" ng-show="UserInfo.p_INWARD.view">
                                            <label for="inputPassword3" class="col-sm-4 col-sm-4 control-label">Immediate Transfer</label>

                                            <div class="col-md-8 col-sm-8">
                                                <input type="checkbox" ng-model="OutWards.autotransfer" />
                                            </div>

                                        </div>
                                    </div>

                                            <div class="col-md-8 col-sm-8">
                                                <textarea type="text" ng-model="OutWards.remarks" rows="3" style="width:100%" />
                                            </div>

                                        </div>
                                    </div>

                                        </div>

                                <div class="col-md-8 col-sm-8">
                                    <div class="row row-padbot-15">

                                        <div class="col-md-12">
                                            <div class="form-group" ng-show="OutWards.fromlocationid>0">
                                                <div class="col-sm-4 col-md-4" style="padding-left:0px">
                                                    <label for="inputEmail3" class="control-label">Search Type</label>
                                                    <select class="input-sm form-control" select2=""

                                                                    Add

                                                                    &nbsp;Delete

                                                        </div>

                                                    </div>
                                                </div>
                                                <div class="col-md-8 col-sm-8 no-padding" ng-show="SourceType==2">

                                                    <div class="input-group input-group-sm">

                                                               style="width: 100%;" onkeyenter="SearchStock(true)"
                                                               ng-model="SearchCondition.lrentryno"
                                                               focusid="lrentryno"
                                                               placeholder="Entry No">
                                                        <span class="input-group-btn">
                                                            <button type="button" class="btn btn-primary btn-sm btn-flat" ng-click="SearchStock(true)">Add</button>

                                                    </div>
                                                </div>
                                                <div class="col-md-8 col-sm-8 no-padding" ng-show="SourceType==0">
                                                    <label for="inputEmail3" class="control-label">Barcode</label>
                                                    <div class="input-group input-group-sm">
                                                        <input method="text" class="input-sm form-control"
                                                               style="width: 100%;" onkeyenter="SearchDirectStock(SearchCondition.directbarcode)"
                                                               ng-model="SearchCondition.directbarcode"
                                                               focusid="barcode"
                                                               placeholder="Barcode">
                                                        <span class="input-group-btn">
                                                            <button type="button" class="btn btn-primary btn-sm btn-flat" ng-click="SearchStock(true)">Add</button>
                                                            <button type="button" class="btn btn-danger btn-sm btn-flat" ng-click="PopItems()">&nbsp;Delete</button>

                                        </div>

                                            <label for="inputEmail3" style="font-size:large">

                                        </div>-->

                                </div>
                            </div>
                        </div>

                    </form>         <!-- inner second div ends -->
                </div>
            </div>
            <!-- main box box-primary ends -->
            <div class="box box-success" ng-show="false">
                <div class="box-body">
                    <div id="printdiv" style="padding:10px">
                        <code style="color:black">
                            <!-- title row -->
                            <div class="row">
                                <div class="col-xs-12">
                                    <h4 style="text-align:center;font-size:large"><b>{{PrintDocument.company.name}}</b></h4>
                                    <h5 style="text-align:center;"><b>{{PrintDocument.company.address}}</b></h5>
                                    <h5 style="text-align:center;"><b>{{SearchRef(PrintDocument.company.cityid,Cities)}}-{{PrintDocument.company.pincode}}, Phone No: {{PrintDocument.company.contactno}}</b></h5>
                                </div>

                                <div class="col-xs-12">
                                    <div class="col-xs-4">
                                        <h6 style="text-align:left;"><b>&nbsp;&nbsp;&nbsp;&nbsp;GSTIN :{{PrintDocument.company.tinanddate}}</b></h6>
                                    </div>

                                    </div>
                                    <div class="col-xs-6">
                                        <h6 style="text-align:center;"><b>Packed On: {{PrintDocument.packedon |date : 'dd-MM-yyyy hh:mm'}}</b></h6>
                                    </div>
                                </div>

                                    <div class="col-sm-12">
                                        <table style="width:100%" class="table-striped">
                                            <tr>
                                                <td width="100%">
                                                    <table style="width:100%" class="table-striped">
                                                        <tr>
                                                            <td width="175px">Goods Transferred From :</td>
                                                            <td style="overflow:hidden">
                                                                <div style="text-align:left;height:20px;overflow:hidden"><b>{{SearchRef(PrintDocument.fromlocationid,Location)}} &nbsp;To&nbsp;  {{SearchRef(PrintDocument.tolocationid,Location)}}</b></div>
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </td>
                                            </tr>
                                        </table>
                                    </div>
                                </div>

                                    </thead>

                                    <tbody>

                                            <td style='padding:2px;margin:0px'>{{item.iqty}}</td>

<script type="text/ng-template" id="SupplierSearch">
    <div class="ngdialog-message">
        <div class="table-responsive mailbox-messages">
            <table fixed-header="150px" class="fixed_table">
                <thead>
                    <tr>
                        <th style="width:25px">&nbsp;</th>
                        <th style="width:150px">Name</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="item in SupplierList">
                        <td><input type="checkbox" ng-model="item.selected" /></td>
                        <td>{{item.name}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">OK</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog(null)">Close</button>
    </div>
</script>
