<div class="content-wrapper">
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Store / Job Work GRN
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ui-sref="JobWork" ng-show="UserInfo.p_STOREJOBWORK.view"><a><i class="fa fa-arrow-up"></i>JobWork</a></li>
            <li ng-show="Navigation.create" style="cursor:pointer" ng-click="Jobwork.Lrinvoicereturnitems = [];CalculateTotal()"><a><i class="fa fa-file"></i>New</a></li>
            <li ng-show="Navigation.save" ng-disabled="SaveRequest" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
            <li ng-show="Navigation.save && Jobwork.id && Jobwork.id>0" style="cursor:pointer" ng-click="PrintBarcode()"><a><i class="fa fa-barcode"></i>Print</a></li>
            <li ng-show="Navigation.save && Jobwork.id==0 || UserInfo.p_PORETURN.modify" style="cursor:pointer" ng-click="PrintDebitNote()"><a><i class="fa fa-print"></i>Print</a></li>
            <li ng-show="Navigation.search" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('SEARCH')"><a><i class="fa fa-search"></i>Search</a></li>
            <li ng-show="Navigation.edit" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('EDIT')"><a><i class="fa fa-backward"></i>Back</a></li>
            <li ng-show="Navigation.searchentity && SearchResult.length>0" style="cursor:pointer" ng-click="exporttoExcel('#debitnote','Debit Notes Report')"><a><i class="fa fa-download"></i>Export</a></li>
            <li ng-show="Navigation.searchentity" style="cursor:pointer" ng-click="Search()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>


    </section>
    <section class="content">
        <div class="box box-success">
            <div class="box-body" ng-hide="ShowSearch">
                <div class="col-md-12">
                    <div class="col-md-3 no-padding">

                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">
                                    GRN/Entry No
                                </label>
                                <div class="col-md-8">
                                    <div class="col-md-6 no-padding">
                                        <input type="text" name="name" class="form-control input-sm" id="inputEmail3"
                                               placeholder="" focusid="first" focusonenter="invoicedate"
                                               ng-model="Jobwork.invoiceno">
                                    </div>
                                    <div class="col-md-6 no-padding">
                                        <input type="text" name="name" class="form-control input-sm" id="inputEmail3"
                                               placeholder="" ng-readonly="true" ng-model="Jobwork.entryno">

                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row row-padbot-15">

                                            <i class="fa fa-calendar"></i>
                                        </div>

                                               focusid="invoicedate" focusonenter="locationid">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row row-padbot-15">

                            </div>

                                </div>
                            </div>
                        </div>

                        <div class="row row-padbot-15">

                                    <span class="input-group-btn" focusid="add" style="position:absolute;right:45px;top:0px">

                                    </div>

                                <div class="col-md-3" style="padding-left:1px;padding-right:1px">

                                    </div>
                                </div>


                            </div>

                            <div class="col-md-4 no-padding">

                                </div>

                                    </div>
                                </div>
                            </div>

                        </div>
                        <div class="col-md-12 no-padding">

                            <div class="col-md-8 no-padding">

                                        <select class="form-control" select2="" style="width: 100%;"

                                    </div>
                                </div>

                                <div class="col-md-3" style="padding-left:1px;padding-right:1px">
                                    <label>Size</label>
                                    <div class="col-md-12 no-padding">
                                        <select class="form-control" select2="" style="width: 100%;"
                                                options="item.id as item.name for item in SizeList track by item.id"
                                                ng-model="OrderList.sizeid" focusid="sizeid" focusonenter="colourid"></select>
                                    </div>
                                </div>
                                <div class="col-md-3" style="padding-left:1px;padding-right:1px">
                                    <label>Colour</label>
                                    <div class="col-md-12 no-padding">
                                        <select class="form-control" select2="" style="width: 100%;"
                                                options="item.id as item.name for item in ColourList track by item.id"

                                    </div>
                                </div>
                                <div class="col-md-3" style="padding-left:1px;padding-right:1px">
                                    <label>Qty</label>
                                    <input type="text" class="input-sm form-control" style="width: 100%;"

                                           focusid="qty" focusonenter="finalprice" ng-model="OrderList.qty"

                                </div>


                            </div>

                            <div class="col-md-4 no-padding">

                                <div class="col-md-4 no-padding">
                                    <label>S.Rate</label>
                                    <input type="text" class="input-sm form-control" style="width: 100%;"
                                           placeholder="Qty"
                                           focusid="finalprice" focusonenter="dealerrate" ng-model="OrderList.finalprice"
                                           selectAllOnFocus="true">
                                </div>


                                <div class="col-md-4 no-padding">
                                    <label>D.Rate</label>

                                </div>

                                <div class="col-md-4" style="padding-left:1px;padding-right:0px">
                                    <label>Charges(T)</label>
                                    <div class="input-group input-group-sm">
                                        <input type="text" class="input-sm form-control" style="width: 100%;"
                                               ng-model="OrderList.chargegross"
                                               focusid="grossamount"
                                               onkeyenter="TryAddItem()" />

                                        <span class="input-group-btn" style="width:10px">
                                            <button type="button" class="btn btn-info btn-sm btn-flat" ng-click="TryAddItem()">
                                                <i class="glyphicon glyphicon-plus-sign"></i>
                                            </button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                            <div class="col-md-12 col-sm-12">

                                <div style="height:85px;width:85px;display:inline">
                                    <a target="_blank" href="File/Show/{{UserInfo.OrganizationID}}/{{currentimageid}}">

                            <div class="col-md-12" style="padding-top:5px">
                                <div class="col-md-3">
                                    <label for="inputEmail3" style="font-size:medium"

                                    <div class="col-md-8 no-padding">
                                        <select class="form-control" select2="" style="width: 100%;"
                                                options="item.id as item.name for item in Status track by item.id"
                                                ng-disabled="Disable2ChangeStatus"
                                                ng-model="Jobwork.status"></select>
                                    </div>
                                </div>
                                <div class="col-md-9 no-padding">
                                    <div class="col-md-3 no-padding">
                                        <label for="inputEmail3" style="font-size:medium"

                                            <span class="pull-right" style="font-size:medium;text-align:right">{{Jobwork.qty}}</span>

                                        <label for="inputEmail3" style="font-size:medium"

            <div class="box-body" ng-show="ShowSearch">

                            <div class="no-padding">
                                <select class="form-control" select2="" style="width: 100%;"
                                        options="item.id as item.name for item in Company track by item.id"
                                        ng-model="SearchCondition.companyid" focusid="comapany1" focusonenter="supplier1"></select>
                            </div>
                        </div>
                        <div class="row row-padbot-15">
                            <label for="inputEmail3" class="control-label no-padding">Supplier</label>
                            <div class="no-padding">
                                <select class="form-control" select2="" style="width: 100%;" options="item.id as item.name for item in Suppliers track by item.id" ng-model="SearchCondition.supplierid" focusid="supplier1" focusonenter="entrydate1"></select>
                            </div>

                        </div>
                        <div class="row row-padbot-15">

                            <label for="inputEmail3" class="control-label no-padding">Invoice Date</label>

                                    <div class="input-group-addon">
                                        <i class="fa fa-calendar"></i>
                                    </div>
                                    <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.frominvdate,SearchCondition.toinvdate" focusid="entrydate1" focusonenter="entrydate2">
                                </div>
                            </div>

                        </div>

                        <div class="row row-padbot-15">

                            <label for="inputEmail3" class="control-label no-padding">Entry Date</label>

                                    <div class="input-group-addon">
                                        <i class="fa fa-calendar"></i>
                                    </div>

                            </div>

<script type="text/ng-template" id="MultiSize">
    <div class="ngdialog-message">
        <div class="md-col-12">




            <div class="col-md-12 row-padbot-15" ng-hide="isView">

                <label for="inputEmail3" class="col-md-3 control-label">Size Detail</label>
                <div class="input-group input-group-sm col-sm-6 no-padding" ng-hide="isSizeGroup">
                    <input type="text" class="input-sm form-control" ng-hide="IsJump" placeholder="Qty-Meter" ng-model="sizeInfo" focusid="sizeInfoBit" onkeyenter="CreateItems()">

                    <input type="text" class="input-sm form-control" ng-show="IsJump" placeholder="Start-Increment-End" ng-model="sizeInfo" focusid="sizeInfo" onkeyenter="CreateItems()">

                    <span class="input-group-btn">
                        <button type="button" class="btn btn-info btn-sm btn-flat" ng-click="CreateItems()">
                            <i class="glyphicon glyphicon-plus-sign"></i>
                        </button>
                    </span>
                </div>
                <div class="input-group input-group-sm col-sm-6 no-padding" ng-show="isSizeGroup">
                    <div class="input-group input-group-sm col-md-8">
                        <select class="input-sm form-control" select2="Size" style="width:100%" ng-model="sizegroupid"
                                options="item.id as item.name for item in SizeGroupList track by item.id"
                                onkeyenter="CreateItems()"
                                startswith="true"></select>
                        <span class="input-group-btn" style="width:10px">
                            <button type="button" class="btn btn-info btn-sm btn-flat" ng-click="CreateItems()">
                                <i class="glyphicon glyphicon-plus-sign"></i>
                            </button>
                        </span>
                    </div>
                </div>
            </div>


            <div class="row-padbot-15">

                <table fixed-header="250px">
                    <thead>
                        <tr>
                            <th class="no-padding" width="70px">Size</th>
                            <th class="no-padding" width="70px">Qty</th>
                            <th class="no-padding" width="70px">Price</th>
                            <th class="no-padding" width="100px">Dealer Price</th>
                            <th class="no-padding" width="50px">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in PopupList">
                            <td>{{item.sizename}}</td>
                            <td><input type="text" class="input-sm form-control" tablecell ng-model="item.qty" ng-readonly="isView" ng-change="QtyChanged(item,item.qty, '{{item.qty}}')" /></td>
                            <td><input type="text" class="input-sm form-control" tablecell ng-model="item.finalprice" /></td>
                            <td><input type="text" class="input-sm form-control" tablecell ng-model="item.dealerprice" /></td>

                            <td ng-hide="isView"><button type="button" class="btn btn-xs btn-primary" ng-click="Delete(item)">Delete</button></td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <div class="col-md-5">
            <label for="inputEmail3" class="col-md-7 control-label">{{Created}}/{{Total}}</label>
            <label for="inputEmail3" class="col-md-5 control-label">{{TotalAmount | number:2}}</label>
        </div>
        <div class="col-md-7">
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-hide="isView || !CanClear" ng-click="Clear()">Clear</button>
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-hide="isView" ng-click="Selected()">OK</button>
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
        </div>
    </div>
</script>
