                                    <div class="col-md-8">
                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="ProductGroup.stylename" ng-disabled="!ProductGroup.styleenable">

                                </div>

                            <div class="row row-padbot-15">

                                    <div class="col-md-8">
                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="ProductGroup.sizename" ng-disabled="!ProductGroup.sizeenable">

                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">

                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="ProductGroup.colourname" ng-disabled="!ProductGroup.colourenable">

                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="ProductGroup.typename" ng-disabled="!ProductGroup.typeenable">

                                    <div class="col-md-6" style="vertical-align:top;font-size:large;color:orangered;"><input type="checkbox" class="icheckbox_flat pull-left" style="margin-right:10px" ng-model="ProductGroup.support_textile" /><b>NO BARCODE</b></div>
                                    <div class="col-md-6" style="vertical-align:top;font-size:large;color:orangered;"><input type="checkbox" class="icheckbox_flat pull-left" style="margin-right:10px" ng-model="ProductGroup.support_textile" /><b>EAN BARCODE</b></div>

                                </div>


                            </div>

                        </div>

                                <div class="col-md-6" style="vertical-align:top;font-size:large;color:brown;"><input type="checkbox" class="icheckbox_flat-green pull-left" style="margin-right:10px" ng-model="ProductGroup.support_textile" /><b>FMCG</b></div>

                                <div class="col-md-6" style="vertical-align:top;font-size:large;color:brown;"><input type="checkbox" class="icheckbox_flat-green pull-left" style="margin-right:10px" ng-model="ProductGroup.support_textile" /><b>KOT</b></div>
