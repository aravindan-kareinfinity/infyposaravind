<div>
    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
        <!-- Content Header (Page header) -->
        <section class="content-header">
            <h1>
                <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
                Finance / Cheque Book
            </h1>
            <ol class="breadcrumb">
                <li ng-show="ShowSearch" style="cursor:pointer" ng-click="Clear()"><a><i class="fa fa-file"></i>Clear</a></li>
                <li ng-show="ShowSearch" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
                <li ng-hide="ShowSearch" style="cursor:pointer" ng-click="SwitchPanel()"><a><i class="fa fa-file"></i>New</a></li>
                <li ng-show="ShowSearch" style="cursor:pointer" ng-click="SwitchPanel();"><a><i class="fa fa-search"></i>Search</a></li>
                <li ng-show="selectedcount>0" style="cursor:pointer" ng-click="ChangeStatus(2)"><a><i class="fa fa-check"></i>Completed</a></li>
                <li ng-show="selectedcount>0" style="cursor:pointer" ng-click="Download()"><a><i class="fa fa-file-excel-o"></i>Download({{selectedcount}})</a></li>
                <li ng-show="selectedcount>0" style="cursor:pointer" ng-click="ChequePDFDownload(true)"><a><i class="fa fa-file-pdf-o"></i>Summary PDF</a></li>
                <li ng-show="selectedcount>0" style="cursor:pointer" ng-click="ChequePDFDownload(false)"><a><i class="fa fa-file-pdf-o"></i>Cheque PDF</a></li>
                <li ng-show="selectedcount>0" style="cursor:pointer" ng-click="Print()"><a><i class="fa fa-print"></i>Print Cheque</a></li>
            </ol>
        </section>
        <!-- Main content -->
        <section class="content">
            <!-- Your Page Content Here -->
            <div class="box box-primary">
                <div class="box-body">

                    <div class="col-md-2" style="padding-right:5px">
                        <div class="col-md-12 no-padding" ng-hide="ShowSearch">

                            <div class="row-padbot-15 row">
                                <label for="inputEmail3" class="control-label">Bank</label>
                                <div class="col-sm-12 col-md-12 no-padding">
                                    <select class="form-control input-sm" select2="Status" options="item.id as item.name for item in Banks track by item.id" ng-model="SearchCondition.bankid"></select>
                                </div>
                            </div>

                            <div class="row-padbot-15 row">
                                <label for="inputEmail3" class="control-label">Company</label>
                                <div class="col-sm-12 col-md-12 no-padding">
                                    <select class="form-control input-sm" select2="Status" options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid"></select>
                                </div>
                            </div>

                            <div class="row-padbot-15 row">
                                <label for="inputEmail3" class="control-label">Location</label>
                                <div class="col-sm-12 col-md-12 no-padding">
                                    <select class="form-control input-sm" select2="Status" options="item.id as item.name for item in Location track by item.id" ng-model="SearchCondition.locationid"></select>
                                </div>
                            </div>

                            <div class="row-padbot-15 row">
                                <label for="inputEmail3" class="control-label">Cheque No</label>
                                <div class="col-sm-12 col-md-12 no-padding">
                                    <input type="text" class="form-control input-sm" ng-model="SearchCondition.chequeno" style="width:100%" />
                                </div>
                            </div>

                            <div class="row-padbot-15 row">
                                <label for="inputEmail3" class="control-label">Source</label>
                                <div class="col-sm-12 col-md-12 no-padding">
                                    <select class="form-control input-sm" select2="Status" options="item.id as item.name for item in SourceTypes track by item.id" ng-model="SearchCondition.sourcetype"></select>
                                </div>
                            </div>


                            <div class="row-padbot-15 row">
                                <label for="inputEmail3" class="control-label">Status</label>
                                <div class="col-sm-12 col-md-12 no-padding">
                                    <select class="form-control input-sm" select2="Status" options="item.id as item.name for item in StatusList track by item.id" ng-model="SearchCondition.status"></select>
                                </div>
                            </div>

                            <div class="row-padbot-15 row">
                                <label for="inputEmail3" class="control-label">Entry Date</label>
                                <div class="col-sm-12 col-md-12 no-padding">

                                    <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.entryfromdate,SearchCondition.entrytodate">
                                </div>
                            </div>

                            <div class="row-padbot-15 row">
                                <label for="inputEmail3" class="control-label">Cheque Date</label>
                                <div class="col-sm-12 col-md-12 no-padding">
                                    <div class="input-group input-group-sm">
                                        <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate">
                                        <span class="input-group-btn">
                                            <button class="btn btn-sm btn-primary btn-box" ng-click="SearchChequeList()"><i class="fa fas fa-search"></i></button>
                                        </span>
                                    </div>
                                </div>
                            </div>


                        </div>

                        <div class="col-md-12 no-padding" ng-show="ShowSearch">
                            <div class="row row-padbot-15">


                                <label for="inputEmail3" class="form-group control-label">Cheque Number</label>
                                <div class="col-sm-12 col-md-12 no-padding">
                                    <input type="text" class="form-control input-sm" style="width: 100%;" ng-model="ChequeBox.chequeno">
                                </div>



                            </div>
                            <div class="row row-padbot-15">

                                <label for="inputEmail3" class="form-group control-label">Date</label>
                                <div class="col-sm-12 col-md-12 no-padding">
                                    <div class="input-group date">
                                        <div class="input-group-addon">
                                            <i class="fa fa-calendar"></i>
                                        </div>
                                        <input type="text" class="form-control input-sm datepicker" datemodule="ChequeBox.chequedate" ng-model="ChequeBox.chequedate" focusid="date" focusonenter="bankid">
                                    </div>
                                </div>

                            </div>
                            <div class="row row-padbot-15">
                                <label for="inputEmail3" class="form-group control-label">Bank</label>
                                <div class="col-sm-12 col-md-12 no-padding">
                                    <select class="form-control" select2='Bank'
                                            style="width: 100%;" options="item.id as item.name for item in Banks track by item.id"
                                            ng-model="ChequeBox.bankid" focusid="bankid" focusonenter="type"></select>
                                </div>
                            </div>
                            <div class="row row-padbot-15">

                                <label for="inputEmail3" class="form-group control-label">Type</label>
                                <div class="col-sm-12 col-md-12 no-padding">
                                    <select class="form-control" select2="" style="width: 100%;" ng-model="ChequeBox.sourcetype" ng-options="item.code as item.name for item in SourceTypes track by item.code" focusid="type" focusonenter="accountname"></select>
                                </div>


                            </div>
                            <div class="row row-padbot-15">
                                <label for="inputEmail3" class="form-group control-label">Account Name</label>
                                <div class="col-sm-12 col-md-12 no-padding">
                                    <input type="text" class="form-control input-sm" style="width: 100%;" ng-model="ChequeBox.accountname" focusid="accountname" focusonenter="amount">
                                </div>
                            </div>

                            <div class="row row-padbot-15">
                                <label for="inputEmail3" class="form-group control-label">Amount</label>
                                <div class="col-sm-12 col-md-12 no-padding">
                                    <input type="number" class="form-control input-sm" style="width: 100%;" ng-model="ChequeBox.amount" focusid="amount" focusonenter="">
                                </div>
                            </div>

                        </div>
                    </div>
                    <div class="col-md-10" style="padding-left:0px">
                        <div class="col-md-12" id="gridContainer">
                        </div>
                    </div>


                </div>


            </div>

        </section>
    </div>
    <!-- /.content-wrapper -->
</div>


<script type="text/ng-template" id="ChooseReport">
    <div class="ngdialog-message">
        <div class="md-col-12" style="margin-bottom:40px">
            <label for="inputEmail3" class="col-md-4 control-label">Report</label>
            <div class="col-sm-8 col-md-8">
                <select class="form-control input-sm" style="width: 100%;" select2="Cheque"
                        options="item.id as item.name for item in ReportList track by item.id"
                        ng-model="seletedreportid "></select>
            </div>
        </div>
        <div class="ngdialog-buttons">
            <div class="md-col-12" style="padding-bottom: 30px;padding-top: 40px;padding-right: 15px;">
                <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Save()">OK</button>
                <button type="button" class="ngdialog-button ngdialog-button-secondary" ng-click="closeThisDialog()">Close</button>
            </div>
        </div>
    </div>
</script>
