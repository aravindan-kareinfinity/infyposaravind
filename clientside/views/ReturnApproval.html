<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            Return Approval
        </h1>
        <ol class="breadcrumb">
            <li><a href="#"><i class="fa fa-dashboard"></i>Home</a></li>
<li><a href back-button>Back</a></li>
            <li class="active">Return Approval</li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->
        <div class="box box-primary" ng-hide="ShowSearch">
            <div class="box-body">
                <div class="col-md-12">
                    <div class="row row-padbot-15">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Customer PhoneNo</label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control input-sm" ng-model="Employee.remarks.items" focusid="first">
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-sm-4 control-label">Issued On</label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control input-sm" ng-model="Employee.remarks.items">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Name</label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control input-sm" ng-model="Employee.remarks.items">
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-sm-4 control-label">Issued Employee</label>
                                <div class="col-md-8">
                                    <select class="form-control" select2='Company' ng-model="Courier.companyid" options="item.id as item.name for item in CourierCompany track by item.id"></select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Address</label>
                                <div class="col-md-8">
                                    <textarea class="form-control" ng-model="Employee.remarks.items"></textarea>
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Approved By</label>
                                <div class="col-md-8">
                                    <select class="form-control" select2='Company' ng-model="Courier.companyid" options="item.id as item.name for item in CourierCompany track by item.id"></select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-primary btn-success pull-left" ng-click="AddNew()">Now Issue</button>
                    <button type="button" class="btn btn-primary btn-warning pull-right" ng-click="Pending()">Show Pending</button>
                </div>
            </div>
        </div>
        <div class="box box-primary" ng-show="ShowNew">
            <div class="box-body">
                <h4>Product Details</h4>
                <div class="row row-padbot-15">
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="col-sm-4">
                                <input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Barcode">
                            </div>
                            <div class="col-sm-3">
                                <input type="text" class="form-control input-sm" style="width: 100%;" placeholder="Name">
                            </div>
                            <div class="col-sm-3">
                                <input type="number" class="form-control input-sm" style="width: 100%;" placeholder="Qty">
                            </div>
                            <div class="col-sm-2">
                                <button type="button" class="btn btn-block btn-primary" ng-click="AddItem()">Add</button>
                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="table-responsive mailbox-messages">
                                <table fixed-header="200px" class="fixed_table">
                                    <thead>
                                        <tr>
                                            <th>Barcode</th>
                                            <th>Name</th>
                                            <th>Qty</th>
                                            <th>Amount</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr ng-repeat="item in ApprovalItems">
                                            <td>{{SearchRef(item.productid,ProductList)}}</td>
                                            <td>{{item.buyingqty}}</td>
                                            <td>{{item.buyingprice}}</td>
                                            <td>{{item.buyingprice}}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row row-padbot-15">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-4 control-label">No Of items</label>
                            <div class="col-md-8">
                                <input type="number" class="form-control input-sm" ng-model="Employee.remarks.items">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">

                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn btn-info pull-left" ng-click="AddNew()">Print</button>
                    <button type="button" class="btn btn-success pull-right" ng-click="AddNew()">Save</button>
                </div>

            </div>
        </div>

        <div class="box box-primary" ng-show="ShowPending">
            <div class="box-body">
                <h4>Product Details</h4>
                <div class="row row-padbot-15">
                    <div class="col-md-12">
                        <div class="table-responsive mailbox-messages">
                            <table fixed-header="200px" class="fixed_table">
                                <thead>
                                    <tr>
                                        <th>Barcode</th>
                                        <th>Name</th>
                                        <th>Qty</th>
                                        <th>Return Qty</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="item in ApprovalItems">
                                        <td>{{item.barcode}}</td>
                                        <td>{{item.name}}</td>
                                        <td>{{item.qty}}</td>
                                        <td><input type="number"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            </div>
    </section>
</div>
