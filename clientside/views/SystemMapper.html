<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Setting  /   System Mapper
        </h1>
        <ol class="breadcrumb">
            <li ng-show="SelectedEntity.CanSave" style="cursor:pointer" ng-click="MoveAll(igrid,Source,Selected)"><a><i class="fa  fa-arrow-right"></i>Associate</a></li>
            <li ng-show="SelectedEntity.CanSave" style="cursor:pointer" ng-click="MoveAll(sgrid,Selected,Source)"><a><i class="fa  fa-arrow-left"></i>Disassociate</a></li>
            <li ng-show="SelectedEntity.CanSave" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
            <li ng-show="SelectedEntity.CanCancel" style="cursor:pointer" ng-click="Cancel()"><a><i class="fa fa-backward"></i>Cancel</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->
        <div class="box box-primary">
            <div class="box-body">

                <div class="col-md-12 no-padding" style="margin-bottom:8px">
                    <div class="col-md-6 no-padding">

                        <label for="inputEmail3" class="col-md-4 control-label">Mapping Mode</label>
                        <div class="col-md-8 col-sm-8">

                            <select class="form-control" select2="" style="width: 100%;" ng-model="SystemMapper.type"
                                    options="item.id as item.name for item in Modes track by item.id"
                                    ng-change="OnMappingModeChange(SystemMapper.type)"
                                    focusid="first"></select>

                        </div>
                    </div>

                </div>
                <div class="col-md-12 no-padding" ng-show="SystemMapper.type>0">

                    <div class="col-md-12 no-padding" style="margin-bottom:8px" ng-show="SystemMapper.type==1">
                        <div class="col-md-6 col-sm-6 no-padding">
                            <label for="inputEmail3" class="col-md-4 control-label">Employee</label>
                            <div class="col-md-8 col-sm-8">
                                
                                    <select class="form-control"
                                            select2="" style="width: 100%;" ng-model="SystemMapper.parentid"
                                            ng-change="LoadChildrens()"
                                            options="item.id as item.name for item in Employee track by item.id"></select>
                                    
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding" style="margin-bottom:8px" ng-show="SystemMapper.type==2">
                        <div class="col-md-6 col-sm-6 no-padding">
                            <label for="inputEmail3" class="col-md-4 control-label">Supplier Group</label>
                            <div class="col-md-8 col-sm-8">
                                
                                    <select class="form-control" select2=""
                                            ng-change="LoadChildrens()"
                                            style="width: 100%;" ng-model="SystemMapper.parentid" 
                                            options="item.id as item.name for item in SupplierGroups track by item.id"></select>
                                
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">

                            <div class="col-md-12" id="gridContainer">
                            </div>

                        </div>
                        <div class="col-md-6 no-padding">

                            <div class="col-md-12" id="gridContainerselected">

                            </div>

                        </div>

                    </div>
                </div>

                <!-- /.row -->
            </div>
        </div>

        <!-- /.content -->
    </section>
</div>
