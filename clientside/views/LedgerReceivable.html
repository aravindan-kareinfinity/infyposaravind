
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header" style="height:33px">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
          Finance / Receivable
            <small></small>
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="SearchDaybook()"><a><i class="fa fa-search"></i>Search</a></li>
            <li style="cursor:pointer" ng-show="selectedcount==1" ng-click="EditVoucher()"><i class="fa fa-edit"></i>&nbsp;Voucher</li>
            <li style="cursor:pointer" ng-show="DownloadURL!=null"><a href="{{DownloadURL}}"><i class="fa fa-file-pdf-o"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'Receivable')"><a><i class="fa fa-download"></i>Download</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->
        <div class="box box-primary">
            <div class="box-body no-border">
                <div class="col-md-12 no-padding">
                    <div class="col-md-2 no-padding">

                        <div class="col-md-12" style="padding-left:0px">
                            <label>Sources</label>
                            <select class="form-control select2" 
                                    ng-change="SearchCondition.ledgerid=0"
                                    style="width: 100%;" select2="" options="item.id as item.name for item in Sources track by item.id" ng-model="SearchCondition.sourceid"></select>
                        </div>

                        <div class="col-md-12" style="padding-left:0px" ng-show="SearchCondition.sourceid == 0">
                            <label>Ledger</label>
                            <select class="form-control select2" style="width: 100%;" select2="" options="item.id as item.displayname for item in Ledgers track by item.id" ng-model="SearchCondition.ledgerid"></select>
                        </div>

                        <div class="col-md-12" style="padding-left:0px" ng-show="SearchCondition.sourceid == 1">
                            <label>Ledger</label>
                            <select class="form-control select2" style="width: 100%;" select2="" options="item.id as item.name for item in Customer track by item.id" ng-model="SearchCondition.ledgerid"></select>
                        </div>

                        <div class="col-md-12" style="padding-left:0px">
                            <label>Company</label>
                            <select class="form-control select2" style="width: 100%;" select2="" options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid"></select>
                        </div>

                        <div class="col-md-12" style="padding-left:0px">
                            <label>Location</label>
                            <select class="form-control select2" style="width: 100%;" select2="" options="item.id as item.name for item in Locations track by item.id" ng-model="SearchCondition.locationid"></select>
                        </div>


                        <div class="col-md-12" style="padding-left:0px">
                            <label>Report</label>
                            <select class="form-control select2" style="width: 100%;" select2=""
                                    options="item.id as item.name for item in ReportType track by item.id" ng-model="SearchCondition.reporttypeid"></select>
                        </div>

                        <div class="col-md-12" style="padding-left:0px" ng-show="SearchCondition.reporttypeid==2 || SearchCondition.reporttypeid==3">
                            <label>Age</label>
                            <input type="text" class="form-control input-sm" style="width:100%" ng-model="SearchCondition.ageranges" />
                        </div>



                        <div class="col-md-12" style="padding-left:0px">
                            <label>Date</label>
                            <div class="input-group input-group-sm">
                                <div class="input-group-addon">
                                    <i class="fa fa-calendar"></i>
                                </div>
                                <input type="text" class="form-control input-sm datepicker"
                                       daterange="SearchCondition.fromdate,SearchCondition.todate">

                            </div>
                        </div>

                    </div>

                    <div class="col-md-10" id="gridContainer">
                    </div>
                </div>

            </div>
        </div>
        <!-- /.row -->
    </section>
</div>
