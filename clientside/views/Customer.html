                        <div class="input-group input-group-sm col-sm-9 no-padding">
                            <div class="col-md-6 no-padding">
                                <input type="text" class="input-sm form-control" placeholder="Code"
                                       ng-model="Customer.pincode">
                            </div>
                            <div class="col-md-6 no-padding">
                                <input type="text" class="input-sm form-control" placeholder="Code"
                                       ng-model="gst.pradr.addr.pncd">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary pull-left" ng-click="Apply()">Apply</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Save</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>

<script type="text/ng-template" id="Attachment">
    <div class="ngdialog-message">
        <div class="table-responsive mailbox-messages">

            <div class="col-md-12">
                <h4 class="box-title">File Attachments</h4>
                <div class="row row-padbot-15">
                    <div class="form-group">
                        <label for="inputEmail3" class="col-sm-4 form-group required control-label">Type</label>
                        <div class="col-sm-8">
                            <select class="form-control input-sm" select2='Type' style="width:100%;"
                                    ng-model="Slide.title" focusid="typeid"
                                    options="item.id as item.name for item in DocTypes track by item.id"></select>
                        </div>
                    </div>
                </div>
                <div class="row row-padbot-15">
                    <div class="form-group">
                        <label for="inputEmail3" class="col-sm-4 form-group required control-label">Images</label>
                        <div class="col-sm-8">
                            <div class="col-md-6" style="padding-left:0px">

                                <div class="col-md-2 no-padding">
                                    <button class="btn btn-success btn-rad btn-trans btn-xs" ng-click="CaptureImage('IMAGE',Slide,'image')">
                                        <i class="fa fa-camera"></i>
                                    </button>
                                </div>
                                <div class="col-md-10 no-padding">
                                    <div class="col-md-6 no-padding">
                                        <file-upload class="btn btn-success btn-rad btn-trans btn-xs file-upload"
                                                     resize="true" max-width="1280"
                                                     max-height="1280"
                                                     preview="true"
                                                     ng-model="Slide.image"
                                                     filemodel="Slide.image"
                                                     filetype="IMAGE"
                                                     multiple="false">
                                            <i class="fa fa-upload"></i>
                                            <span>Upload Files</span>
                                        </file-upload>
                                    </div>
                                </div>

                            </div>
                            <div class="col-md-6" style="padding-right:0px">
                                <button type="button" class="btn btn-primary btn-xs pull-right" ng-click="AddSlide()">ADD</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row row-padbot-15">
                    <div class="col-md-12">
                        <table fixed-header="170px" class="fixed_table" additionalheight="300">
                            <thead>
                                <tr>
                                    <th width="50px">Image</th>
                                    <th width="150px">Type</th>
                                    <th width="50px">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="item in Customer.attachment">

                                    <td style="align-content:center">

                                        <a href="File/Show/{{UserInfo.OrganizationID}}/{{item.image}}" target="_blank">
                                            <img ng-src="File/Thumbnail/{{UserInfo.OrganizationID}}/{{item.image}}" style="height:50px;width:50px" />
                                        </a>

                                    </td>
                                    <td style="align-content:center">{{item.typename}}</td>

                                    <td>
                                        <button type="button" class="btn-danger btn btn-xs btn-flat" ng-click="ManagesearchSlideItem('DeleteSlide',item)"
                                                data-widget="delete" data-toggle="tooltip" title="Delete">
                                            <i class="fa fa-trash" aria-hidden="true"></i>
                                        </button>
                                        <button type="button" class="btn-primary btn btn-xs btn-flat" ng-click="ManagesearchSlideItem('EditSlide',item)" data-widget="edit" data-toggle="tooltip" title="Edit"><i class="fa fa-pencil"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>

<script type="text/ng-template" id="ChangeStatusDialog">
    <div class="ngdialog-message">
        <div class="table-responsive mailbox-messages">

            <div class="col-md-12">
                <label>Status</label>
                <select class="input-sm form-control" select2="" style="width: 100%;"
                        options="item.id  as item.name for item in parent.StatusList track by item.id"
                        ng-model="statusid"></select>

            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="ChangeStock()">Change</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>

<script type="text/ng-template" id="ChooseMerge">
    <h4 style="font-size:medium;color:brown">
        All the selected customers loyalty points will be merged. {{SelectedItem.name}}
    </h4>
    <div class="ngdialog-message">
        {{item.name}}
        <div class="md-col-12 row">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Select the Merge To</label>
                <div class="input-group input-group-sm col-sm-6 no-padding">
                    <select class="form-control input-sm" select2=''
                            style="width:100%;"
                            ng-model="id"
                            ng-change="rowselected()"
                            options="item.id as item.name for item in SelectedRows track by item.id"></select>
                </div>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Save</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>
