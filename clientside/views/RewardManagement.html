        <!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            Reward Manager
            <small></small>
        </h1>
        <ol class="breadcrumb">
            <li><a href="#"><i class="fa fa-dashboard"></i>Home</a></li>
            <li><a href back-button>Back</a></li>
            <li class="active">Reward Manager</li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->
        <div class="box box-primary">
            <div class="box-body">
                <div class="col-md-12">
                    <div class="col-md-5">
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inpu`tEmail3" class="col-sm-4 col-md-4 control-label">Mobile No</label>
                                <div class="col-md-8 col-sm-8">

                                    <div class="input-group input-group-sm">
                                        <input type="text" class="form-control input-sm" ng-model="GiftVoucher.mobileno" onkeyenter="SearchCustomer()">
                                        <span class="input-group-btn">
                                            <button class="btn btn-sm btn-primary btn-box" ng-click="SearchCustomer()"><i class="fa fa-search"></i></button>
                                        </span>
                                    </div>
                                </div>

                            </div>
                        </div>

                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputPassword3" class="col-md-4 control-label">Name</label>
                                <div class="col-md-8 col-sm-8">
                                    <input method="text" class="input-sm form-control " style="width: 100%;" ng-model="GiftVoucher.name" onkeyenter="SearchCode()">


                                </div>
                            </div>
                        </div>
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputPassword3" class="col-md-4 control-label">Gender</label>
                                <div class="col-md-8 col-sm-8">
                                    <select class="form-control input-sm" style="width: 100%;" select2="" options="genders.id as genders.name for genders in Gender track by genders.id" ng-model="Customer.gender" focusid="gender"></select>
                                </div>

                            </div>

                        </div>
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Date Of Birth</label>
                                <div class="col-md-8">
                                    <div class="input-group date">
                                        <div class="input-group-addon">
                                            <i class="fa fa-calendar"></i>
                                        </div>
                                        <input type="text" class="form-control input-sm pull-right" datemodule="Customer.dateofBirth" ng-model="Customer.dateofbirth">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Loyalty Point</label>
                                <div class="col-md-8">
                                    <input method="text" class="input-sm form-control" ng-readonly="true" style="width: 100%;" ng-model="GiftVoucher.vouchervalue">
                                </div>
                            </div>
                        </div>
                        <br />
                        <div class="row-padbot-15">
                            <div class="col-md-4"></div>
                            <div class="col-md-3">
                                <button class="btn btn-sm btn-primary btn-box" ng-click="ConvertCoupon()">Convert to Coupon</button>
                            </div>
                            <div class="col-md-1"></div>
                            <div class="col-md-3">
                                <button class="btn btn-sm btn-primary btn-box" ng-click="AdjustLoyalty()">Adjust Loyalty</button>
                            </div>
                        </div>

                    </div>
                    <div class="col-md-7">
                        <div class="table-responsive mailbox-messages" ng-show="SearchResult.length>0">
                            <table fixed-header="400px" class="fixed_table">
                                <thead>
                                    <tr>
                                        <th width="30px"><input type="checkbox" ng-model="SearchCondition.SelectAll" ng-change="SelectAllChanged()" /></th>
                                        <th style="width:100px">Code</th>
                                        <th style="width:80px;text-align:right">Value</th>
                                        <!--<th style="width:100px">Status</th>-->
                                        <th style="width:120px;text-align:right">Billed On</th>
                                        <th style="width:120px;text-align:right">Bill No</th>
                                        <!--<th style="width:120px">Bill Value</th>-->
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="item in SearchResult">
                                        <td><input type="checkbox" ng-model="item.selected" /></td>
                                        <td style="font-size:smaller;color:brown">{{item.vouchercode}}</td>
                                        <td style="font-size:smaller;color:black;text-align:left">{{item.vouchervalue}}</td>
                                        <!--<td>{{item.status}}</td>-->
                                        <td style="font-size:smaller;color:black;text-align:right">{{item.billdate}}</td>
                                        <td style="font-size:smaller;color:black;text-align:right">{{item.billno}}</td>
                                        <!--<td>{{item.billamt}}</td>-->
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <!-- /.row -->
            </div>
        </div>

    </section>


    <script type="text/ng-template" id="ConvertCoupon">
        <div class="ngdialog-message">
            <div>
                <div class="col-md-12">
                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-3 control-label">Rewind Point</label>
                            <div class="col-md-6">
                                <input type="text" class="form-control input-sm" style="width: 100%;" focusid="customer_name" focusonenter="customer_contact" ng-model="name">
                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-3 control-label">Amount</label>
                            <div class="col-md-6">
                                <input type="text" class="form-control input-sm" style="width: 100%;" focusid="customer_contact" focusonenter="customer_area" ng-model="contactno">
                            </div>
                        </div>
                    </div>

                </div>
                
            </div>
        </div>
        <div class="ngdialog-buttons">
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Save()">Save</button>
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
        </div>
    </script>

    <script type="text/ng-template" id="AdjustLoyalty">
        <div class="ngdialog-message">
            <div>
                <div class="col-md-12">
                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-3 control-label">Reason</label>
                            <div class="col-md-4">
                                <select class="form-control" style="width: 100%;" select2=""
                                        options="item.id as item.name for item in Reasons track by item.id"
                                        ng-model="Item.reasonid"></select>
                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-3 control-label">Point Value</label>
                            <div class="col-md-4">
                                <input type="text" class="form-control input-sm" style="width: 100%;" focusid="customer_contact" focusonenter="customer_area" ng-model="contactno">
                            </div>
                        </div>
                    </div>
                  
                </div>
                
            </div>
        </div>
        <div class="ngdialog-buttons">
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Add()">Add</button>
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
        </div>
    </script>

</div>
<!-- /.content-wrapper -->
<!-- Page script -->
