  <!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            Daily Expences
            <small></small>
        </h1>
        <ol class="breadcrumb">
            <li><a href="#"><i class="fa fa-dashboard"></i>Home</a></li>
<li><a href back-button>Back</a></li>
            <li class="active">Daily Expences</li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->
        <div class="box box-primary" ng-hide="ShowSearch">
            <div class="box-body">
                <div class="col-md-12">
                    <div class="row row-padbot-15">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Employee</label>
                                <div class="col-md-8">
                                    <select class="form-control" select2='Company' ng-model="Courier.companyid" options="item.id as item.name for item in CourierCompany track by item.id"></select>
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-sm-4 control-label">Date/Time</label>
                                <div class="col-md-4">
                                    <div class="input-group date">
                                        <div class="input-group-addon">
                                            <i class="fa fa-calendar"></i>
                                        </div>
                                        <input type="text" class="form-control pull-right" id="datepicker" ng-model="CurrentBill.billdatedisplay">
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <input method="text" class="form-control input-sm" style="width: 100%;" readonly ng-model="CurrentBill.billtimedisplay">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Reason</label>
                                <div class="col-md-8">
                                    <select class="form-control" select2='Company' ng-model="Courier.companyid" options="item.id as item.name for item in CourierCompany track by item.id"></select>
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-sm-4 control-label">Amount</label>
                                <div class="col-md-8">
                                    <input type="number" class="form-control input-sm" ng-model="Employee.remarks.items">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Additional Note</label>
                                <div class="col-md-8">
                                    <textarea class="form-control" ng-model="Employee.remarks.items"></textarea>
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                        <div class="col-sm-5">
                        </div>
                        <button type="button" class="btn btn-success pull-right" ng-click="Save()">Save</button>
                    </div>
                </div>

                <div class="col-md-12">
                    <div class="table-responsive mailbox-messages">

                        <table fixed-header="200px" class="fixed_table">
                            <thead>
                                <tr>
                                    <th style="width:50px">&nbsp;</th>
                                    <th>Date</th>
                                    <th>EmployeeName</th>
                                    <th>Reason</th>
                                    <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="item in DailyExpencesList">
                                    <td></td>
                                    <td>{{item.date}}</td>
                                    <td>{{item.name}}</td>
                                    <td>{{item.reason}}</td>
                                    <td>{{item.amount}}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>  <!-- /.row -->


            </div>
        </div>

        <!-- /.content -->

    </section>



</div>
