<script type="text/ng-template" id="SearchCustomer">
    <div class="ngdialog-message">
        <div>
            <div class="col-md-12 no-padding">
                <div class="col-md-6 no-padding">
                    <div class="col-md-12 no-padding">
                        <label>Mobile No</label>
                        <div class="input-group-sm">
                            <input type="text" class="form-control input-sm" placeholder=""
                                   focusonenter="customer_name" ng-model="contactno" focusid="customer_contact"
                                   onkeyenter="Search(true)">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <label>Name</label>
                        <div class="input-group-sm">
                            <input type="text" class="form-control input-sm" style="width: 100%;" focusid="customer_name"
                                   focusonenter="customer_birthdate" ng-model="name" onkeyenter="Search()">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">
                            <label>Date of Birth</label>
                            <div class="input-group-sm">
                                <div class="input-group date">
                                    <div class="input-group-addon">
                                        <i class="fa fa-calendar"></i>
                                    </div>
                                    <input type="text" class="form-control input-sm datepicker" datemodule="dateofbirth" focusid="customer_birthdate"
                                           focusonenter="customer_billingname" ng-model="dateofbirth">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label>Billing Name</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" style="width: 100%;" ng-model="billingname"
                                       focusonenter="card_no" focusid="customer_billingname">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">
                            <label>Card No</label>
                            <div class="input-group-sm">

                            <div class="input-group-sm">
                                <select class="input-sm form-control" style="width: 100%;" select2=""
                                        ng-model="religionid" focusid="customer_religion" focusonenter="customer_emailid"
                                        options="item.id as item.name for item in ReligionList track by item.id"></select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12">
                        <div class="col-md-6 no-padding">
                            <label>Email Id</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" style="width: 100%;"
                                       ng-model="emailid" onkeyenter="Create()" focusid="customer_emailid">
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label></label>
                            <div class="input-group-sm">
                                <button type="button" class="ngdialog-button ngdialog-button-primary pull-right" ng-click="Search()">Search</button>
                            </div>
                        </div>
                    </div>
                </div>
