      <!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1> <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
           Finance / Incentive Process
            <small></small>
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-show="EnableNotes" ng-click="ShowNotes(igrid)"><a><i class="fa fa-print"></i>Notes</a></li>
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'','Incentive Report')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="Export2CSV()"><a><i class="fa fa-download"></i>CSV</a></li>
            <li style="cursor:pointer" ng-click="GenerateIncentive()"><a><i class="fa fas fa-search-plus"></i>Generate</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box box-success">
            <div class="box-body">
                <div class="col-md-12">
                    <div class="col-md-3">
                        <div class="row row-padbot-15">
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Company</label>
                                    <div class="col-md-8">
                                        <select class="form-control input-sm" style="width: 100%;" select2="" options="company.id as company.name for company in Companies track by company.id" ng-model="companyid"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Location</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" style="width: 100%;" select2="" ng-model="locationid" options="item.id as item.name for item in Locations track by item.id"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Date Range</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm" style="width:100%" daterange="fromdate,todate">
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Department</label>
                                    <div class="col-md-8">
                                        <select class="form-control input-sm" style="width: 100%;" select2="" options="department.id as department.name for department in Departments track by department.id" ng-model="departmentid"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Product Section</label>
                                    <div class="col-md-8">
                                        <select class="form-control input-sm" style="width: 100%;" select2="" options="section.id as section.name for section in Divisions track by section.id" ng-model="sectionid"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Employee Section</label>
                                    <div class="col-md-8">
                                        <select class="form-control input-sm" style="width: 100%;" select2="" options="section.id as section.name for section in Divisions track by section.id" ng-model="employeesectionid"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Employee Floor</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" style="width: 100%;" select2="" ng-model="employeefloorid" options="item.id as item.code for item in Floors track by item.id"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Employee</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" style="width: 100%;" select2="" ng-model="employeeid" options="item.id as item.code for item in Employee track by item.id"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Remove Zero</label>
                                    <div class="col-md-8">
                                        <input type="checkbox" class="pull-right" ng-model="excludezero" />
                                    </div>
                                </div>
                            </div>

                                <div class="form-group">

                                    <div class="col-md-1">
                                        <input type="checkbox" ng-model="includesales" />

                            <div class="row row-padbot-15">
                                <div style="margin-right:10px;margin-left:10px">
                                    <table fixed-header="250px" additionalheight="300" class="fixed_table">
                                        <thead>
                                            <tr>
                                                <th>Name</th>
                                                <th style="width:50px">
                                                    Show
                                                </th>
                                            </tr>
                                        </thead>
                                        <tr ng-repeat="item in IncentiveModes">
                                            <td>{{item.name}}</td>
                                            <td><input type="checkbox" ng-model="item.show"></td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-9">
                        <div class="col-md-12 no-padding" id="gridContainer">
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </section>
</div>
