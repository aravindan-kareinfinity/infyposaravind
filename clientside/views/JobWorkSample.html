       <!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Warehouse / Jobwork Samples
        </h1>
        <ol class="breadcrumb">
            <li ng-show="Navigation.create" style="cursor:pointer" ng-click="New()"><a><i class="fa fa-file"></i>New</a></li>
            <li ng-show="Navigation.save" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
            <li ng-show="Navigation.search" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('SEARCH')"><a><i class="fa fa-search"></i>Search</a></li>
            <li ng-show="Navigation.edit" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('EDIT')"><a><i class="fa fa-backward"></i>Back</a></li>
            <li ng-show="Navigation.searchentity && SearchResult.length>0" style="cursor:pointer" ng-click="exporttoExcel(igrid,'Courier entry', 'courier')"><a><i class="fa fa-download"></i>Export</a></li>
            <li ng-show="Navigation.searchentity" style="cursor:pointer" ng-click="Search()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>

    <!-- Main content -->
    <section class="content">
        <div class="box box-primary">
            <div class="box-body">
                <div class="col-md-3 no-padding" ng-hide="ShowSearch">

                    <div class="col-md-12 no-padding">
                        <label for="inputEmail3" class="control-label">Entry No</label>
                        <div class="col-sm-12 no-padding">
                            <input type="text" class="form-control input-sm" ng-model="JobworkSample.sampleno" ng-readonly="true" focusonenter="awbnumber">
                        </div>
                    </div>


                    <div class="col-md-12 no-padding">
                        <label for="inputEmail3" class="control-label">Customer</label>
                        <div class="col-sm-12 no-padding">
                            <select class="input-sm form-control " select2="Select Customers"
                                    ng-model="JobworkSample.customerid"
                                    options="item.id as item.name for item in B2BCustomers track by item.id" style="width:100%"
                                    focusid="customername"
                                    focusonenter="autocoding"></select>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">Courier</label>
                            <div class="col-sm-12 no-padding">
                                <select class="form-control" select2='Company' ng-model="JobworkSample.receivedcouriercompanyid"
                                        options="item.id as item.name for item in CourierList track by item.id"
                                        focusid="companyid" focusonenter="status"></select>
                            </div>
                        </div>

                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">POD No</label>
                            <div class="col-sm-12 no-padding">
                                <input type="text" class="form-control input-sm" ng-model="JobworkSample.receivedcourierpod" focusid="podnumber" focusonenter="awbnumber">
                            </div>
                        </div>

                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">Received On</label>
                            <div class="col-sm-12 no-padding">
                                <input type="text" class="form-control input-sm"
                                       ng-model="JobworkSample.receivedon" datemodule="JobworkSample.receivedon"
                                       focusid="poddate">
                            </div>

                        </div>
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">Expected On</label>
                            <div class="col-sm-12 no-padding">
                                <input type="text" class="form-control input-sm"
                                       ng-model="JobworkSample.expecteddelivery" datemodule="JobworkSample.expecteddelivery"
                                       focusid="poddate">
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <label for="inputEmail3" class="control-label">Received By</label>
                        <div class="col-sm-12 no-padding">
                            <select class="form-control" select2='Received By' ng-model="JobworkSample.receivedby" options="item.id as item.name for item in Employees track by item.id" focusid="receivedby" focusonenter="description"></select>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">Product</label>
                            <div class="col-sm-12 no-padding">
                                <select class="form-control" select2='Received By' ng-model="JobworkSample.productid"
                                        options="item.id as item.name for item in Products track by item.id"
                                        focusid="receivedby" focusonenter="description"></select>
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">Design</label>
                            <div class="col-sm-12 no-padding">
                                <input type="text" class="form-control input-sm" ng-model="JobworkSample.designname"
                                       focusid="designname" focusonenter="awbnumber">
                            </div>
                        </div>

                    </div>




                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">Sample Qty</label>
                            <div class="col-sm-12 no-padding">
                                <input type="number" class="form-control input-sm" ng-model="JobworkSample.sampleqty" focusid="podnumber" focusonenter="awbnumber">
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">Order Qty</label>
                            <div class="col-sm-12 no-padding">
                                <input type="number" class="form-control input-sm" ng-model="JobworkSample.orderqty" focusid="awbnumber">
                            </div>
                        </div>
                    </div>


                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">Purchase Price</label>
                            <div class="col-sm-12 no-padding">
                                <input type="number" class="form-control input-sm" ng-model="JobworkSample.purchaseprice" focusid="podnumber" focusonenter="awbnumber">
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">Sales Price</label>
                            <div class="col-sm-12 no-padding">
                                <input type="number" class="form-control input-sm" ng-model="JobworkSample.sellingprice" focusid="awbnumber">
                            </div>
                        </div>
                    </div>




                    <div class="col-md-12 no-padding">

                        <div class="col-md-12 no-padding">
                            Sample Photo
                        </div>
                        <div class="col-md-12 no-padding">
                            <div class="col-md-6 no-padding">
                                <file-upload class="btn btn-success btn-rad btn-trans btn-sm file-upload" resize="true" max-width="1280"
                                             max-height="1280"
                                             preview="true"
                                             ng-model="JobworkSample.sampleimageid"
                                             filemodel="JobworkSample.sampleimageid"
                                             filetype="IMAGE"
                                             multiple="false">
                                    <i class="fa fa-upload"></i>
                                </file-upload>
                            </div>
                        </div>

                    </div>


                    <div class="col-md-12 no-padding">
                        <label for="inputEmail3" class="control-label">Remarks</label>
                        <div class="col-sm-12 no-padding">
                            <textarea class="form-control" rows="2" ng-model="JobworkSample.communication.remarks"></textarea>
                        </div>
                    </div>

                </div>

                <div class="col-md-3 no-padding" ng-show="ShowSearch">

                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">Entry No</label>
                            <div class="col-sm-12 no-padding">
                                <input type="text" class="form-control input-sm"
                                       ng-model="SearchCondition.sampleno">
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">Status</label>
                            <div class="col-sm-12 no-padding">
                                <select class="input-sm form-control " select2="Status"
                                        ng-model="SearchCondition.samplestatus"
                                        options="item.id as item.name for item in StatusList track by item.id"
                                        style="width:100%"></select>
                            </div>
                        </div>

                    </div>


                    <div class="col-md-12 no-padding">
                        <label for="inputEmail3" class="control-label">Customer</label>
                        <div class="col-sm-12 no-padding">
                            <select class="input-sm form-control " select2="Select Customers"
                                    ng-model="SearchCondition.customerid"
                                    options="item.id as item.name for item in B2BCustomers track by item.id"
                                    style="width:100%"
                                    focusid="customername"
                                    focusonenter="autocoding"></select>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">Received Courier</label>
                            <div class="col-sm-12 no-padding">
                                <select class="form-control" select2='Company' ng-model="SearchCondition.receivedcouriercompanyid"
                                        options="item.id as item.name for item in CourierList track by item.id"
                                        style="width:100%"
                                        focusid="companyid" focusonenter="status"></select>
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">POD No</label>
                            <div class="col-sm-12 no-padding">
                                <input type="text" class="form-control input-sm" ng-model="SearchCondition.receivedcourierpod" focusid="podnumber" focusonenter="awbnumber">
                            </div>
                        </div>

                    </div>



                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">

                            <label for="inputEmail3" class="control-label">Sent Courier</label>
                            <div class="col-sm-12 no-padding">
                                <select class="form-control" select2='Company' ng-model="SearchCondition.sentcouriercompanyid "
                                        options="item.id as item.name for item in CourierList track by item.id"
                                        style="width:100%"
                                        focusid="companyid" focusonenter="status"></select>
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">POD No</label>
                            <div class="col-sm-12 no-padding">
                                <input type="text" class="form-control input-sm" ng-model="SearchCondition.sentcourierpod" focusid="podnumber" focusonenter="awbnumber">
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <label for="inputEmail3" class="control-label">Received On</label>
                        <div class="col-sm-12 no-padding">
                            <input type="text" class="form-control input-sm"
                                   daterange="SearchCondition.receivedfromdate,SearchCondition.receivedtodate"
                                   focusid="poddate">
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <label for="inputEmail3" class="control-label">Expected On</label>
                        <div class="col-sm-12 no-padding">
                            <input type="text" class="form-control input-sm"
                                   daterange="SearchCondition.expectedfromdate,SearchCondition.expectedtodate"
                                   focusid="poddate">
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <label for="inputEmail3" class="control-label">Sent On</label>
                        <div class="col-sm-12 no-padding">
                            <input type="text" class="form-control input-sm"
                                   daterange="SearchCondition.sentfromdate,SearchCondition.senttodate"
                                   focusid="poddate">
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">Sent By</label>
                            <div class="col-sm-12 no-padding">
                                <select class="form-control" select2='Received By' ng-model="SearchCondition.sentby"
                                        options="item.id as item.name for item in Employees track by item.id" focusid="receivedby"
                                        style="width:100%"
                                        focusonenter="description"></select>
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">Received By</label>
                            <div class="col-sm-12 no-padding">
                                <select class="form-control" select2='Received By' ng-model="SearchCondition.receivedby"
                                        options="item.id as item.name for item in Employees track by item.id" focusid="receivedby"
                                        style="width:100%"
                                        focusonenter="description"></select>
                            </div>
                        </div>

                    </div>



                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">Product</label>
                            <div class="col-sm-12 no-padding">
                                <select class="form-control" select2='Received By' ng-model="SearchCondition.productid"
                                        options="item.id as item.name for item in Products track by item.id" focusid="receivedby"
                                        style="width:100%"
                                        focusonenter="description"></select>
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="control-label">Design</label>
                            <div class="col-sm-12 no-padding">
                                <input type="text" class="form-control input-sm" ng-model="SearchCondition.designname"
                                       focusid="designname" focusonenter="awbnumber">
                            </div>
                        </div>

                    </div>






                </div>

                <div class="col-md-9 no-padding">

                    <div class="col-md-12" id="gridContainer">

                    </div>

                </div>

            </div>
        </div>

    </section>
    <!-- /.content -->
</div>


<script type="text/ng-template" id="ChangeStatus">
    <div class="ngdialog-message">

        <div class="col-md-12">
            <div class="col-md-4" style="padding-right:5px;padding-left:5px">
                <div class="row row-padbot-15">
                    <div class="form-group">
                        <label for="inputEmail3" class="control-label">Sample No</label>
                        <div class="col-md-12 no-padding">
                            <input type="text" class="form-control input-sm" style="width: 100%;"
                                    ng-readonly="true" ng-model="JobworkSample.sampleno">
                        </div>
                    </div>
                </div>
                <div class="row row-padbot-15">
                    <div class="form-group">
                        <label for="inputEmail3" class="control-label">Customer</label>
                        <div class="col-md-12 no-padding">
                            <input type="text" class="form-control input-sm" style="width: 100%;"
                                   focusid="customer_contact" focusonenter="customer_area"
                                   ng-model="customername" ng-readonly="true">
                        </div>
                    </div>
                </div>
                <div class="row row-padbot-15">
                    <div class="form-group">
                        <label for="inputEmail3" class="control-label">Status</label>
                        <div class="col-md-12 no-padding">
                            <select class="input-sm form-control " select2="Status"
                                    ng-model="samplestatus"
                                    options="item.id as item.name for item in StatusList track by item.id"
                                    style="width:100%"></select>
                        </div>
                    </div>
                </div>
                <div class="row row-padbot-15">
                    <div class="form-group">
                        <label for="inputEmail3" class="control-label">Remark</label>
                        <div class="col-md-12 no-padding">
                            <textarea class="form-control" rows="2" ng-model="remarks"></textarea>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-8" style="padding-left:25px;padding-right:0px">
                <table fixed-header="280px">
                    <thead>
                        <tr>
                            <th style="width:80px">Date</th>
                            <th style="width:80px">Status</th>
                            <th style="width:150px">Remark</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in JobworkSample.communication.list">
                            <td>{{item.addedon| date:'dd-MM-yyyy'}}</td>
                            <td>{{SearchRef(item.status,StatusList,'Received')}}</td>
                            <td>{{item.remark}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>


    </div>
    <div class="ngdialog-buttons">
        <div class="col-md-4" style="padding-top:20px">
            <button type="button" class="btn-xs btn btn-info" ng-click="AddRemark()">Add Remark</button>
            <button type="button" class="btn-xs btn btn-info" ng-show="ShowChangeStatus" ng-click="ChangeStatus()">Change Status</button>
        </div>
        <div class="col-md-8" style="padding-top:20px">
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Select()">Save</button>
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
        </div>
    </div>
</script>
