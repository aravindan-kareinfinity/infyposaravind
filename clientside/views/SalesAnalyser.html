<script type="text/ng-template" id="SaveReport">
    <div class="ngdialog-message">
        <div class="md-col-12">
            <div class="table-responsive mailbox-messages">
                <div class="md-col-12">
                    <div class="form-group">
                        <label for="inputEmail3" class="col-md-4 control-label">Title</label>
                        <div class="col-sm-8 col-md-8">
                            <input type="text" style="width:100%" ng-model="Report.Title" />
                        </div>
                    </div>
                </div>
                <div class="md-col-12">
                    <div class="form-group">
                        <label for="inputEmail3" class="col-md-4 control-label">Description</label>
                        <div class="col-sm-8 col-md-8">
                            <textarea type="text" style="width:100%" ng-model="Report.Description" rows="2" />
                        </div>
                    </div>
                </div>
                <div class="md-col-12">
                    <div class="form-group">
                        <label for="inputEmail3" class="col-md-4 control-label">Column Group</label>
                        <div class="col-sm-8 col-md-8">
                            <select class="form-control input-sm" style="width: 100%;" select2=""
                                    options="report.id as report.name for report in GroupColumns track by report.id"
                                    ng-model="Report.GroupCoumn"></select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="inputEmail3" class="col-md-4 control-label">Columns</label>
                        <div class="col-sm-8 col-md-8">
                            <div style="display:inline;padding-right:10px"><input type="checkbox" ng-model="Report.ResultColumn.qty" /> Qty</div>
                            <div style="display:inline;padding-right:10px" ng-show="SHOWVALUE"><input type="checkbox" ng-model="Report.ResultColumn.value" /> Value</div>

                            <div style="display:inline;padding-right:10px" ng-show="SHOWVALUE"><input type="checkbox" ng-model="Report.ResultColumn.margin" /> Margin</div>

                        </div>
                    </div>
                </div>
                <div class="md-col-12">
                    <div class="form-group">

                        <div class="col-sm-12 col-md-12">
                            <table class="fixed_table" id="stockanalyser" fixed-header="200px">
                                <thead>
                                    <tr>
                                        <th width="30px">&nbsp;</th>
                                        <th width="150px">Type</th>
                                        <th>Values</th>
                                        <th width="20px"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="item in SecondaryCondtions">
                                        <td><input type="checkbox" ng-model="item.ShowColumn" /></td>
                                        <td>{{item.typeName}}</td>
                                        <td>
                                            <div style="width:400px;height:30px;overflow:hidden">
                                                <span ng-repeat="itm in item.nameList track by $index |limitTo: 5">{{itm}}&nbsp;</span>
                                            </div>
                                        </td>
                                        <td><i class="fa fa-trash-o" aria-hidden="true" ng-click="DeleteItem(item)"></i></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="md-col-12">
                    <div class="form-group">
                        <div class="col-sm-12 col-md-12">

                            <div class="col-md-3 no-padding">
                                <div class="col-md-8 no-padding">PRODUCT</div>
                                <div class="col-md-4"><input type="checkbox" ng-model="Report.Column.Product" /></div>
                            </div>
                            <div class="col-md-3 no-padding">
                                <div class="col-md-8 no-padding">BRAND</div>
                                <div class="col-md-4"><input type="checkbox" ng-model="Report.Column.Brand" /></div>
                            </div>
                            <div class="col-md-3 no-padding">
                                <div class="col-md-8 no-padding">STYLE</div>
                                <div class="col-md-4"><input type="checkbox" ng-model="Report.Column.Style" /></div>
                            </div>
                            <div class="col-md-3 no-padding">
                                <div class="col-md-8 no-padding">PATTERN</div>
                                <div class="col-md-4"><input type="checkbox" ng-model="Report.Column.Pattern" /></div>
                            </div>
                            <div class="col-md-3 no-padding">
                                <div class="col-md-8 no-padding">SIZE</div>
                                <div class="col-md-4"><input type="checkbox" ng-model="Report.Column.Size" /></div>
                            </div>
                            <div class="col-md-3 no-padding">
                                <div class="col-md-8 no-padding">COLOUR</div>
                                <div class="col-md-4"><input type="checkbox" ng-model="Report.Column.Colour" /></div>
                            </div>
                            <div class="col-md-3 no-padding">
                                <div class="col-md-8 no-padding">TYPE</div>
                                <div class="col-md-4"><input type="checkbox" ng-model="Report.Column.Type" /></div>
                            </div>
                            <div class="col-md-3 no-padding">
                                <div class="col-md-8 no-padding">DESIGN</div>
                                <div class="col-md-4"><input type="checkbox" ng-model="Report.Column.Design" /></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="ngdialog-buttons">
            <hr />
            <div class="col-md-4">
                <div class="col-md-8 no-padding">ALL COLUMN</div>
                <div class="col-md-4"><input type="checkbox" ng-model="Report.Column.All" ng-change="SelectAll(Report.Column.All)" /></div>
            </div>
            <button type="button" class="ngdialog-button btn-danger" ng-show="Report.id>0" ng-click="Delete()">Delete</button>
            <button type="button" class="ngdialog-button btn-success" ng-click="ShowReport()">View</button>
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Save()">Save</button>
            <button type="button" class="ngdialog-button ngdialog-button-secondary" ng-click="closeThisDialog()">Close</button>
        </div>
    </div>
</script>
