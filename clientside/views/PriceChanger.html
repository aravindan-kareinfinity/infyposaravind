<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Store / Price Changer
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="Clear()"><a><i class="fa fa-file"></i>Clear</a></li>
            <li style="cursor:pointer" ng-click="Delete()"><a><i class="fa fa-trash"></i>Delete</a></li>
            <li style="cursor:pointer" ng-click="SearchItems()"><a><i class="fa fa-search"></i>Search</a></li>

            <li style="cursor:pointer">

                <file-upload class="btn-xs file-upload" style="display:inline-block"
                             resize="true" max-width="1280" uri='File/UploadXLSX/{{UserInfo.OrganizationID}}/'
                             max-height="1280" preview="false" ng-model="uploadfile"
                             filemodel="uploadfile" onuploadcomplete="fileuploadedcomplete"
                             multiple="false">
                    <i class="fa fa-upload">Upload</i>
                </file-upload>

            </li>
            <li style="cursor:pointer" ng-show="CanSave" ng-click="SaveConformation()"><a><i class="fa fa-save"></i>Save</a></li>
            <li style="cursor:pointer" ng-click="PrintBarcode()"><a><i class="fa fa-barcode"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'pricechanger', 'pricechanger')"><a><i class="fa fa-download"></i></a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->

        <div class="box box-success" ng-hide="ShowSearch">
            <div class="box-body">
                <div class="col-md-12 no-padding">
                    <div class="col-md-3">

                        <div class="row">

                            <div class="row row-padbot-15">
                                <div class="col-md-12" style="padding-left:0px;padding-right:0px">
                                    <label for="inputEmail3" class="col-md-4 control-label" style="vertical-align:top;color:brown;text-align:left">Search Mode</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in SearchModes track by item.id" ng-model="Price.mode"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="col-md-12" style="padding-left:0px;padding-right:0px">
                                    <label for="inputEmail3" class="col-md-4 control-label" style="vertical-align:top;color:brown;text-align:left">COMPANY</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Company track by item.id" ng-model="Price.companyid"></select>
                                    </div>
                                </div>
                                <div class="col-md-12" ng-show="SupportDealerPrice" style="padding-left:0px;padding-right:0px;padding-top:5px">
                                    <label for="inputEmail3" class="col-md-4 control-label" style="vertical-align:top;color:brown;text-align:left">PRICE MODE</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;"
                                                options="item.id  as item.name for item in PriceModes track by item.id"
                                                ng-model="Price.pricemode"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15" ng-show="Price.mode!=1">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label" style="vertical-align:top;color:brown;text-align:left">LOCATION</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Locations track by item.id" ng-model="Price.locationid"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15" ng-hide="Price.mode==3">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">PURCHASE DATE</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm" style="width:100%" daterange="Price.fromdate,Price.todate">
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15" ng-hide="Price.mode==3">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">CHANGED DATE</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm" style="width:100%" daterange="Price.changedfromdate,Price.changedtodate">
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">PRODUCT</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Products track by item.id" ng-model="Price.productid"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">BRAND</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Brand track by item.id" ng-model="Price.brandid"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15" ng-hide="Price.mode==3">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">PATTERN</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Patterns track by item.id" ng-model="Price.patternid"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15" ng-hide="Price.mode==3">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">MATERIAL</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Material track by item.id" ng-model="Price.materialid"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15" ng-hide="Price.mode==3">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">COLOUR</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2='' style="width: 100%;" ng-model="Price.colourid" options="item.id as item.name for item in Colors track by item.id"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15" ng-hide="Price.mode==3">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">STYLE</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Styles track by item.id" ng-model="Price.styleid"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15" ng-hide="Price.mode==3">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">SIZE</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Sizes track by item.id" startswith="true" ng-model="Price.sizeid"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15" ng-hide="Price.mode==3">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">PRICE TAG</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in PriceTags track by item.id" startswith="true" ng-model="Price.pricetagid"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15" ng-hide="Price.mode==3">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">DESIGN CODE</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm" id="inputPassword3" ng-model="Price.designid">
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">SUPPLIER</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Suppliers track by item.id" startswith="true" ng-model="Price.supplierid"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15" ng-show="Price.mode==3">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Tax</label>
                                    <div class="col-md-6" style="padding-right:0px">
                                        <select class="input-sm form-control" select2="" style="width: 100%;"
                                                options="item.id  as item.name for item in SalesTax track by item.id" startswith="true" ng-model="Price.taxid"></select>
                                    </div>
                                    <div class="col-md-2" style="padding-left:0px">
                                        <input type="text" class="form-control input-sm" id="inputPassword3"
                                               placeholder="%" style="width: 100%;" ng-model="Price.taxpercentage">
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">BAR CODE</label>
                                    <div class="col-md-8">
                                        <div class="input-group input-group-sm">
                                            <input type="text" class="form-control input-sm" id="inputPassword3" onkeyenter="SearchByBarcode(Price.barcode)" ng-model="Price.barcode" focusid="first">
                                            <span class="input-group-btn">
                                                <button type="button" class="btn btn-info btn-flat" ng-click="SearchByBarcode(Price.barcode)">Go</button>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-9">

                        <div class="row row-padbot-15" ng-show="Price.mode==3">
                            <div class="col-md-3 no-padding">
                                <div class="col-md-12">
                                    <label for="inputEmail3" class="control-label" style="font-size:10pt">INCREASE MARGIN(%)</label>
                                </div>
                                <div class="col-md-12">
                                    <div class="input-group input-group-sm">

                                        <input method="text" class="input-sm input-sm form-control" style="width: 100%;" 
                                               ng-model="allitem.npIncrease">
                                        <span class="input-group-btn no-padding">
                                            <button type="button" class="btn btn-info btn-flat" ng-click="Apply('7')">Apply</button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3 no-padding">
                                <div class="col-md-12">
                                    <label for="inputEmail3" class="control-label" style="font-size:10pt">DECREASE MARGIN(%)</label>
                                </div>
                                <div class="col-md-12">
                                    <div class="input-group input-group-sm">

                                        <input method="text" class="input-sm input-sm form-control" style="width: 100%;" 
                                               ng-model="allitem.npDecrease">
                                        <span class="input-group-btn no-padding">
                                            <button type="button" class="btn btn-info btn-flat" ng-click="Apply('8')">Apply</button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row row-padbot-15" ng-show="IsDealerPrice && Price.mode!=3">
                            <div class="col-md-3 no-padding">
                                <div class="col-md-12">
                                    <label for="inputEmail3" class="control-label" style="font-size:10pt">PROFIT %</label>
                                </div>
                                <div class="col-md-12">
                                    <div class="input-group input-group-sm">

                                        <input method="text" class="input-sm input-sm form-control" style="width: 100%;" ng-model="allitem.npdealerprice">
                                        <span class="input-group-btn no-padding">
                                            <button type="button" class="btn btn-info btn-flat" ng-click="Apply('5')">Apply</button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3 no-padding">
                                <div class="col-md-12">
                                    <label for="inputEmail3" class="control-label" style="font-size:10pt">PRICE</label>
                                </div>
                                <div class="col-md-12">
                                    <div class="input-group input-group-sm">

                                        <input method="text" class="input-sm input-sm form-control" style="width: 100%;" ng-model="allitem.ndealerprice">
                                        <span class="input-group-btn no-padding">
                                            <button type="button" class="btn btn-info btn-flat" ng-click="Apply('6')">Apply</button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row row-padbot-15" ng-hide="IsDealerPrice || Price.mode == 3">

                            <div class="col-md-2 no-padding">
                                <div class="col-md-12">
                                    <label for="inputEmail3" class="control-label" style="font-size:10pt">MARGIN %</label>
                                </div>
                                <div class="col-md-12">
                                    <div class="input-group input-group-sm">

                                        <input method="text" class="input-sm input-sm form-control" style="width: 100%;" 
                                               ng-model="allitem.npIncrease">
                                        <span class="input-group-btn no-padding">
                                            <button type="button" class="btn btn-info btn-flat" ng-click="Apply('7')">Apply</button>
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-2 no-padding">
                                <div class="col-md-12">
                                    <label for="inputEmail3" class="control-label" style="font-size:10pt">PROFIT %</label>
                                </div>
                                <div class="col-md-12">
                                    <div class="input-group input-group-sm">

                                        <input method="text" class="input-sm input-sm form-control" style="width: 100%;" ng-model="allitem.nprofit">
                                        <span class="input-group-btn no-padding">
                                            <button type="button" class="btn btn-info btn-flat" ng-click="Apply('4')">Apply</button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-2 no-padding">
                                <div class="col-md-12">
                                    <label for="inputEmail3" class="control-label">PRICE</label>
                                </div>
                                <div class="col-md-12">
                                    <div class="input-group input-group-sm">
                                        <input method="text" class="input-sm input-sm form-control" style="width: 100%;" ng-model="allitem.nprice">
                                        <span class="input-group-btn no-padding">
                                            <button type="button" class="btn btn-info btn-flat" ng-click="Apply('1')">Apply</button>
                                        </span>
                                    </div>
                                </div>
                            </div>


                            <div class="col-md-2 no-padding">
                                <div class="col-md-12">
                                    <label for="inputEmail3" class="control-label">DISCOUNT</label>
                                </div>
                                <div class="col-md-12">
                                    <div class="input-group input-group-sm">
                                        <input method="text" class="input-sm input-sm form-control" style="width: 100%;" ng-model="allitem.ndiscount">
                                        <span class="input-group-btn no-padding">
                                            <button type="button" class="btn btn-info btn-flat" ng-click="Apply('2')">Apply</button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-2 no-padding">
                                <div class="col-md-12">
                                    <label for="inputEmail3" class="control-label">DIST %</label>
                                </div>
                                <div class="col-md-12">
                                    <div class="input-group input-group-sm">
                                        <input method="text" class="input-sm input-sm form-control" style="width: 100%;" ng-model="allitem.npdiscount">
                                        <span class="input-group-btn no-padding">
                                            <button type="button" class="btn btn-info btn-flat" ng-click="Apply('3')">Apply</button>
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-2 no-padding">
                                <div class="col-md-12">
                                    <label for="inputEmail3" class="control-label">Final</label>
                                </div>
                                <div class="col-md-12">
                                    <div class="input-group input-group-sm">
                                        <input method="text" class="input-sm input-sm form-control" style="width: 100%;" ng-model="allitem.finalprice">
                                        <span class="input-group-btn no-padding">
                                            <button type="button" class="btn btn-info btn-flat" ng-click="ApplyFinalValue()">Apply</button>
                                        </span>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12 no-padding" id="report">
                                <div class="col-md-12" id="gridContainer" style="padding-right:0px">

                                </div>

                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label" style="text-align: right">Change Reason</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm" id="inputPassword3" ng-model="Price.reason">
                                    </div>
                                </div>
