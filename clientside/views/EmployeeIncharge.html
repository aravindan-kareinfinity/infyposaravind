<div>
    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
        <!-- Content Header (Page header) -->
        <section class="content-header">
            <h1>
                <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
                Employee Incharge &amp; Incentives For ({{CurrentEmployee.name}})
            </h1>
            <ol class="breadcrumb">
                <li style="cursor:pointer" ng-show="ModifiedCount>0 && !ReportPage" ng-click="Save()"><a><i class="fa fa-save"></i>Save &nbsp;({{ModifiedCount}})</a></li>
                <li style="cursor:pointer" ng-show="ReportPage" ng-click="ReportPage=!ReportPage"><a><i class="fa fa-gears"></i>Configuration</a></li>
                <li style="cursor:pointer" ng-hide="ReportPage" ng-click="ReportPage=!ReportPage"><a><i class="fa fa-file"></i>Report</a></li>
            </ol>

        </section>
        <!-- Main content -->
        <section class="content">
            <!-- first row starts  -->
            <div class="box box-primary">
                <div class="box-body">

                    <div class="col-md-12 no-padding" ng-show="ReportPage">

                        <div class="col-md-2 no-padding">

                     
                            <div class="col-md-12" style="padding-left:0px">
                                <label for="inputEmail3" class="control-label no-margin">Sales Range</label>
                                <div class="input-group input-group-sm">
                                    <input type="text" daterange="SearchCondition.sfrom,SearchCondition.sto" class="input-sm form-control">
                                    <span class="input-group-btn">
                                        <button type="button" class="btn btn-sm btn-info" ng-click="GenerateReport()" focusid="go">
                                            <i class="fa fa-search"></i>
                                        </button>
                                    </span>
                                </div>
                            </div>

                           
                        </div>

                        <div class="col-md-10" style="padding-right:0px">
                            <div class="col-md-12 no-padding" id="rptContainer">

                            </div>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding" ng-hide="ReportPage">
                        <div class="col-md-3" style="padding-left:0px">
                            <div class="col-md-12 no-padding" id="gridContainer">

                            </div>
                        </div>

                        <div class="col-md-9 no-padding">
                            <div class="col-md-3 no-padding">
                                <label for="inputEmail3" class="form-group required control-label no-margin">Location</label>
                                <select class="input-sm form-control" options="item.id as item.name for item in LocationList track by item.id"
                                        ng-model="locationid" select2=""
                                        focusid="locationid" focusonenter="inchargetype"></select>
                            </div>
                            <div class="col-md-2 no-padding">
                                <label for="inputEmail3" class="form-group required control-label no-margin">Type</label>
                                <select class="input-sm form-control" options="item.id as item.name for item in InchargeTypes track by item.id"
                                        ng-change="CurrentInchargeChanged()"
                                        focusid="inchargetype" focusonenter="inchargeid"
                                        ng-model="inchargetype" select2=""></select>
                            </div>
                            <div class="col-md-4 no-padding">
                                <label for="inputEmail3" class="form-group required control-label no-margin">{{CurrentIncharge.name}}</label>
                                <select class="input-sm form-control" options="item.id as item.name for item in InchargeList track by item.id" 
                                        focusid="inchargeid" focusonenter="incentivetype"
                                        ng-model="inchargeid" select2=""></select>
                            </div>

                            <div class="col-md-3 no-padding">
                                <label for="inputEmail3" class="form-group required control-label no-margin">Incentive</label>
                                <div class="input-group input-group-sm">
                                    <div class="col-md-12 no-padding">
                                        <div class="col-md-6 no-padding">
                                            <select class="input-sm form-control" 
                                                    focusid="incentivetype" focusonenter="incentivevalue"
                                                    options="item.id as item.name for item in IncentiveTypes track by item.id" ng-model="incentivetype" select2=""></select>
                                        </div>
                                        <div class="col-md-6 no-padding">
                                            <input type="text" ng-model="incentivevalue" 
                                                   focusid="incentivevalue" focusonenter="addproduct"
                                                   class="input-sm form-control">
                                        </div>
                                    </div>
                                    <span class="input-group-btn">
                                        <button type="button" class="btn btn-sm btn-info" ng-click="AddProduct()" focusid="addproduct">
                                            <i class="fa fa-plus"></i>
                                        </button>
                                    </span>
                                </div>
                            </div>

                            <div class="col-md-12 no-padding" id="prdContainer">

                            </div>
                        </div>



                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
