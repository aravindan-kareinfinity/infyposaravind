
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header" style="height:33px">
        <h1>

            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Finance /  {{FinanceReportTitle}}
            <small></small>
        </h1>
        <ol class="breadcrumb">

            <li style="width: 700px; height: 25px">
                <div class="col-md-12 no-padding">
                    <div class="col-md-4 no-padding">
                        <select class="select2" style="width: 100%"
                                select2=""
                                ng-options="item.id as item.name for item in Company track by item.id"
                                ng-model="SearchCondition.companyid"></select>
                    </div>
                    <div class="col-md-3 no-padding">
                        <select class="select2" style="width: 100%"
                                select2=""
                                ng-options="item.id as item.name for item in Locations track by item.id"
                                ng-model="SearchCondition.locationid"></select>
                    </div>
                    <div class="col-md-5 no-padding">
                        <div class="input-group input-group-sm">
                            <input type="text" class="form-control input-sm datepicker"
                                   daterange="SearchCondition.fromdate,SearchCondition.todate">

                            <span class="input-group-btn" ng-click="SearchFinanceReport()">
                                <button class="btn btn-sm btn-info btn-box"><i class="fa fa-search"></i></button>
                            </span>
                            <span class="input-group-btn" ng-click="ExportXLSX()">
                                <button class="btn btn-sm btn-info btn-box"><i class="fa fa-download"></i></button>
                            </span>
                        </div>
                    </div>
                </div>
            </li>

        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->
        <div class="box box-primary">
            <div class="box-body no-border">
                <div class="col-md-12">

                    <div class="col-md-12" id="gridContainer">
                    </div>
                </div>

            </div>
        </div>
        <!-- /.row -->
    </section>
</div>
