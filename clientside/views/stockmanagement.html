<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Store / Stock Marker
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="Clear()"><a><i class="fa fa-file"></i>Clear</a></li>
            <li style="cursor:pointer" ng-click="SearchStock()"><a><i class="fa fa-search"></i>Search</a></li>
            <li style="cursor:pointer">
                <file-upload class="btn-xs file-upload" style="display:inline-block"
                             resize="true" max-width="1280" uri='File/UploadXLSX/{{UserInfo.OrganizationID}}/'
                             max-height="1280" preview="false" ng-model="uploadfile"
                             filemodel="uploadfile" onuploadcomplete="fileuploadedcomplete"
                             multiple="false">
                    <i class="fa fa-upload">Upload</i>
                </file-upload>
            </li>
            <li style="cursor:pointer" ng-click="ShowChangeDialog()"><a><i class="fa fa-tags"></i>Stock Mark</a></li>
            <li style="cursor:pointer" ng-show="IsOnline" ng-click="SaveOnline()"><a><i class="fa fa-tags"></i>Update Online</a></li>
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'Stock')"><a><i class="fa fa-download"></i>Download</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->
        <div class="box box-success">
            <div class="box-body">
                <div class="col-md-3">

                    <div class="row">
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label" style="vertical-align:top;color:brown;text-align:left">Mode</label>
                                <div class="col-md-8">
                                    <select class="input-sm form-control" select2="" 
                                            style="width: 100%;" options="item.id  as item.name for item in Modes track by item.id" 
                                            ng-model="SearchCondition.mode"
                                            ng-change="IsOnline=false"></select>
                                </div>
                            </div>
                        </div>
                        <div class="row row-padbot-15">
                            &nbsp;
                        </div>
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label" style="vertical-align:top;color:brown;text-align:left">Company</label>
                                <div class="col-md-8">
                                    <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid" focusid="company" focusonenter="location" ></select>
                                </div>
                            </div>
                        </div>
                        <div class="row row-padbot-15" ng-show="SearchCondition.mode==2 || SearchCondition.mode==3">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label" style="vertical-align:top;color:brown;text-align:left">Location</label>
                                <div class="col-md-8">
                                    <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Location track by item.id" ng-model="SearchCondition.locationid" focusid="location" focusonenter="purchasedate"  ></select>
                                </div>
                            </div>
                        </div>
                        <div class="row row-padbot-15" ng-show="SearchCondition.mode==3">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Stock Marker</label>
                                <div class="col-md-8">
                                    <div class="input-group input-group-sm">
                                        <select class="form-control" select2="" style="width: 100%;" 
                                                options="item.id  as item.name for item in MarkerType track by item.id"
                                                ng-model="SearchCondition.markerid"
                                                ng-change="IsOnline=false"
                                                ></select>
                                        <span class="input-group-btn">
                                            <button type="button" class="btn btn-info btn-flat" ng-click="Search()">Go</button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-12 no-padding" ng-hide="SearchCondition.mode==3">

                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Purchase Date</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="purchasedate" focusonenter="product">
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Product</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Product track by item.id" ng-model="SearchCondition.productid" focusid="product" focusonenter="brand"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Brand</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Brand track by item.id" ng-model="SearchCondition.brandid" focusid="brand" focusonenter="pattern"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Pattern</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Pattern track by item.id" ng-model="SearchCondition.patternid" focusid="pattern" focusonenter="material"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Material</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Material track by item.id" ng-model="SearchCondition.materialid" focusid="material" focusonenter="color"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Colour</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2='' style="width: 100%;" ng-model="SearchCondition.colourid"
                                                options="item.id as item.name for item in Color track by item.id" focusid="color" focusonenter="typeid"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Type</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2='' style="width: 100%;" ng-model="SearchCondition.typeid" 
                                                options="item.id as item.name for item in Type track by item.id" focusid="typeid" focusonenter="style"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Style</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" 
                                                options="item.id  as item.name for item in Style track by item.id" ng-model="SearchCondition.styleid" 
                                                focusid="style" focusonenter="size"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Size</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Sizes track by item.id" startswith="true" ng-model="SearchCondition.sizeid" focusid="size" focusonenter="designcode"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Design</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm" id="inputPassword3" ng-model="SearchCondition.designid" focusid="designcode" focusonenter="supplier">
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Supplier</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Supplier track by item.id" startswith="true" ng-model="SearchCondition.supplierid" focusid="supplier" focusonenter="barcode"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Barcode</label>
                                    <div class="col-md-8">
                                        <div class="input-group input-group-sm">
                                            <input type="text" class="form-control input-sm" id="inputPassword3" onkeyenter="SearchBarcode()" ng-model="SearchCondition.barcode" focusid="barcode" focusonenter="stockmarker">
                                            <span class="input-group-btn">
                                                <button type="button" class="btn btn-info btn-flat" ng-click="SearchBarcode()">Go</button>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
                <!-- STOCK Report -->
                <div class="col-md-9">

                    <div class="box no-border">
                        <div class="box-body no-padding">
                            <div class="row">
                                <div class="col-md-12 no-padding" id="report">
                                    <div class="col-md-12" id="gridContainer">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <script type="text/ng-template" id="ChangeAttributeDialog">
        <div class="ngdialog-message">
            <div class="table-responsive mailbox-messages">
                <div class="col-md-12">
                    <label><b>All the Selected Items will be Either Added/Removed from the Below Selected Marking</b></label>
                </div>
                <div class="col-md-12">
                    <select class="form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in parent.MarkerType track by item.id" ng-model="parent.markerid"></select>
                </div>
                <div class="col-md-12">
                    <input type="checkbox" ng-model="parent.ExclusiveBarcode" />Exclusive Barcode
                </div>
                
                <div class="col-md-12">
                    <br />
                    <br />
                </div>
            </div>
        </div>
        <div class="ngdialog-buttons">
            <button type="button" class="ngdialog-button ngdialog-button-primary" style="background-color:#00A65A" ng-click="AddFromList('Add')">Add To List</button>
            <button ng-hide="parent.ExclusiveBarcode" type="button" class="ngdialog-button ngdialog-button-primary pull-right" style="background-color:#DD4B39" ng-click="RemoveFromList('Delete')">Remove From List</button>
            <button ng-hide="parent.ExclusiveBarcode" type="button" class="ngdialog-button ngdialog-button-primary pull-right" style="background-color:#DD4B39" ng-click="DeleteAll('DeleteAll')">Remove All</button>
            <button type="button" class="ngdialog-button ngdialog-button-primary pull-left" ng-click="closeThisDialog()">Close</button>
        </div>
    </script>

</div>
