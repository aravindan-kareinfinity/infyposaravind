                                        </div>

                                    <input type="text" class="form-control input-sm" style="width: 100%;" placeholder="TO" ng-model="SearchCondition.toprice" ng-maxlength="150">

                                    <div class="form-group">
                                        <label for="inputEmail3" class="col-md-12 control-label">Customer Type</label>

                                <div class="row row-padbot-15">

                                        <label for="inputEmail3" class="col-md-12 control-label">Customer Name</label>

                                        <div class="col-md-12">
                                            <input type="text" class="form-control input-sm" style="width: 100%;" ng-model="SearchCondition.customername" ng-maxlength="150">
                                        </div>
                                    </div>
                                </div>
                                <div class="row row-padbot-15">
                                    <div class="form-group">
                                        <label for="inputEmail3" class="col-md-12 control-label">Result Limit</label>

                                        <div class="col-md-12">
                                            <input type="text" class="form-control input-sm" id="inputEmail3" placeholder=""
                                                   ng-model="SearchCondition.limit" onkeyenter="Search()" focusid="billname">
                                        </div>
                                    </div>
                                </div>

                            </div>


                            <div class="col-md-9">
                                <div class="row row-padbot-15">
                                    <div class="col-md-12">
                                        <b>Bills</b>
                                    </div>
                                    <div class="col-md-12">
                                        <div class="col-md-12 no-padding" id="gridContainer">
                                        </div>

        </div>

    </section>

<script type="text/ng-template" id="UpdateBill">
    <h4 style="font-size:medium;color:brown">
        All the selected items will be Updated. Please Use Sales Inbox for B2B Bill Updation.
    </h4>
    <div class="ngdialog-message">
        <!--<div class="md-col-12 row">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Select Customer</label>
                <div class="input-group input-group-sm col-sm-6 no-padding">
                    <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in parent.RetailCustomers track by item.id" ng-model="parent.UpdateBill.customerid"></select>
                </div>
            </div>
        </div>-->
        <div class="md-col-12 row">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Mobile No</label>
                <div class="input-group input-group-sm col-sm-6 no-padding">
                    <input type="text" class="form-control input-sm" ng-model="parent.UpdateBill.mobileno" onkeyenter="SearchCustomer()">
                    <span class="input-group-btn">
                        <button class="btn btn-sm btn-primary btn-box" ng-click="SearchCustomer()"><i class="fa fa-search"></i></button>
                    </span>
                </div>
            </div>
        </div>
        <div class="md-col-12 row" ng-show="parent.UpdateBill.customerid>0">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Name</label>
                <div class="input-group input-group-sm col-sm-6 no-padding">
                    <input type="text" class="form-control input-sm" ng-model="parent.UpdateBill.customername" readonly>
                </div>
            </div>
        </div>
        <div class="md-col-12 row" ng-show="parent.UpdateBill.customerid>0">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">GST No</label>
                <div class="input-group input-group-sm col-sm-6 no-padding">
                    <input type="text" class="form-control input-sm" ng-model="parent.UpdateBill.gstno" readonly>
                </div>
            </div>
        </div>

        <div class="md-col-12 row">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Select Bill Date</label>
                <div class="input-group input-group-sm col-sm-6 no-padding">
                    <div class="input-group date">
                        <div class="input-group-addon">
                            <i class="fa fa-calendar"></i>
                        </div>
                        <input type="text" class="form-control input-sm datepicker" datemodule="parent.UpdateBill.billdate" ng-model="parent.UpdateBill.billdate">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <div class="col-md-3">
            <button type="button" class="ngdialog-button ngdialog-button-primary pull-left" ng-click="UpdateBillDate()">Update Bill Date</button>
        </div>
        <div class="col-md-3">
            <button type="button" class="ngdialog-button ngdialog-button-primary pull-left" ng-click="UpdateIGST()">Update IGST</button>
        </div>
        <div class="col-md-3">
            <button type="button" class="ngdialog-button ngdialog-button-primary pull-right" ng-click="UpdateHSN()">Update HSN</button>
        </div>
        <div class="col-md-3">
            <button type="button" class="ngdialog-button ngdialog-button-primary pull-right" ng-click="UpdateCustomer()">Update Customer</button>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <div class="col-md-12">
            <button type="button" class="ngdialog-button ngdialog-button-info pull-right" ng-click="closeThisDialog()">Close</button>
        </div>
    </div>

</script>
