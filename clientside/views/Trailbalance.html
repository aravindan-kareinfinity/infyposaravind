
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header" style="height:33px">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
          Finance / Trial Balance
            <small></small>
        </h1>
        <ol class="breadcrumb">
            <li style="width:700px">
                
                   
                    <div class="col-md-12 no-padding">
                        <div class="col-md-3 no-padding">
                            <select class="form-control select2" style="width: 100%;" select2=""
                                    options="item.id as item.name for item in Company track by item.id"
                                    ng-model="SearchCondition.companyid" focusid="companyid"></select>
                        </div>
                        <div class="col-md-3 no-padding">
                            <select class="form-control select2" style="width: 100%;" select2=""
                                    options="item.id as item.name for item in Locations track by item.id"
                                    ng-model="SearchCondition.locationid" focusid="locationid"></select>
                        </div>

             
                        <div class="col-md-6 no-padding">
                            <div class="input-group input-group-sm">
                                <div class="input-group-addon">
                                    <i class="fa fa-calendar"></i>
                                </div>
                                <input type="text" class="form-control input-sm datepicker"
                                       opens="left"
                                       daterange="SearchCondition.fromdate,SearchCondition.todate">
                                <span class="input-group-btn" ng-click="SearchTrailBalance()">
                                    <button class="btn btn-sm btn-info btn-box"><i class="fa fa-search"></i></button>
                                </span>

                                <span class="input-group-btn" ng-click="exporttoExcel(igrid,'Trial Balance')">
                                    <button class="btn btn-sm btn-success btn-box"><i class="fa fa-download"></i></button>
                                </span>
                            </div>
                        </div>


                        

                    </div>

                       


           
            </li>

        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->
        <div class="box box-primary">
            <div class="box-body no-border">
                <div class="col-md-12">

                    <div class="col-md-12" id="gridContainer">
                    </div>
                </div>

            </div>
        </div>
        <!-- /.row -->
    </section>
</div>
