<script type="text/ng-template" id="ChooseOption">
    <div class="ngdialog-message">
        <div class="md-col-12" style="padding-bottom:15px">
            <div class="md-col-6">
                <div class="form-group">
                    <label for="inputEmail3" class="col-md-4 control-label">Filter Mode</label>

                    <div class="col-md-8">
                        <div class="input-group input-group-sm">
                            <select class="form-control" select2="" style="width: 100%;" options="size.id as size.name for size in OptionList track by size.id" ng-model="option" />
                            <span class="input-group-btn">
                                <button type="button" class="btn btn-info btn-flat" ng-click="LoadItems()">Go!</button>
                            </span>
                        </div>
                    </div>

                </div>
            </div>
        </div>


        <div class="md-col-12" style="padding-bottom:15px">
            <table fixed-header="300px" class="fixed_table">
                <thead>
                    <tr>
                        <th style="width:50px" ng-hide="option==1">SL</th>
                        <th style="width:150px">Product</th>
                        <th style="width:100px" ng-hide="option==2">Barcode</th>
                        <th style="width:200px">Size</th>
                        <th style="width:200px" ng-hide="option==1">MRP</th>
                        <th style="width:150px">Stock</th>
                        <th style="width:100px">
                            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Select
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="item in BarcodeList|filter:searchbarcode">
                        <td ng-hide="option==1">{{item.sno}}</td>
                        <td>{{item.product}}</td>
                        <td ng-hide="option==2">{{item.barcode}}</td>
                        <td>{{item.size}}</td>
                        <td ng-hide="option==1">{{item.mrp}}</td>
                        <td>{{item.qty}} / {{item.tqty}}</td>
                        <td style="text-align:center"><input type="checkbox" ng-model="item.selected" /></td>
                    </tr>
                </tbody>
            </table>
        </div>


        <div class="ngdialog-buttons">
            <input ng-model="selectall" type="checkbox" ng-change="SelectAllChanged(BarcodeList)" />
            <input type="text" ng-model="searchbarcode" style="width:150px" placeholder="Barcode" />
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Add</button>
            <button type="button" class="ngdialog-button ngdialog-button-secondary" ng-click="closeThisDialog()">Close</button>
        </div>
    </div>
</script>
