       <!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Warehouse / Courier
        </h1>
        <ol class="breadcrumb">
            <li ng-show="Navigation.create" style="cursor:pointer" ng-click="CreateNew()"><a><i class="fa fa-file"></i>New</a></li>
            <li ng-show="Navigation.save" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
            <li ng-show="Navigation.delete" style="cursor:pointer" ng-click=""><a><i class="fa fa-trash"></i>Delete</a></li>
            <li ng-show="Navigation.search" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('SEARCH')"><a><i class="fa fa-search"></i>Search</a></li>
            <li ng-show="Navigation.edit" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('EDIT')"><a><i class="fa fa-backward"></i>Back</a></li>
            <li ng-show="Navigation.edit" style="cursor:pointer" ng-click="DownloadImagePDF()"><a><i class="fa fa-download"></i>Image PDF</a></li>
            <li ng-show="Navigation.searchentity && SearchResult.length>0" style="cursor:pointer" ng-click="exporttoExcel(igrid,'Courier entry', 'courier')"><a><i class="fa fa-download"></i>Export</a></li>
            <li ng-show="Navigation.searchentity" style="cursor:pointer" ng-click="Search()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>

    <!-- Main content -->
    <section class="content">
        <div class="box box-primary" ng-hide="ShowSearch">
            <div class="box-body">
                <div class="col-md-12 no-padding">
                    <div class="col-md-7 no-padding">
                        <div class="col-md-6">
                            <div class="col-md-12 no-padding">
                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group required control-label">Entry No</label>

                                    <div class="col-sm-12 no-padding">
                                        <input type="text" class="form-control input-sm" ng-model="Courier.entryno" ng-readonly="true" focusonenter="awbnumber">
                                    </div>
                                </div>

                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group required control-label">Type of Courier</label>
                                    <div class="col-sm-12 no-padding">
                                        <select class="form-control" select2='Type'
                                                ng-model="Courier.type" options="item.id as item.name for item in TypesofCourier track by item.id"
                                                focusid="typeofcorier" focusonenter="companyid"
                                                ng-change="ChangeConfiguration()"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-12 no-padding">
                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group required control-label">Company</label>
                                    <div class="col-sm-12 no-padding">
                                        <select class="form-control" select2='' ng-model="Courier.receivingcompanyid"
                                                options="item.id as item.name for item in Company track by item.id"
                                                focusid="companyid" focusonenter="couriercompanyid"></select>
                                    </div>
                                </div>

                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group required control-label">Courier Company</label>
                                    <div class="col-sm-12 no-padding">
                                        <select class="form-control" select2='Company' ng-model="Courier.companyid"
                                                options="item.id as item.name for item in CourierCompany track by item.id"
                                                focusid="couriercompanyid" onkeyenter="Focus('mode')"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-12 no-padding" ng-show="CourierSetting.inward == CourierSetting.outward">
                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group required control-label">Mode</label>
                                    <div class="col-sm-12 no-padding">
                                        <select class="form-control" select2='Status' ng-model="Courier.mode"
                                                options="item.id as item.name for item in Modes track by item.id"
                                                focusid="mode" ng-change="ModeChanged()" focusonenter="status"></select>
                                    </div>
                                </div>
                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group required control-label">Status</label>
                                    <div class="col-sm-12 no-padding">
                                        <select class="form-control" select2='Status' ng-model="Courier.status"
                                                options="item.id as item.name for item in Status track by item.id"
                                                focusid="status"
                                                onkeyenter="Focus('receivedon')"></select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-12 no-padding" ng-show="Courier.mode==0">

                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group required control-label">Received On</label>
                                    <div class="col-sm-12 no-padding">
                                        <input method="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="Courier.receivedon" datemodule="Courier.receivedon"
                                               focusid="receivedon" focusonenter="receivedby">
                                    </div>

                                </div>
                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group required control-label">Received By</label>
                                    <div class="col-sm-12 no-padding">
                                        <select class="form-control" select2='Received By' ng-model="Courier.receivedby"
                                                options="item.id as item.name for item in Employees track by item.id"
                                                focusid="receivedby" style="width:100%"
                                                onkeyenter="Focus('customername')"></select>
                                    </div>

                                </div>
                            </div>

                            <div class="col-md-12 no-padding" ng-show="Courier.mode==1">
                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group required control-label">Booked On</label>
                                    <div class="col-sm-12 no-padding">
                                        <input type="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="Courier.senton" datemodule="Courier.senton"
                                               focusid="senton" focusonenter="sentby">
                                    </div>
                                </div>
                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group required control-label">Booked By</label>
                                    <div class="col-sm-12 no-padding">
                                        <select class="form-control" select2='Sent By' ng-model="Courier.sentby"
                                                options="item.id as item.name for item in Employees track by item.id"
                                                focusid="sentby"
                                                style="width:100%"
                                                onkeyenter="Focus('customername')"></select>
                                    </div>
                                </div>
                            </div>



                            <div class="col-md-12 no-padding" ng-show="CourierSetting.customer">
                                <label for="inputEmail3" class="form-group required control-label">Customer</label>
                                <div class="col-sm-12 input-group input-group-sm">
                                    <input type="text" ng-model="Courier.name" onkeyenter="ShowCustomerDialog()"
                                           class="input-sm form-control" style="width:100%"
                                           focusid="customername" />
                                    <span class="input-group-btn">
                                        <button type="button" class="btn btn-primary btn-sm" ng-click="ShowCustomerDialog()"
                                                data-widget="go" data-toggle="tooltip" title="Go">
                                            <i class="fa fa-search"></i>
                                        </button>
                                    </span>
                                </div>
                            </div>

                            <div class="col-md-12 no-padding" ng-show="CourierSetting.name">
                                <label for="inputEmail3" class="form-group required control-label">Person</label>
                                <div class="col-sm-12 no-padding">
                                    <input type="text" ng-model="Courier.name" focusid="personname"
                                           onkeyenter="Focus('customerb2b')"
                                           class="input-sm form-control" style="width:100%" />
                                </div>
                            </div>

                            <div class="col-md-12 no-padding" ng-show="CourierSetting.customerb2b">
                                <label for="inputEmail3" class="form-group required control-label">Customer</label>
                                <div class="col-sm-12 no-padding">
                                    <select class="form-control" select2='Supplier'
                                            ng-model="Courier.customerid"
                                            options="item.id as item.name for item in B2BCustomers track by item.id"
                                            focusid="customerb2b"
                                            style="width:100%"
                                            onkeyenter="Focus('supplierid')"></select>
                                </div>
                            </div>
                            <div class="col-md-12 no-padding" ng-show="CourierSetting.supplier || CourierSetting.agent">
                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group required control-label">Supplier</label>
                                    <div class="col-sm-12 no-padding">
                                        <select class="form-control" select2='Supplier' ng-model="Courier.supplierid"
                                                options="item.id as item.name for item in Suppliers track by item.id"
                                                focusid="supplierid"
                                                style="width:100%"
                                                focusonenter="agentid"></select>
                                    </div>
                                </div>

                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group control-label">Agent</label>
                                    <div class="col-sm-12 no-padding">
                                        <select class="form-control" select2='Agent'
                                                ng-model="Courier.agentid" options="item.id as item.name for item in Agent track by item.id"
                                                focusid="agentid"
                                                style="width:100%"
                                                onkeyenter="Focus('invoiceno')"></select>
                                    </div>
                                </div>
                            </div>


                        </div>
                        <div class="col-md-6">

                            <div class="col-md-12 no-padding" ng-show="CourierSetting.invoiceno">
                                <div class="col-md-4 no-padding">
                                    <label for="inputEmail3" class="form-group  control-label">No Of Bundle</label>
                                    <div class="col-sm-12 no-padding">
                                        <input type="number" class="form-control input-sm" ng-model="Courier.bundles"
                                               focusid="invoiceno" focusonenter="lrnos">
                                    </div>

                                </div>
                                <div class="col-md-4 no-padding">
                                    <label for="inputEmail3" class="form-group  control-label">No Of LR's</label>
                                    <div class="col-sm-12 no-padding">
                                        <input type="number" class="form-control input-sm" ng-model="Courier.lrnos"
                                               focusid="lrnos" focusonenter="invnos">
                                    </div>

                                </div>
                                <div class="col-md-4 no-padding">
                                    <label for="inputEmail3" class="form-group  control-label">No Of Invoice</label>
                                    <div class="col-sm-12 no-padding">
                                        <input type="number" class="form-control input-sm" ng-model="Courier.invnos"
                                               focusid="invnos"
                                               onkeyenter="Focus('collectpayment')">
                                    </div>
                                </div>

                            </div>


                            <div class="col-md-12 no-padding" ng-show="CourierSetting.collectpayment">
                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group  control-label">Weight</label>
                                    <div class="col-sm-12 no-padding">
                                        <input type="number" class="form-control input-sm" ng-model="Courier.weight"
                                               focusid="collectpayment" focusonenter="rate"
                                               ng-change="tamountchanged('weight')">
                                    </div>
                                </div>
                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group  control-label">Rate</label>
                                    <div class="col-sm-12 no-padding">
                                        <input type="number" class="form-control input-sm" ng-model="Courier.rate"
                                               focusid="rate" focusonenter="taxid" ng-change="tamountchanged('rate')">
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-12 no-padding" ng-show="CourierSetting.collectpayment">
                                <div class="col-md-4 no-padding">
                                    <label for="inputEmail3" class="form-group  control-label">T.Tax %</label>
                                    <div class="col-sm-12 no-padding">
                                        <select class="form-control input-sm" select2="Tax %" style="width:100%;" ng-options="item.id as item.name for item in purchaseTax track by item.id"
                                                ng-model="Courier.taxid" ng-change="taxChanged()" focusid="taxid" focusonenter="taxamount"></select>

                                    </div>
                                </div>
                                <div class="col-md-4 no-padding">
                                    <label for="inputEmail3" class="form-group  control-label">T.Tax Amt</label>
                                    <div class="col-sm-12 no-padding">
                                        <input type="number" class="form-control input-sm" ng-model="Courier.taxamount"
                                               focusid="taxamount" focusonenter="amount" ng-change="tamountchanged('tax')">
                                    </div>
                                </div>
                                <div class="col-md-4 no-padding">
                                    <label for="inputEmail3" class="form-group  control-label">T.Amount</label>
                                    <div class="col-sm-12 no-padding">
                                        <input type="number" class="form-control input-sm"
                                               ng-model="Courier.amount" focusid="amount"
                                               ng-change="tamountchanged('amount')"
                                               onkeyenter="Focus('billcopy')">
                                    </div>
                                </div>
                            </div>


                            <div class="col-md-12 no-padding" ng-show="CourierSetting.billcopy">
                                <div class="col-md-4 no-padding">
                                    <label for="inputEmail3" class="form-group  control-label">Copy Bills</label>
                                    <div class="col-sm-12 no-padding">
                                        <input type="text" class="form-control input-sm" ng-model="Courier.copybills"
                                               focusid="billcopy" focusonenter="isbillcopy">
                                    </div>

                                </div>
                                <div class="col-md-4 no-padding">
                                    <label for="inputEmail3" class="form-group  control-label">Is Bill Copy</label>
                                    <div class="col-sm-12">
                                        <input type="checkbox" class="icheckbox_minimal-blue"
                                               ng-model="Courier.isbillcopy"
                                               focusid="isbillcopy"
                                               focusonenter="ishold">
                                    </div>
                                </div>
                                <div class="col-md-4 no-padding">
                                    <label for="inputEmail3" class="form-group  control-label">Is Hold</label>
                                    <div class="col-sm-12">
                                        <input type="checkbox" class="icheckbox_minimal-blue"
                                               ng-model="Courier.ishold"
                                               focusid="ishold"
                                               onkeyenter="Focus('detail')">
                                    </div>
                                </div>
                            </div>


                            <div class="col-md-12 no-padding" ng-show="CourierSetting.detail">
                                <div class="col-sm-12 no-padding">
                                    <div class="col-md-8 no-padding">
                                        <label for="inputEmail3" class="form-group  control-label">Detail</label>
                                    </div>
                                    <div class="col-md-4 no-padding">
                                        <label for="inputEmail3" class="form-group  control-label">Paid By</label>
                                    </div>
                                </div>

                                <div class="col-sm-12 no-padding">
                                    <div class="col-md-8 no-padding">
                                        <input type="text" rows="1" class="form-control input-sm"
                                               ng-model="Courier.description"
                                               focusid="detail"
                                               focusonenter="paymode" />
                                    </div>
                                    <div class="col-md-4 no-padding">
                                        <select class="form-control" select2='Paid By' ng-model="Courier.paymode"
                                                options="item.id as item.name for item in PayModes track by item.id"
                                                focusid="paymode"
                                                style="width:100%"
                                                onkeyenter="Focus('awbewb')"></select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-12 no-padding" ng-show="CourierSetting.awbewb">

                                <div class="col-md-6 no-padding">
                                    <div class="col-md-12 no-padding">
                                        <label for="inputEmail3" class="form-group  control-label">EWB No</label>
                                        <div class="col-sm-12 no-padding">
                                            <input type="text" class="form-control input-sm" ng-model="Courier.ewbno"
                                                   focusid="awbewb" focusonenter="packedby">
                                        </div>
                                    </div>
                                </div>

                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group required control-label">Packed By</label>
                                    <div class="col-sm-12 no-padding">
                                        <select class="form-control" select2='Sent By' ng-model="Courier.packedby"
                                                options="item.id as item.name for item in Employees track by item.id"
                                                focusid="packedby"
                                                style="width:100%"
                                                onkeyenter="Focus('pod')"></select>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                    <div class="col-md-5 no-padding">

                        <div class="col-md-6 no-padding">
                            <div class="col-md-12 no-padding" ng-show="CourierSetting.pod">
                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group  control-label">POD Date </label>
                                    <div class="col-sm-12 no-padding">
                                        <input type="text" class="form-control input-sm"
                                               ng-model="Courier.poddate"
                                               datemodule="Courier.poddate"
                                               focusid="pod"
                                               focusonenter="podnumber">
                                    </div>
                                </div>
                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group  control-label">POD No</label>
                                    <div class="col-sm-12 no-padding">
                                        <input type="text" class="form-control input-sm"
                                               ng-model="Courier.podnumber" focusid="podnumber"
                                               onkeyenter="SearchPOD()">
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-12" ng-show="CourierSetting.pod"
                                 style="padding-left:0px;padding-right:0px;padding-top:10px">

                                <table fixed-header="170px">
                                    <thead>
                                        <tr>

                                            <th width="100px">Bill No</th>
                                            <th width="100px">Amount</th>
                                            <th width="50px">&nbsp;</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr ng-repeat="item in Courier.podlist">
                                            <td style="align-content:center">{{item.billno}}</td>
                                            <td style="align-content:center">{{item.billamount}}</td>
                                            <td>
                                                <button type="button" class="btn-danger btn btn-xs btn-flat" ng-click="ManagesearchSlideItem('DeletePOD',item)"
                                                        data-widget="delete" data-toggle="tooltip" title="Delete">
                                                    <i class="fa fa-trash" aria-hidden="true"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>

                            </div>
                        </div>

                        <div class="col-md-6 no-padding">


                            <div class="col-md-12" style="padding-left:0px;">
                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group  control-label">Attachment</label>
                                    <div class="col-sm-12 no-padding">
                                        <select class="form-control input-sm" select2='Type' style="width:100%;"
                                                ng-model="Slide.title"
                                                focusid="attachmenttype"
                                                focusonenter="cameracapture"
                                                options="item.id as item.name for item in ImageTypes track by item.id"></select>
                                    </div>
                                </div>
                                <div class="col-md-6 no-padding" ng-show="Slide.title">
                                    <label for="inputEmail3" class="form-group  control-label">&nbsp;</label>
                                    <div class="col-sm-12 no-padding">
                                        <div style="padding-left:5px;padding-top:5px">
                                            <button class="btn btn-success btn-rad btn-trans btn-xs pull-right"
                                                    ng-click="CaptureImage('IMAGE',ImageCaptured)"
                                                    focusid="cameracapture">
                                                <i class="fa fa-camera"></i>
                                            </button>
                                        </div>
                                        <div style="padding-left:5px;padding-top:0px">
                                            <file-upload class="btn btn-success btn-rad btn-trans btn-xs file-upload"
                                                         resize="true" max-width="1280"
                                                         onuploadcomplete="ImageCaptured"
                                                         max-height="1280" preview="true" ng-model="Slide.image"
                                                         filemodel="Slide.image"
                                                         filetype="IMAGE"
                                                         multiple="false">
                                                <i class="fa fa-upload">Upload File</i>
                                            </file-upload>
                                        </div>
                                    </div>
                                </div>
                            </div>


                            <div class="col-md-12" style="padding-left:0px;padding-top:10px">


                                <table fixed-header="170px">
                                    <thead>
                                        <tr>

                                            <th width="50px">Image</th>
                                            <th width="150px">Type</th>

                                            <th width="50px">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr ng-repeat="item in Courier.attachment">

                                            <td style="align-content:center">

                                                <a href="File/Show/{{UserInfo.OrganizationID}}/{{item.image}}" target="_blank">
                                                    <img ng-src="File/Thumbnail/0/{{item.image}}" style="height:50px;width:50px" />
                                                </a>

                                            </td>
                                            <td style="align-content:center">{{item.title}}</td>
                                            <td>
                                                <button type="button" class="btn-danger btn btn-xs btn-flat" ng-click="ManagesearchSlideItem('DeleteSlide',item)"
                                                        data-widget="delete" data-toggle="tooltip" title="Delete">
                                                    <i class="fa fa-trash" aria-hidden="true"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>

                            </div>
                        </div>

                    </div>
                </div>

                <div class="col-md-12" style="padding-left:0px;padding-right:0px;padding-top:10px">

                    <div class="col-md-12" id="gridedit">

                    </div>

                </div>

            </div>
        </div>

        <div class="box box-primary" id="searchBox" ng-show="ShowSearch">
            <div class="box-body">
                <div class="col-md-3">

                    <div class="col-md-12 no-padding">
                        <label for="inputEmail3" class="col-md-12 no-padding control-label">Company</label>

                        <select class="form-control input-sm" select2=''
                                style="width:100%"
                                ng-model="SearchCondition.receivingcompanyid"
                                options="item.id as item.name for item in Company track by item.id"></select>

                    </div>

                    <div class="col-md-12 no-padding">
                        <label for="inputEmail3" class="col-md-12 no-padding control-label">Courier Company</label>

                        <select class="form-control input-sm" select2=''
                                style="width:100%" ng-model="SearchCondition.companyid" options="item.id as item.name for item in CourierCompany track by item.id"></select>

                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="col-md-12 no-padding control-label">Supplier</label>

                            <select class="form-control input-sm" style="width:100%" select2='' ng-model="SearchCondition.supplierid" options="item.id as item.name for item in Suppliers track by item.id"></select>
                        </div>

                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="col-md-12 no-padding control-label">Agent</label>

                            <select class="form-control input-sm" style="width:100%" select2='' ng-model="SearchCondition.agentid" options="item.id as item.name for item in Agent track by item.id"></select>

                        </div>

                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="col-md-12 no-padding control-label">Type Of Courier</label>

                            <select class="form-control input-sm" style="width:100%" select2='' ng-model="SearchCondition.type" options="item.id as item.name for item in TypesofCourier track by item.id"></select>

                        </div>
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="col-md-12 no-padding control-label">Status</label>

                            <select class="form-control input-sm" style="width:100%" select2='' ng-model="SearchCondition.status" ng-options="item.name as item.name for item in Status track by item.name"></select>

                        </div>

                    </div>


                    <div class="col-md-12 no-padding">
                        <label for="inputEmail3" class="col-md-12 no-padding control-label">Sent On</label>

                        <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.sentfromdate,SearchCondition.senttodate">

                    </div>

                    <div class="col-md-12 no-padding">
                        <label for="inputEmail3" class="col-md-12 no-padding control-label">Received On</label>

                        <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.receivedfromdate,SearchCondition.receivedtodate">

                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="col-md-12 no-padding control-label">EWB Number</label>

                            <input type="text" class="form-control input-sm" id="inputEmail3" placeholder="" ng-model="SearchCondition.ewbno">

                        </div>
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="col-md-12 no-padding control-label">POD Number</label>
                            <input type="text" class="form-control input-sm" id="inputEmail3" placeholder="" ng-model="SearchCondition.podnumber">

                        </div>

                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="form-group  control-label">Is Bill Copy</label>
                            <div class="col-sm-12">
                                <input type="checkbox" class="icheckbox_minimal-blue"
                                       ng-model="SearchCondition.isbillcopy">
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label for="inputEmail3" class="form-group  control-label">Is Hold</label>
                            <div class="col-sm-12">
                                <input type="checkbox" class="icheckbox_minimal-blue"
                                       ng-model="SearchCondition.ishold">
                            </div>
                        </div>
                    </div>


                </div>
                <div class="col-md-9" style="padding-left:5px">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>

                </div>

            </div>
            <!-- /.row -->
        </div>
    </section>
    <!-- /.content -->
</div>


<script type="text/ng-template" id="SearchCustomer">
    <div class="ngdialog-message">
        <div>
            <div class="col-md-12">
                <div class="row row-padbot-15">
                    <div class="col-md-12">
                        <label for="inputEmail3" class="col-md-3 control-label">Name</label>
                        <div class="col-md-6">
                            <input type="text" class="form-control input-sm" style="width: 100%;" focusid="customer_name" focusonenter="customer_contact" ng-model="name">
                        </div>
                    </div>
                </div>
                <div class="row row-padbot-15">
                    <div class="col-md-12">
                        <label for="inputEmail3" class="col-md-3 control-label">Contact No</label>
                        <div class="col-md-6">
                            <input type="text" class="form-control input-sm" style="width: 100%;" focusid="customer_contact" focusonenter="customer_area" ng-model="contactno">
                        </div>
                    </div>
                </div>
                <div class="row row-padbot-15">
                    <div class="col-md-12">
                        <label for="inputEmail3" class="col-md-3 control-label">Area</label>
                        <div class="col-md-6">
                            <input type="text" class="form-control input-sm" style="width: 100%;" focusid="customer_area" onkeyenter="Search()" ng-model="area">
                        </div>
                    </div>
                </div>
                <div class="row row-padbot-15">
                    <div class="col-md-12">
                        <label for="inputEmail3" class="col-md-3 control-label">GST No</label>
                        <div class="col-md-6">
                            <input type="checkbox" placeholder="" ng-model="hasgst" style="position: absolute; left: 20px;top: 3px;z-index: 1000;">
                            <input type="text" class="form-control input-sm" style="width: 100%;padding-left:30px" ng-disabled="!hasgst" focusid="customer_gstno" ng-model="gstno">
                            <button type="button" style="position:absolute;right:20px;top:3px;" class="ngdialog-button ngdialog-button-primary" ng-click="Search(name,area)">Search</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-12">
                <table fixed-header="200px">
                    <thead>
                        <tr>
                            <th style="width:25px">&nbsp;</th>
                            <th style="width:250px">Name</th>
                            <th style="width:150px">Area</th>
                            <th style="width:100px">Mobile</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in PopupList">
                            <td><input type="checkbox" ng-model="item.selected" ng-change="Customer=item" /></td>
                            <td>{{item.name}}</td>
                            <td>{{item.area}}</td>
                            <td>{{item.mobileno}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <div class="col-md-12" style="padding-top:10px">
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Create()">Create</button>
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Select()">Select</button>
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
        </div>
    </div>
</script>
