<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <!--<h1>
            /{Title}}
        </h1>-->
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            CRM / Send SMS
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="Search()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>


            <li style="cursor:pointer" ng-hide="SearchCondition.typeid == 'CUSTOMERCAMPAIGN'" ng-click="SendSMS(selectedlist)"><a><i class="fa fa-arrow-right"></i>SEND SMS</a></li>
            <li style="cursor:pointer" ng-show="SearchCondition.typeid == 'CUSTOMERCAMPAIGN'" ng-click="SendMessage(selectedlist)"><a><i class="fa fa-arrow-right"></i>START</a></li>


            <li style="cursor:pointer">
                <file-upload class="btn-xs file-upload" style="display:inline-block" resize="true" max-width="1280"
                             max-height="1280" preview="false" onlyupload="true" ng-model="referencefile"
                             filemodel="referencefile" onuploadcomplete='fileuploadedcomplete'
                             uri='File/UploadXLSX/{{UserInfo.OrganizationID}}/'
                             multiple="false">
                    <i class="fa fa-upload"></i>
                    <span>Upload</span>
                </file-upload>
            </li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box primary">
            <div class="box-body">
                <div class="col-md-4 no-padding">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <div class="col-md-12 no-padding">
                                Source
                            </div>
                            <div class="col-md-12" style="padding-left:0px;padding-top:10px;padding-right:0px">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Types track by item.id"
                                        ng-change="ChangeReport()" ng-model="SearchCondition.typeid" focusid="source" focusonenter="custcatogery"></select>
                            </div>

                        </div>
                    </div>

                    <div class="col-md-12" ng-show="Customers">
                        <div class="col-md-6 no-padding">
                            <label>CUSTOMER CATEGORY</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in CustomerCategory track by item.id" ng-model="SearchCondition.categoryid" focusid="custcatogery" focusonenter="location"></select>
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label>LOCATION</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Location track by item.id" ng-model="SearchCondition.locationid" focusid="location" focusonenter="dob"></select>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12" ng-show="Employee || Customers">
                        <div class="col-md-12 no-padding">
                            <div class="col-md-6 no-padding">
                                <label>BIRTH DATE</label>
                                <div class="input-group-sm">
                                    <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.dobfromdate,SearchCondition.dobtodate" focusid="dob" focusonenter="floor">
                                </div>
                            </div>
                            <div class="col-md-6 no-padding" ng-hide="Employee">
                                <label>BILL DATE</label>
                                <div class="input-group-sm">
                                    <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="billdate" focusonenter="religion">
                                </div>
                            </div>
                            <div class="col-md-6 no-padding" ng-show="Employee">
                                <label>ANNIVERSARY DATE</label>
                                <div class="input-group-sm">
                                    <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="anniversarydate" focusonenter="floor">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12" ng-show="Customers">
                        <div class="col-md-6 no-padding">
                            <label>FLOOR</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Floor track by item.id" ng-model="SearchCondition.floorid" focusid="floor" focusonenter="counter"></select>
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label>COUNTER</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Counter track by item.id" ng-model="SearchCondition.counterid" focusid="counter" focusonenter="product"></select>
                            </div>
                        </div>
                    </div>


                    <div class="col-md-12" ng-show="Customers">
                        <div class="col-md-6 no-padding">
                            <label>PRODUCT</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Product track by item.id" ng-model="SearchCondition.productid" focusid="product" focusonenter="brand"></select>
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label>BRAND</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Brand track by item.id" ng-model="SearchCondition.brandid" focusid="brand" focusonenter="size"></select>
                            </div>
                        </div>
                    </div>


                    <div class="col-md-12" ng-show="Customers">
                        <div class="col-md-6 no-padding">
                            <label>SIZE</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Sizes track by item.id" startswith="true" ng-model="SearchCondition.sizeid" focusid="size" focusonenter="billdate"></select>
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label>RELIGION</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Religions track by item.id" ng-model="SearchCondition.religionid" focusid="religion" focusonenter="billvaluefrom"></select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12" ng-show="Customers">
                        <div class="col-md-6 no-padding">

                            <div class="col-md-12 no-padding">
                                City
                            </div>

                            <div class="col-md-12" style="padding-left:0px;padding-top:10px;padding-right:0px">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="city.id as city.name for city in Cities track by city.id" startswith="true" ng-model="SearchCondition.cityid" focusid="city" focusonenter="billvaluefrom"></select>
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <div class="col-md-12 no-padding">
                                Area
                                <div style="position:absolute;top:1px;right:1px" ng-show="Customers">
                                    Area Group <input type="checkbox" ng-model="SearchCondition.showareagroup" />
                                </div>
                            </div>
                            <div class="col-md-12" style="padding-left:0px;padding-top:10px;padding-right:0px">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="city.id as city.name for city in Area track by city.id" startswith="true" ng-model="SearchCondition.areaid" focusid="city" focusonenter="billvaluefrom"></select>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12" ng-show="Customers && SearchCondition.showareagroup">
                        <div class="col-md-6 no-padding">
                            <label>Area Group - 1</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in AreaGroup1 track by item.id" startswith="true" ng-model="SearchCondition.areagroup1id"></select>
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label>Area Group - 2</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in AreaGroup2 track by item.id" ng-model="SearchCondition.areagroup2id" ></select>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding" ng-show="Supplier">
                        <div class="col-md-12">
                            <label>City</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="city.id as city.name for city in Cities track by city.id" startswith="true" ng-model="SearchCondition.cityid" focusid="city" focusonenter="billvaluefrom"></select>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12" ng-show="Customers">

                        <div class="col-md-6 no-padding">
                            <label>Bill Value From</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" style="width: 100%;" placeholder="FROM" ng-model="SearchCondition.fromprice" ng-maxlength="150" focusid="billvaluefrom" focusonenter="billvalueto">
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label>BILL Value To</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" style="width: 100%;" placeholder="TO" ng-model="SearchCondition.toprice" ng-maxlength="150" focusid="billvalueto" focusonenter="smsurl">
                            </div>
                        </div>

                    </div>



                    <div class="col-md-12" ng-hide="SearchCondition.typeid == 'CUSTOMERCAMPAIGN'">
                        <span>URL</span>
                        <input method="text" class="form-control input-sm" placeholder="" style="width: 100%;" ng-model="SearchCondition.smsurl" focusid="smsurl" focusonenter="message">

                    </div>


                    <div class="col-md-12" ng-hide="SearchCondition.typeid == 'CUSTOMERCAMPAIGN'">
                        <span>Message</span>
                        <textarea class="form-control input-sm" rows="2" ng-model="SearchCondition.template" ng-required="true" focusid="message" focusonenter="mobileno"></textarea>
                    </div>



                </div>

                <div class="col-md-8 no-padding">

                    <div class="col-md-6" style="padding-left:0px" ng-show="SearchCondition.typeid == 'CUSTOMERCAMPAIGN'">
                        <div class="col-md-12 no-padding">
                            <label>CAMPAIGN</label>
                            <div class="col-md-12 no-padding">
                                <select class="input-sm form-control" select2="" style="width: 100%;"
                                        options="item.id  as item.description for item in CampaignList track by item.id"
                                        ng-model="SearchCondition.campaignid"></select>
                            </div>
                        </div>


                    </div>

                    <div class="col-md-6 pull-right" style="padding-right:0px;padding-bottom:10px">
                        <span>Add to List</span>
                        <div class="input-group input-group-sm">
                            <input method="text" class="form-control input-sm" placeholder="Mobile No" style="width: 100%;" ng-model="SearchCondition.mobileno" focusid="mobileno" onkeyenter="AddMobileNo()">
                            <span class="input-group-btn">
                                <button class="btn btn-sm btn-primary btn-box" ng-click="AddMobileNo()"><i class="fa fas fa-plus"></i></button>
                            </span>
                            <span class="input-group-btn">
                                <button class="btn btn-sm btn-danger btn-box" ng-click="RemoveMobileNo()"><i class="fa fas fa-times "></i></button>
                            </span>
                        </div>

                    </div>

                    <div class="col-md-12 no-padding" id="gridContainer">

                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 input-group-sm" ng-show="Customers">
                            Exclude Customer Who has Sales inbetween <input type="checkbox" ng-model="SearchCondition.excludecustomerhassale" />
                        </div>
                        <div class="col-md-6 input-group-sm">
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.excludefromdate,SearchCondition.excludetodate" focusid="ecludedate">
                        </div>
                    </div>


                </div>


            </div>

        </div>

    </section>
</div>

<script type="text/ng-template" id="SendSms">
    <div class="ngdialog-message">

        <div class="table-responsive mailbox-messages">
            <div class="col-md-12">
                <div style="height:30px"></div>
                <div class="col-md-10">
                    <span>Template</span>
                    <div class="input-group input-group-sm">
                        <select class="form-control select2" style="width: 100%;" select2="" options="item.id as item.code for item in refsmstemplate track by item.id" ng-model="smstemplateid"></select>
                        <span class="input-group-btn">
                            <button type="button" class="btn btn-primary btn-sm" ng-click="GetTemplateText()" data-widget="search" data-toggle="tooltip" title="Search"><i class="fa fa-plus"></i></button>
                        </span>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-md-10">
                        <label>Message</label>
                        <textarea name="message" class="form-control" rows="7" ng-trim="false" ng-model="SendSms.message" required ng-keyup="Calculate()"></textarea>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-md-2">
                    </div>
                </div>
            </div>

        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Send()" data-widget="send" data-toggle="tooltip" title="Send">Send</button>
    </div>
</script>
