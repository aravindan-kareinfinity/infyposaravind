<script type="text/ng-template" id="ProductSearch">
    <div class="ngdialog-message">
        <div class="table-responsive mailbox-messages">
            <div class="col-md-12">
                <table fixed-header="150px" class="fixed_table">
                    <thead>
                        <tr>
                            <th style="width:100px">Name</th>
                            <th style="width:150px">Detail</th>
                            <th style="width:40px">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in PopupList">
                            <td>{{item.printingname}}</td>
                            <td>{{item.display}}</td>
                            <td><button type="button" class="btn btn-xs btn-primary" ng-click="Selected(item)">Select</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>

<script type="text/ng-template" id="PurchaseOrderGenerator">
    <div class="ngdialog-message">

        <div class="table-responsive mailbox-messages">
            <div class="col-md-12">
                <div class="col-md-6 no-padding">
                    <div class="form-group">
                        <label for="inputEmail3" class="col-md-4 form-group required control-label">Company</label>
                        <div class="col-md-8">
                            <select class="form-control input-sm" select2='Company' style="width:100%"
                                    ng-model="companyid" options="item.id as item.name for item in CompanyList track by item.id"></select>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 no-padding">
                    <div class="form-group">
                        <label for="inputEmail3" class="col-md-4 form-group required control-label">Supplier</label>
                        <div class="col-md-8">
                            <select class="form-control input-sm" select2='Supplier' style="width:100%"
                                    ng-model="supplierid" options="item.id as item.name for item in SupplierList track by item.id"></select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-12">
                <div class="col-md-6 no-padding">
                    <div class="form-group">
                        <label for="inputEmail3" class="col-md-4 form-group required control-label">PO Date</label>
                        <div class="col-md-8">
                            <div class="input-group date">
                                <div class="input-group-addon">
                                    <i class="fa fa-calendar"></i>
                                </div>
                                <input type="text" class="form-control datepicker input-sm" datemodule="podate" ng-model="Podate">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 no-padding">
                    <div class="form-group">
                        <label for="inputEmail3" class="col-md-4 form-group required control-label">Order Location</label>
                        <div class="col-md-8">
                            <select class="form-control input-sm" select2='Location' style="width:100%"
                                    ng-model="locationid" options="item.id as item.name for item in LocationList track by item.id"></select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-12">
                <div class="col-md-6 no-padding">
                    <div class="form-group">
                        <label for="inputEmail3" class="col-md-4 form-group required control-label">Due Date</label>
                        <div class="col-md-8">
                            <div class="input-group date">
                                <div class="input-group-addon">
                                    <i class="fa fa-calendar"></i>
                                </div>
                                <input type="text" class="form-control datepicker input-sm" datemodule="expectedate" ng-model="Expectedate">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 no-padding">
                    <div class="form-group">
                        <label for="inputEmail3" class="col-md-4 form-group required control-label">Delivery Location</label>
                        <div class="col-md-8">
                            <select class="form-control input-sm" select2='Location' style="width:100%"
                                    ng-model="deliverylocationid" options="item.id as item.name for item in LocationList track by item.id"></select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-12">
                <div class="col-md-12 no-padding">
                    <div class="form-group">
                        <label for="inputEmail3" class="col-md-2 form-group required control-label">
                            Purchase Incharge
                        </label>
                        <div class="col-md-10">
                            <select class="form-control input-sm" select2='Company' style="width:100%"
                                    ng-model="shopcontactemployeeid" options="item.id as item.name for item in EmployeeList track by item.id"></select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-12">
                <table fixed-header="250px" class="fixed_table">
                    <thead>
                        <tr>
                            <th style="width:100px">Product</th>
                            <th style="width:100px">Attributes</th>
                            <th style="width:80px">Design</th>
                            <th style="width:80px">Price</th>
                            <th style="width:80px">Delivery Mode</th>
                            <th style="width:60px">Qty</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in PopupList">
                            <td>{{item.productname}}</td>
                            <td>{{item.description}}/{{item.sizename}}</td>
                            <td><input type="text" class="input-sm" style="width:100%" ng-model="item.designid" /></td>
                            <td><input type="text" class="input-sm" style="width: 100%" ng-model="item.pricerange" /></td>
                            <td>
                                <select class="form-control input-sm" select2='Location' style="width:100%"
                                        ng-model="item.deliverymode" options="item.id as item.name for item in DeliveryModeList track by item.id"></select>
                            </td>
                            <td style="text-align:right;padding-right:5px">{{item.oqty}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons" style="padding-right:15px">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Save()">Save</button>
    </div>
</script>
