<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <!--<h1>
            /{Title}}
        </h1>-->
        <h1>
            Customer Anniversary Campaign
        </h1>
        <ol class="breadcrumb">
            <li><a href="#"><i class="fa fa-dashboard"></i>Home</a></li>
            <li><a href back-button>Back</a></li>
            <li class="active">{{Title}} details</li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box">
            <div class="box-body">


                <div class="row">
                    <div class="col-md-5">
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputPassword3" class="col-md-4 control-label">DATE</label>
                                <div class="col-md-8 col-sm-8">

                                    <div class="input-group input-group-sm">
                                        <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate">
                                        <span class="input-group-btn">
                                            <button class="btn btn-sm btn-primary btn-box" ng-click="SearchAnniversary()"><i class="fa fas fa-search"></i></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row-padbot-15">
                            <div class="table-responsive mailbox-messages">

                                <table fixed-header="500px" class="fixed_table">
                                    <thead>
                                        <tr>
                                            <th style="width:100px">Name</th>
                                            <th style="width:100px">Mobile No</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr ng-repeat="item in SearchResult">
                                            <td>{{item.name}}</td>
                                            <td>{{item.mobileno}}</td>
                                        </tr>
                                    </tbody>
                                </table>

                            </div>
                        </div>

                    </div>
                    <!-- /.col -->
                    <div class="col-md-6">

                        <div class="form-group">
                            <div class="col-md-10">
                                <label style="font-size:large;color:brown">Message</label>
                                <textarea name="message" class="form-control" rows="7" ng-trim="false" ng-model="SendSms.message" required></textarea>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-md-10">
                                <span class="direct-chat-timestamp">Length ({{SendSms.message.length > 0 ? SendSms.message.length : 0}}/160)</span>
                                <button type="button" class="btn btn-info btn-sm pull-right" ng-click="Send()" data-widget="send" data-toggle="tooltip" title="Send">Send</button>
                            </div>
                        </div>

                    </div>
                    <!-- /.col -->
                </div>
                <!-- /.row -->


            </div>
        </div>
    </section>
</div>
