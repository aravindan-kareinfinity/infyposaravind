<div>
    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
        <!-- Content Header (Page header) -->
        <section class="content-header">
            <h1>
                <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
                Finance / Bank Reconciliation
            </h1>
            <ol class="breadcrumb">
                <li ng-show="ChangeCount>0" style="cursor:pointer" ng-click="SaveBRS()"><a><i class="fa fa-save"></i>Save BRS</a></li>
                <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'BRS', 'BRS')"><a><i class="fa fas fa-save"></i>Export</a></li>
                <li style="cursor:pointer" ng-show="selectedcount==1" ng-click="EditVoucher()"><i class="fa fa-edit"></i>&nbsp;Voucher</li>
                <li ng-show="selectedcount>0" style="cursor:pointer" ng-click="ChangeStatus()"><a><i class="fa fa-check"></i>Change Status</a></li>
                <li ng-show="selectedcount>0" style="cursor:pointer" ng-click="Download()"><a><i class="fa fa-print"></i>Download({{selectedcount}})</a></li>
            </ol>
        </section>
        <!-- Main content -->
        <section class="content">
            <!-- Your Page Content Here -->
            <div class="box box-primary">
                <div class="box-body">

                    <div class="col-md-2" style="padding-right:5px">
                        <div class="col-md-12 no-padding">


                            <div class="row row-padbot-15">
                                <label for="inputEmail3" class="control-label col-md-12" style="font-weight:bolder">Company</label>
                                <div class="col-sm-12 col-md-12">
                                    <select class="form-control" select2='Company'
                                            style="width: 100%;" options="item.id as item.name for item in Company track by item.id"
                                            ng-model="SearchCondition.companyid"></select>
                                </div>
                            </div>

                            <div class="row row-padbot-15">
                                <label for="inputEmail3" class="control-label col-md-12" style="font-weight:bolder">Bank</label>
                                <div class="col-sm-12 col-md-12">
                                    <select class="form-control" select2='Bank'
                                            style="width: 100%;" options="item.id as item.name for item in Banks track by item.id"
                                            ng-model="SearchCondition.bankid"></select>
                                </div>
                            </div>


                            <div class="row row-padbot-15">
                                <label for="inputEmail3" class="control-label col-md-12" style="font-weight:bolder">Status</label>
                                <div class="col-sm-12 col-md-12">
                                    <select class="form-control" select2='Status'
                                            style="width: 100%;" options="item.id as item.name for item in StatusSearchList track by item.id"
                                            ng-model="SearchCondition.statusid"></select>
                                </div>
                            </div>

                            <div class="row-padbot-15 row">
                                <div for="inputEmail3" class="control-label col-md-12" style="font-weight:bolder">
                                    Transaction Modes
                                    <input type="checkbox" class="pull-right" ng-change="AllChanged()" ng-model="SearchCondition.alltransation" />
                                </div>
                            </div>
                            <div class="row-padbot-15 row">
                                <label for="inputEmail3" class="control-label col-md-6">Supplier</label>
                                <div class="col-md-6"><input type="checkbox" class="pull-right" ng-model="SearchCondition.supplierpayment" /></div>
                            </div>
                            <div class="row-padbot-15 row">
                                <label for="inputEmail3" class="control-label col-md-6">Transport</label>
                                <div class="col-md-6"><input type="checkbox" class="pull-right" ng-model="SearchCondition.transportpayment" /></div>
                            </div>
                            <div class="row-padbot-15 row">
                                <label for="inputEmail3" class="control-label col-md-6">Agent</label>
                                <div class="col-md-6"><input type="checkbox" class="pull-right" ng-model="SearchCondition.agentpayment" /></div>
                            </div>
                            <div class="row-padbot-15 row">
                                <label for="inputEmail3" class="control-label col-md-6">Customer</label>
                                <div class="col-md-6"><input type="checkbox" class="pull-right" ng-model="SearchCondition.customerpayment" /></div>
                            </div>
                            <div class="row-padbot-15 row">
                                <label for="inputEmail3" class="control-label col-md-6">Voucher</label>
                                <div class="col-md-6"><input type="checkbox" class="pull-right" ng-model="SearchCondition.vouchers" /></div>
                            </div>
                            <div class="row-padbot-15 row">
                                <label for="inputEmail3" class="control-label col-md-12" style="font-weight:bolder">Transaction Date</label>
                                <div class="col-sm-12 col-md-12">
                                    <div class="input-group input-group-sm">
                                        <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate">
                                        <span class="input-group-btn">
                                            <button class="btn btn-sm btn-primary btn-box" ng-click="SearchTransaction()"><i class="fa fas fa-search"></i></button>
                                        </span>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                    <div class="col-md-10" style="padding-left:0px">
                        <div class="col-md-12">
                            <div class="col-md-2 no-padding" style="font-size:large;color:orangered">Opening Balance</div>
                            <div class="col-md-2" ng-show="SearchSummary.opening>0">{{SearchSummary.opening}} Dr</div>
                            <div class="col-md-2" ng-show="SearchSummary.opening<0">{{SearchSummary.opening*-1}} Cr</div>
                            <div class="col-md-2 pull-right">
                                <div class="pull-right" ng-show="SearchSummary.closing>0">
                                    {{SearchSummary.closing}} Dr
                                </div>
                                <div class="pull-right" ng-show="SearchSummary.closing<0">
                                    {{SearchSummary.closing*-1}} Cr
                                </div>
                            </div>
                            <div class="col-md-2  no-padding pull-right" style="font-size:large;color:orangered">Closing Balance</div>

                        </div>
                        <div class="col-md-12" id="gridContainer">
                        </div>
                    </div>
                </div>

            </div>

        </section>
    </div>
    <!-- /.content-wrapper -->
</div>


<script type="text/ng-template" id="ChooseReport">
    <div class="ngdialog-message">
        <div class="md-col-12" style="margin-bottom:40px">
            <label for="inputEmail3" class="col-md-4 control-label">Report</label>
            <div class="col-sm-8 col-md-8">
                <select class="form-control input-sm" style="width: 100%;" select2="Cheque"
                        options="item.id as item.name for item in ReportList track by item.id"
                        ng-model="seletedreportid "></select>
            </div>
        </div>
        <div class="ngdialog-buttons">
            <div class="md-col-12" style="padding-bottom: 30px;padding-top: 40px;padding-right: 15px;">
                <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Save()">OK</button>
                <button type="button" class="ngdialog-button ngdialog-button-secondary" ng-click="closeThisDialog()">Close</button>
            </div>
        </div>
    </div>
</script>



<script type="text/ng-template" id="ChooseStatus">
    <div class="ngdialog-message">

        <div class="row row-padbot-15">
            <label for="inputEmail3" class="col-md-4 control-label">Status</label>
            <div class="col-sm-8 col-md-8">
                <select class="form-control input-sm" style="width: 100%;" select2="Cheque"
                        options="item.id as item.name for item in StatusList track by item.id"
                        ng-model="status"></select>
            </div>
        </div>
        <div class="row row-padbot-15">
            <label for="inputEmail3" class="col-md-4 control-label">Date</label>
            <div class="col-sm-8 col-md-8">
                <input type="text" class="form-control input-sm datepicker" datemodule="date" ng-model="date">
            </div>
        </div>
        <div class="ngdialog-buttons">
            <div class="md-col-12" style="padding-bottom: 30px;padding-top: 30px;padding-right: 0px;">
                <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Save()">OK</button>
                <button type="button" class="ngdialog-button ngdialog-button-secondary" ng-click="closeThisDialog()">Close</button>
            </div>
        </div>
    </div>
</script>
