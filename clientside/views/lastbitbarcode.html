<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Store  /   Last Bit Conversion
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="Clear()"><a><i class="fa fa-file"></i>New</a></li>
            <li style="cursor:pointer" ng-show="CanGenerate" ng-click="Save()"><a><i class="fa fa-save"></i>Split</a></li>
            <li style="cursor:pointer" ng-show="BarcodeList.length>0 && CanGenerate" ng-click="PrintBarcode()"><a><i class="fa fa-barcode"></i>Print</a></li>
        </ol>


    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->

        <div class="box box-success" ng-hide="ShowSearch">
            <div class="box-body">



                <div class="col-md-8 no-padding">
                    <div class="row col-md-12" style="padding-bottom:10px">

                        <div class="col-md-6 no-padding">

                            <label for="inputEmail3" class="col-md-4 control-label">Source</label>
                            <div class="col-md-4" style="padding-right:0px">
                                <span><input type="radio" ng-model="SearchCondition.mode" value="1" class="pull-left" ng-change="Clear()" /><span style="padding-left:10px">WH Stock</span></span>
                            </div>

                            <div class="col-md-4" style="padding-left:0px">
                                <span><input type="radio" ng-model="SearchCondition.mode" value="2" ng-change="Clear()" /><span style="padding-left:10px">Retail Stock</span></span>
                            </div>

                        </div>

                        <div class="col-md-6 no-padding" ng-show="SearchCondition.mode == '1'">
                            <label for="inputEmail3" class="col-md-4 control-label">Company</label>
                            <div class="col-md-8">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid"></select>
                            </div>
                        </div>

                        <div class="col-md-6 no-padding" ng-show="SearchCondition.mode == '2'">

                            <label for="inputEmail3" class="col-md-4 control-label">LOCATION</label>
                            <div class="col-md-8">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Location track by item.id" ng-model="SearchCondition.locationid"></select>
                            </div>

                        </div>
                    </div>

                    <div class="row col-md-12" style="padding-bottom:10px">
                        <div class="col-md-6 no-padding">

                            <label for="inputEmail3" class="col-md-4 control-label">BAR CODE</label>
                            <div class="col-md-8">
                                <div class="input-group input-group-sm">
                                    <input type="text" class="form-control input-sm" id="inputPassword3" onkeyenter="Search(SearchCondition.barcode)" ng-model="SearchCondition.barcode" focusid="first">
                                    <span class="input-group-btn">
                                        <button type="button" class="btn btn-info btn-flat" ng-click="Search(SearchCondition.barcode)">Go</button>
                                    </span>
                                </div>
                            </div>

                        </div>
                        <div class="col-md-6">
                            <file-upload class="btn btn-success btn-rad btn-trans btn-sm file-upload pull-right" resize="true" max-width="1280"
                                         max-height="1280" preview="true" ng-model="Employee.personal.Img_Idcard"
                                         filemodel="Employee.personal.img_idcard" onuploadcomplete='fileuploadedcomplete'
                                         uri='File/UploadXLSX/{{UserInfo.OrganizationID}}/'
                                         multiple="false">
                                <i class="fa fa-upload"></i>
                                <span>Upload</span>
                            </file-upload>
                        </div>
                    </div>


                    <div class="row col-md-12">
                        <table fixed-header="350px" class="fixed_table" additionalheight="90">
                            <thead>
                                <tr>
                                    <th style="width:120px">NAME</th>
                                    <th ng-show="system_invcol_pricetag" style="width:100px">PRICE TAG</th>
                                    <th style="width:80px">BARCODE</th>
                                    <th style="width:80px;">PRICE</th>
                                    <th style="width:80px;">DISCOUNT</th>
                                    <th style="width:80px">STOCK</th>
                                    <th style="width:60px">JOURNAL</th>
                                    <th style="width:60px">QTY</th>
                                    <th style="width:30px"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="item in ItemList">
                                    <td>{{item.productname}}</td>
                                    <td ng-show="system_invcol_pricetag">{{item.pricetagname}}</td>
                                    <td>{{item.barcode}}</td>
                                    <td>{{item.price}}</td>
                                    <td>{{item.discount}}</td>
                                    <td>{{item.rstock}}</td>
                                    <td><input type="text" ng-model="item.adjstock" /></td>
                                    <td><input type="text" ng-model="item.qty" /></td>
                                    <td><button type="button" class="btn btn-danger btn-sm pull-right" ng-click="RemoveItem(item)">Delete</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="row col-md-12">
                        <div class="col-md-4 no-padding">
                            <label for="inputEmail3" class="control-label">New Product</label>
                            <div class="col-md-12 no-padding">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in ProductList track by item.id" ng-model="SearchCondition.productid"></select>
                            </div>
                        </div>
                        <div class="col-md-2 no-padding">
                            <label for="inputEmail3" class="control-label">Price</label>
                            <div class="col-md-12 no-padding">
                                <input type="text" class="input-sm" ng-change="PriceChanged('price')" ng-model="SearchCondition.price" style="width:100%" />
                            </div>
                        </div>
                        <div class="col-md-2  no-padding">
                            <label for="inputEmail3" class=" control-label">Discount</label>
                            <div class="col-md-12 no-padding">
                                <input type="text" class="input-sm" ng-change="PriceChanged('discount')" ng-model="SearchCondition.discount" style="width:100%" />
                            </div>
                        </div>
                        <div class="col-md-2  no-padding">
                            <label for="inputEmail3" class=" control-label">Final</label>
                            <div class="col-md-12 no-padding">
                                <input type="text" class="input-sm" ng-change="PriceChanged('final')" ng-model="SearchCondition.final" style="width:100%" />
                            </div>
                        </div>
                        <div class="col-md-1  no-padding">
                            <label for="inputEmail3" class=" control-label">HSN</label>
                            <div class="col-md-12 no-padding">
                                <input type="text" class="input-sm" ng-model="SearchCondition.hsncode" style="width:100%" />
                            </div>
                        </div>
                        <div class="col-md-1  no-padding">
                            <label for="inputEmail3" class=" control-label pull-right">IsBit</label>
                            <div class="col-md-12 no-padding">
                                <input type="checkbox" class="icheckbox_flat-green pull-right" ng-model="SearchCondition.isbit" />
                            </div>
                        </div>

                    </div>

                </div>

                <div class="col-md-4" id="report" style="padding-left:0px">

                    <div class="row" style="padding-bottom:10px">


                        <label for="inputEmail3" class="col-md-4 control-label">Source Barcode</label>
                        <div class="col-md-8">
                            <div class="input-group input-group-sm">
                                <input type="text" class="form-control input-sm" id="inputPassword3" ng-model="SearchCondition.searchbarcode">
                                <span class="input-group-btn">
                                    <button type="button" class="btn btn-info btn-flat" ng-click="SearchPackCode(SearchCondition.searchbarcode)">Go</button>
                                </span>
                            </div>
                        </div>

                    </div>

                    <div class="row">&nbsp;</div>

                    <div class="row">
                        <table fixed-header="420px" class="fixed_table" additionalheight="20">
                            <thead>
                                <tr>
                                    <th style="width:50px"><input type="checkbox" ng-model="printallbarcode" ng-change="selectallbarcode()" /></th>
                                    <th>Barcode</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="item in BarcodeList">
                                    <td><input type="checkbox" ng-model="item.selected" /></td>
                                    <td>{{item.barcode}}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>


<script type="text/ng-template" id="ChooseBarecodes">
    <div class="ngdialog-message">
        <div class="md-col-12">
            <div class="table-responsive mailbox-messages">
                <table fixed-header="300px" class="fixed_table">
                    <thead>
                        <tr>
                            <th style="width:50px">SL</th>
                            <th style="width:200px">Product</th>
                            <th style="width:120px">Barcode</th>
                            <th style="width:120px">No</th>
                            <th style="width:75px">Copy</th>
                            <th style="width:150px">
                                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Select
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in BarcodeList|filter:searchbarcode">
                            <td>{{item.sno}}</td>
                            <td>{{item.name}}</td>
                            <td>{{item.code}}</td>
                            <td>{{item.no}}</td>
                            <td><input type="number" ng-model="item.copy" /></td>
                            <td style="text-align:center"><input type="checkbox" ng-model="item.selected" /></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="ngdialog-buttons">
            <input ng-model="selectall" type="checkbox" ng-change="SelectAllChanged(BarcodeList)" />
            <input type="text" ng-model="searchbarcode" style="width:125px" placeholder="Barcode" />
            <input type="number" ng-model="fixcopy" style="width:70px" onkeyenter="SetCopy()" placeholder="Copies" />
            <input type="text" ng-model="fixno" style="width:100px" onkeyenter="SetSelection()" placeholder="from-to" />
            <input type="number" ng-model="packagesize" style="width:70px" placeholder="Package Size" />
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Select</button>
            <button type="button" class="ngdialog-button ngdialog-button-secondary" ng-click="closeThisDialog()">Close</button>
        </div>
    </div>
</script>
