<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->

    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Bug Tracker
        </h1>
        <ol class="breadcrumb">
            <li ng-show="Navigation.create" style="cursor:pointer" ng-click="New()"><a><i class="fa fa-file"></i>New</a></li>
            <li ng-show="Navigation.save" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
            <li ng-show="Navigation.search" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('SEARCH')"><a><i class="fa fa-search"></i>Search</a></li>
            <li ng-show="Navigation.edit" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('EDIT')"><a><i class="fa fa-backward"></i>Back</a></li>
            <li ng-show="Navigation.print" style="cursor:pointer" ng-click=""><a><i class="fa fa-print"></i>Print</a></li>
            <li ng-show="Navigation.searchentity" style="cursor:pointer" ng-click="Search()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->
        <div class="box box-primary" ng-hide="ShowSearch">
            <div class="box-body">
                <div class="col-md-6">
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Customer</label>
                                <div class="col-md-8">
                                    <select class="form-control select2" style="width: 100%;" select2="" options="item.id as item.name for item in Company track by item.id" ng-model="BugTracker.companyid"
                                            focusid="first" focusonenter="typeid"></select>
                                </div>
                                

                            </div>
                        </div>
                    </div>
                    <!--<div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group control-label">Location</label>
                                <div class="col-md-8">
                                    <select class="form-control select2" style="width: 100%;" select2="" options="item.id as item.name for item in Location track by item.id" ng-model="BugTracker.locationid"></select>
                                </div>
                                

                            </div>
                        </div>
                    </div>-->
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Type</label>
                                <div class="col-md-8">
                                    <select class="form-control select2" style="width: 100%;" select2="" options="item.id as item.name for item in Type track by item.id" ng-model="BugTracker.typeid"
                                            focusid="typeid" focusonenter="priorityid"></select>
                                </div>
                                

                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Priority</label>
                                <div class="col-md-8">
                                    <select class="form-control select2" style="width: 100%;" select2="" options="item.id as item.name for item in Priority track by item.id" ng-model="BugTracker.priorityid"
                                            focusid="priorityid" focusonenter="statusid"></select>
                                </div>
                                

                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Status</label>
                                <div class="col-md-8">
                                    <select class="form-control select2" style="width: 100%;" select2="" options="item.id as item.name for item in Status track by item.id" ng-model="BugTracker.statusid"
                                            focusid="statusid" focusonenter="requestedby"></select>
                                </div>
                                

                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Requested By</label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control input-sm" style="width: 100%;" ng-model="BugTracker.requestedby" ng-change="BugTracker.requestedby = BugTracker.requestedby.toUpperCase()"
                                           focusid="requestedby" focusonenter="requestedon">
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Requested On</label>
                                <div class="col-md-8">
                                    <input method="text" class="form-control input-sm" style="width: 100%;"
                                           ng-model="BugTracker.requestedon" datemodule="BugTracker.requestedon" focusid="requestedon" focusonenter="contactno">
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Contact No</label>
                                <div class="col-md-8">
                                    <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="BugTracker.contactno" ng-required="true" focusid="contactno" focusonenter="bugdetails">
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Bug Details</label>
                                <div class="col-md-8">
                                    <textarea name="address" class="form-control input-sm" rows="5" ng-model="BugTracker.bugdetails" focusid="bugdetails" focusonenter="assignedto"></textarea>
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <!-- /.row -->
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Assigned To</label>
                                <div class="col-md-8">
                                    <select class="form-control select2" style="width: 100%;" select2="" options="item.id as item.name for item in Employee track by item.id" ng-model="BugTracker.assignedby"
                                            focusid="assignedto" focusonenter="attachtypeid"></select>
                                </div>


                            </div>
                        </div>
                    </div>

                </div>
                <div class="col-md-6">
                    <h4 class="box-title">File Attachments</h4>

                    <div class="row row-padbot-15">
                        <div class="col-md-3">
                            <label>Type</label>
                        </div>
                        <div class="col-md-9">
                            <select class="form-control input-sm" select2='Type' style="width:100%;" ng-model="Slide.title" focusid="attachtypeid"
                                    options="item.id as item.name for item in ImageTypes track by item.id"></select>
                        </div>
                    </div>



                    <div class="row row-padbot-15">
                        <div class="col-md-3">
                            <label>Images</label>
                        </div>

                        <div class="col-md-6">
                            <div class="col-md-6 no-padding">
                                <file-upload class="btn btn-success btn-rad btn-trans btn-xs file-upload" resize="true" max-width="1280"
                                             max-height="1280" preview="true" ng-model="Slide.image"
                                             filemodel="Slide.image"
                                             multiple="false">
                                    <i class="fa fa-upload"></i>
                                    <span>Upload Files</span>
                                </file-upload>
                            </div>
                        </div>
                        <div class="col-md-2 pull-right">
                            <button type="button" class="btn btn-primary btn-xs pull-right" ng-click="AddSlide()">ADD</button>
                        </div>
                    </div>
                    <div class="row row-padbot-15">

                        <div class="col-md-12">
                            <table fixed-header="110px">
                                <thead>
                                    <tr>

                                        <th width="50px">Image</th>
                                        <th width="150px">Type</th>

                                        <th width="50px">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="item in BugTracker.attachment">

                                        <td style="align-content:center">

                                            <a href="File/Show/0/{{item.image}}" target="_blank">
                                                <img ng-src="File/Thumbnail/0/{{item.image}}" style="height:50px;width:50px" />
                                            </a>

                                        </td>
                                        <td style="align-content:center">{{item.title}}</td>

                                        <td>
                                            <button type="button" class="btn-danger btn btn-xs btn-flat" ng-click="ManagesearchSlideItem('DeleteSlide',item)"
                                                    data-widget="delete" data-toggle="tooltip" title="Delete">
                                                <i class="fa fa-trash" aria-hidden="true"></i>
                                            </button>
                                            <button type="button" class="btn-primary btn btn-xs btn-flat" ng-click="ManagesearchSlideItem('EditSlide',item)" data-widget="edit" data-toggle="tooltip" title="Edit"><i class="fa fa-pencil"></i></button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div>
                        &nbsp;
                    </div>
                    <h4 class="box-title">Resolved Details</h4>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Resolved By</label>
                                <div class="col-md-8">
                                    <select class="form-control select2" style="width: 100%;" select2="" options="item.id as item.name for item in Employee track by item.id" ng-model="BugTracker.resolvedby"></select>
                                </div>


                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Resolved On</label>
                                <div class="col-md-8">
                                    <input method="text" class="form-control input-sm" style="width: 100%;"
                                           ng-model="BugTracker.resolvedon" datemodule="BugTracker.resolvedon" focusid="resolvedon" focusonenter="supplierid">
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Comments</label>
                                <div class="col-md-8">
                                    <textarea name="comments" class="form-control input-sm" rows="2" ng-model="BugTracker.comments"></textarea>
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                </div>

            </div>
        </div>

        <div class="box box-primary" id="searchBox" ng-show="ShowSearch">
            <div class="box-body">
                <div class="row row-padbot-15">
                    <div class="col-md-6 col-sm-6">
                        <label for="inputEmail3" class="col-sm-1 col-md-2 control-label no-padding">Customer</label>
                        <div class="col-sm-4 col-md-4">
                            <select class="form-control" select2="" style="width: 100%;" ng-model="SearchCondition.companyid" options="item.id as item.name for item in Company track by item.id"></select>
                        </div>
                        <label for="inputEmail3" class="col-sm-1 col-md-2 control-label no-padding">Priority</label>
                        <div class="col-sm-4 col-md-4">
                            <select class="form-control" select2="" style="width: 100%;" ng-model="SearchCondition.priorityid" options="item.id as item.name for item in Priority track by item.id"></select>
                        </div>
                    </div>
                    <div class="col-md-6 col-sm-6">
                        <label for="inputEmail3" class="col-sm-1 col-md-1 control-label no-padding">Status</label>
                        <div class="col-sm-4 col-md-4">
                            <select class="form-control" select2="" style="width: 100%;" ng-model="SearchCondition.statusid" options="item.id as item.name for item in Status track by item.id"></select>
                        </div>
                        <label for="inputEmail3" class="col-sm-1 col-md-1 control-label no-padding">Date</label>
                        <div class="col-sm-4 col-md-4">
                            <input type="text" daterange="SearchCondition.fromdate,SearchCondition.todate" class="form-control pull-right input-sm">
                        </div>
                        <div class="col-sm-2 col-md-2 no-padding">
                            <button type="button" class="btn btn-primary btn-sm btn-box pull-right" ng-click="Search()">Search</button>
                        </div>
                    </div>
                </div>
                <div class="row row-padbot-15">
                    <div class="col-md-12" id="gridContainer">
                    </div>
                </div>
            </div>
        </div>
        <!-- /.content -->
    </section>
</div>
<!-- /.content-wrapper -->
