  <!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Master / Tailoring Order / Tailor 
        </h1>
        <ol class="breadcrumb">
            <li ng-show="Navigation.create" style="cursor:pointer" ng-click="New()"><a><i class="fa fa-file"></i>New</a></li>
            <li ng-show="Navigation.save" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
            <li ng-show="Navigation.delete" style="cursor:pointer" ng-click=""><a><i class="fa fa-trash"></i>Delete</a></li>
            <li ng-show="Navigation.search" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('SEARCH')"><a><i class="fa fa-search"></i>Search</a></li>
            <li ng-show="Navigation.edit" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('EDIT')"><a><i class="fa fa-backward"></i>Back</a></li>
            <li ng-show="Navigation.print" style="cursor:pointer" ng-click=""><a><i class="fa fa-print"></i>Print</a></li>
            <li ng-show="Navigation.searchentity" style="cursor:pointer" ng-click="Search()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->
        <div class="box box-primary" ng-hide="ShowSearch">
            <div class="box-body">

                <div class="col-md-5" style="padding-right:0px">


                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-5 form-group required control-label">Name</label>
                                <div class="col-md-7">
                                    <input type="text" name="name" class="form-control input-sm" style="width: 100%;"
                                           ng-model="Tailors.name" ng-maxlength="150"
                                           focusid="transportname" ng-change="Tailors.name = Tailors.name.toUpperCase()"
                                           focusonenter="contactno">
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- /.row -->

       

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-5 form-group required control-label">Contact No</label>
                                <div class="col-md-7">
                                        <input type="text" class="form-control input-sm" style="width: 100%;" ng-model="Tailors.contactno" 
                                               ng-maxlength="150" ng-required="true" focusid="contactno" focusonenter="emailid">
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <!-- /.row -->

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-5 form-group required control-label">Email ID</label>
                                <div class="col-md-7">
                                        <input type="email" name="emailid" class="form-control input-sm" style="width: 100%;" ng-model="Tailors.emailid" ng-required="true" focusid="emailid" focusonenter="address">
                                    </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-5 control-label">Address</label>
                                <div class="col-md-7">
                                    <textarea class="form-control input-sm" rows="3" ng-model="Tailors.address" focusid="address" focusonenter="cityid"></textarea>
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <!-- /.row -->

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-5 control-label">City</label>
                                <div class="col-md-7">
                                    <select class="form-control" style="width: 100%;" select2="" options="item.id as item.name for item in Cities track by item.id" ng-model="Tailors.cityid" focusid="cityid" focusonenter="stateid"></select>
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-5 control-label">State</label>
                                <div class="col-md-7">
                                    <select class="form-control" style="width: 100%;" select2="" options="item.id as item.name for item in States track by item.id" ng-model="Tailors.stateid" focusid="stateid" focusonenter="countryid"></select>
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <!-- /.row -->
                    <!-- /.row -->


                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-5 control-label">PAN</label>
                                <div class="col-md-7">
                                    <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Tailors.pan"
                                           focusid="pan" focusonenter="gst">
                                </div>

                            </div>
                        </div>
                        <!-- /.col -->
                    </div>


                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-5 control-label">GST</label>
                                <div class="col-md-7">
                                    <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Tailors.gst"
                                           focusid="gst" focusonenter="basetransportid">
                                </div>

                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-5 control-label">Bank</label>
                                <div class="col-md-7">
                                    <select class="input-sm form-control" select2="" style="width: 100%;"
                                            ng-model="Tailors.BankID"
                                            options="item.id as item.name for item in Banks track by item.id"
                                            focusid="BankID" focusonenter="bankbranch"></select>
                                </div>

                            </div>
                        </div>
                        <!-- /.col -->

                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-5 control-label">Branch</label>
                                <div class="col-md-7">
                                    <input type="text" class="form-control input-sm"
                                           id="inputPassword3" placeholder=""
                                           ng-model="Tailors.bankbranch"
                                           focusid="bankbranch" focusonenter="bankaccountname">

                                </div>

                            </div>
                        </div>
                        <!-- /.col -->

                    </div>


                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-5 form-group required control-label">Bank Account Name</label>
                                <div class="col-md-7">
                                    <input type="text" class="form-control input-sm" id="inputPassword3" placeholder=""
                                           ng-model="Tailors.bankaccountname" focusid="bankaccountname" focusonenter="bankifci">

                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-5 control-label">IFSC</label>
                                <div class="col-md-7">
                                    <input type="text" class="form-control input-sm" id="inputPassword3" placeholder="" ng-model="Tailors.bankifci" focusid="bankifci"
                                           focusonenter="bankaccountno">
                                </div>

                            </div>
                        </div>
                        <!-- /.col -->

                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-5 control-label">Account No</label>
                                <div class="col-md-7">
                                    <input type="text" class="form-control input-sm" id="inputPassword3" placeholder="" ng-model="Tailors.bankaccountno"
                                           focusid="bankaccountno"
                                           focusonenter="basetransportid">

                                </div>

                            </div>
                        </div>
                        <!-- /.col -->

                    </div>




                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <div class="col-md-12">
                                    <label for="inputEmail3" class="col-md-5 control-label text-green" ng-class="ErrorStyle">{{ErrorMessage}}</label>
                                </div>
                            </div>
                        </div>
                        <!--<div class="col-md-12">
            <div class="col-md-10"></div>
            <div class="col-md-1">
                <a class="btn btn-block btn btn-sm btn btn-primary" ng-click="Clear()">Clear</a>
            </div>
            <div class="col-md-1">
                <a class="pull-right btn btn-block btn btn-sm btn btn-primary" ng-click="Save()">Save</a>
            </div>
        </div>-->
                    </div>

                </div>
                <div class="col-md-7" style="padding-left:0px">

                    <div class="row row-padbot-15">
                        <div class="col-md-12">


                            <div class="col-md-12" id="gridchargecontainer">

                            </div>

                        </div>
                    </div>


                </div>
                <!-- /.row -->
            </div>
        </div>
        <div class="box box-primary" id="searchBox" ng-show="ShowSearch">

            <div class="box-body">
                <div class="col-md-3">
                    <div class="row">
                        <div class="col-md-12">
                            <label>Name</label>
                            <input type="text" class="form-control input-sm" id="inputEmail3" placeholder="" ng-model="SearchCondition.name">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>Contact No</label>
                            <input type="text" class="form-control input-sm" id="inputEmail3" placeholder="" ng-model="SearchCondition.contactno">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>In Active</label>
                            <input type="checkbox" class="icheckbox_minimal-blue" ng-model="SearchCondition.inactive">
                        </div>
                    </div>
                </div>
                <div class="col-md-9 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>
                </div>

            </div>
        </div>
        <!-- /.content -->
    </section>
</div>
<!-- /.content-wrapper -->
