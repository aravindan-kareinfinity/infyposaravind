<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Setting  /    Company
        </h1>
        <ol class="breadcrumb">
            <li ng-show="Navigation.create" style="cursor:pointer" ng-click="New()"><a><i class="fa fa-file"></i>New</a></li>
            <li ng-show="Navigation.save" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
            <li ng-show="Navigation.delete" style="cursor:pointer" ng-click=""><a><i class="fa fa-trash"></i>Delete</a></li>
            <li ng-show="Navigation.search" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('SEARCH')"><a><i class="fa fa-search"></i>Search</a></li>
            <li ng-show="Navigation.edit" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('EDIT')"><a><i class="fa fa-backward"></i>Back</a></li>
            <li ng-show="Navigation.print" style="cursor:pointer" ng-click=""><a><i class="fa fa-print"></i>Print</a></li>
            <li ng-show="Navigation.searchentity" style="cursor:pointer" ng-click="Search()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="row">

            <div class="box box-info" ng-hide="ShowSearch">

                <div class="box-body">
                    <div class="col-md-7 no-padding">
                        <div class="col-md-6" style="padding-left:15px;padding-right:5px">
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group required control-label">Code</label>
                                    <div class="col-md-8">
                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.code"
                                               focusid="first" ng-change="Company.code = Company.code.toUpperCase()">
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group required control-label">Name</label>
                                    <div class="col-md-8">
                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.name"
                                               focusid="first" ng-change="Company.name = Company.name.toUpperCase()">
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group required control-label">Reg. Name</label>
                                    <div class="col-md-8">
                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.billingname"
                                               focusid="billingname" ng-change="Company.billingname = Company.billingname.toUpperCase()">
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group required control-label">Contact Person</label>
                                    <div class="col-md-8">
                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.contactperson" focusid="contactperson">
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group required control-label">Contact No</label>
                                    <div class="col-md-8">
                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.contactno" focusid="contactno">
                                    </div>
                                </div>
                            </div>

                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group">Address</label>
                                    <div class="col-md-8">
                                        <textarea class="form-control input-sm" rows="5" ng-model="Company.address" ng-required="true"></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group">City</label>
                                    <div class="col-md-8">
                                        <select class="form-control input-sm" style="width: 100%;"
                                                select2=""
                                                options="city.id as city.name for city in Cities track by city.id"
                                                ng-model="Company.cityid" />
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group">PIN Code</label>
                                    <div class="col-md-8">
                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.pincode">
                                    </div>
                                </div>
                            </div>

                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group">State/Country</label>
                                    <div class="col-md-4" style="padding-right:0px">
                                        <select class="form-control input-sm" style="width: 100%;" select2="" options="state.id as state.name for state in States track by state.id" ng-model="Company.stateid"></select>
                                    </div>
                                    <div class="col-md-4" style="padding-left:0px">
                                        <select class="form-control input-sm" style="width: 100%;" select2="" options="country.id as country.name for country in Countries track by country.id" ng-model="Company.countryid"></select>
                                    </div>
                                </div>
                            </div>

                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group">Internal Vendor</label>
                                    <div class="col-md-1" style="padding-right:0px">
                                        <input type="checkbox" class="icheckbox_minimal-blue" ng-model="Company.internalbuyer">
                                    </div>
                                    <label for="inputEmail3" class="col-md-3 form-group">Margin</label>
                                    <div class="col-md-4" style="padding-left:0px">
                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.internalmargin">
                                    </div>
                                </div>
                            </div>

                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group">As Supplier</label>
                                    <div class="col-md-3" style="padding-right:0px">
                                        <input method="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="Company.company_as_suppliercode" onkeyenter="SearchCode('Supplier')">
                                    </div>
                                    <div class="col-md-5" style="padding-left:0px">

                                        <input method="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="Company.suppliername" ng-readonly="true">

                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group">As Customer</label>
                                    <div class="col-md-3" style="padding-right:0px">
                                        <input method="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="Company.company_as_customercode" onkeyenter="SearchCode('Customer')">
                                    </div>
                                    <div class="col-md-5" style="padding-left:0px">
                                        <input method="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="Company.customername" ng-readonly="true">
                                    </div>
                                </div>
                            </div>

                        </div>

                        <div class="col-md-6" style="padding-left:5px;padding-right:5px">

                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">GST No</label>
                                    <div class="col-md-8">
                                        <input method="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="Company.tinanddate">
                                    </div>
                                </div>
                            </div>

                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">GST Username</label>
                                    <div class="col-md-8">
                                        <input method="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="Company.gstusername">
                                    </div>
                                </div>
                            </div>

                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">EInvoice Username</label>
                                    <div class="col-md-8">
                                        <input method="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="Company.einvoiceusername">
                                    </div>
                                </div>
                            </div>

                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">EInvoice Password</label>
                                    <div class="col-md-8">
                                        <input method="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="Company.einvoicepwd">
                                    </div>
                                </div>
                            </div>

                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">GST Access Key</label>
                                    <div class="col-md-8">
                                        <input method="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="Company.gstaccesskey">
                                    </div>
                                </div>
                            </div>

                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">PF/ESI No</label>
                                    <div class="col-md-8">
                                        <div class="col-md-6 no-padding">
                                            <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.pfno">
                                        </div>
                                        <div class="col-md-6 no-padding">
                                            <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.esino">
                                        </div>

                                    </div>
                                </div>
                            </div>


                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">TAN/PAN</label>
                                    <div class="col-md-8">
                                        <div class="col-md-6 no-padding">
                                            <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.tan">
                                        </div>
                                        <div class="col-md-6 no-padding">
                                            <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.pan">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Bank A/C Name</label>
                                    <div class="col-md-8">
                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.bankaccountname">
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Account No</label>
                                    <div class="col-md-8">
                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.bankaccountno">
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">IFSC</label>
                                    <div class="col-md-8">
                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.bankifci">
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group">Email ID</label>
                                    <div class="col-md-8">
                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.emailid" ng-required="true">
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group">Website</label>
                                    <div class="col-md-8">
                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.website">
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Logo</label>
                                    <div class="col-md-8">
                                        <div class="col-md-6 no-padding">
                                            <file-upload class="btn btn-success btn-trans file-upload btn-sm"
                                                         resize="true" max-width="1280"
                                                         filetype="LOGO"
                                                         max-height="1280" preview="true" ng-model="Company._Logo"
                                                         filemodel="Company.logo"
                                                         multiple="false">
                                                <i class="fa fa-upload"></i>
                                            </file-upload>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Active</label>
                                    <div class="col-md-1">
                                        <input type="checkbox" class="icheckbox_minimal-blue" ng-model="Company.isactive">
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="col-md-5">
                        <div class="col-md-10">
                            <label style="font-size:large;color:brown">Printer Configuration</label>
                        </div>
                        <!--<div class="col-md-2 pull-right">
                            <button type="button" class="btn btn-primary btn-sm btn-primary  pull-right btn_pad btn-flat" ng-click="SwitchPanel()">Search</button>
                        </div>-->

                        <div class="row-padbot-15">
                            <div class="col-md-12">
                                <div class="col-md-8 no-padding">
                                    <div class="col-md-4 no-padding">
                                        <label>Location</label>
                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.serverLocation">
                                    </div>
                                    <div class="col-md-4 no-padding">
                                        <label>Server</label>
                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.serverName">
                                    </div>
                                    <div class="col-md-4 no-padding">
                                        <label>IP</label>
                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.serverIp">
                                    </div>
                                </div>
                                <div class="col-md-4 no-padding">
                                    <div class="col-md-6 no-padding">
                                        <label>Port</label>
                                        <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Company.serverPort">
                                    </div>
                                    <div class="col-md-6 no-padding">
                                        <label>Type</label>
                                        <div class="input-group input-group-sm">
                                            <select class="form-control input-sm" style="width: 100%;" select2="" options="servertype.id as servertype.name for servertype in servertypes track by servertype.id" ng-model="Company.serverType"></select>
                                            <span class="input-group-btn">
                                                <button type="button" class="btn btn-info btn-sm glyphicon glyphicon-plus-sign btn-flat pull-left " ng-click="AddServer()"></button>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <table fixed-header="350px" class="fixed_table">
                                    <thead>
                                        <tr>
                                            <th style="width:50px">Location</th>
                                            <th style="width:70px">Name</th>
                                            <th style="width:70px">IP</th>
                                            <th style="width:40px">Port</th>
                                            <th style="width:40px">Type</th>
                                            <th style="width:30px;text-align:center">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr ng-repeat="item in Company.servers">
                                            <td>
                                                <input type="text" style="width:100%" class="form-control input-sm" ng-model="item.location" />
                                            </td>
                                            <td>
                                                <input type="text" style="width:100%" class="form-control input-sm" ng-model="item.name" />
                                            </td>
                                            <td>
                                                <input type="text" style="width:100%" class="form-control input-sm" ng-model="item.ip" />
                                            </td>
                                            <td>
                                                <input type="text" style="width:100%" class="form-control input-sm" ng-model="item.port" />
                                            </td>
                                            <td>{{item.type}}</td>
                                            <td>
                                                <!--<button type="button" class="btn-danger btn btn-xs" ng-click="RemoveServer(item)">Delete</button>-->
                                                <button type="button" class="btn-danger btn btn-xs" ng-show="UserInfo.p_COMPANYMASTER.delete"
                                                        ng-click="RemoveServer(item)" data-widget="delete" data-toggle="tooltip" title="Delete">
                                                    <i class="fa fa-trash" aria-hidden="true"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="box box-primary" id="searchBox" ng-show="ShowSearch">
                <div class="box-body">
                    <div class="row row-padbot-15">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-sm-6">Name</label>
                                <div class="col-sm-6">
                                    <input type="text" class="form-control input-sm" ng-model="SearchCondition.name">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-sm-6">Contact Person</label>
                                <div class="col-sm-6">
                                    <input type="text" class="form-control input-sm" ng-model="SearchCondition.contactperson">
                                </div>
                            </div>
                        </div>

                        <!-- /.col -->
                    </div>

                    <!-- /.row -->
                    <div class="col-md-12">

                        <div class="col-md-12 no-padding" id="gridContainer">

                        </div>

                    </div>

                </div>
                <!-- /.content -->
            </div>

        </div>


    </section>
</div>
<!-- /.content-wrapper -->
