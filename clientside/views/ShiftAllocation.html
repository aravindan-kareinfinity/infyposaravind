<div>
    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
        <!-- Content Header (Page header) -->
        <section class="content-header">
            <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a> HR /
                Leave Analysis
            </h1>
            <ol class="breadcrumb">
                <!--<li><a href="#"><i class="fa fa-dashboard"></i>Home</a></li>-->
                <li style="cursor:pointer" ng-click="Generate()"><a><i class="fa fa-search"></i>Search</a></li>
                <li style="cursor:pointer" ng-click="printDiv('shifalloc', 'Shift Report')"><a><i class="fa fa-print"></i>Print</a></li>
                <li style="cursor:pointer" ng-click="Delete()"><a><i class="fa fa-trash"></i>Delete</a></li>
                <!--<li><a href back-button>Back</a></li>
                <li class="active">Leave Analysis</li>-->
            </ol>
        </section>
        <!-- Main content -->
        <section class="content">
            <!-- first row starts  -->
            <div class="box box-primary">
                <div class="box-body">
                    <form name="productrequestform">
                        <div class="row row-padbot-15">
                            <div class="col-md-12 col-sm-12">
                                <!-- basic details starts -->
                                <div class="col-md-4">

                                    <div class="row row-padbot-15">
                                        <div class="form-group">
                                            <label for="inputEmail3" class="col-md-4 control-label">Company</label>
                                            <div class="col-sm-8 col-md-8">
                                                <select class="form-control input-sm" style="width: 100%;" select2="" options="section.id as section.name for section in Companies track by section.id" ng-model="ShiftAllocation.companyid" focusid="first"></select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="row row-padbot-15">
                                        <div class="form-group">
                                            <label for="inputEmail3" class="col-md-4 control-label">Department</label>
                                            <div class="col-sm-8 col-md-8" style="padding-right:0px">
                                                <select class="form-control input-sm" style="width: 100%;" select2="" options="department.id as department.name for department in Departments track by department.id" ng-model="ShiftAllocation.departmentid"></select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="row row-padbot-15">
                                        <div class="form-group">
                                            <label for="inputEmail3" class="col-md-4 control-label">Floor</label>
                                            <div class="col-sm-8 col-md-8">
                                                <select class="form-control input-sm" style="width: 100%;" select2="" options="floor.id as floor.name for floor in Floors track by floor.id" ng-model="ShiftAllocation.floorid"></select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                            <div class="col-md-12 col-sm-12">
                                <!-- basic details starts -->
                                <div class="col-md-4">
                                    <div class="row row-padbot-15">
                                        <div class="form-group">
                                            <label for="inputEmail3" class="col-md-4 control-label">Working Location</label>
                                            <div class="col-sm-8 col-md-8">
                                                <select class="form-control input-sm" style="width: 100%;" select2="" options="location.id as location.name for location in Locations track by location.id" ng-model="ShiftAllocation.locationid"></select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <!-- basic details ends -->
                                <div class="col-md-4">
                                    <div class="row row-padbot-15">
                                        <div class="form-group">
                                            <label for="inputEmail3" class="col-md-4 control-label">Month/Year</label>
                                            <div class="col-md-5 col-sm-5">
                                                <select class="input-sm form-control" select2="" ng-model="ShiftAllocation.monthid" options="item.id as item.name for item in MonthList track by item.id"></select>
                                            </div>
                                            <div class="col-md-3 col-sm-3 no-padding">
                                                <input type="text" class="input-sm form-control" ng-model="ShiftAllocation.year">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="row row-padbot-15">
                                        <div class="form-group">
                                            <label for="inputEmail3" class="col-md-4 control-label">Section</label>
                                            <div class="col-sm-8 col-md-8">
                                                <select class="form-control input-sm" style="width: 100%;" select2="" options="section.id as section.name for section in Sections track by section.id" ng-model="ShiftAllocation.sectionid"></select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-12 col-sm-12">

                                <div class="col-md-4">
                                    <div class="row row-padbot-15">
                                        <div class="form-group">
                                            <label for="inputEmail3" class="col-md-4 control-label">Salary Mode</label>
                                            <div class="col-sm-8 col-md-8">
                                                <select class="form-control input-sm" style="width: 100%;" select2="" options="item.id as item.name for item in SalaryModes track by item.id" ng-model="ShiftAllocation.salarymode"></select>
                                            </div>
                                        </div>
                                    </div>
                                </div>


                                <div class="col-md-4">
                                    <div class="row row-padbot-15">
                                        <div class="form-group">
                                            <label for="inputEmail3" class="col-md-4 control-label">Working Mode</label>
                                            <div class="col-sm-8 col-md-8" style="padding-right:0px">
                                                <select class="form-control input-sm" style="width: 100%;" select2="" options="item.id as item.name for item in WorkingModes track by item.id" ng-model="ShiftAllocation.workingmode"></select>
                                            </div>
                                        </div>
                                    </div>
                                </div>


                                <div class="col-md-4">

                                    <div class="row row-padbot-15">
                                        <div class="form-group">
                                            <label for="inputEmail3" class="col-md-4 control-label">Re-Generate&nbsp;&nbsp;</label>
                                            <input type="checkbox" ng-model="ShiftAllocation.regenerate" />
                                            <div class="col-md-6 pull-right">
                                                <!--<button class="btn btn-warning btn-sm pull-right danger" ng-click="Delete()">Delete</button>
                                                <button class="btn btn-warning btn-sm pull-right" ng-click="Generate()">Search</button>

                                                <button type="button" class="btn btn-info btn-pad btn-sm pull-right" style="margin-right:25px" ng-click="printDiv('shifalloc', 'Shift Report')"
                                                        data-widget="print" data-toggle="tooltip" title="Print">
                                                    <i class="fa fa-print" aria-hidden="true"></i>
                                                </button>-->
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>

                            <div class="col-md-12">
                                <label for="inputEmail3" class="control-label text-green" ng-class="ErrorStyle">{{ErrorMessage}}</label>
                            </div>
                        </div>
                    </form>

                    <div id="shifalloc">

                        <div class="col-md-12">
                            <div class="col-md-6">
                                <label class="pull-left"><b>{{SearchRef(SearchResult.sectionid, Sections)}}</b></label>
                                <label class="pull-right">From {{SearchResult.fromdate |date:'dd-MM-yyyy'}} To {{SearchResult.todate |date:'dd-MM-yyyy'}}</label>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="pull-right" "><b>{{SearchRef(SearchResult.companyid, Locations)}}</b></label>
                            </div>
                        </div>

                        <div ng-repeat="item in SearchResult.summary">

                            <div class="col-md-6" style="border:1px solid black">

                                <row>
                                    <table class="table">

                                        <thead>

                                            <tr>

                                                <th colspan="2">
                                                    <div class="col-md-4"> <b>{{item.day}}</b></div>
                                                    <div class="col-md-4"> <b>{{item.days}}</b></div>
                                                    <div class="col-md-4 pull-right"> Count : {{item.employees.length}}</div>

                                                </th>
                                            </tr>

                                            <tr>
                                                <th>
                                                    Code
                                                </th>
                                                <th>
                                                    Name
                                                </th>
                                            </tr>
                                        </thead>
                                        <tbody>


                                            <tr ng-repeat="emp in item.employees">
                                                <td>{{emp.employeecode}}</td>
                                                <td>{{emp.name}}</td>

                                            </tr>

                                        </tbody>

                                    </table>
                                </row>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </section>
    </div>
</div>
