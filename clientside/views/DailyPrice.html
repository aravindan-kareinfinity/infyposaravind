<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Store / DailyPrice
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="Clear()"><a><i class="fa fa-file"></i>Clear</a></li>
            <li style="cursor:pointer" ng-show="CanSave" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'pricechanger', 'pricechanger')"><a><i class="fa fa-file-excel-o"></i></a></li>
            <li style="cursor:pointer" ng-click="Export2CSV()"><a><i class="fa fa-file-text-o"></i></a></li>
            <li ng-show="CanSave && DailyPrice && DailyPrice.id && DailyPrice.id>0 && !SaveAgain" style="cursor:pointer" ng-click="ApplyCurrent()"><a><i class="fa fa-plus-square"></i>Apply {{SearchRef(DailyPrice.locationid,Locations)}}</a></li>
            <li ng-show="!ShowSearch" style="cursor:pointer" ng-click="ShowSearch=true"><a><i class="fa fa-search"></i>Search</a></li>
            <li ng-show="ShowSearch" style="cursor:pointer" ng-click="ShowSearch=false"><a><i class="fa fa-backward"></i>Back</a></li>
            <li ng-show="ShowSearch" style="cursor:pointer" ng-click="Search()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->

        <div class="box box-success">
            <div class="box-body">
                <div class="col-md-12 no-padding" ng-show="ShowSearch">
                    <div class="col-md-2">



                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="control-label" style="vertical-align:top;color:brown;text-align:left">COMPANY</label>
                                <div class="col-md-12 no-padding">
                                    <select class="input-sm form-control" select2="" style="width: 100%;"

                                            options="item.id  as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid"></select>
                                </div>
                            </div>
                        </div>
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="control-label" style="vertical-align:top;color:brown;text-align:left">LOCATION</label>
                                <div class="col-md-12 no-padding">
                                    <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Locations track by item.id" ng-model="SearchCondition.locationid"></select>
                                </div>
                            </div>
                        </div>

                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="control-label">Daily Group</label>
                                <div class="col-md-12 no-padding">
                                    <select class="input-sm form-control" select2="" style="width: 100%;"
                                            options="item.id  as item.name for item in DailyPriceGroup track by item.id" ng-model="SearchCondition.pricegroupid"></select>
                                </div>
                            </div>
                        </div>

                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="control-label">Product</label>
                                <div class="col-md-12 no-padding">
                                    <select class="input-sm form-control" select2="" style="width: 100%;"
                                            options="item.id  as item.name for item in Products track by item.id" ng-model="SearchCondition.productid"></select>
                                </div>
                            </div>
                        </div>

                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class=" control-label">Date</label>
                                <div class="col-md-12 no-padding">
                                    <input type="text" class="form-control input-sm" placeholder=""
                                           daterange="SearchCondition.fromdate,SearchCondition.todate">
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="col-md-10">
                        <div class="col-md-12" id="searchgridContainer">

                        </div>
                    </div>
                </div>

                <div class="col-md-12 no-padding" ng-hide="ShowSearch">
                    <div class="col-md-3">

                        <div class="row">


                            <div class="row row-padbot-15">
                                <div class="col-md-12" style="padding-left:0px;padding-right:0px">
                                    <label for="inputEmail3" class="col-md-4 control-label" style="vertical-align:top;color:brown;text-align:left">COMPANY</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;"
                                                ng-change="ClearCurrent()"
                                                options="item.id  as item.name for item in Company track by item.id" ng-model="DailyPrice.companyid"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label" style="vertical-align:top;color:brown;text-align:left">LOCATION</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;"
                                                ng-change="ClearCurrent()"
                                                options="item.id  as item.name for item in Locations track by item.id" ng-model="DailyPrice.locationid"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Daily Group</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;"
                                                options="item.id  as item.name for item in DailyPriceGroup track by item.id"
                                                ng-change="ClearCurrent()"
                                                ng-model="DailyPrice.pricegroupid"></select>
                                    </div>
                                </div>
                            </div>

                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">DailyPrice On</label>
                                    <div class="col-md-8">
                                        <div class="input-group input-group-sm" style="width:100%">
                                            <input type="text" class="form-control input-sm" placeholder=""
                                                   ng-change="ClearCurrent()"
                                                   datemodule="DailyPrice.priceon" ng-model="DailyPrice.priceon">

                                            <span class="input-group-btn" style="width:10px">
                                                <button type="button" focusid="vdailypricegroupid" class="btn btn-info btn-sm btn-flat"
                                                        ng-click="ShowDailPriceItems()">
                                                    <i class=" glyphicon glyphicon-plus-sign"></i>
                                                </button>
                                            </span>
                                        </div>

                                    </div>
                                </div>
                            </div>

                            <div class="row row-padbot-15" style="padding-top:15px" ng-show="DailyPrice">
                                <div class="input-group input-group-sm" style="width:100%;padding-left:15px">
                                    Upload Price List
                                    <span class="input-group-btn" style="width:50px">
                                        <file-upload class="btn btn-default btn-rad btn-trans btn-sm file-upload" resize="true" max-width="1280"
                                                     max-height="1280" preview="true" ng-model="barcodes"
                                                     filemodel="barcodes" onuploadcomplete='fileuploaded'
                                                     uri='File/UploadXLSX/{{UserInfo.OrganizationID}}/'
                                                     multiple="false">
                                            <i class="fa fa-upload"></i>
                                        </file-upload>

                                    </span>
                                </div>
                            </div>

                            <div class="row" style="padding-top:25px" ng-show="DailyPrice && DailyPrice.id && DailyPrice.id>0">
                                <div class="col-md-12" style="padding-left:0px">
                                    <label for="inputEmail3" class="col-md-4 control-label">Locations</label>
                                    <button class="pull-right btn btn-sm btn-success" style="margin-left:10px" ng-click="ApplyPrice()"><i class="fa fa-check"></i> Apply ({{ApplyCount}})</button>
                                    <button class="pull-right btn btn-sm btn-primary" ng-click="CopyPrice()"><i class="fa fa-clone"></i> Copy ({{CopyCount}})</button>
                                </div>

                                <div id="locationgrid" class="col-md-12" style="margin-top:10px">


                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="col-md-9">

                        <div class="row row-padbot-15" ng-show="DailyPrice && DailyPrice.id && DailyPrice.id>0">
                            <div class="col-md-4 no-padding">
                                <label for="inputEmail3" class="col-md-4 control-label">Approved</label>
                                <div class="col-md-8">
                                    <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Employees track by item.id" ng-model="DailyPrice.employeeid"></select>
                                </div>
                            </div>
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12 no-padding" id="report">
                                <div class="col-md-12" id="gridContainer" style="padding-right:0px">



                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
