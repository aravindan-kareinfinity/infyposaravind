       <!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            Dashboard
        </h1>
        <ol class="breadcrumb">
            <li><a href="#"><i class="fa fa-dashboard"></i>Home</a></li>
<li><a href back-button>Back</a></li>
            <li class="active">Dashboard</li>
        </ol>
    </section>

    <!-- Main content -->
    <section class="content">
        <!-- Info boxes -->
        <div class="row">
            <div class="row row-padbot-15">
                <div class="col-md-12">
                    <div class="form-group">
                        <div class="col-md-3">
                            <label for="inputEmail3" class="col-md-5 control-label">Product</label>
                            <div class="col-md-7">
                                <select class="form-control" select2="" style="width: 100%;" options="product.id as product.name for product in Products track by product.id" ng-model="Item.productid"></select>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label>
                                Hight  <input type="checkbox" class="icheckbox_minimal-blue" ng-model="Item.isactive">
                            </label>
                            <label>
                                Low  <input type="checkbox" class="icheckbox_minimal-blue" ng-model="Item.isactive">
                            </label>
                        </div>
                        <div class="col-md-3">

                            <label for="inputEmail3" class="col-md-5 control-label">Year</label>
                            <div class="col-md-7">

                                <input type="text" class="form-control pull-right" datemodule="InvoiceItem.invoicedate" ng-model="InvoiceItem.InvoiceDate" id="datepicker">
                            </div>
                        </div>

                        <div class="col-md-3">
                            <label for="inputEmail3" class="col-md-5 control-label">Quarter</label>
                            <div class="col-md-7">
                                <select class="form-control" select2="" style="width: 100%;" options="product.id as product.name for product in Products track by product.id" ng-model="Item.productid"></select>
                            </div>
                        </div>

                    </div>
                </div>
                <!-- /.col -->
            </div>
        </div>




        <div class="row">

            <div class="col-md-4">
                <!-- LINE CHART -->
                <div class="box box-info">
                    <div class="box-header with-border">
                        <h3 class="box-title">Brand</h3>
                        <div class="box-tools pull-right">
                            <button type="button" class="btn btn-box-tool" data-widget="collapse">
                                <i class="fa fa-minus"></i>
                            </button>
                            <button type="button" class="btn btn-box-tool" data-widget="remove"><i class="fa fa-times"></i></button>
                        </div>
                    </div>
                    <div class="box-body">
                        <div class="chart">
                            <canvas id="brandChart" style="height:250px"></canvas>
                        </div>
                    </div>
                    <!-- /.box-body -->
                </div>
            </div>
            <div class="col-md-4">
                <!-- AREA CHART -->
                <div class="box box-primary">
                    <div class="box-header with-border">
                        <h3 class="box-title">Size</h3>
                        <div class="box-tools pull-right">
                            <button type="button" class="btn btn-box-tool" data-widget="collapse">
                                <i class="fa fa-minus"></i>
                            </button>
                            <button type="button" class="btn btn-box-tool" data-widget="remove"><i class="fa fa-times"></i></button>
                        </div>
                    </div>
                    <div class="box-body">
                        <div class="chart">
                            <canvas id="sizeChart" style="height:250px"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <!-- LINE CHART -->
                <div class="box box-info">
                    <div class="box-header with-border">
                        <h3 class="box-title">Colour Chart</h3>
                        <div class="box-tools pull-right">
                            <button type="button" class="btn btn-box-tool" data-widget="collapse">
                                <i class="fa fa-minus"></i>
                            </button>
                            <button type="button" class="btn btn-box-tool" data-widget="remove"><i class="fa fa-times"></i></button>
                        </div>
                    </div>
                    <div class="box-body">
                        <div class="chart">
                            <canvas id="colourChart" style="height:250px"></canvas>
                        </div>
                    </div>
                    <!-- /.box-body -->
                </div>
            </div>
        </div>
    </section>
    <!-- /.content -->
</div>

<script src="Clientside/plugins/chartjs/Chart.min.js"></script>
<script src="Clientside/dist/js/demo.js"></script>
<script>
    $(function () {
        /* ChartJS
         * -------
         * Here we will create a few charts using ChartJS
         */

        //--------------
        //- AREA CHART -
        //--------------

        // Get context with jQuery - using jQuery's .get() method.
        var sizeChartCanvas = $("#sizeChart").get(0).getContext("2d");
        // This will get the first returned node in the jQuery collection.
        var sizeChart = new Chart(sizeChartCanvas);

        var sizeChartData = {
            labels: ["January", "February", "March", "April", "May", "June", "July"],
            datasets: [
              {
                  label: "Electronics",
                  fillColor: "rgba(210, 214, 222, 1)",
                  strokeColor: "rgba(210, 214, 222, 1)",
                  pointColor: "rgba(210, 214, 222, 1)",
                  pointStrokeColor: "#c1c7d1",
                  pointHighlightFill: "#fff",
                  pointHighlightStroke: "rgba(220,220,220,1)",
                  data: [65, 59, 80, 81, 56, 55, 40]
              },
              {
                  label: "Digital Goods",
                  fillColor: "rgba(60,141,188,0.9)",
                  strokeColor: "rgba(60,141,188,0.8)",
                  pointColor: "#3b8bba",
                  pointStrokeColor: "rgba(60,141,188,1)",
                  pointHighlightFill: "#fff",
                  pointHighlightStroke: "rgba(60,141,188,1)",
                  data: [28, 48, 40, 19, 86, 27, 90]
              }
            ]
        };

        var areaChartOptions = {
            //Boolean - If we should show the scale at all
            showScale: true,
            //Boolean - Whether grid lines are shown across the chart
            scaleShowGridLines: false,
            //String - Colour of the grid lines
            scaleGridLineColor: "rgba(0,0,0,.05)",
            //Number - Width of the grid lines
            scaleGridLineWidth: 1,
            //Boolean - Whether to show horizontal lines (except X axis)
            scaleShowHorizontalLines: true,
            //Boolean - Whether to show vertical lines (except Y axis)
            scaleShowVerticalLines: true,
            //Boolean - Whether the line is curved between points
            bezierCurve: true,
            //Number - Tension of the bezier curve between points
            bezierCurveTension: 0.3,
            //Boolean - Whether to show a dot for each point
            pointDot: false,
            //Number - Radius of each point dot in pixels
            pointDotRadius: 4,
            //Number - Pixel width of point dot stroke
            pointDotStrokeWidth: 1,
            //Number - amount extra to add to the radius to cater for hit detection outside the drawn point
            pointHitDetectionRadius: 20,
            //Boolean - Whether to show a stroke for datasets
            datasetStroke: true,
            //Number - Pixel width of dataset stroke
            datasetStrokeWidth: 2,
            //Boolean - Whether to fill the dataset with a color
            datasetFill: true,
            //String - A legend template
            legendTemplate: "<ul class=\"<%=name.toLowerCase()%>-legend\"><% for (var i=0; i<datasets.length; i++){%><li><span style=\"background-color:<%=datasets[i].lineColor%>\"></span><%if(datasets[i].label){%><%=datasets[i].label%><%}%></li><%}%></ul>",
            //Boolean - whether to maintain the starting aspect ratio or not when responsive, if set to false, will take up entire container
            maintainAspectRatio: true,
            //Boolean - whether to make the chart responsive to window resizing
            responsive: true
        };



        //Create the line chart
        sizeChart.Line(sizeChartData, areaChartOptions);

        //-------------
        //- LINE CHART -
        //--------------
        var brandChartCanvas = $("#brandChart").get(0).getContext("2d");
        var brandChart = new Chart(brandChartCanvas);
        var brandChartOptions = areaChartOptions;
        brandChartOptions.datasetFill = false;
        brandChart.Line(sizeChartData, brandChartOptions);

        //- LINE CHART -
        //--------------
        var colourChartCanvas = $("#colourChart").get(0).getContext("2d");
        var colourChart = new Chart(colourChartCanvas);
        var colourChartOptions = areaChartOptions;
        colourChartOptions.datasetFill = false;
        colourChart.Line(sizeChartData, colourChartOptions);



    });
</script>
