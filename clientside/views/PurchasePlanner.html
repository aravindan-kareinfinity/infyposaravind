<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Analytical / Purchase Planner
            (
            <span ng-show="IsBrandBased">Brand Based</span>
            <span ng-hide="IsBrandBased">Product Based</span>
            )
        </h1>
        <ol class="breadcrumb">

            <li style="cursor:pointer" ng-hide="IsBrandBased" ng-click="IsBrandBased=true"><a><i class="fa fa-wrench"></i>Brand Based</a></li>
            <li style="cursor:pointer" ng-show="IsBrandBased" ng-click="IsBrandBased=false"><a><i class="fa fa-wrench"></i>Product Based</a></li>
            <li style="cursor:pointer" ng-click="Search()"><a><i class="fa fa-search"></i>Search</a></li>
            <li style="cursor:pointer" ng-hide="igrid == null" ng-click="exporttoExcel(igrid,'Purchae Plan')"><a><i class="fa fa-download"></i>Export</a></li>
            <li style="cursor:pointer" ng-hide="igrid == null" ng-click="Convert2PO()"><a><i class="fa fa-upload"></i>Convert 2 PO</a></li>

        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box box-primary">
            <div class="box-body">
                <div class="col-md-3">
                    <div class="col-md-12 no-padding" ng-hide="IsBrandBased">
                        <div class="col-md-6 no-padding">
                            <label>PRODUCT</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Product track by item.id" ng-model="SearchCondition.productid" ng-change="ProductChange()"></select>
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label>GROUP</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in ProductGroups track by item.id" ng-model="SearchCondition.productgroupid" ng-change="ProductChange()"></select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding" ng-show="IsBrandBased">
                        <div class="col-md-6 no-padding">
                            <label>Brand</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Brands track by item.id" ng-model="SearchCondition.brandid"></select>
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label>Section</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Sections track by item.id" ng-model="SearchCondition.sectionid"></select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">

                        <div class="col-md-6 no-padding">
                            <label>Supplier</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Supplier track by item.id" ng-model="SearchCondition.supplierid" ng-change="ProductChange()"></select>
                            </div>
                        </div>

                        <div class="col-md-6 no-padding">
                            <label>City</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Cities track by item.id" ng-model="SearchCondition.suppliercityid" ng-change="ProductChange()"></select>
                            </div>
                        </div>


                    </div>


                    <div class="col-md-12 no-padding">
                        <div class="col-md-4 no-padding">
                            <label>ROTATION</label>
                            <div class="input-group-sm">
                                <div class="col-md-4 no-padding">
                                    <input type="text" class="form-control input-sm" id="inputPassword3" placeholder="Planned Rotation" ng-change="rotatiochanged()" ng-model="SearchCondition.rotation">
                                </div>
                                <div class="col-md-8 no-padding">
                                    <input type="text" class="form-control input-sm" ng-readonly="true" id="inputPassword3" placeholder="Planned Rotation" ng-model="SearchCondition.rotationdays">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 no-padding">
                            <label>PLAN DAYS</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" id="inputPassword3" placeholder="Planned Days" ng-model="SearchCondition.plandays">
                            </div>
                        </div>
                        <div class="col-md-4 no-padding">

                            <label>MARK UP</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" id="inputPassword3" placeholder="Markup %" ng-model="SearchCondition.markup">
                            </div>

                        </div>

                    </div>
                    <div class="col-md-12 no-padding">

                        <label>SALE PATTERN DATE</label>
                        <div class="input-group-sm">
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate">
                        </div>

                    </div>

                    <div class="col-md-12 no-padding">

                        <label>Row Label</label>
                        <div class="input-group-sm">
                            <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Options track by item.id" ng-model="SearchCondition.primarycolumn" ng-change="ProductChange()"></select>
                        </div>

                    </div>

                    <div class="col-md-12 no-padding" ng-show="SearchCondition.primarycolumn==18">

                        <div class="input-group-sm">
                            <div class="col-md-4 no-padding">
                                <input type="text" class="form-control input-sm" style="width:100%" placeholder="start" ng-model="pricerange.start">
                            </div>
                            <div class="col-md-4 no-padding">
                                <input type="text" class="form-control input-sm" style="width:100%" placeholder="increment" ng-model="pricerange.increment">
                            </div>
                            <div class="col-md-4 no-padding">
                                <input type="text" class="form-control input-sm" style="width:100%" placeholder="end" ng-model="pricerange.end">
                            </div>
                        </div>

                    </div>

                    <div class="col-md-12 no-padding">

                        <label>Column Label</label>
                        <div class="input-group-sm">
                            <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.name for item in Options track by item.id" ng-model="SearchCondition.secondarycolumn" ng-change="ProductChange()"></select>
                        </div>

                    </div>

                    <div class="col-md-12 no-padding" ng-show="SearchCondition.secondarycolumn==18">

                        <div class="input-group-sm">
                            <div class="col-md-4 no-padding">
                                <input type="text" class="form-control input-sm" style="width:100%" placeholder="start" ng-model="pricerange.start">
                            </div>
                            <div class="col-md-4 no-padding">
                                <input type="text" class="form-control input-sm" style="width:100%" placeholder="increment" ng-model="pricerange.increment">
                            </div>
                            <div class="col-md-4 no-padding">
                                <input type="text" class="form-control input-sm" style="width:100%" placeholder="end" ng-model="pricerange.end">
                            </div>
                        </div>

                    </div>
                    <div class="col-md-12 no-padding">



                        <table fixed-header="80px" additionalheight="300">
                            <thead>
                                <tr>
                                    <th>
                                        Additional Columns
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="item in Options">
                                    <td ng-show="item.id != SearchCondition.primarycolumn && item.id != SearchCondition.secondarycolumn"><input type="checkbox" ng-model="item.selected">&nbsp;{{item.name}}</td>
                                </tr>
                            </tbody>
                        </table>


                    </div>

                </div>

                <div class="col-md-9">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12 no-padding" id="gridContainer">

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

</div>
