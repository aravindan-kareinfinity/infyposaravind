<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Customer Credit Note
        </h1>
        <ol class="breadcrumb">
            <li ng-show="Navigation.create" style="cursor:pointer" ng-click="New()"><a><i class="fa fa-file"></i>New</a></li>
            <li ng-show="Navigation.save" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
            <li ng-show="Navigation.delete" style="cursor:pointer" ng-click=""><a><i class="fa fa-trash"></i>Delete</a></li>
            <li ng-show="Navigation.search" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('SEARCH')"><a><i class="fa fa-search"></i>Search</a></li>
            <li ng-show="Navigation.edit" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('EDIT')"><a><i class="fa fa-backward"></i>Back</a></li>
            <li ng-show="LastPaymentID>0" style="cursor:pointer" ng-click="PrintSettilement(LastPaymentID)"><a><i class="fa fa-print"></i>Print</a></li>
            <li ng-show="LastPaymentID>0" style="cursor:pointer" ng-click="PrintPDF(LastPaymentID)"><a><i class="fa fa-print"></i>Print PDF</a></li>
            <li ng-show="Navigation.searchentity" style="cursor:pointer" ng-click="Search()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box box-purple" ng-hide="ShowSearch">
            <div class="box-body">
                <div class="row row-padbot-15">
                    <div class="col-md-12 col-sm-12 no-padding">

                        <div class="col-md-5 col-sm-5">


                            <div class="col-md-12">

                                <div class="row row-padbot-15">
                                    <label for="inputEmail3" class="col-md-4 col-sm-4 form-group required control-label">CR Date/No</label>
                                    <div class="col-md-8 col-sm-8 input-group input-group-sm">
                                        <div class="col-md-6 no-padding">
                                            <input type="text" class="form-control input-sm pull-right"
                                                   datemodule="CustomerCreditNote.creditnotedate"
                                                   ng-model="CustomerCreditNote.creditnotedate" id="datepicker">
                                        </div>
                                        <div class="col-md-6 no-padding">
                                            <input type="text" class="form-control input-sm pull-right"
                                                   ng-readonly="true"
                                                   ng-model="CustomerCreditNote.creditnoteno">
                                        </div>
                                    </div>
                                </div>

                                <div class="row row-padbot-15">
                                    <label for="inputEmail3" class="col-md-4 col-sm-4 control-label">Customer</label>
                                    <div class="col-md-8 col-sm-8 input-group input-group-sm">
                                        <input type="text" ng-model="SearchPaymentCondition.customername"
                                               ng-readonly="true"
                                               onkeyenter="ShowCustomerDialog()" class="input-sm form-control" style="width:100%" />
                                        <span class="input-group-btn">
                                            <button type="button" class="btn btn-primary btn-sm" ng-click="ShowCustomerDialog()" data-widget="go" data-toggle="tooltip" title="Go"><i class="fa fa-search"></i></button>
                                        </span>
                                    </div>
                                </div>

                                <!--<div class="row row-padbot-15">
                                    <label for="inputEmail3" class="col-md-4 col-sm-4 control-label">Company</label>
                                    <div class="col-md-8 col-sm-8 input-group input-group-sm">
                                        <select class="form-control input-sm" select2='Buying Company' style="width:100%" options="item.id as item.name for item in BuyingCompany track by item.id"
                                                ng-model="SearchPaymentCondition.companyid"></select>
                                    </div>
                                </div>-->

                                <div class="row row-padbot-15">
                                    <label for="inputEmail3" class="col-md-4 col-sm-4 control-label">Company</label>
                                    <div class="col-md-8 no-padding" style="vertical-align:top;font-size:small;color:black">
                                        <select class="form-control" select2='Company'
                                                style="width: 100%;" options="item.id as item.name for item in BuyingCompany track by item.id"
                                                ng-model="CustomerCreditNote.companyid"></select>
                                    </div>
                                </div>

                                <div class="row row-padbot-15">
                                    <label for="inputEmail3" class="col-md-4 col-sm-4 control-label">Location</label>
                                    <div class="col-md-8 no-padding" style="vertical-align:top;font-size:small;color:black">
                                        <select class="form-control" select2='Location'
                                                style="width: 100%;" options="item.id as item.name for item in Locations track by item.id"
                                                ng-model="CustomerCreditNote.locationid"></select>
                                    </div>
                                </div>


                                <div class="row row-padbot-15">
                                    <label for="inputEmail3" class="col-md-4 col-sm-4 control-label">Remarks</label>
                                    <div class="col-md-8 col-sm-8  no-padding">
                                        <div>
                                            <input type="text" name="name" class="form-control input-sm" id="inputEmail3" placeholder="" ng-model="CustomerCreditNote.remarks">
                                        </div>
                                    </div>
                                </div>

                                <div class="row row-padbot-15">
                                    <label for="inputEmail3" class="col-md-4 col-sm-4 control-label">Bill No</label>
                                    <div class="col-md-8 col-sm-8 input-group input-group-sm">
                                        <input type="text" class="form-control input-sm"
                                               style="width:100%" onkeyenter="SearchBill()"
                                               ng-model="SearchPaymentCondition.billno">
                                        <span class="input-group-btn">
                                            <button type="button" class="btn btn-primary btn-sm"
                                                    ng-click="SearchBill()" data-widget="go" data-toggle="tooltip" title="Go">
                                                <i class="fa fa-search"></i>
                                            </button>
                                        </span>
                                    </div>
                                </div>


                                <div class="row row-padbot-15">
                                    <div class="col-md-8"
                                         style="vertical-align:top;font-size:large;color:brown">
                                        <b>Allocation</b>
                                    </div>

                                    <div class="col-md-4">
                                        <div style="vertical-align:top;text-align:right;font-size:x-large;color:indianred">
                                            <b>Total : {{BillValue}}</b>
                                        </div>
                                    </div>
                                </div>

                                <div class="row row-padbot-15">
                                    <label for="inputEmail3" class="col-md-4 col-sm-4 form-group control-label">Percentage / Value</label>
                                    <div class="col-md-8 col-sm-8 input-group input-group-sm">
                                        <div class="col-md-6 no-padding">
                                            <input type="text" class="form-control input-sm pull-right"
                                                   ng-change="GrossAdujstedChanged('percentage')"
                                                   ng-model="SearchPaymentCondition.billpercentage">
                                        </div>
                                        <div class="col-md-6 no-padding">
                                            <input type="text" class="form-control input-sm pull-right"
                                                   ng-model="SearchPaymentCondition.billvalue"
                                                   ng-change="GrossAdujstedChanged('value')"
                                                   id="datepicker">
                                        </div>
                                    </div>
                                </div>

                                <div class="row row-padbot-15" style="margin-left:0px">
                                    <table fixed-header="420px" class="fixed_table"
                                           additionalheight="310">
                                        <thead>
                                            <tr>
                                                <th style="width:40px">Tax %</th>
                                                <th style="width:80px">Value</th>
                                                <th style="width:60px">A.Value</th>
                                                <th style="width:60px">A.Tax</th>
                                                <th style="width:60px">Adjusted</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr ng-repeat="item in BillItemAllocations">
                                                <td>{{item.taxpercentage}}</td>
                                                <td>{{item.totalamount}}</td>
                                                <td>
                                                    <input type="number" class="form-control input-sm pull-right"
                                                           ng-change="AdujstedChanged(item,'value')"
                                                           ng-model="item.adjustedvalue">
                                                </td>
                                                <td>
                                                    <input type="number" class="form-control input-sm pull-right"
                                                           ng-change="AdujstedChanged(item,'tax')"
                                                           ng-model="item.adjustedtax">
                                                </td>
                                                <td>{{item.adjustedtotal}}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <div class="row row-padbot-15">
                                    <div class="col-md-3">
                                        <label>IGST SALE&nbsp;&nbsp;&nbsp;</label>
                                        <input type="checkbox" class="icheckbox_flat-green" ng-model="CustomerCreditNote.isinterstatesale" />
                                    </div>

                                    <button type="button" class="btn btn-primary btn-sm pull-right" ng-click="AddBill()" data-widget="go" data-toggle="tooltip" title="Go">
                                        <i class="fa fa-plus">&nbsp;Add</i>
                                    </button>
                                </div>

                            </div>
                        </div>

                        <div class="col-md-7 col-sm-7">
                            <div class="col-md-12 col-sm-12">
                                <div class="row row-padbot-15" id="gridBillsContainer">

                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>

        </div>

        <div class="box box-primary" ng-show="ShowSearch">
            <div class="box-body">

                <div class="col-md-3">

                    <div class="row row-padbot-15">
                        <label for="inputEmail3">Credit Note No</label>
                        <div class="col-md-12 no-padding">
                            <input type="text" name="name" class="form-control input-sm" id="inputEmail3" placeholder="" ng-model="SearchPaymentCondition.creditnoteno">
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3">Customer</label>
                            <div class="col-md-12 no-padding">
                                <div class="input-group input-group-sm">
                                    <input type="text" class="form-control input-sm" id="inputPassword3" onkeyenter="ShowCustomerDialog()" ng-model="SearchPaymentCondition.customername">
                                    <span class="input-group-btn">
                                        <button type="button" class="btn btn-info btn-flat" ng-click="ShowCustomerDialog()">Go</button>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3">Date</label>
                            <div class="col-md-12 no-padding">
                                <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate">
                            </div>
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <label for="inputEmail3">Company</label>
                        <div class="col-md-12 no-padding" style="vertical-align:top;font-size:small;color:black">
                            <select class="form-control" select2='Company'
                                    style="width: 100%;" options="item.id as item.name for item in BuyingCompany track by item.id"
                                    ng-model="SearchPaymentCondition.companyid"></select>
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <label for="inputEmail3">Bill No</label>
                        <div class="col-md-12 no-padding">
                            <input type="text" name="name" class="form-control input-sm" id="inputEmail3" placeholder="" ng-model="SearchPaymentCondition.remarks">
                        </div>
                    </div>

                </div>

                <div class="col-md-9 no-padding">
                    <div class="col-md-12" id="gridContainer">
                    </div>
                </div>

            </div>
            <!-- /.content -->
        </div>

    </section>
    <!-- /.content -->
</div>
<!-- /.content-wrapper -->


<script type="text/ng-template" id="SearchCustomer">
    <div class="ngdialog-message">
        <div>
            <div class="col-md-12">
                <div class="row row-padbot-15">
                    <div class="col-md-12">
                        <label for="inputEmail3" class="col-md-3 control-label">Name</label>
                        <div class="col-md-6">
                            <input type="text" class="form-control input-sm" style="width: 100%;" focusid="customer_name" focusonenter="customer_contact" ng-model="name">
                        </div>
                    </div>
                </div>
                <div class="row row-padbot-15">
                    <div class="col-md-12">
                        <label for="inputEmail3" class="col-md-3 control-label">Contact No</label>
                        <div class="col-md-6">
                            <input type="text" class="form-control input-sm" style="width: 100%;" focusid="customer_contact" focusonenter="customer_area" ng-model="contactno">
                        </div>
                    </div>
                </div>
                <div class="row row-padbot-15">
                    <div class="col-md-12">
                        <label for="inputEmail3" class="col-md-3 control-label">Area</label>
                        <div class="col-md-6">
                            <input type="text" class="form-control input-sm" style="width: 100%;" focusid="customer_area" onkeyenter="Search()" ng-model="area">
                        </div>
                    </div>
                </div>
                <div class="row row-padbot-15">
                    <div class="col-md-12">
                        <label for="inputEmail3" class="col-md-3 control-label">GST No</label>
                        <div class="col-md-6">
                            <input type="checkbox" placeholder="" ng-model="hasgst" style="position: absolute; left: 20px;top: 3px;z-index: 1000;">
                            <input type="text" class="form-control input-sm" style="width: 100%;padding-left:30px" ng-disabled="!hasgst" focusid="customer_gstno" ng-model="gstno">
                            <button type="button" style="position:absolute;right:20px;top:3px;" class="ngdialog-button ngdialog-button-primary" ng-click="Search(name,area)">Search</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-12">
                <table fixed-header="200px">
                    <thead>
                        <tr>
                            <th style="width:25px">&nbsp;</th>
                            <th style="width:250px">Name</th>
                            <th style="width:150px">Area</th>
                            <th style="width:100px">Mobile</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in PopupList">
                            <td><input type="checkbox" ng-model="item.selected" ng-change="Customer=item" /></td>
                            <td>{{item.name}}</td>
                            <td>{{item.area}}</td>
                            <td>{{item.mobileno}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <div class="col-md-12" style="padding-top:10px">
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Create()">Create</button>
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Select()">Select</button>
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
        </div>
    </div>
</script>
