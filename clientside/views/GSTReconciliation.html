<div>
    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
        <!-- Content Header (Page header) -->
        <section class="content-header">
            <h1>
                <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
                GST Inbox
            </h1>
            <ol class="breadcrumb">
                <li ng-show="Navigation.create" style="cursor:pointer" ng-click="Clear()"><a><i class="fa fa-file"></i>New</a></li>
                <li ng-show="Navigation.save" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
                <li ng-show="Navigation.search" style="cursor:pointer" ng-click="Search()"><a><i class="fa fa-search"></i>Search</a></li>


            </ol>
        </section>
        <!-- Main content -->
        <section class="content">
            <!-- Your Page Content Here -->
            <!-- /.Box Ends -->
            <div class="box box-primary">
                <div class="box-body">
                    <div class="col-md-3" style="overflow-y:scroll;" ng-style="panelheight">

                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Mode</label>
                                <div class="col-md-8">
                                    <select class="form-control" select2='Select Mode' ng-model="GSTInbox.mode"
                                            options="item.id as item.name for item in Modes track by item.id"></select>
                                </div>

                            </div>
                        </div>

                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">From Date</label>
                                <div class="col-md-8">
                                    <div class="input-group date">
                                        <div class="input-group-addon">
                                            <i class="fa fa-calendar"></i>
                                        </div>
                                        <input type="text" class="form-control datepicker input-sm"
                                               datemodule="SearchCondition.billdate" ng-model="SearchCondition.billdate"
                                               focusonenter="company">
                                    </div>

                                </div>
                            </div>
                        </div>
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">To Date</label>
                                <div class="col-md-8">
                                    <div class="input-group date">
                                        <div class="input-group-addon">
                                            <i class="fa fa-calendar"></i>
                                        </div>
                                        <input type="text" class="form-control datepicker input-sm"
                                               datemodule="SearchCondition.billdate" ng-model="SearchCondition.billdate"
                                               focusonenter="company">
                                    </div>

                                </div>
                            </div>
                        </div>
                        <div class="col-md-12 no-padding" ng-show="GSTInbox.mode==5">
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Company</label>
                                    <div class="col-md-8">
                                        <select class="form-control" select2='' ng-model="GSTInbox.configuration.companyid"
                                                options="item.id as item.name for item in Companies track by item.id"></select>
                                    </div>

                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label" style="color:black">GST No</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm"
                                               placeholder="" ng-model="GSTInbox.configuration.gst">
                                    </div>

                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">UserName</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm"
                                               placeholder="" ng-model="GSTInbox.configuration.gst_username">
                                    </div>

                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Password</label>
                                    <div class="col-sm-8 col-md-8">
                                        <div class="input-group input-group-sm">
                                            <input type="text" class="form-control input-sm" ng-model="GSTInbox.configuration.gst_password">
                                            <span class="input-group-btn">
                                                <button class="btn btn-sm btn-primary btn-box" ng-click="CheckOTP()"><i class="fa fa-paper-plane"></i>&nbsp;OTP</button>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">OTP</label>
                                    <div class="col-sm-8 col-md-8">
                                        <div class="input-group input-group-sm">
                                            <input type="text" class="form-control input-sm" ng-model="GSTInbox.configuration.otp">
                                            <span class="input-group-btn">
                                                <button class="btn btn-sm btn-primary btn-box" ng-click="CheckOTP()"><i class="fa fa-eye-slash"></i></button>
                                            </span>
                                        </div>
                                    </div>

                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label" style="color:black;font-size:medium;"><b>E-Way Bill</b></label>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Username</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm"
                                               placeholder="" ng-model="GSTInbox.configuration.eway_username">
                                    </div>

                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Password</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm"
                                               placeholder="" ng-model="GSTInbox.configuration.eway_username">
                                    </div>

                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <div class="col-md-9"></div>
                                    <div class="col-md-1">
                                        <button class="btn btn-xs btn-primary btn-box pull-left" ng-click="Test()">Test</button>

                                    </div>

                                </div>
                            </div>
                            <div class="row row-padbot-15 no-pad-top">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-8 control-label" style="color:black;font-size:medium;"><b>E-Invoice Bill</b></label>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Username</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm"
                                               placeholder="" ng-model="GSTInbox.configuration.einv_username">
                                    </div>

                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Password</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm"
                                               placeholder="" ng-model="GSTInbox.configuration.einv_password ">
                                    </div>

                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <div class="col-md-9"></div>
                                    <div class="col-md-1">
                                        <button class="btn btn-xs btn-primary btn-box pull-left" ng-click="Test()">Test</button>

                                    </div>

                                </div>
                            </div>
                        </div>


                        <!--<div class="row row-padbot-15" ng-show="GSTInbox.mode==5">
        <div class="form-group">
            <label for="inputEmail3" class="col-md-4 control-label">Company</label>
            <div class="col-md-8">
                <select class="form-control" select2='' ng-model="GSTInbox.companyid"
                        options="item.id as item.name for item in Companies track by item.id"></select>
            </div>

        </div>
    </div>-->
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Location</label>
                                <div class="col-md-8">
                                    <select class="form-control" select2='' ng-model="GSTInbox.locationid"
                                            options="item.id as item.name for item in Locations track by item.id"></select>
                                </div>

                            </div>
                        </div>
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Supplier</label>
                                <div class="col-md-8">
                                    <select class="form-control" select2='' ng-model="GSTInbox.supplierid"
                                            options="item.id as item.name for item in Suppliers track by item.id"></select>
                                </div>
                            </div>
                        </div>



                    </div>
                    <div class="col-md-9 no-padding">
                        <div class="col-md-12 no-padding" id="gridContainer">
                        </div>
                    </div>
                    <!-- /.row -->

                </div>
                <!-- /.content -->
            </div>

        </section>
    </div>
    <!-- /.content-wrapper -->
</div>
