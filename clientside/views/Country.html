<div>


    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
        <!-- Content Header (Page header) -->
        <section class="content-header">
            <h1>
                Master  | Country 
                <small></small>
            </h1>
            <ol class="breadcrumb">
                <li><a href="#"><i class="fa fa-dashboard"></i>Home</a></li>
<li><a href back-button>Back</a></li>
                <li class="active">Lab Template</li>
            </ol>
        </section>
        <!-- Main content -->
        <section class="content">
            <!-- Default box -->
            <div class="box box-info" ng-hide="ShowSearch">   
                <div class="box-body">
                    <div class="row">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-sm-2 control-label">Code</label>
                                <div class="col-sm-5">
                                    <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Country.Code">
                                </div>
                                <div class="col-sm-5">
                                    <button type="button" class="pull-right btnMarginer btn btn-warning" ng-click="SwitchPanel()">Search</button>
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <!-- /.row -->
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-sm-2 control-label">Name</label>
                                <div class="col-sm-5">
                                    <input method="text" class="form-control " style="width: 100%;" ng-model="Country.Name">
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <!-- /.row -->
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-sm-2 control-label">Additional Info</label>
                                <div class="col-sm-5">
                                    <input method="text" class="form-control " style="width: 100%;" ng-model="Country.AdditionalInfo">
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <!-- /.row -->
                </div>
                <div class="box-body">
                    <div class="row">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-sm-2 control-label">Sorting Index</label>
                                <div class="col-sm-5">
                                    <input method="text" class="form-control " style="width: 100%;" ng-model="Country.SortingIndex">
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <!-- /.row -->
                </div>
                <div class="box-footer">

                    <button type="submit" class="btn btn-info pull-right">Save</button>
                </div><!-- /.box-footer-->
            </div><!-- /.box -->


            <div class="box box-primary" id="searchBox" ng-show="ShowSearch">
                <div class="box-body">
                    <div class="row">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-sm-2 control-label">Code</label>
                                <div class="col-sm-5">
                                    <input type="text" class="form-control input-sm" id="inputEmail3" placeholder="" ng-model="SearchCondition.Code">
                                </div>
                                <div class="col-sm-5">
                                    <button type="button" class="pull-right btnMarginer btn btn-warning" ng-click="SwitchPanel()">Back</button>
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="box-body">
                        <div class="row">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-sm-2 control-label">Name</label>
                                    <div class="col-sm-5">
                                        <input type="text" class="form-control input-sm" id="inputEmail3" placeholder="" ng-model="SearchCondition.Name">
                                    </div>
                                  
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>
                        <div class="row">
                            <button type="button" class="pull-right btnMarginer btn btn-primary" ng-click="Search()">Search</button>
                            <!-- /.row -->
                        </div>
                        <!-- /.row -->
                    </div>
                </div>
                <div class="box-body">
                    <div class="row">


                        <div class="table-responsive">
                            <table class="table table-bordered table-hover table-striped">
                                <thead>
                                    <tr>
                                        <th>Code</th>
                                        <th>Country Name</th>
                                        <th>Additional Info</th>
                                        <th>Sorting Index</th>
                                        
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="item in SearchResult">
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td><button type="button" class="btnMarginer btn btn-toolbar" ng-click="ManageSearchItem('Delete',item)">Delete</button></td>
                                        <td><button type="button" class="btnMarginer btn btn-sm" ng-click="ManageSearchItem('Edit',item)">Edit</button></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
                <!-- /.content -->
            </div>
        </section><!-- /.content -->
    </div>

    <!-- /.content-wrapper -->
</div>
