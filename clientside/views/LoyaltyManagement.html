<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            CRM  /   Loyalty Management
        </h1>
        <ol class="breadcrumb">
            <li ng-hide="ShowSearch" style="cursor:pointer" ng-click="New()"><a><i class="fa fa-file"></i>New</a></li>
            <li ng-hide="ShowSearch" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
            <li ng-hide="ShowSearch" style="cursor:pointer" ng-click="ShowSearch=true"><a><i class="fa fa-backward"></i>Back</a></li>
            <li ng-show="ShowSearch" style="cursor:pointer" ng-click="Search()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'loyaltydetails', 'loyaltydetails')"><a><i class="fa fa-download"></i></a></li>
            <li ng-show="UserInfo.p_CUSTOMERLOYALTYMGMT.create && ShowSearch && customerid>0" style="cursor:pointer" ng-click="ManageSearchItem('Add', null)"><a><i class="fa fas fa-search-plus"></i>Add Points</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box box-primary" ng-hide="ShowSearch">
            <div class="box-body">
                <div class="col-md-6">

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group control-label">Customer Name</label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control input-sm" style="width: 100%;" readonly ng-model="customername">
                                </div>

                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group control-label">Location</label>
                                <div class="col-md-8">
                                    <select class="input-sm form-control" select2="" style="width: 100%;" ng-model="Customer.locationid"
                                            options="item.id as item.name for item in RetailLocation track by item.id"></select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group control-label">Bill No</label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control input-sm" style="width: 100%;" ng-model="Customer.billno">
                                </div>

                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group control-label">Bill Date</label>
                                <div class="col-md-8">
                                    <div class="input-group date">
                                        <div class="input-group-addon">
                                            <i class="fa fa-calendar"></i>
                                        </div>
                                        <input type="text" class="form-control input-sm datepicker" datemodule="Customer.billdate" ng-model="Customer.billdate">
                                    </div>
                                </div>

                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group control-label">Bill Value</label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control input-sm" style="width: 100%;" ng-model="Customer.billvalue">
                                </div>

                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group control-label">Loyalty Point</label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control input-sm" style="width: 100%;" ng-model="Customer.loyelty">
                                </div>

                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group control-label">Redeem Point</label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control input-sm" style="width: 100%;" ng-model="Customer.adjusted">
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group control-label">Expiry Date</label>
                                <div class="col-md-8">
                                    <div class="input-group date">
                                        <div class="input-group-addon">
                                            <i class="fa fa-calendar"></i>
                                        </div>
                                        <input type="text" class="form-control input-sm datepicker" datemodule="Customer.expiry" ng-model="Customer.expiry">
                                    </div>
                                </div>

                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group control-label">Remark</label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control input-sm" style="width: 100%;" ng-model="Customer.remark">
                                </div>

                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                </div>


            </div>
        </div>

        <div class="box primary" ng-show="ShowSearch">
            <div class="box-body">
                <div class="col-md-3">

                    <div class="col-md-12 no-padding">
                        <label>CARD NO</label>
                        <div class="input-group-sm">
                            <input type="text" class="form-control input-sm" id="inputEmail3" placeholder=""
                                   ng-model="SearchCondition.cardno" onkeyenter="Search()">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <label>MOBILE NO</label>
                        <div class="input-group-sm">
                            <input type="text" class="form-control input-sm" id="inputEmail3" placeholder=""
                                   ng-model="SearchCondition.mobileno" onkeyenter="Search()" focusid="first">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <label>EMAIL ID</label>
                        <div class="input-group-sm">
                            <input type="text" class="form-control input-sm" id="inputEmail3" placeholder=""
                                   ng-model="SearchCondition.emailid" onkeyenter="Search()">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <label>CUSTOMER NAME</label>
                        <div class="input-group-sm">
                            <input type="text" class="form-control input-sm" id="inputEmail3" placeholder=""
                                   ng-model="SearchCondition.customername" onkeyenter="Search()">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <label>Bill Date</label>
                        <div class="input-group-sm">
                            <div class="input-group date">
                                <div class="input-group-addon">
                                    <i class="fa fa-calendar"></i>
                                </div>
                                <input type="text" daterange="SearchCondition.fromdate,SearchCondition.todate"
                                       class="input-sm form-control pull-right">
                            </div>
                        </div>
                    </div>
                    <div>
                        &nbsp;
                    </div>
                    <div class="col-md-12 no-padding">
                        <label class="col-md-6 no-padding">SHOW SUMMARY</label>
                        <div class="col-md-6 no-padding">
                            <input type="checkbox" class="icheckbox_flat-green pull-right" ng-model="SearchCondition.issummary" />
                        </div>
                    </div>


                    <div class="col-md-12 no-padding" ng-hide="true">

                        <div class="col-md-12 no-padding" style="vertical-align:top;color:brown;font-size:large"><b>Customer Name</b></div>
                        <div class="col-md-12 no-padding" style="vertical-align:top;font-size:large;color:green"><b>{{customername}}</b></div>

                        <div class="col-md-12 no-padding" style="vertical-align:top;color:brown;font-size:large"><b>Total Reward Points</b></div>
                        <div class="col-md-12 no-padding" style="vertical-align:top;font-size:large;color:green"><b>{{totalreward}}</b></div>

                        <button type="button" class="btn btn-info btn-sm pull-right" ng-click="ManageSearchItem('Add', null)" style="margin-top: -10px;">Add Loyalty</button>

                    </div>
                    <div class="col-md-12 no-padding" style="margin-top:10px" ng-show="customerid>0">
                        <div class="col-md-12 no-padding" id="rewardgrid">

                        </div>
                    </div>
                </div>

                <div class="col-md-9 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">

                    </div>
                </div>
            </div>
        </div>
    </section>


</div>
