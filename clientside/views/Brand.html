
<div class="content-wrapper">
    <!-- Content Header (Page header) -->

    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Master / Brand
        </h1>
        <ol class="breadcrumb">
            <li ng-show="Navigation.create" style="cursor:pointer" ng-click="New()"><a><i class="fa fa-file"></i>New</a></li>
            <li ng-show="Navigation.save" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
            <li ng-show="Navigation.delete" style="cursor:pointer" ng-click=""><a><i class="fa fa-trash"></i>Delete</a></li>
            <li ng-show="Navigation.search" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('SEARCH')"><a><i class="fa fa-search"></i>Search</a></li>
            <li ng-show="Navigation.edit" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('EDIT')"><a><i class="fa fa-backward"></i>Back</a></li>
            <li ng-show="Navigation.print" style="cursor:pointer" ng-click=""><a><i class="fa fa-print"></i>Print</a></li>
            <li ng-show="Navigation.searchentity" style="cursor:pointer" ng-click="Export()"><a><i class="fa fa-download"></i>Export</a></li>
            <li style="cursor:pointer" ng-show="selectedcount>1" ng-click="MergeSelected()"><a><i class="fa fa-trash">({{selectedcount}}) Merge Selected</i></a></li>
            <li ng-show="Navigation.searchentity" style="cursor:pointer" ng-click="Search()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->
        <div class="box box-primary" ng-hide="ShowSearch">
            <div class="box-body no-border">

                <div class="col-md-12">
                    <div class="col-md-6">
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Code</label>
                                <div class="col-md-8">
                                    <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Brand.code" focusid="first" ng-change="Brand.code = Brand.code.toUpperCase()" focusonenter="name">
                                </div>
                            </div>
                        </div>

                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Name</label>
                                <div class="col-md-8">
                                    <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Brand.name" ng-change="Brand.name = Brand.name.toUpperCase()" focusid="name" focusonenter="printingname">
                                </div>
                            </div>
                        </div>

                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Printing Name</label>
                                <div class="col-md-8">
                                    <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="Brand.printingname" ng-change="Brand.printingname = Brand.printingname.toUpperCase()" focusid="printingname" focusonenter="barcodeprefix">
                                </div>
                            </div>
                        </div>

                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Margin</label>
                                <div class="col-md-4 no-padding">
                                    <label for="inputEmail3" class="col-md-4 control-label">Min</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm" ng-model="Brand.minmargin">
                                    </div>
                                </div>
                                <div class="col-md-4 no-padding">
                                    <label for="inputEmail3" style="padding-left:0px" class="col-md-4 control-label">Max</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm" ng-model="Brand.maxmargin">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Brand Type</label>
                                <div class="col-md-8">
                                    <select class="form-control" select2=''
                                            ng-model="Brand.groupid" style="width:100%"
                                            options="item.id as item.name for item in CoreBrand track by item.id" focusid="corebrandid" focusonenter="discountmode"></select>
                                </div>
                            </div>
                        </div>
                        <div class="row row-padbot-15">
                            <label for="inputEmail3" class="col-md-4 control-label">Discount/Discount Value</label>
                            <div class="form-group">
                                <div class="col-md-4">
                                    <select class="form-control" select2="" name="state" ng-model="Brand.discountmode" options="discount.id as discount.name for discount in Discount track by discount.id" focusid="discountmode" focusonenter="discountvalue"></select>
                                </div>
                                <div class="col-md-4">
                                    <input method="text" class="form-control input-sm" ng-model="Brand.discountvalue" focusid="discountvalue" focusonenter="isactive">
                                </div>
                            </div>
                        </div>

                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Logo</label>
                                <div class="col-md-6">
                                    <file-upload class="btn btn-rad btn-trans btn-xs file-upload"
                                                 resize="true" max-width="1280"
                                                 max-height="1280" preview="false"
                                                 ng-model="Brand.timageid"
                                                 filemodel="Brand.timageid"
                                                 filetype="IMAGE"
                                                 onuploadcomplete='imageuploaded'
                                                 multiple="false">
                                        <i class="fa fa-file-image-o"></i>
                                        <span>Image</span>
                                    </file-upload>
                                </div>
                                <div class="col-md-2" ng-show="Brand.logoid && Brand.logoid != null && Brand.logoid != ''">
                                    <img style="height:24px;width:24px" ng-src="File/Thumbnail/0/{{Brand.logoid}}" />
                                </div>
                            </div>

                        </div>
                        

                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Active</label>
                                <div class="col-md-8">
                                    <input type="checkbox" class="icheckbox_minimal-blue" ng-model="Brand.isactive" focusid="isactive" focusonenter="materialid">
                                </div>
                            </div>

                        </div>
                    </div>


                    <div class="col-md-6">

                        <div class="row-padbot-15">
                            <h4 class="box-title">Product Margin - B2B</h4>
                            <div class="col-md-12 no-padding">
                                <div class="col-md-8 no-padding">
                                    <div class="col-md-12 no-padding">
                                        Products
                                    </div>
                                    <div class="col-md-12 no-padding">
                                        <select class="form-control" select2=''
                                                ng-model="productid" style="width:100%"
                                                options="item.id as item.name for item in Products track by item.id"></select>
                                    </div>
                                </div>
                                <div class="col-md-4 no-padding">
                                    <div class="col-md-12 no-padding">
                                        Margin
                                    </div>
                                    <div class="input-group input-group-sm" style="width:100%">
                                        <input type="text" class="input-sm form-control" placeholder="Margin"
                                               ng-model="margin" style="width:100%">
                                        <span class="input-group-btn" style="width:10px">
                                            <button type="button" class="btn btn-info btn-sm btn-flat" ng-click="AddMargin()">
                                                <i class="glyphicon glyphicon-plus-sign"></i>
                                            </button>
                                        </span>
                                    </div>
                                </div>

                                <div class="col-md-12 no-padding">
                                    <table fixed-header="250px" class="fixed_table">
                                        <thead>
                                            <tr>
                                                <th style="width:150px">Product</th>
                                                <th style="width:50px">Margin</th>
                                                <th style="width:50px">&nbsp;</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr ng-repeat="item in Brand.marginlist">
                                                <td>{{SearchRef(item.productid,Products)}}</td>
                                                <td><input method="text" class="form-control input-sm" style="width: 100%;" ng-model="item.margin"></td>
                                                <th style="width:50px">
                                                    <button type="button" class="btn btn-danger btn-xs btn-flat" ng-click="RemoveMargin(item)">
                                                        <i class="glyphicon glyphicon-trash">&nbsp;Remove</i>
                                                    </button>
                                                </th>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            
                        </div>


                    </div>
                </div>




            </div>
        </div>
        <!-- /.row -->
        <div class="box box-primary" id="searchBox" ng-show="ShowSearch">
            <div class="box-body">
                <div class="col-md-3">
                    <div class="row">
                        <div class="col-md-12">
                            <label>Code</label>
                            <input type="text" class="form-control input-sm" id="inputEmail3" placeholder="" ng-model="SearchCondition.code">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>Name</label>
                            <input type="text" class="form-control input-sm" id="inputEmail3" placeholder="" ng-model="SearchCondition.name">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>InActive</label>
                            <input type="checkbox" class="icheckbox_minimal-blue" ng-model="SearchCondition.inactive">
                        </div>
                    </div>
                </div>
                <div class="col-md-9 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>
                </div>

            </div>
        </div>
    </section>
</div>


<script type="text/ng-template" id="ChooseMerge">
    <h4 style="font-size:medium;color:brown">
        All the selected items will be merged as single item. {{SelectedItem.name}}
    </h4>
    <div class="ngdialog-message">
        <!--<div class="md-col-12 row">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Merge from</label>
                <div class="col-sm-9 no-padding">
                    <div class="col-md-1" ng-repeat="item in SelectedRows">
                        {{item.name}}
                    </div>
                </div>
            </div>
        </div>-->
        <div class="md-col-12 row">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Select the Merge To</label>
                <div class="input-group input-group-sm col-sm-6 no-padding">
                    <select class="form-control input-sm" select2=''
                            style="width:100%;"
                            ng-model="id"
                            ng-change="rowselected()"
                            options="item.id as item.name for item in SelectedRows track by item.id"></select>
                </div>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Save</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>
