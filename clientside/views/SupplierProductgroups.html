
<div class="content-wrapper">
    <!-- Content Header (Page header) -->

    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Master / Vendor Trade Agreement
        </h1>
        <ol class="breadcrumb">
            <li ng-show="Navigation.save" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
            <li ng-show="Navigation.delete" style="cursor:pointer" ng-click=""><a><i class="fa fa-trash"></i>Delete</a></li>
            <li ng-show="Navigation.search" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('SEARCH')"><a><i class="fa fa-search"></i>Search</a></li>
            <li ng-show="Navigation.edit" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('EDIT')"><a><i class="fa fa-backward"></i>Back</a></li>
            <li ng-show="Navigation.print" style="cursor:pointer" ng-click=""><a><i class="fa fa-print"></i>Print</a></li>

            <li style="cursor:pointer" ng-show="SupplierTradeAgreement.supplierid && SupplierTradeAgreement.supplierid>0">
                <file-upload class="btn-xs file-upload" style="display:inline-block"
                             resize="true" max-width="1280"
                             max-height="1280" preview="true"
                             filetype="DATA"
                             ng-model="ImportAggreementmodel"
                             filemodel="ImportAggreementmodel"
                             uri='File/ProcessProductAgreement/0'
                             onuploadcomplete="ImportAggreement"
                             multiple="false">
                    <i class="fa fa-upload"></i>
                    <span>Import</span>
                </file-upload>
            </li>
            <li ng-show="Navigation.searchentity" style="cursor:pointer" ng-click="Search()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
            <li ng-show="Navigation.searchentity" style="cursor:pointer" ng-click="Export()"><a><i class="fa fa-download"></i></a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->
        <div class="box box-primary">
            <div class="box-body no-border" ng-show="ShowSearch">
                <div class="col-md-2">
                    <div class="row row-padbot-15">
                        <div for="inputEmail3">
                            Supplier Name

                            <div class="pull-right" style="color:brown">
                                {{SearchCondition.gstno}}
                            </div>
                        </div>

                        <select class="form-control" select2=''
                                ng-model="SearchCondition.supplierid" style="width:100%"
                                ng-change="SearchCondition.gstno = findGST(SearchCondition.supplierid)"
                                options="item.id as item.name for item in Suppliers track by item.id"
                                focusid="scsupplierid" focusonenter="scproductgroupid"></select>
                    </div>
                    <div class="row row-padbot-15">
                        <label for="inputEmail3">Products</label>
                        <select class="form-control" select2=''
                                ng-model="SearchCondition.productgroupid" style="width:100%"
                                options="item.id as item.name for item in ProductGroups track by item.id"
                                focusid="scproductgroupid" focusonenter="scagreementname"></select>
                    </div>


                    <div class="row row-padbot-15">
                        <label for="inputEmail3">Agreenent Name</label>
                        <input method="text" class="form-control input-sm" style="width: 100%;"
                               ng-model="SearchCondition.agreementname"
                               placeholder="Name"
                               focusid="scagreementname" focusonenter="itemcode">
                    </div>


                    <div class="row row-padbot-15">
                        <label for="inputEmail3">Item Code</label>
                        <input method="text" class="form-control input-sm" style="width: 100%;"
                               ng-model="SearchCondition.itemcode"
                               placeholder="Name"
                               focusid="itemcode" focusonenter="scuan">
                    </div>


                    <div class="row row-padbot-15">
                        <div class="col-md-12 no-padding" style="height:30px" for="inputEmail3">
                            <div style="margin-left:0px">
                                <div style="position:absolute;right:0px;top:0px">
                                    Detail <input type="checkbox" ng-model="SearchCondition.showdetail" />
                                </div>
                                Item
                            </div>
                        </div>
                        <input method="text" ng-show="SearchCondition.showdetail" class="form-control input-sm" style="width: 100%;"
                               ng-model="SearchCondition.itemname"
                               placeholder="Name"
                               focusid="scuan" focusonenter="scapprovedby">
                    </div>

                    <div class="row row-padbot-15" ng-hide="SearchCondition.showdetail">
                        <label for="inputEmail3">UAN</label>
                        <input method="text" class="form-control input-sm" style="width: 100%;"
                               ng-model="SearchCondition.uan"
                               placeholder="Name"
                               focusid="scuan" focusonenter="scapprovedby">
                    </div>

                    <div class="row row-padbot-15">
                        <label for="inputEmail3">Approved by</label>
                        <select class="input-sm form-control"
                                select2="Approver" style="width:100%" ng-model="SearchCondition.approvedby"
                                options="item.id as item.name for item in Employees track by item.id" focusid="sccreatedby"
                                focusonenter="scdisabled" startswith="true"></select>
                    </div>


                    <div class="row row-padbot-15">
                        <label for="inputEmail3">Created by</label>
                        <select class="input-sm form-control"
                                select2="Approver" style="width:100%" ng-model="SearchCondition.createdby"
                                options="item.id as item.name for item in Employees track by item.id" focusid="scmodifiedby"
                                focusonenter="scdisabled" startswith="true"></select>
                    </div>



                    <div class="row row-padbot-15">
                        <label for="inputEmail3">Modified by</label>
                        <select class="input-sm form-control"
                                select2="Approver" style="width:100%" ng-model="SearchCondition.modifiedby"
                                options="item.id as item.name for item in Employees track by item.id" focusid="scmodifiedby"
                                focusonenter="scdisabled" startswith="true"></select>
                    </div>


                    <div class="row row-padbot-15">
                        <label for="inputEmail3">Disabled On</label>
                        <div class="no-padding">
                            <div class="input-group date">
                                <div class="input-group-addon">
                                    <i class="fa fa-calendar"></i>
                                </div>
                                <input type="text" class="form-control input-sm" style="width:100%"
                                       daterange="SearchCondition.fromdisabled,SearchCondition.todisabled" focusid="scdisabled" focusonenter="sccreated">
                            </div>
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <label for="inputEmail3">Created On</label>
                        <div class="no-padding">
                            <div class="input-group date">
                                <div class="input-group-addon">
                                    <i class="fa fa-calendar"></i>
                                </div>
                                <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromcreated,SearchCondition.tocreated"
                                       focusid="sccreated" focusonenter="scmodified">
                            </div>
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <label for="inputEmail3">Modified On</label>
                        <div class="no-padding">
                            <div class="input-group date">
                                <div class="input-group-addon">
                                    <i class="fa fa-calendar"></i>
                                </div>
                                <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromodified,SearchCondition.tomodified"
                                       focusid="scmodified">
                            </div>
                        </div>
                    </div>


                </div>

                <div class="col-md-10">
                    <div id="searchresult">

                    </div>
                </div>
            </div>
            <div class="box-body no-border" ng-hide="ShowSearch">
                <div class="col-md-3">
                    <div class="row row-padbot-15">
                        <div for="inputEmail3">
                            Supplier Name

                            <div class="pull-right" style="color:brown">
                                {{SupplierTradeAgreement.gstno}}
                            </div>
                        </div>

                        <select class="form-control" select2=''
                                ng-model="SupplierTradeAgreement.supplierid" style="width:100%"
                                ng-change="LoadData()"
                                options="item.id as item.name for item in Suppliers track by item.id"
                                focusid="supplierid" focusonenter="productgroupid"></select>
                    </div>
                    <div class="row row-padbot-15">
                        <label for="inputEmail3">Products</label>

                        <div class="input-group input-group-sm" style="width:100%">
                            <span class="input-group-btn" style="width:10px">
                                <input type="checkbox" ng-model="EnableProductGroup" />
                            </span>
                            <select class="form-control" select2=''
                                    ng-disabled="!EnableProductGroup"
                                    ng-model="SupplierTradeAgreement.productgroupid" style="width:100%"
                                    options="item.id as item.name for item in ProductGroups track by item.id"
                                    focusid="productgroupid" focusonenter="additem"></select>

                            <span class="input-group-btn" style="width:10px">
                                <button type="button" class="btn btn-info btn-sm btn-flat"
                                        ng-disabled="!EnableProductGroup"
                                        focusid="additem" ng-click="AddProductGroup()">
                                    <i class="glyphicon glyphicon-plus-sign"></i>
                                </button>
                            </span>
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <div id="productgrouplist">

                        </div>
                    </div>
                </div>


                <div class="col-md-3 no-padding">
                    <div class="col-md-12">
                        <div class="col-md-12 no-padding">

                            <div class="col-md-12 no-padding">
                                <label style="color:lightseagreen;font-size:20px">{{SupplierProduct.name}}</label>
                            </div>

                            <div class="col-md-6 no-padding">
                                <div style="color:brown"><b>Attribute</b><button class="btn btn-xs btn-success pull-left" ng-click="ManageAttribute()"><i class="fa fa-plus-circle"></i></button></div>
                                <div class="input-group input-group-sm" style="width: 100%; margin-top: 10px">
                                    <select class="input-sm form-control"
                                            select2="Size" style="width:100%;" ng-model="AttributeTypeID"
                                            ng-change="ChangeAttribute()"
                                            onkeyenter="ChangeAttribute()"
                                            options="item.id as item.name for item in AttributeTypes track by item.id" focusid="attributetype"
                                            focusonenter="designid" startswith="true"></select>
                                </div>
                            </div>
                            <div class="col-md-6 no-padding">
                                <div style="color:brown">
                                    <b>{{CurrentAttribute}}</b>
                                    <button class="btn btn-xs btn-primary pull-left" ng-click="ImportAttribute()"><i class="fa fa-arrow-down"></i></button>
                                </div>

                                <div class="input-group input-group-sm" style="width: 100%; margin-top: 10px">
                                    <select class="input-sm form-control"
                                            select2="Size" style="width:100%" ng-model="attributeid" onkeyenter="ChangeAttribute()"
                                            options="item.id as item.name for item in AttributeList track by item.id" focusid="attributeid"
                                            focusonenter="designid" startswith="true"></select>

                                    <span class="input-group-btn" style="width:10px">
                                        <button type="button" class="btn btn-info btn-sm btn-flat" focusid="additem" ng-click="AddAttribute()">
                                            <i class="glyphicon glyphicon-plus-sign"></i>
                                        </button>
                                    </span>
                                </div>
                            </div>
                            <!--<div class="col-md-12 no-padding">
                                <button class="btn btn-sm btn-primary pull-right" ng-click="ImportAttribute()" style="margin-top: 20px; margin-left: 20px">Import {{CurrentAttribute}}</button>
                                <button class="btn btn-sm btn-success pull-right" ng-click="ManageAttribute()" style="margin-top:20px;margin-left:20px">Create New {{CurrentAttribute}}</button>
                            </div>-->
                        

                        </div>
                        

                        <div id="attributeslist" class="col-md-12 no-padding" style="margin-top:10px">

                        </div>
                    </div>
                </div>


                <div class="col-md-6" style="padding-left:0px">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12 no-padding">
                            <div class="col-md-4 no-padding">
                                <label style="color:lightseagreen;font-size:20px">Price Agreement</label>
                            </div>
                            <div class="col-md-8 no-padding">
                                <div class="col-md-5 no-padding">
                                    <input method="text" class="form-control input-sm" style="width: 100%;"
                                           ng-model="agreementname"
                                           placeholder="Name"
                                           focusid="agreementname" focusonenter="brandid">
                                </div>
                                <div class="col-md-3 no-padding">
                                    <select class="input-sm form-control"
                                            select2="Brand" style="width:100%" ng-model="brandid"
                                            options="item.id as item.name for item in BrandList track by item.id" focusid="brandid"
                                            focusonenter="approvedby" startswith="true"></select>
                                </div>
                                <div class="col-md-4 no-padding">
                                    <select class="input-sm form-control"
                                            select2="Approver" style="width:100%" ng-model="approvedby"
                                            options="item.id as item.name for item in Employees track by item.id" focusid="approvedby"
                                            focusonenter="agreementon" startswith="true"></select>
                                </div>
                            </div>

                        </div>
                        <div class="col-md-12 no-padding">
                            <div class="col-md-5 no-padding">

                                <div class="col-md-6 no-padding">
                                    <label style="color:brown"><b>Date</b></label>
                                    <input method="text" class="form-control input-sm" style="width: 100%;"
                                           ng-model="agreementon" datemodule="agreementon"
                                           focusid="agreementon" focusonenter="marginmode">
                                </div>
                                <div class="col-md-6 no-padding">
                                    <label style="color:brown"><b>Mode</b></label>
                                    <select class="input-sm form-control"
                                            select2="Size" style="width:100%" ng-model="marginmode"
                                            options="item.id as item.name for item in MarginModes track by item.id" focusid="marginmode"
                                            focusonenter="cost" startswith="true"></select>
                                </div>
                            </div>
                            <div class="col-md-7 no-padding">

                                <div class="col-md-4 no-padding">

                                    <label style="color:brown"><b>Cost</b></label>
                                    <input method="text" class="form-control input-sm" style="width: 100%;"
                                           ng-model="cost"
                                           focusid="cost" focusonenter="price">

                                </div>


                                <div class="col-md-4 no-padding">
                                    <label style="color:brown"><b>Price</b></label>
                                    <input method="text" class="form-control input-sm" style="width: 100%;"
                                           ng-model="price"
                                           focusid="price" focusonenter="mrp">
                                </div>
                                <div class="col-md-4 no-padding">
                                    <label style="color:brown"><b>MRP</b></label>

                                    <div class="input-group input-group-sm" style="width:100%">
                                        <input method="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="mrp"
                                               focusid="mrp" focusonenter="addtradeagreement">
                                        <span class="input-group-btn" style="width:10px">
                                            <button type="button" class="btn btn-info btn-sm btn-flat" focusid="addtradeagreement"
                                                    ng-click="AddTradeAgreement()">
                                                <i class="glyphicon glyphicon-plus-sign"></i>
                                            </button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-12 no-padding" style="margin-top:10px">
                            <div id="tradeagreementgrid">

                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12 no-padding" ng-show="TradeAgreement != null">
                            <label style="color:lightseagreen;font-size:20px;float:left">Items Matrix - </label>
                            <label style="color: darkcyan; font-size: 20px; float: left">{{TradeAgreement.agreementname}}</label>


                            <button class="btn btn-sm btn-primary pull-right" ng-show="selectedcount>0" style="margin-top:5px;margin-left:10px" ng-click="UpdateNonUANItems()"><i class="fa fa-edit"></i>&nbsp;Non-UAN</button>
                            <button class="btn btn-sm btn-danger pull-right" ng-show="selectedcount>0" style="margin-top:5px;margin-left:10px" ng-click="DeleteMatrixItems()"><i class="fa fa-trash"></i>&nbsp;Delete</button>

                            <file-upload class="btn btn-success btn-rad btn-trans btn-sm file-upload pull-right"
                                         ng-hide="selectedcount>0"
                                         style="margin-top:5px;margin-left:5px"
                                         resize="true" max-width="1280" uri='File/UploadXLSX/{{UserInfo.OrganizationID}}/'
                                         max-height="1280" preview="false" ng-model="uploadfile"
                                         filetype="DATA"
                                         filemodel="uploadfile" onuploadcomplete="fileuploadedcomplete"
                                         multiple="false">
                                <i class="fa fa-upload">&nbsp;Upload</i>
                            </file-upload>

                            <button class="btn btn-sm btn-success pull-right" style="margin-top:5px;margin-left:10px" ng-show="selectedcount>0" ng-click="ExportItems()"><i class="fa fa-file-excel-o"></i>&nbsp;Export</button>
                            <button class="btn btn-sm btn-success pull-right" style="margin-top:5px;margin-left:10px" ng-click="UpdateMatrixItems()" ng-show="ItemGLNChanged"><i class="fa fa-save"></i>&nbsp;Update</button>
                            <button class="btn btn-sm btn-primary pull-right" ng-hide="selectedcount>0" style="margin-top:5px" ng-click="ShowMatrixConfig(TradeAgreement)"><i class="fa fa-gears"></i>&nbsp;Config</button>
                        </div>
                        <div class="col-md-12 no-padding" style="margin-top:5px">
                            <div id="itemsgrid">

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- /.row -->

    </section>
</div>


<script type="text/ng-template" id="MatrixConfiguration">
    <div class="ngdialog-message">
        <div class="col-md-12 no-padding" style="margin-bottom:10px">
            <span style="font-size:20px;color:orangered">Matrix Configuration</span>
        </div>
        <div class="col-md-12 no-padding" style="width: 620px; overflow-x: auto">
            <div class="col-md-12 no-padding" style="width:3000px">
                <div ng-repeat="masteritem in masters" style="float:left; width:200px; border-right: 2px solid darkgray; border-left: 2px solid darkgray;">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12 no-padding" style="border-bottom:2px solid darkgray">
                            <div class="col-md-3 no-padding">
                                <input type="checkbox" ng-model="masteritem.selected" ng-change="SelectAll(masteritem.selected,masteritem.items)" />
                            </div>
                            <div class="col-md-9 no-padding">
                                {{masteritem.attributetype}}
                            </div>
                        </div>
                        <div class="col-md-12 no-padding" style="border-bottom: 2px solid darkgray; height: 250px; overflow-y: scroll">
                            <div ng-repeat="configitem in masteritem.items" class="col-md-12 no-padding">
                                <div class="col-md-3 no-padding">
                                    <input type="checkbox" ng-model="configitem.selected" />
                                </div>
                                <div class="col-md-9 no-padding">
                                    {{configitem.attributename}}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="ngdialog-buttons" style="padding-top: 310px;">
        <div class="col-md-3 no-padding">
            <select class="form-control" select2='Barcode Mode'
                    placeholder="Barcode Mode"
                    ng-model="barcodemode" style="width:100%"
                    options="item.id as item.name for item in Parent.BarcodeModes track by item.id"
                    focusid="barcodemode"></select>
        </div>
        <div class="col-md-3 no-padding">
            <select class="form-control" select2='Barcode Mode'
                    placeholder="Barcode Mode"
                    ng-model="namingmode" style="width:100%"
                    options="item.id as item.code for item in Parent.Sellingnametemplates track by item.id"
                    focusid="namingmode"></select>
        </div>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Save</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>


<script type="text/ng-template" id="ImportAttributes">
    <div class="ngdialog-message">
        <div id="attributegrid" style="margin-top:25px">

        </div>
    </div>
    <div class="ngdialog-buttons" style="margin-top:25px">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Save</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>

<script type="text/ng-template" id="ManageAttribute">
    <div class="ngdialog-message">

        <div class="md-col-12">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Code</label>
                <div class="input-group input-group-sm col-sm-9 no-padding">
                    <input type="text" class="input-sm form-control" placeholder="Code"
                           ng-model="code" focusid="code" focusonenter="name">
                </div>
            </div>
        </div>

        <div class="md-col-12">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Name</label>
                <div class="input-group input-group-sm col-sm-9 no-padding">
                    <input type="text" class="input-sm form-control" placeholder="Name"
                           ng-model="name" focusid="name" focusonenter="name">

                </div>
            </div>
        </div>

    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Save</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>



<script type="text/ng-template" id="CloneAgreement">
    <div class="ngdialog-message">
        <div class="col-md-12 no-padding">
            <div class="col-md-12 no-padding">


                <div class="col-md-5 no-padding">
                    <label style="color:brown"><b>Description</b></label>
                    <input method="text" class="form-control input-sm" style="width: 100%;"
                           ng-model="agreement.agreementname"
                           placeholder="Name"
                           focusid="agreementname" focusonenter="brandid">
                </div>
                <div class="col-md-3 no-padding">
                    <label style="color:brown"><b>Brand</b></label>
                    <select class="input-sm form-control"
                            select2="Brand" style="width:100%" ng-model="agreement.brandid"
                            options="item.id as item.name for item in Parent.BrandList track by item.id" focusid="brandid"
                            focusonenter="approvedby" startswith="true"></select>
                </div>
                <div class="col-md-4 no-padding">
                    <label style="color:brown"><b>Approver</b></label>
                    <select class="input-sm form-control"
                            select2="Approver" style="width:100%" ng-model="agreement.approvedby"
                            options="item.id as item.name for item in Parent.Employees track by item.id" focusid="approvedby"
                            focusonenter="agreementon" startswith="true"></select>
                </div>

            </div>
            <div class="col-md-12 no-padding">
                <div class="col-md-5 no-padding">

                    <div class="col-md-6 no-padding">
                        <label style="color:brown"><b>Date</b></label>
                        <input method="text" class="form-control input-sm" style="width: 100%;"
                               ng-model="agreement.agreementon" datemodule="agreement.agreementon"
                               focusid="agreementon" focusonenter="marginmode">
                    </div>
                    <div class="col-md-6 no-padding">
                        <label style="color:brown"><b>Mode</b></label>
                        <select class="input-sm form-control"
                                select2="Size" style="width:100%" ng-model="agreement.marginmode"
                                options="item.id as item.name for item in Parent.MarginModes track by item.id" focusid="marginmode"
                                focusonenter="cost" startswith="true"></select>
                    </div>
                </div>
                <div class="col-md-7 no-padding">

                    <div class="col-md-4 no-padding">

                        <label style="color:brown"><b>Cost</b></label>
                        <input method="text" class="form-control input-sm" style="width: 100%;"
                               ng-model="agreement.cost"
                               focusid="cost" focusonenter="price">

                    </div>


                    <div class="col-md-4 no-padding">
                        <label style="color:brown"><b>Price</b></label>
                        <input method="text" class="form-control input-sm" style="width: 100%;"
                               ng-model="agreement.price"
                               focusid="price" focusonenter="mrp">
                    </div>
                    <div class="col-md-4 no-padding">
                        <label style="color:brown"><b>MRP</b></label>

                        <div class="input-group input-group-sm" style="width:100%">
                            <input method="text" class="form-control input-sm" style="width: 100%;"
                                   ng-model="agreement.mrp"
                                   focusid="mrp">
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-12 no-padding">
                <div class="col-md-3 no-padding">
                    <label style="color:brown"><b>Barcode</b></label>
                    <select class="form-control" select2='Barcode Mode'
                            placeholder="Barcode Mode"
                            ng-model="agreement.barcodemode" style="width:100%"
                            options="item.id as item.name for item in Parent.BarcodeModes track by item.id"
                            focusid="barcodemode"></select>
                </div>
                <div class="col-md-3 no-padding">
                    <label style="color:brown"><b>Display</b></label>
                    <select class="form-control" select2='Barcode Mode'
                            placeholder="Barcode Mode"
                            ng-model="agreement.namingmode" style="width:100%"
                            options="item.id as item.code for item in Parent.Sellingnametemplates track by item.id"
                            focusid="namingmode"></select>
                </div>


                <div class="col-md-3 no-padding">
                    <label style="color:brown"><b>Copy Matrix</b></label>
                    <br />
                    <input type="checkbox" ng-model="copymatrix">
                </div>
                <div class="col-md-3 no-padding">
                    <label style="color:brown"><b>Copy Items</b></label>
                    <br />
                    <input type="checkbox"
                           ng-model="copyitems">
                </div>


            </div>
        </div>

    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Save</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>



<script type="text/ng-template" id="ImportAgreement">
    <div class="ngdialog-message">
        <div class="col-md-12 no-padding">
            <div class="col-md-12 no-padding">
                <div class="col-md-4 no-padding">
                    <label style="color:brown"><b>Barcode</b></label>
                    <select class="form-control" select2='Barcode Mode'
                            placeholder="Barcode Mode"
                            ng-model="agreement.barcodemode" style="width:100%"
                            options="item.id as item.name for item in Parent.BarcodeModes track by item.id"
                            focusid="barcodemode"></select>
                </div>
                <div class="col-md-4 no-padding">
                    <label style="color:brown"><b>Display</b></label>
                    <select class="form-control" select2='Barcode Mode'
                            placeholder="Barcode Mode"
                            ng-model="agreement.namingmode" style="width:100%"
                            options="item.id as item.code for item in Parent.Sellingnametemplates track by item.id"
                            focusid="namingmode"></select>
                </div>

                <div class="col-md-4 no-padding">
                    <label style="color:brown"><b>Approver</b></label>
                    <select class="input-sm form-control"
                            select2="Approver" style="width:100%" ng-model="agreement.approvedby"
                            options="item.id as item.name for item in Parent.Employees track by item.id" focusid="approvedby"
                            focusonenter="agreementon" startswith="true"></select>
                </div>
            </div>

            <div class="col-md-12 no-padding" ng-show="missingproducts">
                <label style="color:brown"><b>Missing Products</b></label>
                <div ng-repeat="product in agreement.missing_product" class="col-md-12">
                    {{product}}
                </div>
            </div>
            <div class="col-md-12 no-padding" ng-hide="missingproducts">
                <div class="col-md-6 no-padding" style="height:300px;overflow-y:scroll">
                    <label style="color:brown"><b>Missing Attributes</b></label>
                    <div ng-repeat="product in agreement.missingattribes" class="col-md-12">
                        <div class="col-md-4">
                            {{product.key}}
                        </div>
                        <div class="col-md-8">
                            {{product.value}}
                        </div>
                    </div>
                </div>

                <div class="col-md-6 no-padding" style="height:300px;overflow-y:scroll">
                    <label style="color:brown"><b>Missing UAN</b></label>
                    <div ng-repeat="uan in agreement.Status.missing_uan" class="col-md-12">
                        {{uan}}
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Save</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>
