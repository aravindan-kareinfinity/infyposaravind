
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Component Purchase Order
        </h1>
        <ol class="breadcrumb">
            <li ng-show="Navigation.create" style="cursor:pointer" ng-click="Clear()"><a><i class="fa fa-file"></i>New</a></li>
            <li style="cursor:pointer" ng-click="ShowComponentCreation()"><a><i class="fa fa-file"></i>New Component</a></li>
            <li ng-show="UserInfo.p_PURCHASEORDER.print && ProductRequest.id>0" style="cursor:pointer" ng-click="Print()"><a><i class="fa fa-print"></i>Print</a></li>
            <li ng-show="UserInfo.p_PURCHASEORDER.print && ProductRequest.id>0" style="cursor:pointer" ng-click="Publish()"><a><i class="fa fa-file"></i>Publish</a></li>
            <!--<li ng-show="UserInfo.p_PURCHASEORDER.print && ProductRequest.id>0" style="cursor:pointer" ng-click="Validate(ProductRequest.id)"><a><i class="fa fa-calendar"></i>Validate</a></li>-->
            <li ng-show="Navigation.save" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
            <li ng-show="Navigation.delete" style="cursor:pointer" ng-click=""><a><i class="fa fa-trash"></i>Delete</a></li>
            <li ng-show="Navigation.search" style="cursor:pointer" ng-click="ShowSearch=!ShowSearch;Navigation.SetMode('SEARCH')"><a><i class="fa fa-search"></i>Search</a></li>
            <li ng-show="Navigation.edit" style="cursor:pointer" ng-click="ShowSearch=!ShowSearch;Navigation.SetMode('EDIT')"><a><i class="fa fa-backward"></i>Back</a></li>
            <li ng-show="Navigation.searchentity" style="cursor:pointer" ng-click="Search()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->
        <div class="box box-success" ng-hide="ShowSearch">
            <div class="box-body">

                <div class="col-md-12 no-padding">

                    <div class="col-md-3 no-padding">
                        <div class="col-md-12">
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="control-label no-margin">PO Number</label>
                                <input type="text" class="form-control input-sm" style="width:100%" ng-model="ProductRequest.pono" disabled />
                            </div>
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="form-group required control-label no-margin">PO Date</label>
                                <div class="input-group date">
                                    <div class="input-group-addon">
                                        <i class="fa fa-calendar"></i>
                                    </div>
                                    <input type="text" class="form-control datepicker input-sm" datemodule="ProductRequest.podate"
                                           ng-model="ProductRequest.Podate" focusid="first" focusonenter="pobookno">
                                </div>
                            </div>
                        </div>

                        <div class="col-md-12">
                            <div class="no-padding col-md-6">

                                <label for="inputEmail3" class="control-label no-margin">Booking No</label>
                                <input type="text" class="form-control input-sm" style="width:100%"
                                       ng-model="ProductRequest.pobookno" focusid="pobookno" focusonenter="pobookdate" />

                            </div>
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="form-group required control-label no-margin">Booking Date</label>
                                <div class="input-group date">
                                    <div class="input-group-addon">
                                        <i class="fa fa-calendar"></i>
                                    </div>
                                    <input type="text" class="form-control datepicker input-sm" datemodule="ProductRequest.pobookdate"
                                           ng-model="ProductRequest.pobookdate" focusid="pobookdate" focusonenter="company">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="form-group required control-label no-margin">Company</label>
                                <select class="form-control input-sm" select2='Company' ng-model="ProductRequest.companyid"
                                        style="width:100%" ng-options="item.id as item.name for item in Company track by item.id"
                                        focusid="company" focusonenter="dlocation"></select>
                            </div>
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="form-group required control-label no-margin">Delivery Location</label>
                                <select class="form-control input-sm" select2='Location' ng-model="ProductRequest.deliverylocationid"
                                        style="width:100%" ng-options="item.id as item.name for item in DeliveryLocations track by item.id"
                                        focusid="dlocation" focusonenter="supplier"></select>
                            </div>
                        </div>

                        <div class="col-md-12">
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="form-group required control-label no-margin">Supplier</label>
                                <select class="form-control input-sm" select2='Supplier'
                                        style="width:100%" ng-model="ProductRequest.supplierid" ng-options="item.id as item.name for item in Suppliers track by item.id"
                                        focusid="supplier" focusonenter="duedate"></select>
                            </div>
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="control-label no-margin">Due Date</label>
                                <div class="input-group date">
                                    <div class="input-group-addon">
                                        <i class="fa fa-calendar"></i>
                                    </div>
                                    <input type="text" class="form-control datepicker input-sm"
                                           datemodule="ProductRequest.expectedate" ng-model="ProductRequest.expectedate" focusid="duedate" focusonenter="tolerance">
                                </div>
                            </div>
                        </div>

                        <div class="col-md-12">
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="control-label no-margin">Tolerance %</label>
                                <input type="text" class="form-control input-sm" style="width:100%"
                                       ng-model="ProductRequest.tolerance" focusid="tolerance"
                                       focusonenter="freight" />
                            </div>
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="control-label no-margin">Freight</label>
                                <select class="form-control input-sm" select2='Mode' ng-model="ProductRequest.freight"
                                        ng-options="item.id as item.name for item in FreightList track by item.id" focusid="freight" focusonenter="preparedby"></select>
                            </div>
                        </div>


                        <div class="col-md-12">
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="control-label no-margin">Prepared By</label>
                                <select class="form-control" select2="" style="width:100%"
                                        ng-options="type.id  as type.name for type in Employee track by type.id"
                                        ng-model="ProductRequest.preparedby"
                                        focusid="preparedby" focusonenter="approvedby"></select>
                            </div>
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="control-label no-margin">Approved By</label>
                                <select class="form-control" select2="" style="width:100%"
                                        ng-options="type.id  as type.name for type in Employee track by type.id"
                                        ng-model="ProductRequest.approvedby"
                                        focusid="approvedby" focusonenter="bomcategoryid"></select>
                            </div>
                        </div>

                        <div class="col-md-12">
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="form-group required control-label no-margin">Component Category</label>
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in BOMCategory track by item.id"
                                        ng-model="ProductRequest.Details.bomcategoryid"
                                        ng-change="categoryChange(true)"
                                        focusid="bomcategoryid"></select>
                            </div>
                            <div class="no-padding col-md-6" ng-show="AutoBOMCode">
                                <label for="inputEmail3" class="control-label no-margin">Component</label>
                                <input type="text" style="width:100%" class="input-sm"
                                       focusid="autobomcode"
                                       focusonenter="colour"
                                       ng-change="bomchange(false)"
                                       ng-model="ProductRequest.Details.bomcode" />
                            </div>
                            <div class="no-padding col-md-6" ng-hide="AutoBOMCode">
                                <label for="inputEmail3" class="control-label no-margin">Component</label>
                                <select class="input-sm form-control" select2="" style="width: 100%;"
                                        ng-options="item.id  as item.title for item in BOMList track by item.id"
                                        ng-model="ProductRequest.Details.bomid" focusid="bomid"
                                        ng-change="bomchange(true)"
                                        focusonenter="brandname"></select>
                            </div>
                        </div>

                        <div class="col-md-12">
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="form-group required control-label no-margin">Supplier Brand</label>
                                <input type="text" style="width:100%" class="input-sm form-control"
                                       focusid="brandname"
                                       focusonenter="designid"
                                       ng-model="ProductRequest.Details.brandname" />

                            </div>
                            <div class="no-padding col-md-6">
                                <div class="col-md-8 no-padding">
                                    <label for="inputEmail3" class="control-label no-margin">Design</label>
                                    <input type="text" style="width:100%" class="input-sm form-control"
                                           focusid="designid"
                                           focusonenter="colourcode"
                                           ng-model="ProductRequest.Details.designid" />

                                </div>
                                <div class="col-md-4 no-padding">
                                    <label for="inputEmail3" class="control-label no-margin">Shade</label>
                                    <input type="text" style="width:100%" class="input-sm form-control"
                                           focusid="colourcode"
                                           focusonenter="colour"
                                           ng-model="ProductRequest.Details.colourshade" />
                                </div>
                            </div>

                        </div>

                        <div class="col-md-12">
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="control-label no-margin">Our Shade</label>
                                <input type="text" style="width:100%" class="input-sm form-control"
                                       focusid="colourcode"
                                       focusonenter="colour"
                                       ng-model="ProductRequest.Details.colourcode" />
                            </div>

                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="control-label no-margin">Colour</label>
                                <select class="input-sm form-control" select2="Select Colour" style="width:100%"
                                        ng-model="ProductRequest.Details.colourid"
                                        ng-change="ColourChanged()"
                                        ng-options="item.id as item.name for item in ColorList track by item.id"
                                        focusid="colour" focusonenter="width"></select>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="no-padding col-md-6">

                                <label for="inputEmail3" class="control-label no-margin">Width</label>
                                <input class="input-sm form-control" style="width:100%" type="text"
                                       ng-model="ProductRequest.Details.width" focusid="width" focusonenter="qty" />
                            </div>
                            <div class="no-padding col-md-6">
                                <div class="no-padding col-md-4">
                                    <label for="inputEmail3" class="control-label no-margin">Qty</label>
                                    <input class="input-sm form-control" style="width:100%" type="text"
                                           ng-model="ProductRequest.Details.qty" focusid="qty" focusonenter="rate" />
                                </div>
                                <div class="no-padding col-md-8">
                                    <label for="inputEmail3" class="form-group required control-label no-margin">Rate</label>
                                    <div class="input-group input-group-sm">
                                        <input class="input-sm form-control" style="width:100%" type="text"
                                               ng-model="ProductRequest.Details.rate" focusid="rate" onkeyenter="AddItem()" />
                                        <span class="input-group-btn" focusid="add">
                                            <button type="button" class="btn btn-sm btn-info" ng-click="AddItem()" focusid="add">Add</button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-12">

                            <label for="inputEmail3" class="control-label no-margin">Remarks</label>
                            <textarea rows="3" style="width:100%" class="input-sm form-control"
                                      focusid="designid"
                                      focusonenter="colourcode"
                                      ng-model="ProductRequest.remarks" />


                        </div>

                        <div class="col-md-12" ng-show="ProductRequest.pobookno && ProductRequest.pobookno!=''">
                            <label for="inputEmail3" style="padding-top:10px" class="control-label pull-left">Manual Form Copy</label>
                            <div class="pull-right" style="padding-top:5px;margin:0px">

                                <a target="_blank" href="File/Show/{{UserInfo.OrganizationID}}/{{ProductRequest.formimageid}}">
                                    <img style="height:24px;width:24px" ng-show="ProductRequest.formimageid"
                                         ng-src="File/Show/{{UserInfo.OrganizationID}}/{{ProductRequest.formimageid}}" />
                                </a>


                                <button ng-show="ProductRequest.formimageid"
                                        style="margin-left:5px;margin-right:5px"
                                        class="btn btn-danger btn-rad btn-trans btn-xs"
                                        ng-click="ProductRequest.formimageid = null">
                                    <i class="fa fa-remove"></i>
                                </button>

                                <file-upload ng-hide="ProductRequest.formimageid" class="btn btn-xs pull-right btn-success btn-rad btn-trans file-upload"
                                             resize="true" max-width="1280"
                                             max-height="1280" preview="false"
                                             ng-model="ProductRequest.timageid"
                                             filemodel="ProductRequest.timageid"
                                             onuploadcomplete="poimageuploaded"
                                             multiple="false">
                                    <i class="fa fa-upload"></i>
                                </file-upload>

                                <button ng-hide="ProductRequest.formimageid" style="margin-left:5px;margin-right:5px" class="btn btn-success pull-right btn-rad btn-trans btn-xs"
                                        ng-click="CaptureImage('IMAGE',ProductRequest,'formimageid',false,
                                            {'width':200,'height':100})">
                                    <i class="fa fa-camera"></i>
                                </button>
                            </div>

                        </div>

                    </div>

                    <div class="col-md-9 no-padding">

                        <div class="col-md-12 no-padding">

                            <div class="no-padding pull-left" style="vertical-align:top;font-size:large;color:brown;">
                                <label for="inputEmail3" style="font-size:large">Delivery to</label>
                            </div>

                            <div class="col-md-3 no-padding">
                                <select class="input-sm form-control" select2="Delivery to" style="width:100%"
                                        ng-model="ProductRequest.dsupplierid"
                                        ng-options="item.id as item.name for item in Suppliers track by item.id"
                                        focusid="colour" focusonenter="width"></select>
                            </div>



                            <div class="no-padding pull-right" style="vertical-align:top;font-size:large;color:brown;">
                                <label for="inputEmail3" style="font-size:large">Order Qty</label>
                                <div class="input-group input-group-sm pull-right" style="font-size:medium;color:black;padding-left:10px;padding-right:10px;padding-top:3px">
                                    {{orderqty|number:2}}
                                </div>
                            </div>
                            <div class="no-padding pull-right" style="vertical-align:top;font-size:large;color:brown;">
                                <label for="inputEmail3" style="font-size:large">Order Value</label>
                                <div class="input-group input-group-sm pull-right" style="font-size: medium; color: black; padding-left: 10px; padding-right: 10px; padding-top: 3px">
                                    {{orderamount|number:2}}
                                </div>
                            </div>

                            <!--<div class="col-md-6 no-margin">
                                <div ng-show="CurrentBOMImage != null">
                                    <img ng-src="File/Show/{{UserInfo.OrganizationID}}/{{CurrentBOMImage}}" />
                                </div>
                            </div>-->

                        </div>



                        <div class="col-md-12 no-padding">
                            
                            <div class="table-responsive mailbox-messages" style="margin-top:10px">
                                <table fixed-header="430px" class="fixed_table" additionalheight="25">
                                    <thead>
                                        <tr>
                                            <th style="width:50px">S.No</th>
                                            <th style="width:60px" align="center">Image</th>
                                            <th style="width:60px" align="center">&nbsp;</th>
                                            <th style="width:100px">Category</th>
                                            <th style="width:150px">Name</th>
                                            <th style="width:100px">Color</th>
                                            <th style="width:80px">Width</th>
                                            <th style="width:150px">Design</th>
                                            <th style="width:80px">Qty</th>
                                            <th style="width:80px">Rate</th>
                                            <th style="width:80px">Amount</th>
                                            <th style="width:80px">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr ng-repeat="item in ProductRequest.ComponentPOitems">
                                            <td>{{$index+1}}</td>
                                            <td>

                                                <div ng-show="item.imageid != null && item.imageid != ''">
                                                    <button class="btn btn-danger btn-rad btn-trans btn-xs" ng-click="item.imageid='';item.timageid=''">
                                                        <i class="fa fa-trash"></i>
                                                    </button>
                                                </div>

                                                <div ng-hide="item.imageid != null && item.imageid != ''">
                                                    <div class="col-md-6 no-padding">
                                                        <file-upload class="btn btn-xs btn-success btn-rad btn-trans file-upload"
                                                                     resize="true" max-width="1280"
                                                                     max-height="1280" preview="false" ng-model="item.timageid"
                                                                     filemodel="item.timageid"
                                                                     onuploadcomplete="imageuploaded"
                                                                     itemmodel="item"
                                                                     multiple="false">
                                                            <i class="fa fa-upload"></i>
                                                        </file-upload>
                                                    </div>
                                                    <button class="btn btn-success btn-rad btn-trans btn-xs" ng-click="CaptureImage('IMAGE',item,'imageid',true,{'width':200,'height':100})">
                                                        <i class="fa fa-camera"></i>
                                                    </button>
                                                </div>


                                            </td>
                                            <td>

                                                <div ng-show="item.imageid != null && item.imageid != ''">
                                                    <div>
                                                        <a target="_blank" href="File/Show/{{UserInfo.OrganizationID}}/{{item.imageid}}">
                                                            <img style="height:32px" ng-src="File/Thumbnail/0/{{item.imageid}}" />
                                                        </a>
                                                    </div>

                                                </div>

                                            </td>
                                            <td>{{SearchRef(item.bomcategoryid,BOMCategory)}}</td>
                                            <td>{{SearchBOM(item.bomid,BOMAllList)}}</td>
                                            <td>{{SearchRef(item.colourid,AllColorList)}}</td>
                                            <td>{{item.width}}</td>
                                            <td>{{item.brandname}}/{{item.designid}}/{{item.colourshade}}</td>
                                            <td>{{item.qty}}</td>
                                            <td>{{item.rate}}</td>
                                            <td>{{item.amount}}</td>
                                            <td tablecell>
                                                <button type="button" class="btn btn-xs btn-primary" ng-click="ManageItem('Edit',item)"><i class="fa fa-edit"></i></button>
                                                <button type="button" class="btn btn-xs btn-danger" ng-click="ManageItem('Delete',item)"><i class="fa fa-trash"></i></button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="col-md-4 pull-right input-group input-group-sm" ng-show="UserInfo.p_ComponentPO.print && ProductRequest.id>0">
                                <select class="form-control input-sm" select2="Status" ng-model="ProductRequest.status"
                                        ng-options="item.id as item.name for item in POStatus track by item.id"></select>
                                <span class="input-group-btn">
                                    <button type="button" class="btn btn-sm btn-info" ng-click="ChangeOrderStatus()">Change</button>
                                </span>
                            </div>
                        </div>

                    </div>

                </div>

            </div>
        </div>


        <div class="box box-primary" id="searchBox" ng-show="ShowSearch">
            <div class="box-body">
                <div class="col-md-3">

                    <div class="box-body">
                        <div class="row">
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">LOCATION</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in DeliveryLocations track by item.id"
                                                ng-model="SearchCondition.deliverylocationid"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">SUPPLIER</label>
                                    <div class="col-md-8">
                                        <select class="form-control" select2='Supplier' style="width: 100%;" ng-model="SearchCondition.supplierid" ng-options="item.id as item.name for item in Suppliers track by item.id"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">PO NO</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm" placeholder="" ng-model="SearchCondition.pono">
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">REQUESTED </label>
                                    <div class="col-md-8">
                                        <div class="input-group date">
                                            <div class="input-group-addon">
                                                <i class="fa fa-calendar"></i>
                                            </div>
                                            <input type="text" class="form-control datepicker input-sm" daterange="SearchCondition.fromdate,SearchCondition.todate" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">DUE ON</label>
                                    <div class="col-md-8">
                                        <div class="input-group date">
                                            <div class="input-group-addon">
                                                <i class="fa fa-calendar"></i>
                                            </div>
                                            <input type="text" class="form-control datepicker input-sm"
                                                   daterange="SearchCondition.duefromdate,SearchCondition.duetodate" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Design</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm" ng-model="SearchCondition.designid">
                                    </div>
                                </div>
                            </div>

                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Category</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in BOMCategory track by item.id"
                                                ng-model="SearchCondition.bomcategoryid"
                                                ng-change="searchcategoryChange(true)"></select>
                                    </div>
                                </div>
                            </div>

                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Component</label>
                                    <div class="col-md-8">
                                        <select class="input-sm form-control" select2="" style="width: 100%;"
                                                ng-options="item.id  as item.title for item in BOMList track by item.id"
                                                ng-model="SearchCondition.bomid"></select>
                                    </div>
                                </div>
                            </div>


                            <div class="row row-padbot-15">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">STATUS</label>
                                    <div class="col-md-8">
                                        <select class="form-control" select2='Status' style="width: 100%;" ng-model="SearchCondition.statusid" ng-options="item.id as item.name for item in POSearchStatus track by item.id"></select>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>
                <div class="col-md-9">

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="table-responsive mailbox-messages">

                                <table fixed-header="500px" class="fixed_table" additionalheight="25">
                                    <thead>
                                        <tr>
                                            <th style="width:120px">Company</th>
                                            <th style="width:120px">Supplier</th>
                                            <th style="width:60px">PO No</th>
                                            <th style="width:80px">PO Date</th>
                                            <th style="width:80px">Expected On</th>
                                            <th style="width:50px">Status</th>
                                            <th style="width:100px">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr ng-repeat="item in SearchResult">
                                            <td>{{SearchRef(item.companyid,Company)}}</td>
                                            <td>{{SearchRef(item.supplierid,Suppliers)}}</td>
                                            <td>{{item.pono}}</td>
                                            <td>{{item.podate |date:'dd-MM-yyyy'}}</td>
                                            <td>{{item.expectedate |date:'dd-MM-yyyy'}}</td>
                                            <td>{{item.stdisp}}</td>
                                            <td>
                                                <button type="button" class="btn btn-danger btn-xs" ng-click="ManageSearchItem('Delete',item)" ng-show="UserInfo.p_COMPONENTPO.delete"><i class="fa fa-trash"></i></button>
                                                <button type="button" class="btn btn-info btn-xs" ng-click="ManageSearchItem('Edit',item)" ng-show="UserInfo.p_COMPONENTPO.modify"><i class="fa fa-edit"></i></button>
                                                <button type="button" class="btn btn-xs btn-danger" ng-click="ManageSearchItem('Cancel',item)" ng-show="UserInfo.p_COMPONENTPO.modify"><i class="fa fa-ban"></i></button>
                                                <button type="button" class="btn btn-info btn-xs" ng-click="ManageSearchItem('Complete',item)" ng-show="UserInfo.p_COMPONENTPO.modify"><i class="fa fa-check"></i></button>
                                                <button type="button" class="btn btn-xs btn-danger" ng-click="Print(item.id)" ng-show="UserInfo.p_COMPONENTPO.print"><i class="fa fa-print"></i></button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- /.content -->
        </div>


    </section>
</div>


<script type="text/ng-template" id="ProductSearch">
    <div class="ngdialog-message">
        <div class="table-responsive mailbox-messages">
            <div class="col-md-12" ng-show="ShowCreate">
                <label for="inputPassword3" class="col-md-4">Printing Name</label>
                <div class="input-group input-group-sm col-md-8">
                    <input type="text" class="input-sm form-control" ng-model="printingname">
                    <span class="input-group-btn">
                        <button type="button" class="btn btn-info btn-flat" ng-click="Create()">Create</button>
                    </span>
                </div>
            </div>
            <div class="col-md-12">
                <table fixed-header="150px" class="fixed_table">
                    <thead>
                        <tr>
                            <th style="width:40px">Action</th>
                            <th style="width:100px">Name</th>
                            <th style="width:150px">Detail</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in PopupList">
                            <td><button type="button" class="btn btn-xs btn-primary" ng-click="Selected(item)">Select</button></td>
                            <td>{{item.printingname}}</td>
                            <td>{{item.display}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>
