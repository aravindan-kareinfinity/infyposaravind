<script type="text/ng-template" id="ChangeStatusDialog">
    <div class="ngdialog-message">
        <div class="table-responsive mailbox-messages">

            <div class="col-md-12">
                <label>Employee</label>
                <select class="input-sm form-control" select2="" style="width: 100%;"
                        options="item.id as item.name for item in Parent.Employees track by item.id"
                        ng-model="employeeid"></select>
            </div>
            <div class="col-md-12">
                <label for="inputEmail3" class="form-group required control-label no-margin">Changed Date</label>
                <div class="input-group date">
                    <div class="input-group-addon">
                        <i class="fa fa-calendar"></i>
                    </div>
                    <input type="text" class="form-control datepicker input-sm"
                           datemodule="statuson" ng-model="statuson">
                </div>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Change</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>
