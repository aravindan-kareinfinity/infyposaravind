<script type="text/ng-template" id="BOMRequest">
    <div class="ngdialog-message">
        <div class="md-col-12">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Mode</label>
                <div class="input-group input-group-sm col-sm-6 no-padding">
                    <select class="form-control"
                            style="width:100%;"
                            ng-model="mode"
                            ng-change="modechanged()"
                            ng-options="item.id as item.name for item in Modes track by item.id"></select>
                </div>
            </div>
        </div>
        <div class="md-col-12">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Stage</label>
                <div class="input-group input-group-sm col-sm-6 no-padding">
                    <select class="form-control"
                            style="width:100%;"
                            ng-model="stageid"
                            ng-disabled="mode!=1"
                            ng-options="item.index as item.name for item in StageList track by item.index"></select>
                </div>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" ng-hide="inward" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Create</button>
        <button type="button" ng-show="inward" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Inward</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>

<script type="text/ng-template" id="ChooseStage">
    <div class="ngdialog-message">
        <div class="md-col-12">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Stage</label>
                <div class="input-group input-group-sm col-sm-6 no-padding">
                    <select class="form-control"
                            style="width:100%;"
                            ng-model="stageid"
                            ng-options="item.index as item.name for item in StageList track by item.index"></select>
                </div>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" ng-hide="inward" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Create</button>
        <button type="button" ng-show="inward" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Inward</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>

<script type="text/ng-template" id="ChooseStatus">
    <div class="ngdialog-message">
        <div class="md-col-12">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Status</label>
                <div class="input-group input-group-sm col-sm-6 no-padding">
                    <select class="form-control"
                            style="width:100%;"
                            ng-model="statusid"
                            ng-options="item.id as item.name for item in StatusList track by item.id"></select>
                </div>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Change</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>
