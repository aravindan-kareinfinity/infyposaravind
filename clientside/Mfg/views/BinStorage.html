<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->

    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Bin Storage
        </h1>
        <ol class="breadcrumb">
            <li ng-show="Navigation.save" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->
        <div class="box box-primary" ng-hide="ShowSearch">
            <div class="box-body">
                <div class="col-md-12 no-padding">
                    <form name="agent">

                        <div class="row row-padbot-15">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Location</label>
                                    <div class="col-md-8">

                                        <div class="input-group input-group-sm col-md-12">
                                            <select class="form-control select2" style="width: 100%;"
                                                    select2="" ng-options="item.id as item.name for item in Location track by item.id"
                                                    ng-model="Binstorage.locationid"></select>
                                            <span class="input-group-btn" style="width:10px">
                                                <button type="button" class="btn btn-info btn-sm btn-flat" ng-click="LoadConfiguration()">
                                                    <i class=" glyphicon glyphicon-circle-arrow-down"></i>
                                                </button>
                                            </span>
                                        </div>


                                    </div>
                                </div>

                                <div class="col-md-12" style="padding-top:10px;padding-left:0px">
                                    <div class="col-md-12" style="overflow-y:scroll;padding-left:0px;" ng-style="panelheight">
                                        <div data-angular-treeview="true"
                                             data-tree-id="bintree"
                                             data-tree-model="bintreedata"
                                             data-node-id="id"
                                             data-node-label="name"
                                             data-node-children="children">
                                        </div>
                                    </div>
                                    <!-- /.col -->
                                </div>
                            </div>
                            <div class="col-md-8">
                                <div class="col-md-12 no-padding">
                                    <button class="btn btn-sm btn-info pull-right" ng-show="CurrentNode.supportallocation" ng-click="BinGenerator()">Bin Configuration</button>
                                    <button class="btn btn-sm btn-info pull-right" ng-show="sgrid != null" ng-click="DeleteList()">Delete</button>
                                </div>
                                <div class="col-md-12 no-padding" id="gridContainer">
                                </div>
                            </div>
                        </div>
                    </form>
                </div>

            </div>
        </div>


    </section>
</div>
<!-- /.content-wrapper -->


<script type="text/ng-template" id="BinEdit">
    <div class="ngdialog-message">

        <div class="md-col-12">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Code</label>
                <div class="input-group input-group-sm col-sm-9 no-padding">
                    <input type="text" class="input-sm col-md-6 no-padding" placeholder="height" ng-model="node.code" />
                </div>
            </div>
        </div>

        <div class="md-col-12">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Height/Width</label>
                <div class="input-group input-group-sm col-sm-9 no-padding">
                    <input type="text" class="input-sm col-md-3 no-padding" placeholder="height" ng-model="node.height" />
                    <input type="text" class="input-sm col-md-3 no-padding" placeholder="width" ng-model="node.width" />
                    <label class="col-md-3">Qty</label>
                    <input type="text" class="input-sm col-md-3 no-padding" placeholder="capacity" ng-model="node.maxqty" />
                </div>
            </div>
        </div>

        <div class="md-col-12">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Row/Column</label>
                <div class="input-group input-group-sm col-sm-9 no-padding">
                    <input type="text" class="input-sm col-md-3 no-padding" placeholder="height" ng-model="node.row" />
                    <input type="text" class="input-sm col-md-3 no-padding" placeholder="width" ng-model="node.column" />
                    <label class="col-md-3">Disable</label>
                    <input type="checkbox"
                           ng-model="node.disabled" />
                </div>
            </div>
        </div>



    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Save</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>

<script type="text/ng-template" id="BinGenerator">
    <div class="ngdialog-message">
        <div class="md-col-12">
            <div class="form-group">
                <div style="font-size:large;color:firebrick">{{menu}}</div>
            </div>
        </div>
        

        <div class="md-col-12">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Height/Width</label>
                <div class="input-group input-group-sm col-sm-9 no-padding">
                    <input type="text" class="input-sm col-md-3 no-padding" placeholder="height" ng-model="node.binheight" />
                    <input type="text" class="input-sm col-md-3 no-padding" placeholder="width" ng-model="node.binwidth" />
                    <label class="col-md-3">Qty</label>
                    <input type="text" class="input-sm col-md-3 no-padding" placeholder="capacity"  ng-model="node.maxqty" />
                </div>
            </div>
        </div>

        <div class="md-col-12">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Row/Column</label>
                <div class="input-group input-group-sm col-sm-9 no-padding">
                    <input type="text" class="input-sm col-md-1 no-padding" placeholder="preix" ng-model="node.rowprefix" />
                    <input type="text" class="input-sm col-md-2 no-padding" ng-model="node.rows" placeholder="no of rows"  />
                    <input type="text" class="input-sm col-md-3 no-padding" placeholder="Row Length" ng-model="node.rowlength" />
                    <input type="text" class="input-sm col-md-1 no-padding" placeholder="preix" ng-model="node.columnprefix" />
                    <input type="text" class="input-sm col-md-2 no-padding" ng-model="node.columns" placeholder="no of columns" />
                    <input type="text" class="input-sm col-md-3 no-padding" placeholder="Col Length" ng-model="node.columnlength" />
                </div>
            </div>
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Code Config</label>
                <div class="input-group input-group-sm col-sm-9 no-padding">
                    <input type="text" class="input-sm col-md-2 no-padding" placeholder="Prefix" ng-model="node.codeprefix" />
                    <div class="col-md-4 no-padding">
                        <select class="form-control select2" style="width: 100%;"
                                select2="Row/Column" ng-options="item.id as item.name for item in CodeSource track by item.id"
                                ng-model="node.codefirstpart"></select>
                    </div>

                    <div class="col-md-4 no-padding">
                        <select class="form-control select2" style="width: 100%;"
                                select2="Row/Column" ng-options="item.id as item.name for item in CodeSource track by item.id"
                                ng-model="node.codesecondpart"></select>
                    </div>

                    <input type="text" class="input-sm col-md-2 no-padding" placeholder="Suffix" ng-model="node.codesuffix" />
                </div>
            </div>
        </div>

    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Save</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>

<script type="text/ng-template" id="BinConfig">
    <div class="ngdialog-message">
        <div class="md-col-12">
            <div class="form-group">
                <div style="font-size:large;color:firebrick">{{menu}}</div>
            </div>
        </div>
        <div class="md-col-12">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Code</label>
                <div class="input-group input-group-sm col-sm-9 no-padding">
                    <input type="text" ng-model="node.code" class="input-sm" style="width:100%" />
                </div>
            </div>
        </div>
        <div class="md-col-12">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Name</label>
                <div class="input-group input-group-sm col-sm-9 no-padding">
                    <input type="text" ng-model="node.name" class="input-sm" style="width:100%" />
                </div>
            </div>
        </div>

        <div class="md-col-12">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Height/Width</label>
                <div class="input-group input-group-sm col-sm-9 no-padding">
                    <input type="text" class="input-sm col-md-6 no-padding" ng-model="node.height" />
                    <input type="text" class="input-sm col-md-6 no-padding" ng-model="node.width" />
                </div>
            </div>
        </div>
        <div class="md-col-12">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Storage</label>
                <div class="input-group input-group-sm col-sm-9 no-padding">
                    <input type="checkbox" ng-model="node.supportallocation" />
                </div>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Save</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>
