<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->

    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Component Master
        </h1>
        <ol class="breadcrumb">
            <li ng-show="Navigation.create" style="cursor:pointer" ng-click="New()"><a><i class="fa fa-file"></i>New</a></li>
            <li ng-show="Navigation.save" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
            <li ng-show="Navigation.search" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('SEARCH')"><a><i class="fa fa-search"></i>Search</a></li>
            <li ng-show="Navigation.edit" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('EDIT')"><a><i class="fa fa-backward"></i>Back</a></li>
            <li ng-show="Navigation.edit" style="cursor:pointer" ng-click="Search()"><a><i class="fa fa-search-plus"></i>Search</a></li>
            <li ng-show="Navigation.edit" style="cursor:pointer" ng-click="exporttoExcel(igrid,'whdashboard', 'dashboard')"><a><i class="fa fa-download"></i></a></li>
            <li ng-show="selectedrowcount>0 && Navigation.edit" style="cursor:pointer" ng-click="ShowStatusDialog()"><a><i class="fa fa-ban"></i>Change Status</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->
        <div class="box box-primary" ng-hide="ShowSearch">
            <div class="box-body">
                <div class="no-padding" ng-class="IsDialog?'col-md-12':'col-md-6'">

                    <div class="row row-padbot-15" ng-show="BOMMaster && BOMMaster.id && BOMMaster.id>0">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Code</label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control input-sm" style="width: 100%;"
                                           ng-model="BOMMaster.bommastercode"
                                           ng-readonly="true">
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Core Type</label>
                                <div class="col-md-8">
                                    <select class="form-control select2" style="width: 100%;" select2=""
                                            focusid="first"
                                            focusonenter="name"
                                            ng-options="item.id as item.name for item in BOMCoreTypes track by item.id"
                                            ng-model="BOMMaster.coretypeid"></select>
                                </div>

                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <!-- /.row -->
                    <div class="row row-padbot-15" ng-show="BOMMaster.coretypeid==3">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Product/SKU</label>
                                <div class="col-md-8">
                                    <div class="col-md-6 no-padding">
                                        <select class="form-control select2" style="width: 100%;" select2=""
                                                focusid="productid"
                                                focusonenter="skudesign"
                                                ng-options="item.id as item.name for item in Products track by item.id"
                                                ng-model="BOMMaster.tproductid"></select>
                                    </div>
                                    <div class="col-md-6 no-padding">
                                        <input type="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="BOMMaster.tskuid" required
                                               focusid="skudesign"
                                               focusonenter="name">
                                    </div>
                                </div>

                            </div>
                        </div>
                        <!-- /.col -->
                    </div>


                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Name</label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control input-sm" style="width: 100%;"
                                           ng-model="BOMMaster.name" required
                                           focusid="name"
                                           focusonenter="printname"
                                           ng-change="BOMMaster.name = BOMMaster.name.toUpperCase()">
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Printing Name</label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control input-sm" style="width: 100%;"
                                           focusid="printname"
                                           focusonenter="category"
                                           ng-model="BOMMaster.printingname"
                                           ng-change="BOMMaster.printingname = BOMMaster.printingname.toUpperCase()">
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <!-- /.row -->
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Category</label>
                                <div class="col-md-8">
                                    <select class="form-control select2" style="width: 100%;" select2=""
                                            focusid="category"
                                            focusonenter="uom"
                                            ng-options="item.id as item.name for item in BOMCategory track by item.id" ng-model="BOMMaster.categoryid"></select>
                                </div>

                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">UOM</label>
                                <div class="col-md-8">
                                    <select class="form-control select2" style="width: 100%;" select2=""
                                            focusid="uom"
                                            focusonenter="supplierid"
                                            ng-options="item.id as item.name for item in UOMList track by item.id" ng-model="BOMMaster.uomid"></select>
                                </div>

                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Supplier</label>
                                <div class="col-md-6" style="padding-right:0px">
                                    <select class="form-control select2"
                                            ng-disabled="BOMMaster.multisupplier"
                                            style="width: 100%;" select2=""
                                            focusid="supplierid"
                                            onkeyenter="brandfocus()"
                                            ng-options="item.id as item.name for item in SupplierList track by item.id"
                                            ng-model="BOMMaster.supplierid"></select>
                                </div>
                                <div class="col-md-2">
                                    <input type="checkbox" class="icheckbox_minimal-blue" ng-model="BOMMaster.multisupplier">
                                    Multiple
                                </div>


                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="row row-padbot-15" ng-show="BOMMaster.supplierid>0 && !BOMMaster.multisupplier">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Brand/Design</label>
                                <div class="col-md-8">
                                    <div class="col-md-6 no-padding">
                                        <input type="text" class="form-control input-sm"
                                               focusid="supplierbrand"
                                               focusonenter="designno"
                                               style="width: 100%;" ng-model="BOMMaster.supplierbrand">
                                    </div>
                                    <div class="col-md-6 no-padding">
                                        <input type="text" class="form-control input-sm"
                                               focusid="designno"
                                               focusonenter="colourmode"
                                               style="width: 100%;" ng-model="BOMMaster.designno">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Colour Mode</label>
                                <div class="col-md-8">
                                    <div class="col-md-5 no-padding">
                                        <select class="form-control select2" style="width: 100%;" select2=""
                                                focusid="colourmode"
                                                focusonenter="hsncode"
                                                ng-options="item.id as item.name for item in ColourModes track by item.id" ng-model="BOMMaster.colourmode"></select>

                                    </div>
                                    <div class="col-md-7 no-padding">
                                        <label for="inputEmail3" class="col-md-4 form-group required control-label">HSN</label>
                                        <div class="col-md-8 no-padding">
                                            <input type="text" class="form-control input-sm"
                                                   focusid="hsncode"
                                                   onkeyenter="ConditionalExecute(BOMMaster.colourmode == 1,setFocuscolourid,setFocuswidth)"
                                                   style="width: 100%;" ng-model="BOMMaster.hsncode">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="row row-padbot-15" ng-show="BOMMaster.colourmode == 1">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Colour</label>
                                <div class="col-md-8">
                                    <select class="form-control select2" style="width: 100%;" select2=""
                                            focusid="colourid"
                                            focusonenter="width"
                                            ng-options="item.id as item.name for item in ColorList track by item.id" ng-model="BOMMaster.colorid"></select>
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Width</label>
                                <div class="col-md-8">
                                    <div class="col-md-5 no-padding">
                                        <input type="text" class="form-control input-sm"
                                               focusid="width"
                                               focusonenter="taxid"
                                               style="width: 100%;" ng-model="BOMMaster.width">
                                    </div>
                                    <div class="col-md-7 no-padding">
                                        <label for="inputEmail3" class="col-md-4 form-group required control-label">Tax</label>
                                        <div class="col-md-8 no-padding">
                                            <select class="form-control select2" style="width: 100%;"
                                                    focusid="taxid"
                                                    focusonenter="buyingrate"
                                                    select2="" ng-options="item.id as item.name for item in TaxList track by item.id"
                                                    ng-model="BOMMaster.taxid"></select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <!-- /.row -->
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Accepted Rate</label>
                                <div class="col-md-8">
                                    <div class="col-md-5 no-padding">
                                        <input type="text" class="form-control input-sm"
                                               focusid="buyingrate"
                                               focusonenter="landingcost"
                                               style="width: 100%;" ng-model="BOMMaster.buyingrate">
                                    </div>
                                    <div class="col-md-7 no-padding">
                                        <label for="inputEmail3" class="col-md-4 form-group required control-label">Costing</label>
                                        <div class="col-md-8 no-padding">
                                            <input type="text" class="form-control input-sm"
                                                   focusid="landingcost"
                                                   focusonenter="romin"
                                                   style="width: 100%;" ng-model="BOMMaster.landingcost">
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Reorder Min</label>
                                <div class="col-md-8">
                                    <div class="col-md-5 no-padding">
                                        <input type="text" class="form-control input-sm"
                                               focusid="romin"
                                               focusonenter="romax"
                                               style="width: 100%;" ng-model="BOMMaster.romin">
                                    </div>
                                    <div class="col-md-7 no-padding">
                                        <label for="inputEmail3" class="col-md-4 form-group required control-label">Max</label>
                                        <div class="col-md-8 no-padding">
                                            <input type="text" class="form-control input-sm"
                                                   focusid="romax"
                                                   style="width: 100%;" ng-model="BOMMaster.romax">
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 form-group required control-label">Image</label>
                                <div class="col-md-8">
                                    <div class="col-md-2 no-padding">
                                        <button class="btn btn-success btn-rad btn-trans btn-xs"
                                                ng-click="CaptureImage('IMAGE',camerauploaded,null,true,{'width':200,'height':100})">
                                            <i class="fa fa-camera"></i>
                                        </button>
                                    </div>
                                    <div class="col-md-2 no-padding">
                                        <a target="_blank" href="File/Show/{{UserInfo.OrganizationID}}/{{BOMMaster.imageid}}">
                                            <img style="height:24px" ng-src="File/Thumbnail/{{UserInfo.OrganizationID}}/{{BOMMaster.imageid}}" />
                                        </a>
                                    </div>
                                    <div class="col-md-8 no-padding">
                                        <div class="col-md-6 no-padding">
                                            <file-upload class="btn btn-success btn-rad btn-trans btn-xs file-upload"
                                                         resize="true" max-width="1280"
                                                         max-height="1280"
                                                         preview="true"
                                                         ng-model="BOMMaster.imageid"
                                                         filemodel="BOMMaster.imageid"
                                                         filetype="IMAGE"
                                                         onuploadcomplete="imageuploaded"
                                                         multiple="false">
                                                <i class="fa fa-upload"></i>
                                                <span>Upload Image</span>
                                            </file-upload>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
                <div class="col-md-6">

                    <div class="nav-tabs-custom" ng-show="BOMMaster.multisupplier || BOMMaster.colourmode==2">
                        <ul class="nav nav-tabs">
                            <li ng-show="BOMMaster.colourmode==2" class="active"><a data-target="#Colours" data-toggle="tab">Colours</a></li>
                            <li ng-show="BOMMaster.multisupplier"><a data-target="#Suppliers" data-toggle="tab">Suppliers</a></li>
                        </ul>
                        <div class="tab-content" style="height:500px">
                            <div class="tab-pane active" id="Colours">

                                <div class="col-md-12">
                                    <div class="form-group">

                                        <div class="table-responsive mailbox-messages" style="padding-top:5px">
                                            <table fixed-header="360px" class="fixed_table">
                                                <thead>
                                                    <tr>
                                                        <th width="70px">Code</th>
                                                        <th>Colour</th>
                                                        <th style="width:70px">RO(Min)</th>
                                                        <th style="width:70px">RO(Max)</th>
                                                        <th style="width:30px"></th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr>
                                                        <td style="width:50px">
                                                            <input type="text" style="width:100%" ng-model="colourcode"
                                                                   focusid="c_colourcode"
                                                                   focusonenter="c_colourid"
                                                                   class="form-control input-sm" />
                                                        </td>
                                                        <td>
                                                            <select class="form-control select2" style="width: 100%;" select2=""
                                                                    focusid="c_colourid"
                                                                    focusonenter="c_romin"
                                                                    ng-options="item.id as item.name for item in ColorList track by item.id"
                                                                    ng-model="colourid"></select>
                                                        </td>
                                                        <td style="width:50px">
                                                            <input type="text" style="width:100%" ng-model="romin"
                                                                   focusid="c_romin"
                                                                   focusonenter="c_romax"
                                                                   class="form-control input-sm" />
                                                        </td>
                                                        <td style="width:50px">
                                                            <input type="text" style="width:100%" ng-model="romax"
                                                                   focusid="c_romax"
                                                                   focusonenter="c_add"
                                                                   class="form-control input-sm" />
                                                        </td>
                                                        <td style="width:30px">
                                                            <button type="button" class="btn btn-xs btn-primary"
                                                                    focusid="c_add"
                                                                    ng-click="ManageColour('ADD')">
                                                                <i class="fa fa-plus">&nbsp;&nbsp;Add</i>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                    <tr ng-repeat="item in BOMMaster.colourlist">
                                                        <td>
                                                            <input type="text" style="width:100%" ng-model="item.name" class="form-control input-sm" />
                                                        </td>
                                                        <td>

                                                            <div style="width:100%">
                                                                <div class="pull-left" ng-show="item.imageid && item.imageid != null">
                                                                    <img style="height:25px" ng-src="File/Show/{{UserInfo.OrganizationID}}/{{item.imageid}}" />
                                                                </div>
                                                                {{SearchRef(item.id,ColorList)}}
                                                                <div class="pull-right">

                                                                    <button class="btn btn-success btn-rad btn-trans btn-xs"
                                                                            ng-click="CaptureImage('IMAGE',item,'imageid',true,{'width':200,'height':100})">
                                                                        <i class="fa fa-camera"></i>
                                                                    </button>
                                                                </div>

                                                                <div class="pull-right">
                                                                    <div class="col-md-6 no-padding">
                                                                        <file-upload class="btn btn-success btn-rad btn-trans btn-xs file-upload"
                                                                                     resize="true" max-width="1280"
                                                                                     max-height="1280"
                                                                                     preview="true"
                                                                                     ng-model="item.timageid"
                                                                                     filemodel="item.timageid"
                                                                                     filetype="IMAGE"
                                                                                     onuploadcomplete="imageitemuploaded"
                                                                                     multiple="false">
                                                                            <i class="fa fa-upload"></i>
                                                                            <span>Upload Image</span>
                                                                        </file-upload>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td>
                                                            <input type="text" style="width:100%" ng-model="item.romin" class="form-control input-sm" />
                                                        </td>
                                                        <td>
                                                            <input type="text" style="width:100%" ng-model="item.romax" class="form-control input-sm" />
                                                        </td>

                                                        <td style="width:30px">
                                                            <button type="button" class="btn btn-xs btn-danger"
                                                                    ng-click="ManageColour('DELETE',item)">
                                                                <i class="fa fa-trash-o"></i>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>

                            </div>
                            <div class="tab-pane" id="Suppliers">

                                <div class="col-md-12 no-padding">
                                    <div class="form-group">

                                        <div class="table-responsive mailbox-messages" style="padding-top:5px">
                                            <table fixed-header="360px" class="fixed_table">
                                                <thead>
                                                    <tr>
                                                        <th>Supplier</th>
                                                        <th style="width:100px">Brand</th>
                                                        <th style="width:100px">Design</th>
                                                        <th style="width:50px">Rate</th>
                                                        <th style="width:50px">Min</th>
                                                        <th style="width:50px">Max</th>
                                                        <th style="width:15px"></th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr>

                                                        <td>
                                                            <select class="form-control select2" style="width: 100%;" select2=""
                                                                    focusid="c_supplierid"
                                                                    focusonenter="m_brand"
                                                                    ng-options="item.id as item.name for item in SupplierList track by item.id"
                                                                    ng-model="m_supplierid"></select>
                                                        </td>
                                                        <td style="width:70px">
                                                            <input type="text" style="width:100%" ng-model="m_brand"
                                                                   focusid="m_brand"
                                                                   focusonenter="m_design"
                                                                   class="form-control input-sm" />
                                                        </td>
                                                        <td style="width:70px">
                                                            <input type="text" style="width:100%" ng-model="m_design"
                                                                   focusid="m_design"
                                                                   focusonenter="m_rate"
                                                                   class="form-control input-sm" />
                                                        </td>
                                                        <td style="width:70px">
                                                            <input type="text" style="width:100%" ng-model="m_rate"
                                                                   focusid="m_rate"
                                                                   focusonenter="m_min"
                                                                   class="form-control input-sm" />
                                                        </td>
                                                        <td style="width:70px">
                                                            <input type="text" style="width:100%" ng-model="m_min"
                                                                   focusid="m_min"
                                                                   focusonenter="m_max"
                                                                   class="form-control input-sm" />
                                                        </td>
                                                        <td style="width:70px">
                                                            <input type="text" style="width:100%" ng-model="m_max"
                                                                   focusid="m_max"
                                                                   focusonenter="m_add"
                                                                   class="form-control input-sm" />
                                                        </td>
                                                        <td style="width:30px">
                                                            <button type="button" class="btn btn-xs btn-primary"
                                                                    focusid="m_add"
                                                                    ng-click="ManageSupplier('ADD')">
                                                                <i class="fa fa-plus">&nbsp;</i>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                    <tr ng-repeat="item in BOMMaster.supplierlist">
                                                        <td>
                                                            {{SearchRef(item.id,SupplierList)}}
                                                        </td>
                                                        <td>
                                                            <input type="text" style="width:100%" ng-model="item.design" class="form-control input-sm" />
                                                        </td>

                                                        <td>
                                                            <input type="text" style="width:100%" ng-model="item.brand" class="form-control input-sm" />
                                                        </td>
                                                        <td>
                                                            <input type="text" style="width:100%" ng-model="item.rate" class="form-control input-sm" />
                                                        </td>
                                                        <td>
                                                            <input type="text" style="width:100%" ng-model="item.min" class="form-control input-sm" />
                                                        </td>
                                                        <td>
                                                            <input type="text" style="width:100%" ng-model="item.max" class="form-control input-sm" />
                                                        </td>

                                                        <td style="width:30px">
                                                            <button type="button" class="btn btn-xs btn-danger"
                                                                    ng-click="ManageSupplier('DELETE',item)">
                                                                <i class="fa fa-trash-o"></i>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>
            </div>
            </div>
            <div class="box box-primary" id="searchBox" ng-show="ShowSearch">
                <div class="box-body">
                    <div class="col-md-3">
                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <label>Name</label>
                                <input type="text" class="form-control input-sm" id="inputEmail3" placeholder=""
                                       ng-model="SearchCondition.name">
                            </div>
                        </div>
                        <div class="row row-padbot-15">
                            <div class="col-md-12">

                                <label>Core Type</label>
                                <div>
