
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            <span ng-show="!BOMRequest.disablemode" style="color:brown;font-size:large">BOM Request&nbsp;&nbsp;({{SearchRef(BOMRequest.mfgstageid,MfgStages)}} Stage)</span>
            <span ng-show="BOMRequest.disablemode" style="color:brown;font-size:large">BOM Transfer Request</span>
            <lable style="color:brown;font-size:large" ng-show="BOMRequest.mfgworkorderid>0 && BOMRequest.mfgjoborderid==0">WORK ORDER NO : {{BOMRequest.workorderno}}</lable>
            <lable style="color:brown;font-size:large" ng-show="BOMRequest.mfgjoborderid>0">JOB ORDER NO : {{BOMRequest.joborderno}}/{{BOMRequest.workorderno}}</lable>
        </h1>
        <ol class="breadcrumb">
            <li ng-show="Navigation.create" style="cursor:pointer" ng-click="Clear()"><a><i class="fa fa-file"></i>New</a></li>

            <li ng-show="Navigation.create && !BOMRequest.disablemode" style="cursor:pointer" ng-click="ImportBOM()"><a><i class="fa fa-file"></i>Import BOM</a></li>
            <li ng-show="UserInfo.p_BOMRequest.print && BOMRequest.id>0" style="cursor:pointer" ng-click="Print(BOMRequest.id,'DC')"><a><i class="fa fa-print"></i>Print</a></li>
            <li ng-show="UserInfo.p_BOMRequest.print && BOMRequest.id>0" style="cursor:pointer" ng-click="Publish()"><a><i class="fa fa-file"></i>Publish</a></li>
            <li ng-show="Navigation.save" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
            <li ng-show="Navigation.search" style="cursor:pointer" ng-click="ShowSearch=!ShowSearch;Navigation.SetMode('SEARCH')"><a><i class="fa fa-search"></i>Search</a></li>
            <li ng-show="Navigation.edit" style="cursor:pointer" ng-click="ShowSearch=!ShowSearch;Navigation.SetMode('EDIT')"><a><i class="fa fa-backward"></i>Back</a></li>
            <li ng-show="Navigation.searchentity" style="cursor:pointer" ng-click="Search()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->
        <div class="box box-success" ng-hide="ShowSearch">
            <div class="box-body">

                <div class="col-md-12 no-padding">
                    <div class="col-md-4 no-padding">

                        <div class="col-md-12">
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="control-label no-margin">Entry Number</label>
                                <input type="text" class="form-control input-sm" style="width:100%" ng-model="BOMRequest.entryno" disabled />
                            </div>
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="form-group required control-label no-margin">Entry Date</label>
                                <div class="input-group date">
                                    <div class="input-group-addon">
                                        <i class="fa fa-calendar"></i>
                                    </div>
                                    <input type="text" class="form-control datepicker input-sm" datemodule="BOMRequest.entrydate"
                                           ng-model="BOMRequest.entrydate" focusid="first" focusonenter="company">
                                </div>
                            </div>
                        </div>

                        <div class="col-md-12">
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="form-group required control-label no-margin">Company</label>
                                <select class="form-control input-sm" select2='Company' ng-model="BOMRequest.companyid"
                                        style="width:100%" ng-options="item.id as item.name for item in Company track by item.id"
                                        focusid="company" focusonenter="dlocation"></select>
                            </div>
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="form-group required control-label no-margin">Location</label>
                                <select class="form-control input-sm" select2='Location' ng-model="BOMRequest.fromlocationid"
                                        style="width:100%" ng-options="item.id as item.name for item in LocationList track by item.id"
                                        focusid="dlocation" focusonenter="modeid"></select>
                            </div>
                        </div>

                        <div class="col-md-12">
                            <div class="col-md-6 no-padding">
                                <label for="inputEmail3" class="control-label no-margin">Mode</label>
                                <select class="form-control input-sm" select2='Mode'
                                        style="width:100%" ng-model="BOMRequest.mode"
                                        ng-options="item.id as item.name for item in Modes track by item.id"
                                        focusid="modeid"
                                        ng-disabled="BOMRequest.disablemode"
                                        ng-change="isoutward = BOMRequest.mode == 4 || BOMRequest.mode == 5"
                                        onkeyenter="SetMODEFocus()"></select>
                            </div>
                            <div class="col-md-6 no-padding" ng-hide="BOMRequest.mode == 6">
                                <label for="inputEmail3" class="form-group required control-label no-margin">Supplier</label>
                                <select class="form-control input-sm" select2='Supplier'
                                        ng-disabled="BOMRequest.mode != 4 && BOMRequest.mode != 5"
                                        style="width:100%" ng-model="BOMRequest.supplierid"
                                        ng-options="item.id as item.name for item in Suppliers track by item.id"
                                        focusid="supplier" focusonenter="preparedby"></select>
                            </div>
                            <div class="no-padding col-md-6" ng-show="BOMRequest.mode == 6">
                                <label for="inputEmail3" class="form-group required control-label no-margin">To Location</label>
                                <select class="form-control input-sm" select2='Location' ng-model="BOMRequest.tolocationid"
                                        style="width:100%" ng-options="item.id as item.name for item in LocationList track by item.id"
                                        focusid="tolocationid" focusonenter="preparedby"></select>
                            </div>
                        </div>


                        <div class="col-md-12">
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="control-label no-margin">Prepared By</label>
                                <select class="form-control" select2="" style="width:100%"
                                        ng-options="type.id  as type.name for type in Employee track by type.id"
                                        ng-model="BOMRequest.preparedby"
                                        focusid="preparedby" focusonenter="approvedby"></select>
                            </div>
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="control-label no-margin">Approved By</label>
                                <select class="form-control" select2="" style="width:100%"
                                        ng-options="type.id  as type.name for type in Employee track by type.id"
                                        ng-model="BOMRequest.approvedby"
                                        focusid="approvedby" focusonenter="bomcategoryid"></select>
                            </div>
                        </div>

                        <div class="col-md-12">

                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="form-group required control-label no-margin">Component Category</label>
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in BOMCategory track by item.id"
                                        ng-model="BOMRequest.Details.bomcategoryid"
                                        ng-change="categoryChange()"
                                        onkeyenter="SetBOMFocus()"
                                        focusid="bomcategoryid"></select>
                            </div>

                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="control-label no-margin">Component</label>
                                <select class="input-sm form-control" select2="" style="width: 100%;"
                                        ng-options="item.id  as item.title for item in BOMList track by item.id"
                                        ng-model="BOMRequest.Details.bomid" focusid="bomid"
                                        ng-change="productChange()"
                                        focusonenter="width"
                                        onkeyenter="setColourFocus()"></select>
                            </div>
                        </div>

                        <div class="col-md-12">
                            <div class="no-padding col-md-3">
                                <label for="inputEmail3" class="control-label no-margin">BOM #</label>
                                <input type="text" style="width:100%" class="input-sm form-control"
                                       focusid="autobomcode"
                                       onkeyenter="searchbominwardcode(false)"
                                       ng-model="BOMRequest.Details.bomcode" />
                            </div>
                            <div class="no-padding col-md-3">
                                <label for="inputEmail3" class="control-label no-margin">Width</label>
                                <input class="input-sm form-control" style="width:100%" type="text"
                                       ng-model="BOMRequest.Details.width" focusid="width" focusonenter="colourid" />
                            </div>
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="control-label no-margin">Colour</label>
                                <select class="input-sm form-control" select2="Select Colour" style="width:100%"
                                        ng-model="BOMRequest.Details.colourid"
                                        ng-change="colourchanged()"
                                        ng-options="item.id as item.name for item in ColorList track by item.id"
                                        focusid="colourid" focusonenter="qty"></select>
                            </div>
                        </div>

                        <div class="col-md-12">
                            <div class="no-padding col-md-6">
                                <label for="inputEmail3" class="control-label no-margin">Available </label>
                                <input class="input-sm form-control" style="width:100%" type="text"
                                       ng-model="avaialblestock" ng-disabled="true" />

                            </div>
                            <div class="col-sm-6 no-padding">
                                <div class="col-md-6 no-padding">

                                    <label for="inputEmail3" class="control-label no-margin">Qty</label>
                                    <input class="input-sm form-control" style="width:100%" type="text"
                                           ng-model="BOMRequest.Details.qty" focusid="qty" focusonenter="rate" />
                                </div>
                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="form-group required control-label no-margin">Rate</label>
                                    <div class="input-group input-group-sm">
                                        <input class="input-sm form-control" style="width:100%" type="text"
                                               ng-model="BOMRequest.Details.rate" focusid="rate" onkeyenter="AddItem()" />
                                        <span class="input-group-btn" focusid="add">
                                            <button type="button" class="btn btn-sm btn-info" ng-click="AddItem()" focusid="add">Add</button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="col-md-8 no-padding">

                        <div class="col-md-12"
                             style="padding-bottom:10px;padding-left:0px"
                             ng-show="BOMRequest.isrequest">
                            <span for="inputEmail3" style="width:50px;float:left" class="control-label">BOM #</span>
                            <input type="text"
                                   style="width:200px;float:left"
                                   class="input-sm form-control"
                                   focusid="autobomcode"
                                   onkeyenter="searchbominwardcode(true)"
                                   ng-model="BOMRequest.Details.stockbomcode" />
                        </div>
                        <div class="col-md-12 no-padding" id="editGrid">

                        </div>
                        <div class="col-md-12">
                            <div class="col-md-4 pull-right input-group input-group-sm" ng-show="UserInfo.p_BOMRequest.print && BOMRequest.id>0">
                                <select class="form-control input-sm" select2="Status" ng-model="BOMRequest.status"
                                        ng-options="item.id as item.name for item in POStatus track by item.id"></select>
                                <span class="input-group-btn">
                                    <button type="button" class="btn btn-sm btn-info" ng-click="ChangeOrderStatus()">Change</button>
                                </span>
                            </div>
                        </div>

                    </div>

                </div>

            </div>
        </div>


        <div class="box box-primary" id="searchBox" ng-show="ShowSearch">
            <div class="box-body">
                <div class="col-md-3 no-padding">


                    <div class="col-md-12 no-padding">
                        <div class="form-group">
                            <label for="inputEmail3" class="form-group control-label no-margin">Location</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in LocationList track by item.id" ng-model="SearchCondition.locationid"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="form-group">
                            <label for="inputEmail3" class="form-group control-label no-margin">Supplier</label>
                            <select class="form-control" select2='Supplier' style="width: 100%;" ng-model="SearchCondition.supplierid" ng-options="item.id as item.name for item in Suppliers track by item.id"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="form-group">
                            <label for="inputEmail3" class="form-group control-label no-margin">Entry No</label>
                            <input type="text" class="form-control input-sm" placeholder="" ng-model="SearchCondition.entryno">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="form-group">
                            <label for="inputEmail3" class="form-group control-label no-margin">Entry Date</label>

                            <div class="input-group date">
                                <div class="input-group-addon">
                                    <i class="fa fa-calendar"></i>
                                </div>
                                <input type="text" class="form-control datepicker input-sm"
                                       daterange="SearchCondition.fromdate,SearchCondition.todate">
                            </div>

                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="form-group">
                            <label for="inputEmail3" class="form-group control-label no-margin">Status</label>
                            <select class="form-control" select2='Status' style="width: 100%;" ng-model="SearchCondition.statusid" ng-options="item.id as item.name for item in POSearchStatus track by item.id"></select>
                        </div>
                    </div>

                </div>
                <div class="col-md-9" style="padding-right:4px">

<script type="text/ng-template" id="ProductSearch">
    <div class="ngdialog-message">
        <div class="table-responsive mailbox-messages">
            <div class="col-md-12" ng-show="ShowCreate">
                <label for="inputPassword3" class="col-md-4">Printing Name</label>
                <div class="input-group input-group-sm col-md-8">
                    <input type="text" class="input-sm form-control" ng-model="printingname">
                    <span class="input-group-btn">
                        <button type="button" class="btn btn-info btn-flat" ng-click="Create()">Create</button>
                    </span>
                </div>
            </div>
            <div class="col-md-12">
                <table fixed-header="150px" class="fixed_table">
                    <thead>
                        <tr>
                            <th style="width:40px">Action</th>
                            <th style="width:100px">Name</th>
                            <th style="width:150px">Detail</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in PopupList">
                            <td><button type="button" class="btn btn-xs btn-primary" ng-click="Selected(item)">Select</button></td>
                            <td>{{item.printingname}}</td>
                            <td>{{item.display}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>
