<script type="text/ng-template" id="HistoryDialog">
    <div class="ngdialog-message">
        <div class="table-responsive mailbox-messages">

            <div class="col-md-12 no-padding">
                <label>History</label>
                <table fixed-header="200px" class="fixed_table">
                    <thead>
                        <tr>
                            <th style="width:80px">Date</th>
                            <th style="width:100px">User</th>
                            <th style="width:100px">Approver</th>
                            <th style="width:150px">Reason</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="item in SampleOrder.history">
                            <td>{{item.actionon |date:'dd-MM-yyyy'}}</td>
                            <td>{{item.user}}</td>
                            <td>{{item.employee}}</td>
                            <td>{{item.reason}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="col-md-12 no-padding">
                <label>Approved By</label>
                <select class="input-sm form-control" select2="" style="width: 100%;"
                        options="item.id as item.name for item in Parent.Employee track by item.id"
                        ng-model="approvedby"></select>
            </div>
            <div class="col-md-12 no-padding">
                <label>Reason</label>
                <input type="text" ng-model="reason" style="width:100%" class="input-sm" />
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Save</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>
