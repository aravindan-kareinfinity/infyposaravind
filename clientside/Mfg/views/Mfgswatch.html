<!-- Content Wrapper. Contains page content -->

        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            <span style="font-size:20px;" ng-style="ActionMode==1 && {'color': 'orangered'}"

                                                                    ng-style="ActionMode==2 && {'color': 'orangered'}"

                  ng-click="SelectOption(3)">Folders</span>
        </h1>

        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'report.xls','Swatch Report')"><a><i class="fa fas fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-show="ActionMode==1 || ActionMode==3" ng-click="PrintPDF(igrid)"><a><i class="fa fas fa-file-pdf-o"></i>Print</a></li>
            <li style="cursor:pointer" ng-show="actionmode==9 && (samples.optionid==2 || samples.optionid==3)" ng-click="SaveSample()"><a><i class="fa fas fa-file"></i>Save</a></li>
            <li style="cursor:pointer" ng-show="actionmode==9 && samples.optionid==0" ng-click="SearchSample()"><a><i class="fa fas fa-search"></i>Search</a></li>
            <li style="cursor:pointer" ng-show="actionmode==9 && samples.optionid==1" ng-click="SearchSampleSummary()"><a><i class="fa fas fa-search"></i>Search</a></li>

            <li style="cursor:pointer" ng-show="actionmode==4" ng-click="SaveIssue()"><a><i class="fa fas fa-file"></i>Save</a></li>
            <li style="cursor:pointer" ng-show="actionmode==5" ng-click="SaveReceive()"><a><i class="fa fas fa-file"></i>Save</a></li>
            <li style="cursor:pointer" ng-show="actionmode==6" ng-click="SaveJournal()"><a><i class="fa fas fa-file"></i>Save</a></li>
        </ol>
    </section>

                                            focusonenter="searchsalesmen"></select>
                                </div>
                            </div>

                                <label for="inputEmail3" class="col-md-12 control-label">Salesmen</label>
                                <div class="col-md-12">
                                    <select class="form-control input-sm" select2='Charge Type' style="width:100%;"

                                    <label for="inputEmail3" class="col-md-12 control-label">Design</label>
                                    <div class="col-md-12">

                                    </div>
                                </div>
                            </div>

                                            ng-options="item.id as item.code for item in CurrentFolderStock track by item.id"
                                            ng-model="foldersummary.folderid" focusid="foldersummaryfolderid"

                                            focusonenter="summaryreferenceid"></select>
                                </div>
                            </div>

                                    <div class="col-md-12">
                                        <input type="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="CurrentFolder.product" ng-readonly="true">
                                    </div>
                                </div>
                                <div class="col-md-6 no-padding">
                                    <label for="inputEmail3" class="col-md-12 control-label">Brand</label>
                                    <div class="col-md-12">
                                        <input type="text" class="form-control input-sm" style="width: 100%;"

                                    </div>
                                </div>

                            </div>

                            <div class="row row-padbot-15">
                                <label for="inputEmail3" class="col-md-12 control-label">Salesmen</label>
                                <div class="col-md-12">
                                    <select class="form-control input-sm" select2='Charge Type' style="width:100%;"
                                            ng-options="item.id as item.name for item in Salesmans track by item.id"
                                            ng-model="foldersummary.salesmenid" focusid="summaryreferenceid"
                                            focusonenter="summarysearch"></select>
                                </div>
                            </div>

                            <div class="row row-padbot-15">
                                <div class="col-md-12 no-padding">
                                    <label for="inputEmail3" class="col-md-12 control-label">Transacted Date</label>
                                    <div class="col-md-12">
                                        <div class="input-group date">
                                            <div class="input-group-addon">
                                                <i class="fa fa-calendar"></i>
                                            </div>
                                            <input type="text" focusid="searchactioneddate"
                                                   focusonenter="historysearch" class="form-control datepicker input-sm"
                                                   daterange="foldersummary.fromdate,foldersummary.todate">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <button type="button" class="btn btn-xs btn-primary "
                                    focusid="summarysearch"
                                    ng-click="SearchSummary()">
                                <i class="fa fa-file"></i>&nbsp;Search
                            </button>

                        </div>


                        <div id="foldergrid" class="col-md-12 no-padding">

                        </div>

                    </form>

                <div class="col-md-9 no-padding">

                    <div id="gridContainer">

            </div>

        </div>
