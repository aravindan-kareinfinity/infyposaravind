  <!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Tailoring - Inbox
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="CreateJobStage(false)"><a><i class="fa fas fa-angle-double-up"></i>Create Job Order</a></li>
            <li style="cursor:pointer" ng-click="CreateJobStage(true)"><a><i class="fa fas fa-angle-double-down"></i>Inward Job Order</a></li>
            <li style="cursor:pointer" ng-click="WorkOrderGRN()"><a><i class="fa fas fa-angle-double-down"></i>GRN</a></li>
            <li style="cursor:pointer" ng-click="StatusChange('Cancel')"><a><i class="fa fa-times-circle"></i>Cancel</a></li>
            <li style="cursor:pointer" ng-click="StatusChange('Working')"><a><i class="fa fas fa-spinner"></i>Working</a></li>
            <li style="cursor:pointer" ng-click="StatusChange('Completed')"><a><i class="fa fas fa-hourglass-end"></i>Completed</a></li>
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'whdashboard', 'dashboard')"><a><i class="fa fa-download"></i></a></li>
        </ol>

    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box box-primary">
            <div class="box-body">
                <div class="row row-padbot-15">
                    <div class="col-md-6 col-sm-6">
                        <div class="col-md-4">
                            <label for="inputEmail3" class="control-label no-padding">Employee</label>
                            <div class="row">
                                <select class="form-control input-sm" select2="Type"
                                        ng-options="item.id as item.name for item in Employee track by item.id"
                                        ng-model="mfgtailoring.employeeid"></select>
                            </div>
                        </div>

                        <div class="col-md-3">
                            <label for="inputEmail3" class="control-label no-padding">Barcode</label>
                            <div class="row">
                                <input type="text" class="form-control input-sm"
                                       style="width:100%"
                                       ng-model="mfgtailoring.barcode" />

                            </div>
                        </div>

                        <div class="col-md-3">
                            <label for="inputEmail3" class="control-label no-padding">Size Group</label>
                            <div class="row">
                                <select class="form-control input-sm" select2="Type"
                                        ng-options="item.id as item.name for item in SizeGroups track by item.id"
                                        ng-model="mfgtailoring.sizegroupid"></select>
                            </div>
                        </div>

                        <div class="col-md-2">
                            <label for="inputEmail3" class="control-label no-padding">Issued</label>
                            <div class="row">
                                <input type="text" class="form-control input-sm"
                                       style="width:100%"
                                       ng-model="mfgtailoring.iqty" />

                            </div>
                        </div>
                    </div>

                    <div class="col-md-5 col-sm-5">
                        <table>
                            <thead>
                                <tr>
                                    <th ng-repeat="item in mfgtailoring.sizelist">{{item.name}}</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td ng-repeat="item in mfgtailoring.sizelist">
                                        <input type="text" ng-model="item.qty" style="width:100%" />
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-primary btn-sm btn-box pull-right" ng-click="Issue()">Issue</button>
                    </div>
                </div>
                <div class="row row-padbot-15">
                    <div class="col-md-12" id="gridContainer">



                    </div>
                </div>


            </div>
            <!-- /.box-body -->
        </div>
        <!-- /. box -->
    </section>
    <!-- /.content -->
</div>


<script type="text/ng-template" id="ChooseStage">
    <div class="ngdialog-message">
        <div class="md-col-12">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Stage</label>
                <div class="input-group input-group-sm col-sm-6 no-padding">
                    <select class="form-control" select2='Stage'
                            style="width:100%;"
                            ng-model="stageid"
                            ng-options="item.index as item.name for item in StageList track by item.id"></select>
                </div>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" ng-hide="inward" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Create</button>
        <button type="button" ng-show="inward" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">Inward</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
    </div>
</script>
