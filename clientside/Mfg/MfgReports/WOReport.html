   <!-- Content Wrapper. Contains page content -->

                                <div class="col-md-12">
                                    <select class="form-control input-sm" select2="" style="width: 100%;" ng-model="SearchCondition.Mode"

                            </div>
                        </div>

                                            ng-options="item.id as item.name for item in Company track by item.id"></select>
                                </div>
                            </div>
                        </div>


                        <div class="col-md-12  no-padding">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-12">Location</label>

                            </div>
                        </div>

                        <div class="col-md-12  no-padding">

                                <label for="inputEmail3" class="col-md-12">Supplier</label>

                            </div>
                        </div>

                                    <select class="form-control input-sm" select2="" style="width: 100%;" ng-model="SearchCondition.productgroupid"
