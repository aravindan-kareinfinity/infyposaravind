<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Sales Order - Sales Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'outward','inwardreport')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchSKUSales()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3">
                    <div class="row">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' width="100%" ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid"></select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <label>LOCATION</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id" ng-model="SearchCondition.locationid"></select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <label>BRAND</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Brand track by item.id" ng-model="SearchCondition.brandid"></select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <label>CUSTOMER</label>
                            <div class="input-group-sm">

                                <select class="input-sm form-control " select2="Select Customers"
                                        ng-model="SearchCondition.customerid"
                                        ng-options="item.id as item.name for item in Customers track by item.id" style="width:100%"></select>

                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <label>BILL DATE</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <div class="col-md-6 no-padding">
                                <label>SHOW BILLWISE  <input type="checkbox" ng-model="SearchCondition.showdetail" /></label>

                            </div>

                        </div>
                        <div class="col-md-12" ng-show="SearchCondition.showdetail">
                            <div class="col-md-6 no-padding">
                                SO No
                            </div>
                            <div class="col-md-6 no-padding">
                                <input type="text" class="form-control input-sm" ng-model="SearchCondition.sono" style="width:100%" />
                            </div>
                        </div>
                        <div class="col-md-12" ng-show="SearchCondition.showdetail">
                            <div class="col-md-6 no-padding">
                                Size
                            </div>
                            <div class="col-md-6 no-padding">
                                <input type="text" class="form-control input-sm" ng-model="SearchCondition.size" style="width:100%" />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-9 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>
                </div>
            </div>

        </div>

    </section>

</div>
