        <!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1 ng-hide="IsDialog">
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            SKU Details Report
        </h1>

        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="SearchSKUDetail()"><a><i class="fa fa-print"></i>Search</a></li>
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'SKUDetail','SKUDetail')"><a><i class="fa fa-download"></i>Download</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content-->
        <div class="box box-primary">
            <div class="box-body">
                <div class="col-md-3 no-padding">
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-12 control-label">Code</label>
                                <div class="col-md-12">
                                    <input method="text" class="form-control input-sm" style="width: 100%;"
                                           ng-model="SearchCondition.code">
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-12 form-group required control-label">Name</label>
                                <div class="col-md-12">
                                    <input method="text" class="form-control input-sm" style="width: 100%;"
                                           ng-model="SearchCondition.name">
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-12 form-group required control-label">Supplier</label>
                                <div class="col-md-12">
                                    <select class="form-control" select2="" style="width: 100%;"
                                            ng-options="item.id as item.name for item in Supplier track by item.id"
                                            ng-model="SearchCondition.supplierid"></select>
                                </div>

                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-12 form-group required control-label">Product</label>
                                <div class="col-md-12">
                                    <select class="form-control" select2="" style="width: 100%;"
                                            ng-options="item.id as item.name for item in Products track by item.id"
                                            ng-model="SearchCondition.productid"></select>
                                </div>

                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-12 control-label">Year/Month</label>
                                <div class="col-md-6" style="padding-right:0px">
                                    <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="SearchCondition.mfgyear">
                                </div>
                                <div class="col-md-6" style="padding-left:0px">
                                    <input method="text" class="form-control input-sm" style="width: 100%;" ng-model="SearchCondition.mfgmonth">
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                </div>


                <div class="col-md-9 no-padding">

                    <div class="col-md-12 no-padding" id="gridContainer">

                    </div>

                </div>
            </div>
            <!-- /.content -->
        </div>
    </section>
</div>
