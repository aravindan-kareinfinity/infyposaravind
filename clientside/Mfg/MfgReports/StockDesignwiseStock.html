<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Designwise Stock Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(sgrid,'StockReport','StockReport')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="SearchDesignwiseStock()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-2">
                    <div class="row">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' width="100%" ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid"></select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <label> LOCATION</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id" ng-model="SearchCondition.locationid"></select>
                            </div>
                        </div>
                    </div>


                    <div class="row">
                        <div class="col-md-12">
                            <label> PRODUCT</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Product track by item.id" ng-model="SearchCondition.productid"></select>
                            </div>
                        </div>
                    </div>

                    <div class="row" ng-show="system_sizegrouplayout">
                        <div class="col-md-12">
                            <label> SIZE GROUP</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in SizeGroupList track by item.id" ng-model="SearchCondition.sizegroupid"></select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <label> DESIGN</label>
                            <div class="input-group-sm">
                                <input type="text" class="input-sm form-control" ng-model="SearchCondition.designid" />
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label> Show Detail </label>
                            <div class="pull-right">
                                <input type="checkbox" ng-model="SearchCondition.ShowDetail" />
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label> Show Price </label>
                            <div class="pull-right">
                                <input type="checkbox" ng-model="SearchCondition.ShowPrice" />
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label> Show Sales Order </label>
                            <div class="pull-right">
                                <input type="checkbox" ng-model="SearchCondition.ShowSO" />
                            </div>
                        </div>
                    </div>
                    <div class="row" ng-show="SearchCondition.ShowSO">
                        <div class="col-md-12">
                            <label> SO Approved Only</label>
                            <div class="pull-right">
                                <input type="checkbox" ng-model="SearchCondition.ShowSOApproved" />
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label> Show Purchase </label>
                            <div class="pull-right">
                                <input type="checkbox" ng-model="SearchCondition.ShowPurchase" />
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label> Show Sales </label>
                            <div class="pull-right">
                                <input type="checkbox" ng-model="SearchCondition.ShowSales" />
                            </div>
                        </div>
                    </div>
                    <div class="row" ng-show="SearchCondition.ShowSales || SearchCondition.ShowPurchase">
                        <div class="col-md-12">
                            <label> Date Range </label>
                            <div class="col-md-12 no-padding">
                                <input type="text" class="form-control input-sm" style="width:100%" 
                                       daterange="SearchCondition.fromdate,SearchCondition.todate">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label> Show Production </label>
                            <div class="pull-right">
                                <input type="checkbox" ng-model="SearchCondition.ShowWIP" />
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label> Show Fabric </label>
                            <div class="pull-right">
                                <input type="checkbox" ng-model="SearchCondition.ShowFabric" />
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label> Show ROL </label>
                            <div class="pull-right">
                                <input type="checkbox" ng-model="SearchCondition.ShowROL" />
                            </div>

                            <div class="col-md-12 no-padding" ng-show="SearchCondition.ShowROL">
                                <select class="form-control" select2='ROL' width="100%"
                                        ng-options="item.id as item.name for item in ROLStockMode track by item.id" ng-model="SearchCondition.rolmode"></select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label> Show Non-Billed Packing </label>
                            <div class="pull-right">
                                <input type="checkbox" ng-model="SearchCondition.ShowPacking" />
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label> Show Available </label>
                            <div class="pull-right">
                                <input type="checkbox" ng-model="SearchCondition.ShowRemaining" />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-10 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>
                </div>
            </div>

        </div>

    </section>

</div>
