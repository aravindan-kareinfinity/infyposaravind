<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            BOM Inward Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'outward','inwardreport')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchInward()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3">
                    <div class="row">
                        <div class="col-md-12">
                            <label>FROM COMPANY</label>
                            <select class="form-control" select2='Company' width="100%" ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid"></select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>TO COMPANY</label>
                            <select class="form-control" select2='Company' width="100%" ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.tocompanyid"></select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>PACKAGE DATE</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>FROM LOCATION</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id" ng-model="SearchCondition.fromlocationid"></select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>TO LOCATION</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id" ng-model="SearchCondition.locationid"></select>
                            </div>
                        </div>
                    </div>

                    <br />

                    <div class="row row-padbot-15">
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-6 control-label"><u><b>SUMMARY</b></u></label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="row-padbot-15">
                            <div class="row col-md-12">
                                <label for="inputEmail3" class="col-md-6 control-label"><b>TOTAL BUNDLES</b></label>
                                <label for="inputEmail3" class="col-md-6 control-label pull-right" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{totalcount|number:2}}</b></label>
                            </div>
                            <div class="row col-md-12">
                                <label for="inputEmail3" class="col-md-6 control-label"><b>TOTAL QTY</b></label>
                                <label for="inputEmail3" class="col-md-6 control-label pull-right" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{totalqty|number:2}}</b></label>
                            </div>
                        </div>
                    </div>


                </div>

                <div class="col-md-9 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>
                </div>
            </div>

        </div>

    </section>

</div>
