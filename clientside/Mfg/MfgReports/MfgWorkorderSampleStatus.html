<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Workorder Sample Status Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'outward','inwardreport')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="SearchWorkorderSampleStatus()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-2">

                    <div class="row">

                        <label>DATE</label>
                        <div class="input-group-sm">
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate">
                        </div>

                    </div>

                    <div class="row">

                        <label>DIVISION</label>
                        <div class="input-group-sm">
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in ProductDivision track by item.id" ng-model="SearchCondition.Divisionid"></select>
                        </div>

                    </div>

                    <div class="row">

                        <label>CUSTOMER</label>
                        <div class="input-group-sm">
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Customers track by item.id" ng-model="SearchCondition.Customerid"></select>
                        </div>

                    </div>
                </div>
                <div class="col-md-10 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<script type="text/ng-template" id="ChooseTemplate">
    <div class="ngdialog-message">
        <div class="md-col-12">
            <div class="row row-padbot-15">
                <div class="form-group">
                    <label for="inputEmail3" class="col-md-3 control-label">Template</label>
                    <div class="input-group input-group-sm col-sm-6 no-padding">
                        <select class="form-control" select2='Select Template' style="width:100%;"
                                ng-model="templateid"
                                options="item.id as item.name for item in ReportList track by item.id"></select>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <div class="col-md-5">
        </div>
        <div class="col-md-7">
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Selected()">OK</button>
            <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
        </div>
    </div>
</script>
