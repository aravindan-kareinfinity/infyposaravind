        <!-- Content Wrapper. Contains page content -->
<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            BOM Stock Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'outward','inwardreport')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="PrintStockSummary()"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-show="SearchCondition.mode==0" ng-click="DeleteBOMTransaction()"><a><i class="fa fa-trash"></i>Delete</a></li>
            <li style="cursor:pointer" ng-click="SearchStock()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3">

                    <div class="row">
                        <div class="col-md-12">
                            <label>Company</label>
                            <select class="form-control" select2='Company' width="100%" ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid"></select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>Location</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id" ng-model="SearchCondition.locationid"></select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>Category</label>
                            <select class="form-control" select2='Company' width="100%" ng-options="item.id as item.name for item in BOMCategories track by item.id"
                                    ng-change="CategoryChanged()"
                                    ng-model="SearchCondition.categoryid"></select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <label>Component</label>
                            <select class="form-control" ng-change="ComponentChanged()" select2='Company' width="100%"
                                    ng-options="item.id as item.title for item in BOMList track by item.id" ng-model="SearchCondition.bomid"></select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-8" style="padding-right:0px">
                            <label>Colour</label>
                            <select class="form-control" select2='Colour' width="100%"
                                    ng-options="item.id as item.name for item in ColorList track by item.id" ng-model="SearchCondition.colourid"></select>
                        </div>
                        <div class="col-md-4" style="padding-left:0px">
                            <label>Width</label>
                            <input type="text" class="form-control input-sm"
                                   ng-model="SearchCondition.width"
                                   style="width:100%">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <div class="col-md-8 no-padding">
                                <label>Transaction Date</label>
                                <div class="input-group-sm">
                                    <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate">
                                </div>
                            </div>
                            <div class="col-md-4 no-padding">
                                <label>Type</label>
                                <select class="form-control" select2='Type' width="100%"
                                        ng-options="item.id as item.name for item in ReportMode track by item.id"
                                        ng-model="SearchCondition.mode"></select>
                            </div>
                        </div>
                    </div>

                    <div class="row  row-padbot-15" ng-show="SearchCondition.mode==1">
                        <div class="col-md-12">
                            <label>Transaction Type</label>
                            <select class="form-control" select2='Company' width="100%"
                                    ng-options="item.id as item.name for item in TransactionTypes track by item.id" ng-model="SearchCondition.reftype"></select>
                        </div>
                    </div>

                    <div class="row" style="padding-top:10px" ng-hide="SearchCondition.mode==1">
                        <div class="col-md-12">
                            <div class="col-md-8 no-padding">
                                <label>Reorder Information</label>
                                <input type="checkbox" ng-model="SearchCondition.reorderlevel" />
                            </div>
                            <div class="col-md-4 no-padding" ng-show="SearchCondition.reorderlevel">
                                <select class="form-control" select2='ROL' width="100%"
                                        ng-options="item.id as item.name for item in ROLStockMode track by item.id" ng-model="SearchCondition.rolmode"></select>

                            </div>
                        </div>
                    </div>

                    <div class="row" style="padding-top:10px" ng-hide="SearchCondition.mode==1">
                        <div class="col-md-12">
                            <div class="col-md-8 no-padding">
                                <label>Current Stock Value</label>
                                <input type="checkbox" ng-model="SearchCondition.stockvalue" />
                            </div>
                            
                        </div>
                    </div>

                </div>

                <div class="col-md-9 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>
                </div>
            </div>

        </div>

    </section>

</div>
