   <!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Work Order Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="SearchWOGrn()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
            <li style="cursor:pointer" ng-click="exporttoExcel(sgrid,'WorkorderGRN','WorkorderGRN')"><a><i class="fa fa-download"></i>Download</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->

        <div class="box box-primary">
            <div class="box-body">
                <div class="col-md-2 no-padding" style="padding-right:0px">
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-12">Work Order No</label>
                                <div class="col-md-12">
                                    <input type="text" class="form-control input-sm"
                                           onkeyenter="Search()" ng-model="SearchCondition.workorderno" focusid="first" />
                                </div>


                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="form-group">
                        <label for="inputEmail3" class="col-md-12">Order Issued</label>

                        <div class="col-md-12">
                            <select class="form-control input-sm" select2="" style="width: 100%;" ng-model="SearchCondition.Mode"
                                    ng-options="item.id as item.name for item in DeliveryModes track by item.id"></select>
                        </div>

                    </div>


                    <div class="col-md-12 no-padding">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-12">Company</label>
                            <div class="col-md-12">
                                <select class="form-control input-sm" select2="" style="width: 100%;" ng-model="SearchCondition.companyid"
                                        ng-options="item.id as item.name for item in Company track by item.id"></select>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12  no-padding">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-12">Location</label>
                            <div class="col-md-12">
                                <select class="form-control input-sm" select2="" style="width: 100%;" ng-model="SearchCondition.locationid"
                                        ng-options="item.id as item.name for item in AllLocation track by item.id"></select>
                            </div>
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-12">Receiving Location</label>
                                <div class="col-md-12">
                                    <select class="form-control input-sm" select2="" style="width: 100%;"
                                            ng-model="SearchCondition.receivinglocationid"
                                            ng-options="item.id as item.name for item in AllLocation track by item.id"></select>
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-12">Supplier</label>
                                <div class="col-md-12">
                                    <select class="form-control input-sm" select2="" style="width: 100%;"
                                            ng-model="SearchCondition.suppliercompany"
                                            ng-options="item.id as item.name for item in SupplierCompany track by item.id"></select>
                                </div>


                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-12">GRN Date</label>
                                <div class="col-md-12">
                                    <div class="input-group date">
                                        <div class="input-group-addon">
                                            <i class="fa fa-calendar"></i>
                                        </div>
                                        <input type="text" daterange="SearchCondition.fromdate,SearchCondition.todate" class="input-sm form-control pull-right">
                                    </div>
                                </div>


                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <div class="form-group">

                                <label for="inputEmail3" class="col-md-12">Entry Date</label>
                                <div class="col-md-12">
                                    <div class="input-group date">
                                        <div class="input-group-addon">
                                            <i class="fa fa-calendar"></i>
                                        </div>
                                        <input type="text" daterange="SearchCondition.entryfromdate,SearchCondition.entrytodate" class="input-sm form-control pull-right">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- /.col -->
                    </div>
                </div>


                <div class="col-md-10 no-padding">
                    <div class="col-md-12" id="searchgridContainer">

                    </div>
                </div>
                <!-- /.row -->
            </div>

        </div>

    </section>
</div>
