<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Packing Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'outward','inwardreport')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchPackingSlip()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
            <li style="cursor:pointer" ng-show="ShowPackingSummary && PackingSlipList != null" ng-click="ShowPackingSlipSOSummary()"><a><i class="fa fas fa-search-plus"></i>SO Summary</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-2">

                    <div class="row">
                        <div class="col-md-12">
                            <label>REPORT</label>
                            <select class="form-control" select2='Company' width="100%" ng-options="item.id as item.name for item in ReportMode track by item.id" ng-model="SearchCondition.modeid"></select>
                        </div>
                    </div>


                    <div class="row">
                        <div class="col-md-12">
                            <label>BILLING</label>
                            <select class="form-control" select2='Company' width="100%" ng-options="item.id as item.name for item in PackslipSearchModes track by item.id" ng-model="SearchCondition.searchmode"></select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' width="100%" ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid"></select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <label> LOCATION</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id" ng-model="SearchCondition.locationid"></select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <label>DATE</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate">
                            </div>
                        </div>
                    </div>

                    <div class="row" ng-show="SearchCondition.modeid == 1">
                        <div class="col-md-12">
                            <label> PRODUCT</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Product track by item.id" ng-model="SearchCondition.productid"></select>
                            </div>
                        </div>
                    </div>

                    <div class="row" ng-show="SearchCondition.modeid == 1">
                        <div class="col-md-12">
                            <label> DESIGN</label>
                            <div class="input-group-sm">
                                <input type="text" class="input-sm form-control" ng-model="SearchCondition.designid" />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-10 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>
                </div>
            </div>

        </div>

    </section>

</div>
