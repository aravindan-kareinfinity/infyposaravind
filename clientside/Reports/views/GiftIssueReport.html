<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
           Gift Issue Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'Gift Issue Report', 'giftissuereport')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="SearchGiftIssue()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box primary">
            <div class="box-body">

                <div class="col-md-3">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>REPORT</label>
                            <select class="form-control select2" style="width: 100%;" select2=""
                                    options="item.id as item.name for item in GiftReports track by item.id"
                                    ng-model="SearchCondition.mode"></select>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>VOUCHER DATES</label>
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="voucherdates" focusonenter="billdate">
                        </div>
                    </div>

                    <div class="col-md-12 no-padding" ng-show="SearchCondition.mode == '0' || SearchCondition.mode == '1' || SearchCondition.mode == '2'">
                        <div class="col-md-12">
                            <label>VOUCHER CODE</label>
                            <input type="text" class="input-sm form-control" ng-model="SearchCondition.voucherno" focusid="vouchercode" focusonenter="showdetails">
                        </div>
                    </div>

                    <div class="col-md-12 no-padding" ng-show="SearchCondition.mode == '0'">
                        <div class="col-md-12">
                            <label>BILL NO</label>
                            <input type="text" class="input-sm form-control" ng-model="SearchCondition.billno" focusid="vouchercode" focusonenter="showdetails">
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>LOCATION</label>
                            <select class="form-control select2" style="width: 100%;" select2=""
                                    options="item.id as item.name for item in Location track by item.id"
                                    ng-model="SearchCondition.locationid" focusid="coupon"></select>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>COUNTER</label>
                            <select class="form-control select2" style="width: 100%;" select2=""
                                    options="item.id as item.name for item in Counter track by item.id"
                                    ng-model="SearchCondition.counterid" focusid="coupon"></select>
                        </div>
                    </div>



                </div>

                <div class="col-md-9 no-padding">

                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>

                </div>

            </div>

        </div>

    </section>

</div>
