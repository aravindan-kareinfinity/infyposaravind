<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
          Sales /  Pending Orders - Item wise
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'pending po')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchPendingPO()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3">
                    <div class="row">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' ng-options="item.id as item.name for item in Company track by item.id"
                                    ng-model="SearchCondition.companyid" style="width:100%" focusid="first" focusonenter="supplier"  ></select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>SUPPLIER</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Suppliers track by item.id" ng-model="SearchCondition.supplierid" focusid="supplier" focusonenter="orderdate" ></select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>ORDER DATE</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="orderdate" focusonenter="product" >
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>PRODUCT</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in ProductList track by item.id" ng-model="SearchCondition.productid" focusid="product" focusonenter="brand"  ></select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>BRAND</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in BrandName track by item.id" ng-model="SearchCondition.brandid" focusid="brand" focusonenter="design" ></select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>DESIGN</label>
                            <div class="input-group-sm">
                                <input type="text" class="input-sm form-control" ng-model="SearchCondition.designid" focusid="design" focusonenter="showall" >
                            </div>
                        </div>
                    </div>
                    <div>&nbsp;</div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-11">
                            <label>SHOW ALL ORDER ITEMS</label>
                            <div class="col-md-1 pull-right input-group-sm">
                                <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showdetail" focusid="showall" />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-9 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>
                </div>

            </div>

        </div>

    </section>

</div>
