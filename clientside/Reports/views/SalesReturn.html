<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Sales Return Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'LR')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchSalesReturn()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>

        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">

                <div class="col-md-3">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">

                            <label>FROM DATE</label>
                            <div class="input-group date">
                                <div class="input-group-addon">
                                    <i class="fa fa-calendar"></i>
                                </div>
                                <input type="text" class="input-sm form-control datepicker" datemodule="SearchCondition.fromdate" ng-model="SearchCondition.fromdate">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">

                            <label>TO DATE</label>
                            <div class="input-group date">
                                <div class="input-group-addon">
                                    <i class="fa fa-calendar"></i>
                                </div>
                                <input type="text" class="input-sm form-control datepicker" datemodule="SearchCondition.todate" ng-model="SearchCondition.todate">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">

                            <label>LOCATION</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id"
                                    ng-model="SearchCondition.locationid"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">

                            <label>SHOW ITEM DETAILS</label>
                            <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showdetail" />
                        </div>
                    </div>
                    <div class="col-md-12 no-padding" ng-show="SearchCondition.showdetail">
                        <div class="col-md-12">

                            <label>BILL NO</label>
                            <input type="text" class="form-control input-sm" id="inputPassword3" ng-model="SearchCondition.billno">
                        </div>
                    </div>

                    <br />
                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <div class="col-md-4" style="padding-top:15px;"></div>
                            <div class="col-md-2" style="padding-top:15px;">
                            </div>
                            <div class="col-md-5" style="padding-top:15px;">
                            </div>
                           
                        </div>
                    </div>
                    <div class="row">
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-4 control-label"><b>BILLS </b></label>
                            <label for="inputEmail3" class="col-md-8 control-label" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{billcount| number:0}}</b></label>
                        </div>
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-4 control-label"><b>AMOUNT</b></label>
                            <label for="inputEmail3" class="col-md-8 control-label" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{returnamount| number:2}}</b></label>
                        </div>
                    </div>
                </div>

                <div class="col-md-9 no-padding">
                   
                    
                    
                                        <div class="col-md-12 no-padding" id="gridContainer">
                                        </div>
                                  
                    
                </div>

            </div>

        </div>
    </section>

</div>
