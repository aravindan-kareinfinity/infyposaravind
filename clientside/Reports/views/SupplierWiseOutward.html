<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            Outward Reports
        </h1>
        <ol class="breadcrumb">
            <li><a href="#"><i class="fa fa-dashboard"></i> Reports</a></li>
            <li class="active">Reports</li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3 no-padding">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>FROM DATE</label>
                            <div class="input-group-sm">
                                <div class="input-group date">
                                    <div class="input-group-addon">
                                        <i class="fa fa-calendar"></i>
                                    </div>
                                    <input type="text" class="input-sm form-control datepicker" datemodule="SearchCondition.fromdate" ng-model="SearchCondition.fromdate">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>TO DATE</label>
                            <div class="input-group-sm">
                                <div class="input-group date">
                                    <div class="input-group-addon">
                                        <i class="fa fa-calendar"></i>
                                    </div>
                                    <input type="text" class="input-sm form-control datepicker" datemodule="SearchCondition.todate" ng-model="SearchCondition.todate">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>SUPPLIER</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Supplier track by item.id" ng-model="SearchCondition.supplierid"></select>
                            </div>
                        </div>
                    </div>
                    <br />
                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <div class="col-md-11" style="padding-top:15px;">
                                <button type="button" class="btn btn-sm btn-success pull-right" ng-click="SearchOutward()">Search</button>
                            </div>

                        </div>
                    </div>
                </div>

                <div class="col-md-9 no-padding">
                    <div class="col-md-12">
                        <div class="col-md-10">

                        </div>
                        <div class="col-md-2">
                            <div class="box-body">
                                <div class="col-md-6">
                                    <button type="button" class="btn btn-info btn-sm pull-right" ng-click="printDiv('printdiv', 'Report')" data-widget="print" data-toggle="tooltip" title="Print"><i class="glyphicon glyphicon-print" aria-hidden="true"></i></button>
                                </div>
                                <div class="col-md-6">
                                    <button type="button" class="btn-primary btn btn-sm pull-left" ng-click="exporttoExcel(igrid,'Stock')" data-toggle="tooltip" title="Download"><i class="fa fa-download"></i></button>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <div class="box no-border">
                                <div class="box-body ">
                                    <div class="row">
                                        <div class="col-md-12" id="report">
                                            <div class="col-md-12" id="gridContainer">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </section>
