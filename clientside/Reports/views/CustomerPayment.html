<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
           Sales / Credit Customer Outstanding Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'credit customer list', 'customerpaymentreport')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-show="candeletependinginvoice" ng-click="DeleteCustomerPayment()">
                <a>
                    <i class="fa fa-trash"></i>
                    Delete
                </a>
            </li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchCustomerPayment()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box primary">
            <div class="box-body">

                <div class="col-md-3">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Company track by item.id" focusid="company" focusonenter="date"
                                    ng-model="SearchCondition.companyid"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">

                            <label>FROM DATE</label>
                            <div class="input-group date">
                                <div class="input-group-addon">
                                    <i class="fa fa-calendar"></i>
                                </div>
                                <input type="text" class="input-sm form-control datepicker" datemodule="SearchCondition.fromdate" ng-model="SearchCondition.fromdate" focusid="date" focusonenter="toadte">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">

                            <label>TO DATE</label>
                            <div class="input-group date">
                                <div class="input-group-addon">
                                    <i class="fa fa-calendar"></i>
                                </div>
                                <input type="text" class="input-sm form-control datepicker" datemodule="SearchCondition.todate" ng-model="SearchCondition.todate" focusid="toadte" focusonenter="mobileno">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>LOCATION</label>
                            <select class="form-control select2" style="width: 100%;" select2=""
                                    options="item.id as item.name for item in Location track by item.id"
                                    ng-model="SearchCondition.locationid" focusid="coupon"></select>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">

                            <label>MOBILE NO</label>
                            <input type="text" class="input-sm form-control" ng-model="SearchCondition.packageno" focusid="mobileno" focusonenter="showdetails">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-11">
                            <label>SHOW DETAILS</label>
                            <div class="col-md-1 pull-right input-group-sm">
                                <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showdetail" focusid="showdetails" focusonenter="showpending" />
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-11">
                            <label>SHOW PENDING</label>
                            <div class="col-md-1 pull-right input-group-sm">
                                <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showsalesummary" focusid="showpending" />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-9 no-padding">

                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>

                </div>

            </div>

        </div>

    </section>

</div>
