                                    </div>
                                </div>
                            </div>
                            <div class="col-md-5">

                                    <div class="form-group">
                                        <label for="inputEmail3" class="col-md-4 control-label">LRENTRY NO</label>
                                        <div class="col-md-8">
                                            <input type="text" class="form-control input-sm" id="inputPassword3" placeholder="LR Entry No" ng-model="SearchCondition.lrentryno">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-2">

                        </div>
                        <div class="col-md-6">
                            <button type="button" class="btn-primary btn btn-sm pull-left" ng-click="exporttoExcel(igrid,'Stock')" data-toggle="tooltip" title="Download"><i class="fa fa-download"></i></button>
                        </div>
                    </div>
                </div>

                <div class="col-md-12">
                    <div class="box no-border">

                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                                </div>
                                <div class="col-md-6">
                                    <div class="row col-md-12">

                                </div>
