<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
           Sales / Stock Audit Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'stock audit', 'stockaudit')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchStockAudit()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>AUDIT DATE BETWEEN</label>
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="date" focusonenter="company">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Company track by item.id"
                                    ng-model="SearchCondition.companyid" focusid="company"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding" ng-hide="reporttype=='WHSTOCKAUDITREP'">
                        <div class="col-md-12">
                            <label>LOCATION</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id"
                                    ng-model="SearchCondition.locationid" focusid="location" focusonenter="product"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>PRODUCT</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Product track by item.id" focusid="product" focusonenter="material"
                                    ng-model="SearchCondition.productid"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>MATERIAL</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Material track by item.id" ng-model="SearchCondition.materialid" focusid="material" focusonenter="brand"></select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>BRAND</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Brand track by item.id" ng-model="SearchCondition.brandid" focusid="brand" focusonenter="size" ></select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>SIZE</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Sizes track by item.id" startswith="true" ng-model="SearchCondition.sizeid" focusid="size" focusonenter="pattern" ></select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>PATTERN</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Pattern track by item.id" ng-model="SearchCondition.patternid" focusid="pattern" focusonenter="style" ></select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>STYLE</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Style track by item.id" ng-model="SearchCondition.styleid" focusid="style" focusonenter="showchangeson"></select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>SHOW CHANGES ON</label>
                            <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showdetail" focusid="showchangeson" focusonenter="barcode" />
                        </div>
                    </div>
                    <br />

                    <div class="col-md-12 no-padding" ng-show="SearchCondition.showdetail">
                        <div class="col-md-12">
                            <label>BARCODE</label>
                            <input type="text" class="form-control input-sm" id="inputPassword3" placeholder="Barcode" ng-model="SearchCondition.barcode" focusid="barcode" >
                        </div>
                    </div>
                    <br />
                </div>

                <div class="col-md-9 no-padding">

                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>


                </div>

            </div>

        </div>
    </section>

</div>
