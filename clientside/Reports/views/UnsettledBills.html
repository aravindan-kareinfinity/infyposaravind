<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Sales / Unsettled Bills Report
        </h1>
        <ol class="breadcrumb">

            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'unsettled bills', 'unsettledbill')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-show="!SearchCondition.showsalesummary" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SeachUnSettled()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
            <li style="cursor:pointer" ng-show="SearchCondition.unsettled && SalesResult.length>0 && !SearchCondition.showsalesummary" ng-click="printunsettled()"><a><i class="fa fa-print"></i>Print Unsettled</a></li>
            <li style="cursor:pointer" ng-show="SearchCondition.unsettled && SalesResult.length>0 && UserInfo.p_SALES.modify && !SearchCondition.showsalesummary" ng-click="CancelBills()"><a><i class="fa fa-print"></i>Cancel</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">

                <div class="col-md-3">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid" focusid="company" focusonenter="dates"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>DATES</label>
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="dates" focusonenter="locations">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>LOCATION</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id"
                                    ng-model="SearchCondition.locationid" ng-change="SalesResult=[]" focusid="locations"></select>
                        </div>
                    </div>
                    &nbsp;
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>SHOW DELIVERY CODE WISE</label>
                            <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showsalesummary" focusid="showsummary" />
                        </div>
                    </div>
                    &nbsp;
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>CASH BILL</label>
                            <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showmarker" focusid="showmarker" />
                        </div>
                    </div>
                    <div class="col-md-12 no-padding" ng-show="SearchCondition.showsalesummary && SalesResult.length>0">
                        <div class="col-md-12">
                            <div>

                            </div>
                            <input type="text" onkeyenter="Unsettledpackagevalidation(SearchCondition.barcode)"
                                   placeholder="Scan Bill Master code here"
                                   ng-model="SearchCondition.barcode" class="input-sm form-control" style="width:100%" />
                        </div>
                    </div>

                    <!--<div class="col-md-12 no-padding" ng-hide="true">
                        <label>UnSettled</label>
                        <div class="col-md-12">
                            <input type="checkbox" ng-model="SearchCondition.unsettled=true" />
                        </div>
                    </div>
                    <div class="col-md-12 no-padding" ng-hide="true">
                        <label>Summary</label>
                        <div class="col-md-12">
                            <input type="checkbox" ng-model="SearchCondition.summary=false" />
                        </div>
                    </div>-->

                    <br />
                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <div class="col-md-4" style="padding-top:15px;">
                                <!--<button type="button" class="btn btn-sm btn-danger" ng-show="SearchCondition.unsettled && SalesResult.length>0" ng-click="CancelBills()">Cancel Bills</button>
                                <button type="button" class="btn btn-sm btn-danger" ng-show="SearchCondition.unsettled && SearchResult.length>0" ng-click="printunsettled()"><i class="glyphicon glyphicon-print" aria-hidden="true"></i></button>-->
                            </div>
                            <div class="col-md-4" style="padding-top:15px;">
                            </div>
                            <div class="col-md-4" style="padding-top:15px;">
                            </div>

                        </div>
                    </div>

                </div>

                <div class="col-md-9 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>



                </div>

            </div>

        </div>
    </section>

</div>
