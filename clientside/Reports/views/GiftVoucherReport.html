<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
           Sales / Gift Voucher & Credit Note Consumption Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exportGridtoExcel(igrid,'voucherreport', 'voucherreport')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="SearchVoucherConsumption()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box primary">
            <div class="box-body">

                <div class="col-md-3">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>VOUCHER DATES</label>
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="Coupon.validfrom,Coupon.validto" focusid="voucherdates" focusonenter="billdate">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>SALE DATES</label>
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="Coupon.billfromdate,Coupon.billtodate" focusid="billdates" focusonenter="vouchercode">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>VOUCHER TYPE</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in VoucherTypeList track by item.id" focusid="vouchertype" focusonenter="mobileno"
                                    ng-model="Coupon.vouchertypeid"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>VOUCHER CODE</label>
                            <input type="text" class="input-sm form-control" ng-model="Coupon.code" focusid="vouchercode" focusonenter="showdetails">
                        </div>
                    </div>
                </div>

                <div class="col-md-9 no-padding">

                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>

                </div>

            </div>

        </div>

    </section>

</div>
