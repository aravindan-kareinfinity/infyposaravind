<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            Stock Matrix Report
        </h1>
        <ol class="breadcrumb">
            <li><a href="#"><i class="fa fa-dashboard"></i> Reports</a></li>
            <li class="active">Reports</li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3 no-padding">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>PRODUCT</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Product track by item.id" ng-model="SearchCondition.productid"></select>
                            </div>
                        </div>
                    </div>

                    <br />
                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <div class="col-md-11" style="padding-top:15px;">
                                <button type="button" class="btn btn-sm btn-success pull-right" ng-click="SearchRORules()">Search</button>
                            </div>

                        </div>
                    </div>
                    
                </div>

                <div class="col-md-9 no-padding">
                    <div class="col-md-12" id="report">
                        <div class="table-responsive mailbox-messages">
                            <table class="fixed_table" id="suppliers" fixed-header="500px">
                                <thead>
                                    <tr>
                                        <th style="display:none">S.No</th>
                                        <th style="width:170px">NAME</th>
                                        <th style="width:130px">MIN RO</th>
                                        <th style="width:100px">MAX RO</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr ng-repeat="item in ROResult">
                                        <td style="display:none">{{$index+1}}</td>
                                        <td>{{item.description}}</td>
                                        <td>{{item.minro}}</td>
                                        <td>{{item.maxro}}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </section>
</div>
