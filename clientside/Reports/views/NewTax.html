<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Ware house report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'tax list')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchTax()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3">
                    <div class="row">
                        <div class="col-md-12">
                            <label>FROM DATE</label>
                            <div class="input-group-sm">
                                <input type="text" class="input-sm form-control datepicker" datemodule="SearchCondition.fromdate" ng-model="SearchCondition.fromdate" focusid="fromdate" focusonenter="todate" >
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>TO DATE</label>
                            <div class="input-group-sm">
                                <input type="text" class="input-sm form-control datepicker" datemodule="SearchCondition.todate" ng-model="SearchCondition.todate" focusid="todate"  >
                            </div>
                        </div>
                    </div>

                    <br />
                    <div class="row row-padbot-15">
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-6 control-label"><u><b>SUMMARY</b></u></label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-6 control-label"><b>TOTAL RECORDS</b></label>
                            <label for="inputEmail3" class="col-md-6 control-label pull-right" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{totalcount|number:2}}</b></label>
                        </div>
                    </div>
                  

                </div>

                <div class="col-md-9 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>

                </div>
            </div>

        </div>

    </section>

</div>
