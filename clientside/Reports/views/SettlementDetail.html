<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class=" fa fa-arrow-left" style="font-size:large"></i></a>
            Settlement Detail Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'settlement details')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchSettlementDetail()"><a><i class="fa fa-search-plus"></i>Search</a></li>
            <!--<li><a href="#"><i class="fa fa-dashboard"></i> Reports</a></li>
            <li class="active">Reports</li>-->
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box primary">
            <div class="box-body">

                <div class="col-md-3">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid" focusid="company" focusonenter="date"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>DATE BETWEEN</label>
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="date" focusonenter="location">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>LOCATION</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id"
                                    ng-model="SearchCondition.locationid" focusid="location" focusonenter="counter"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>COUNTER</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Counter track by item.id" ng-model="SearchCondition.counterid" focusid="counter" focusonenter="setno"></select>                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>SET NO</label>
                            <input type="text" class="form-control input-sm" id="inputPassword3" ng-model="SearchCondition.setno" focusid="setno" focusonenter="cardno">

                        </div>
                    </div>

                    <div class="row">
                        &nbsp;
                    </div>
                    <div class="row row-padbot-15">
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-6 control-label"><u><b>FIELDS</b></u></label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label for="inputEmail3" class="col-md-5 control-label">CARD NO</label>
                            <div class="col-md-7">
                                <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showcardno" focusid="cardno" focusonenter="cardtype" />
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label for="inputEmail3" class="col-md-5 control-label">CARD TYPE</label>
                            <div class="col-md-7">
                                <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showcardtype" focusid="cardtype" focusonenter="filtermode" />
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label for="inputEmail3" class="col-md-5 control-label">FILTER MODE</label>
                            <div class="col-md-7">
                                <select class="form-control" select2='Mode' style="width: 100%;" ng-model="SearchCondition.payment_typeid"
                                        ng-options="item.id as item.name for item in PaymentModeList track by item.id" focusid="filtermode"></select>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="col-md-9 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>
                </div>

            </div>

        </div>

    </section>

</div>
