<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Ware house report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'po pending')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchPendingPO()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3">
                    <div class="row">
                        <div class="col-md-12">
                            <label>LOCATION</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="Select Location" ng-model="ProductRequest.locationid" ng-options="item.id as item.name for item in Location track by item.id" focusid="first" focusonenter="supplier" ></select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>SUPPLIER</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="Select Supplier" ng-model="ProductRequest.supplierid" ng-options="item.id as item.name for item in Suppliers track by item.id" focusid="supplier" focusonenter="requestedby" ></select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>REQUESTED BY</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="Requested By" ng-model="ProductRequest.Details.requestedid" ng-options="item.id as item.name for item in Employees track by item.id" focusid="requestedby" focusonenter="requestedbetween" ></select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>REQUEST BETWEEN</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" style="width:100%" daterange="ProductRequest.Details.fromdate,ProductRequest.Details.todate" focusid="requestedbetween" focusonenter="priority" >
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>PRIORITY</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" ng-options="item.id as item.name for item in PriorityList track by item.id" ng-model="ProductRequest.Details.priorityid" select2="Select Priority" focusid="priority" focusonenter="reason" ></select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>REASON</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" ng-options="item.id as item.name for item in PrfReson track by item.id" ng-model="ProductRequest.Details.reasonid" select2="Select Reason" focusid="reason" ></select>
                            </div>
                        </div>
                    </div>

                    <br />
                    <div class="row row-padbot-15">
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-6 control-label"><u><b>SUMMARY</b></u></label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-6 control-label"><b>TOTAL QTY</b></label>
                            <label for="inputEmail3" class="col-md-6 control-label pull-right" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{totalqty|number:2}}</b></label>
                        </div>
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-6 control-label"><b>TOTAL VALUE</b></label>
                            <label ng-show="Permission.p_SHOWVALUE.view" for="inputEmail3" class="col-md-6 control-label" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{amount|number:2}}</b></label>
                            <label ng-hide="Permission.p_SHOWVALUE.view" for="inputEmail3" class="col-md-6 control-label" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>*******.**</b></label>
                        </div>

                    </div>
                </div>

                <div class="col-md-9 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>
                </div>
            </div>
        </div>

    </section>
</div>
