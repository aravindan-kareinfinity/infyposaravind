<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
           Sales / Sales HSN Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'Sales Tax HSN', 'saleshsnreport')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchSalesHSN()"><a><i class="fa fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3 no-padding">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid" focusid="company" focusonenter="date"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>DATES</label>
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="date" focusonenter="location">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">

                            <label>LOCATION</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id" focusid="location" focusonenter="sellingmode"
                                    ng-model="SearchCondition.locationid"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">

                            <label>SELLING MODE</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in SellingMode track by item.id" focusid="sellingmode" focusonenter="hideproduct"
                                    ng-model="SearchCondition.sectionid"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">

                            <label>HSN SOURCE</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in HSNSource track by item.id"
                                    ng-model="SearchCondition.hsnsourceid"></select>
                        </div>
                    </div>
                    <div>&nbsp;</div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            HIDE PRODUCT <div class="pull-right">
                                <input type="checkbox" id="inputPassword3" ng-model="SearchCondition.showdetail" focusid="hideproduct" focusonenter="hsnsummary">
                            </div>

                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            HSN SUMMARY<div class="pull-right">
                                <input type="checkbox" id="inputPassword3" ng-model="SearchCondition.showsalesummary" focusid="hsnsummary">
                            </div>

                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            POS Bill<div class="pull-right">
                                <input type="checkbox" id="inputPassword3" ng-model="SearchCondition.posbill">
                            </div>

                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            Dealer Bill<div class="pull-right">
                                <input type="checkbox" id="inputPassword3" ng-model="SearchCondition.dealerbill">
                            </div>
                        </div>
                    </div>

          
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            Credit Bill<div class="pull-right">
                                <input type="checkbox" id="inputPassword3" ng-model="SearchCondition.creditbill">
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            GST Bill<div class="pull-right">
                                <input type="checkbox" id="inputPassword3" ng-model="SearchCondition.gstbill">
                            </div>

                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            Non GST Bill<div class="pull-right">
                                <input type="checkbox" id="inputPassword3" ng-model="SearchCondition.nongstbill">
                            </div>

                        </div>
                    </div>
                    <div class="col-md-12 no-padding" ng-hide="isb2b">
                        <div class="col-md-12">
                            Only B2B Bill<div class="pull-right">
                                <input type="checkbox" id="inputPassword3" ng-model="SearchCondition.onlyb2b">
                            </div>

                        </div>
                    </div>
                    <div class="col-md-12 no-padding" ng-hide="isb2b">
                        <div class="col-md-12">
                            Include B2B Bill<div class="pull-right">
                                <input type="checkbox" id="inputPassword3" ng-model="SearchCondition.includeb2b">
                            </div>

                        </div>
                    </div>
                    <div class="col-md-12 no-padding" ng-hide="isb2b">
                        <div class="col-md-12">
                            Only Sales Invoice<div class="pull-right">
                                <input type="checkbox" id="inputPassword3" ng-model="SearchCondition.onlysales">
                            </div>

                        </div>
                    </div>
                    <div class="col-md-12 no-padding" ng-hide="isb2b">
                        <div class="col-md-12">
                            Only Return Invoice<div class="pull-right">
                                <input type="checkbox" id="inputPassword3" ng-model="SearchCondition.onlyreturn">
                            </div>

                        </div>
                    </div>
                    <br />
                </div>

                <div class="col-md-9 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>
                </div>
            </div>

        </div>

    </section>

</div>
