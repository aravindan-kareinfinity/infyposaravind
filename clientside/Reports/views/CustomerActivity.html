<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            CRM  /   Customer Activity Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'customerlist', 'customerlist')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="SearchMyCustomers()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
            <li style="cursor:pointer" ng-click="PrintMyCustomers()"><a><i class="fa fas fa-print"></i>Print Label</a></li>
            <li style="cursor:pointer" ng-show="selectedlist && selectedlist.length>0" ng-click="SendSMS(selectedlist)"><a><i class="fa fas fa-search-plus"></i>Send SMS</a></li>
        </ol>

    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3 no-padding">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12 no-padding">
                            <label>LOCATION</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id"
                                    ng-model="SearchCondition.locationid" focusid="location" focusonenter="billdate" ></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12 no-padding">
                            <label>BILL DATE</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="billdate" focusonenter="category" >
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">
                            <label>CATEGORY</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id as item.name for item in CustomerType track by item.id" startswith="true" ng-model="SearchCondition.customertype" focusid="category" focusonenter="customertype" ></select>
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label>CUSTOMER TYPE</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id as item.name for item in CustomerCategory track by item.id" startswith="true" ng-model="SearchCondition.categoryid" focusid="customertype" focusonenter="billvaluefrom" ></select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12 no-padding">
                            <label>BILL VALUE</label>

                        </div>
                    </div>
                    <div class="col-md-6 no-padding">
                        <input type="text" class="form-control input-sm" style="width: 100%;" placeholder="FROM" ng-model="SearchCondition.fromprice" focusid="billvaluefrom" focusonenter="billvalueto" >

                    </div>
                    <div class="col-md-6 no-padding">
                        <input type="text" class="form-control input-sm" style="width: 100%;" placeholder="TO" ng-model="SearchCondition.toprice" focusid="billvalueto" focusonenter="loyaltypointfrom" >

                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12 no-padding">
                            <label>LOYALTY POINT</label>

                        </div>
                    </div>
                    <div class="col-md-6 no-padding">
                        <input type="text" class="form-control input-sm" style="width: 100%;" placeholder="FROM" ng-model="SearchCondition.frompoint" ng-maxlength="150" focusid="loyaltypointfrom" focusonenter="loyaltypointto" >

                    </div>
                    <div class="col-md-6 no-padding">
                        <input type="text" class="form-control input-sm" style="width: 100%;" placeholder="TO" ng-model="SearchCondition.topoint" ng-maxlength="150" focusid="loyaltypointto" focusonenter="religion" >

                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12 no-padding">
                            <label>RELIGION</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Religions track by item.id" ng-model="SearchCondition.religionid" focusid="religion" focusonenter="product" ></select>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">
                            <label>PRODUCT</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Product track by item.id" ng-model="SearchCondition.productid" focusid="product" focusonenter="brand" ></select>
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label>BRAND</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Brand track by item.id" ng-model="SearchCondition.brandid" focusid="brand" focusonenter="size" ></select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-6 no-padding">
                            <label>SIZE</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Sizes track by item.id" startswith="true" ng-model="SearchCondition.sizeid" focusid="size" focusonenter="city" ></select>
                            </div>
                        </div>
                        <div class="col-md-6 no-padding">
                            <label>CITY</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="city.id as city.name for city in Cities track by city.id" startswith="true" ng-model="SearchCondition.cityid" focusid="city" ></select>
                            </div>
                        </div>

                    </div>
                </div>

                <div class="col-md-9 no-padding">

                    <div class="col-md-12">
                        <div class="col-md-12" id="report">
                            <div class="col-md-12" id="gridContainer">
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </section>

</div>

<script type="text/ng-template" id="SendSms">
    <div class="ngdialog-message">

        <div class="table-responsive mailbox-messages">
            <div class="col-md-12">
                <div style="height:30px"></div>
                <div class="col-md-10">
                    <span>Template</span>
                    <div class="input-group input-group-sm">
                        <select class="form-control select2" style="width: 100%;" select2="" ng-options="item.id as item.code for item in refsmstemplate track by item.id" ng-model="smstemplateid"></select>
                        <span class="input-group-btn">
                            <button type="button" class="btn btn-primary btn-sm" ng-click="GetTemplateText()" data-widget="search" data-toggle="tooltip" title="Search"><i class="fa fa-plus"></i></button>
                        </span>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-md-10">
                        <label>Message</label>
                        <textarea name="message" class="form-control" rows="7" ng-trim="false" ng-model="SendSms.message" required ng-keyup="Calculate()"></textarea>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-md-2">
                    </div>
                </div>
            </div>

        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Send()" data-widget="send" data-toggle="tooltip" title="Send">Send</button>
    </div>
</script>
