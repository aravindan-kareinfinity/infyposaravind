<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Text Day Summary
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="downloadText()"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printText()"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchTextAllTransaction()"><a><i class="fa fas fa-search-plus"></i>Transaction Summary</a></li>
            <li style="cursor:pointer" ng-click="SearchTextDaySummary()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box primary">
            <div class="box-body">

                <div class="col-md-3">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>SALE DATES</label>
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="dates" focusonenter="company">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>LOCATION</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id"
                                    ng-model="SearchCondition.locationid" focusid="location" focusonenter="appbillno"></select>
                        </div>
                    </div>
                    &nbsp;
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>SALES SUMMARY </label>
                            <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showsalesummary" focusid="showsalesummary" focusonenter="showdetail" />
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>RECEIPT SUMMARY </label>
                            <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showdetail" focusid="showdetail" focusonenter="summary" />
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>UNSETTLED BILLS </label>
                            <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.summary" focusid="summary" focusonenter="includeb2b" />
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>CASHIERS SETTLEMENT SUMMARY </label>
                            <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.includeb2b" focusid="includeb2b" focusonenter="taxwise" />
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>CLOSING DENOMINATION SUMMARY</label>
                            <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.gstbill" focusid="taxwise" focusonenter="showdatewise" />
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>CLOSING DENOMINATION DETAILS</label>
                            <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.taxwise" focusid="taxwise" focusonenter="showdatewise" />
                        </div>
                    </div>

                </div>

                <div class="col-md-9 no-padding" style="height:100px">

                    <textarea id="txtdaysummary" readonly="readonly" style=" width: 100%; display: block; max-width: 100%; line-height: 1.5; padding: 15px 15px 30px; 
                                font-family:'Courier New'; height: 100%;"></textarea>
                    
                </div>

            </div>

        </div>

    </section>

</div>
