<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Sales / Sales Report - Barcode wise
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-show="selectedcount>0 && UserInfo.p_SALES.modify" ng-click="ShowUpdateDialog()"><a><i class="fa fa-edit">({{selectedcount}}) Update HSN</i></a></li>
            <li style="cursor:pointer" ng-click="DownloadItemWiseSalesXslx()"><a><i class="fa fa-download"></i>Export(xlsx)</a></li>
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'sales barcode', 'salesbarcodereport')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-hide="SearchCondition.reporttype == '4'" ng-click="SearchSalesBarcode()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
            <li style="cursor:pointer" ng-show="SearchCondition.reporttype == '4'" ng-click="SearchVoidBarcode()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
            <li style="cursor:pointer" ng-show="SearchCondition.reporttype == '3'" ng-click="SaveReturnBarcodes()"><a><i class="fa fas fa-save"></i>Save</a></li>
            <li style="cursor:pointer" ng-show="SearchCondition.validate && SearchCondition.reporttype == 2" ng-click="salereturnbarcodeexcess()"><a><i class="fa fas fa-filter"></i>Excess Return</a></li>

        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3 no-padding">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid" focusid="company" focusonenter="dates"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>DATES</label>
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="dates" focusonenter="location">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>LOCATION</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id" ng-model="SearchCondition.locationid" focusid="location" focusonenter="mode"></select>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>MODE</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2=""
                                        style="width: 100%;" ng-options="item.id as item.name for item in BillBarcodeSalesMode track by item.id" ng-model="SearchCondition.reporttype" focusid="mode" focusonenter="isb2b"></select>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding" ng-show="SearchCondition.reporttype == '4'">
                        <div class="col-md-12">
                            <label>COUNTER</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2=""
                                        style="width: 100%;" ng-options="item.id as item.name for item in Counter track by item.id" ng-model="SearchCondition.counterid"></select>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding" ng-show="SearchCondition.reporttype == '4'">
                        <div class="col-md-12">
                            <label>BILLER</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2=""
                                        style="width: 100%;" ng-options="item.id as item.name for item in Employees track by item.id" ng-model="SearchCondition.salesmenid"></select>
                            </div>
                        </div>
                    </div>

                    <br />
                    &nbsp;
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <input type="checkbox" ng-model="SearchCondition.isb2b" style="padding-left:30px;" focusid="isb2b" /> Only B2B
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <input type="checkbox" ng-model="SearchCondition.includeb2b" style="padding-left:30px;" focusid="isb2b" /> Include B2B
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <input type="checkbox" ng-model="SearchCondition.onlysales" style="padding-left:30px;" focusid="isb2b" /> Only Negative Sale
                        </div>
                    </div>


                    <div class="col-md-12 no-padding" style="margin-top:10px" ng-show="SearchCondition.reporttype =='3'">
                        <div class="col-md-12">
                            <div>

                            </div>
                            <input type="text" onkeyenter="salereturnbarcodevalidation(SearchCondition.barcode)"
                                   placeholder="Scan Barcode Here"
                                   ng-model="SearchCondition.barcode" class="input-sm form-control" style="width:100%" />
                        </div>
                    </div>
                </div>

                <div class="col-md-9 no-padding">

                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>


                </div>
            </div>

        </div>

    </section>
</div>

<script type="text/ng-template" id="UpdateHSN">
    <h4 style="font-size:medium;color:brown">
        NOTE : All the selected barcode will be Updated, irrespective of Sales Date.
    </h4>
    <div class="ngdialog-message">
        <div class="md-col-12 row">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">HSN Code</label>
                <div class="input-group input-group-sm col-sm-6 no-padding">
                    <input type="text" class="form-control input-sm" ng-model="parent.UpdateBillItem.hsncode">
                </div>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <div class="col-md-6">
            <button type="button" class="ngdialog-button ngdialog-button-primary pull-left" ng-click="UpdateHSN()">Update HSN Code</button>
        </div>
        <div class="col-md-6">
            <button type="button" class="ngdialog-button ngdialog-button-primary pull-right" ng-click="closeThisDialog()">Close</button>
        </div>
    </div>
</script>
