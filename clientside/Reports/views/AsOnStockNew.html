<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Stock Ason Date
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'as on stock', 'asonstock')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchAsOnStock()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-2 no-padding">
                    <div class="col-md-12 no-padding">

                        <label>DATES</label>
                        <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="first" focusonenter="company">

                    </div>
                    <div class="col-md-12 no-padding">
                        <label>COMPANY</label>
                        <select class="form-control" select2='Company' ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid"></select>
                    </div>
                    <div class="col-md-12 no-padding" style="margin-top:10px">
                        <label>SECTION</label>
                        <input class="pull-right icheckbox_minimal-blue" type="checkbox" ng-model="SearchCondition.section" />
                    </div>
                    <div class="col-md-12 no-padding" style="margin-top:10px">
                        <label>PRODUCT</label>
                        <input class="pull-right icheckbox_minimal-blue" type="checkbox" ng-model="SearchCondition.product" />
                    </div>
                    <div class="col-md-12 no-padding" style="margin-top:10px">
                        <label>BRAND</label>
                        <input class="pull-right icheckbox_minimal-blue" type="checkbox" ng-model="SearchCondition.brand" />
                    </div>
                    <div class="col-md-12 no-padding" style="margin-top:10px">
                        <label>STYLE</label>
                        <input class="pull-right icheckbox_minimal-blue" type="checkbox" ng-model="SearchCondition.style" />
                    </div>

                </div>
                <div class="col-md-10" style="padding-right:0px">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>
                </div>
            </div>
        </div>

    </section>
</div>
