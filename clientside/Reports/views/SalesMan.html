<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
           Sales / Salesman Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'sales man', 'salesmanwise')"><a> <i class="fa fa-download"></i>Download</a></li>
            <!--<li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a> <i class="fa fa-print"></i>Print</a></li>-->
            <li style="cursor:pointer" ng-click="printSalesmanSalesReceipt()"><a> <i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchSalesman()"><a> <i class="fa fa fa-search-plus"></i>Search</a></li>
            <li style="cursor:pointer" ng-show="SearchCondition.showmarker && SearchCondition.showmarkerincentive && SalesmanResult && SalesmanResult.length>0" ng-click="SMMatrixIncentive()"><a> <i class="fa fa fa-search-plus"></i>Matrix</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box primary">
            <div class="box-body">

                <div class="col-md-3">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid" focusid="company" focusonenter="dates"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>DATES</label>
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="dates" focusonenter="location">
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>LOCATION</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id"
                                    ng-model="SearchCondition.locationid" focusid="location" focusonenter="employee"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>EMPLOYEE</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Employees track by item.id"
                                    ng-model="SearchCondition.employeeid" focusid="employee" focusonenter="sectionwise"></select>
                        </div>
                    </div>
                    <div>&nbsp;</div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>SECTION WISE</label>&nbsp; <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showdetail" focusid="sectionwise" focusonenter="showmarker" />
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>STOCK MARKER</label>&nbsp; <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showmarker" focusid="showmarker" focusonenter="showmarkerincentive" />
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>MARKER INCENTIVE</label>&nbsp; <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showmarkerincentive" focusid="showmarkerincentive" focusonenter="datewsie" />
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>DATE WISE</label>&nbsp; <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.hidebusinesstrend" focusid="datewsie" focusonenter="billwsie" />
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>BILL WISE</label>&nbsp; <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.integration" focusid="billwsie" focusonenter="onlyreturns" />
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>ONLY RETURNS</label>&nbsp; <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showsalesummary" focusid="onlyreturns" />
                        </div>
                    </div>
                    <br />
                </div>

                <div class="col-md-9 no-padding">

                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>

                </div>

            </div>

        </div>


    </section>

</div>
