<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Sales / Day Wise Collection Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'company wise collection', 'settlementreport')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchSettlementDaySummary()"><a><i class="fa fa-search-plus"></i>Search</a></li>

            <li class="active">Reports</li>-->

    <!-- Main content -->
    <section class="content">
        <div class="box primary">
            <div class="box-body">

                <div class="col-md-3">
                    <div class="col-md-12 no-padding">
                        <label>DATE BETWEEN</label>
                        <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="date" focusonenter="location" >
                    </div>
                    <div class="col-md-12 no-padding">
                        <label>LOCATION</label>
                        <select class="input-sm  form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id" focusid="location" focusonenter="counter"
                                ng-model="SearchCondition.locationid"></select>
                    </div>
                    <div class="col-md-12 no-padding">
                        <label>COUNTER</label>
                        <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Counter track by item.id" ng-model="SearchCondition.counterid" focusid="counter" ></select>
                    </div>
                </div>

                <div class="col-md-9 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>
                </div>

            </div>

        </div>
