<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            Bill Detail Report
        </h1>
        <ol class="breadcrumb">
            <li><a href="#"><i class="fa fa-dashboard"></i> Reports</a></li>
            <li class="active"> Bill Reports</li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">


            <div class="box-body">
                <div class="col-md-3">
                    <div class="col-md-12" style="display:none">
                        <label>SHOW ITEM DETAILS</label>
                        <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showdetail=true" />
                    </div>
                    <div class="col-md-12" style="display:none">
                        <label>SUMMARY</label>
                        <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.summary=false" />
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inpu`tEmail3" class="col-sm-4 col-md-4 control-label">BILL NO</label>
                                <div class="col-md-8 col-sm-8">

                                    <div class="input-group input-group-sm">
                                        <input type="text" class="form-control input-sm" id="inputPassword3" placeholder="BillNo" ng-model="SearchCondition.billno">
                                        <span class="input-group-btn">
                                            <button class="btn btn-sm btn-primary btn-box" ng-click="SearchSales()"><i class="fa fa-search"></i></button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <br />
                    <h4>
                        SUMMARY
                    </h4>
                    <div class="row">
                        <div class="row col-md-12" ng-hide="SearchCondition.showdetail || SearchCondition.summary">
                            <label for="inputEmail3" class="col-md-4 control-label"><b>BILLS</b></label>
                            <label for="inputEmail3" class="col-md-8 control-label no-padding" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{billcount| number:0}}</b></label>
                        </div>
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-4 control-label"><b>QTY</b></label>
                            <label for="inputEmail3" class="col-md-8 control-label no-padding" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{saleqty| number:0}}</b></label>
                        </div>
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-4 control-label"><b>AMOUNT</b></label>
                            <label for="inputEmail3" class="col-md-8 control-label no-padding" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{saleamount| number:2}}</b></label>
                        </div>
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-4 control-label"><b>TAX</b></label>
                            <label for="inputEmail3" class="col-md-8 control-label no-padding" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{saletax| number:2}}</b></label>
                        </div>
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-4 control-label"><b>DISCOUNT</b></label>
                            <label for="inputEmail3" class="col-md-8 control-label no-padding" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{salediscount| number:2}}</b></label>
                        </div>
                    </div>
                </div>
                <div class="col-md-9">
                    <div class="col-md-12">
                        <div class="col-md-8"></div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-sm btn-danger" ng-show="SearchCondition.unsettled && SalesResult.length>0" ng-click="CancelBills()">Cancel Bills</button>
                            <button type="button" class="btn btn-sm btn-danger" ng-show="SearchCondition.unsettled && SearchResult.length>0" ng-click="printunsettled()"><i class="glyphicon glyphicon-print" aria-hidden="true"></i></button>
                        </div>
                        <div class="col-md-1">
                            <button type="button" class="btn btn-info btn-sm pull-right" ng-click="printDiv('report', 'Report')" data-widget="print" data-toggle="tooltip" title="Print"><i class="glyphicon glyphicon-print" aria-hidden="true"></i></button>
                        </div>
                        <div class="col-md-1">
                            <button type="button" class="btn-primary btn btn-sm pull-left" ng-click="exporttoExcel(igrid,'Outward')" data-toggle="tooltip" title="Download"><i class="fa fa-download"></i></button>
                        </div>
                    </div>
                    <div class="col-md-12">
                        <div class="box no-border">
                            <div class="box-body ">
                                <div class="row">
                                    <div class="col-md-12" id="report">
                                        <div class="col-md-12" id="gridContainer">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </section>

</div>
