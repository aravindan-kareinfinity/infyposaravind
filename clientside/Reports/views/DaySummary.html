<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Day Summary 
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exportExcel('daysummary', 'daysummary',0)"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="SearchSummaryMobile()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>

        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>SALE DATES</label>
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid"></select>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>LOCATION</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id"
                                    ng-model="SearchCondition.locationid" ng-change="SalesResult=[]"></select>
                        </div>
                    </div>
                    
                </div>

                <div class="col-md-9 no-padding">

                    <div class="col-md-12 no-padding" id="htmlgrid">
                        <table style="width:100%" id="daysummary">
                            <thead>
                                <tr>
                                    <th></th>
                                    <th></th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tr ng-repeat="item in LocationSummary.Groups" style="border:1px solid gray">
                                <td style="vertical-align:top;border-right:1px solid gray" width="250px">
                                    {{item.name}}
                                </td>
                                <td style="vertical-align:top;text-align:right;border-right:1px solid gray;padding-right:5px" width="100px">
                                    {{item.value}}
                                </td>
                                <td style="vertical-align:top">
                                    <table style="width:100%">
                                        <tr ng-repeat="item in item.Items" style="border-bottom:1px dotted gray">
                                            <td width="250px">
                                                {{item.name}}
                                            </td>
                                            <td width="100px" style="text-align:right;padding-right:5px">
                                                {{item.value}}
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </div>


                </div>

            </div>
        </div>
    </section>

</div>
