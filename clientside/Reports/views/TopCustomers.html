<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            CRM  /   Top Customers
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="SearchTopCustomers()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
            <li style="cursor:pointer" ng-show="selectedlist && selectedlist.length>0" ng-click="SendSMS(selectedlist)"><a><i class="fa fas fa-search-plus"></i>Send SMS</a></li>
            <li style="cursor:pointer" ng-click="printDiv('report', 'Report')"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'LR')"><a><i class="fa fa-download"></i>Download</a></li>
        </ol>

    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3 no-padding">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>LOCATION</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id"
                                    ng-model="SearchCondition.locationid"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>BILL DATE</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>TOP LIST</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" style="width: 100%;" placeholder="LIMIT" ng-model="SearchCondition.limit" ng-maxlength="150">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>AREA</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="city.id as city.name for city in Cities track by city.id" startswith="true" ng-model="SearchCondition.cityid"></select>
                            </div>
                        </div>
                    </div>
                    

                </div>

                <div class="col-md-9 no-padding">

                    <div class="col-md-12">
                      
                                    <div class="col-md-12" id="report">
                                        <div class="col-md-12" id="gridContainer">
                                        </div>
                                   
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </section>

</div>
<script type="text/ng-template" id="SendSms">
    <div class="ngdialog-message">

        <div class="table-responsive mailbox-messages">
            <div class="col-md-12">
                <div style="height:30px"></div>
                <div class="col-md-10">
                    <span>Template</span>
                    <div class="input-group input-group-sm">
                        <select class="form-control select2" style="width: 100%;" select2="" ng-options="item.id as item.code for item in refsmstemplate track by item.id" ng-model="smstemplateid"></select>
                        <span class="input-group-btn">
                            <button type="button" class="btn btn-primary btn-sm" ng-click="GetTemplateText()" data-widget="search" data-toggle="tooltip" title="Search"><i class="fa fa-plus"></i></button>
                        </span>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-md-10">
                        <label>Message</label>
                        <textarea name="message" class="form-control" rows="7" ng-trim="false" ng-model="SendSms.message" required ng-keyup="Calculate()"></textarea>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-md-2">
                    </div>
                </div>
            </div>

        </div>
    </div>
    <div class="ngdialog-buttons">
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="closeThisDialog()">Close</button>
        <button type="button" class="ngdialog-button ngdialog-button-primary" ng-click="Send()" data-widget="send" data-toggle="tooltip" title="Send">Send</button>
    </div>
</script>
