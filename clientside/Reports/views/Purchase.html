<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Purchase Entry Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'Purchase', 'purchaseitemlist')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-show="SearchCondition.showdetail" ng-click="SearchPurchaseList()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
            <li style="cursor:pointer" ng-hide="SearchCondition.showdetail" ng-click="SearchPurchase()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3 no-padding">
                    <div class="row">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid" focusid="company" focusonenter="inventrydate"></select>
                        </div>
                    </div>
 <div class="row">
                        <div class="col-md-12">
                            <div class="col-md-6 no-padding">
                                <label>INV. ENTRY DATE</label>
                                <div class="input-group-sm">
                                    <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="inventrydate" focusonenter="invdate">
                                </div>
                            </div>
                            <div class="col-md-6 no-padding">
                                <label>INVOICE DATE</label>
                                <div class="input-group-sm">
                                    <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromlrdate,SearchCondition.tolrdate" focusid="invdate" focusonenter="barcodedfrom">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <div class="col-md-6 no-padding">
                                <label>SHOW BARCODE ON</label>
                                <div class="input-group-sm">
                                    <input type="checkbox" ng-model="SearchCondition.showbarcodedon" >                                    
                                </div>
                            </div>
                            <div class="col-md-6 no-padding">
                                <label>BARCODED DATE</label>
                                <div class="input-group-sm">
                                    <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.barcodedfrom,SearchCondition.barcodedto" 
                                           focusid="barcodedfrom" focusonenter="entryloaction">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <label>ENTRY LOCATION</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id" ng-model="SearchCondition.locationid" focusid="entryloaction" focusonenter="receivinglocationid"></select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>RECEIVING CITY</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in city track by item.id" ng-model="SearchCondition.receivinglocationid" focusid="receivinglocationid" focusonenter="supplier"></select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <label>SUPPLIER</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Supplier track by item.id" ng-model="SearchCondition.supplierid" focusid="supplier" focusonenter="agent"></select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>AGENT</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Agent track by item.id" ng-model="SearchCondition.agentid" focusid="agent" focusonenter="city"></select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>SUPPLIER CITY</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in city track by item.id" ng-model="SearchCondition.suppliercityid" focusid="city" focusonenter="showrowwise"></select>
                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-6 control-label">Show Row Wise</label>
                            <div class="col-md-6">
                                <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showdetail" focusid="showrowwise" focusonenter="onlymsmeno" />
                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-6 control-label">Show Only MSME</label>
                            <div class="col-md-6">
                                <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.onlymsmeno" focusid="showonlymsmeno" focusonenter="removemfg" />
                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-6 control-label">Exclude Manufactured</label>
                            <div class="col-md-6">
                                <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.removemfg" focusid="showrowwise" focusonenter="summary" />
                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-6 control-label">Exclude Migrated</label>
                            <div class="col-md-6">
                                <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.excludesettled" focusid="summary" focusonenter="summary" />
                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-6 control-label"><u><b>SUMMARY</b></u></label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-6 control-label"><b>INVOICE NOS</b></label>
                            <label for="inputEmail3" class="col-md-6 control-label pull-right" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{lrcount|number:2}}</b></label>
                        </div>

                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-6 control-label"><b>TOTAL TAX</b></label>
                            <label for="inputEmail3" class="col-md-6 control-label pull-right" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{tax|number:2}}</b></label>
                        </div>

                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-6 control-label"><b>TAXABLE AMOUNT</b></label>
                            <label for="inputEmail3" class="col-md-6 control-label pull-right" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{taxableamount|number:2}}</b></label>
                        </div>

                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-6 control-label"><b>TOTAL INV.VALUE</b></label>
                            <label for="inputEmail3" class="col-md-6 control-label" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{amount|number:2}}</b></label>
                        </div>
                    </div>
                </div>

                <div class="col-md-9 no-padding">

                    <div class="row">
                        <div class="col-md-12" id="report">
                            <div class="col-md-12" id="gridContainer">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </section>

</div>
