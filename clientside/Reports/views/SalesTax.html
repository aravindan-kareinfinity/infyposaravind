<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class=" fa fa-arrow-left" style="font-size:large"></i></a>
           Sales /  Sales Tax Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'Sales Tax Report','salestaxreport')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchSalesTax()"><a><i class="fa fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3 no-padding">
                    <div class="col-md-12">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Company track by item.id" focusid="company" focusonenter="date"
                                    ng-model="SearchCondition.companyid"></select>
                        </div>
                    </div>
                    <div class="col-md-12">
                        <div class="col-md-12">
                            <label>DATES</label>
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="date" focusonenter="location" >
                        </div>
                    </div>
                    <div class="col-md-12">
                        <div class="col-md-12">
                            <label>LOCATION</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id" focusid="location" focusonenter="showbillwise" 
                                    ng-model="SearchCondition.locationid"></select>
                        </div>
                    </div>
                    <div class="col-md-12" ng-hide="true">
                        <div class="col-md-12">
                            <label>SHOW ROW WISE</label>
                            <input type="checkbox" class="icheckbox_flat-greenc" ng-model="SearchCondition.summary" focusid="billrowwise" />
                        </div>
                    </div>
                    &nbsp;
                    <div class="col-md-12">
                        <div class="col-md-12">
                            <label>SHOW BILL WISE</label>
                            <div class="col-md-4 pull-right input-group-sm">
                                <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showdetail" focusid="showbillwise" />
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12" ng-hide="isb2b">
                        <div class="col-md-12">
                            <label>Include B2B Bill</label>
                            <div class="col-md-4 pull-right input-group-sm">
                                <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.includeb2b" />
                            </div>
                        </div>
                    </div>
                    <br />
                </div>

                <div class="col-md-9 no-padding">
                    <div class="col-md-12" id="report">
                        <div class="col-md-12 no-padding">
                            <div class="col-md-12 no-padding" id="gridContainer">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </section>

</div>
