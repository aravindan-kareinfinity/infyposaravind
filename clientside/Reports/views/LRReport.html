<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Goods Receive Note Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'GRN', 'lrentryreport')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchLR()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3">
                    <div class="row">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' ng-options="item.id as item.name for item in Company track by item.id"
                                    ng-model="SearchCondition.companyid" style="width:100%" focusid="company" focusonenter="supplier"></select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>SUPPLIER</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Supplier track by item.id" ng-model="SearchCondition.supplierid" focusid="supplier" focusonenter="transport"></select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>TRANSPORT</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Transports track by item.id" ng-model="SearchCondition.transportid" focusid="transport" focusonenter="lrentrydate"></select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <label>LR ENTRY DATE</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="lrentrydate" focusonenter="lrdate">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <label>LR DATE</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromlrdate,SearchCondition.tolrdate" focusid="lrdate" focusonenter="invoicedate">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>INVOICE DATE</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.frominvdate,SearchCondition.toinvdate" focusid="invoicedate" focusonenter="purchaserid">
                            </div>
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <label>PURCHASE MANAGER</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in PurchaseManager track by item.id" ng-model="SearchCondition.purchaserid" focusid="purchaserid" focusonenter="showpendingonly"></select>
                            </div>
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <div class="col-md-12">
                            <label>MODE OF DELIVERY</label>
                            <div class="input-group-sm">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in ModeofDelivery track by item.id" ng-model="SearchCondition.modeofdelivery" focusid="deliverymode" focusonenter="showpendingonly"></select>
                            </div>
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-6 control-label">Show Pending Only</label>
                            <div class="col-md-6">
                                <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.pendinginward" focusid="showpendingonly" />
                            </div>
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-6 control-label">Include Dates</label>
                            <div class="col-md-6">
                                <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.showdetail" focusid="showpendingonly" />
                            </div>
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-6 control-label"><u><b>SUMMARY</b></u></label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-6 control-label"><b>TOTAL ENTRY</b></label>
                            <label for="inputEmail3" class="col-md-6 control-label pull-right" style="font-size:large;color:brown;text-align:right"><b>{{lrcount|number:2}}</b></label>
                        </div>
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-6 control-label"><b>TOTAL BUNDELS</b></label>
                            <label for="inputEmail3" class="col-md-6 control-label pull-right" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{lrbundels|number:2}}</b></label>
                        </div>
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-8 control-label"><b>TOTAL VALUE</b></label>
                            <label for="inputEmail3" class="col-md-4 control-label" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{lrtotalvalue|number:2}}</b></label>
                        </div>
                    </div>
                </div>

                <div class="col-md-9 no-padding">




                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>


                </div>

            </div>

        </div>

    </section>

</div>
