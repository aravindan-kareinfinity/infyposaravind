<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Approved Bill Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'approved sales report', 'approvedsalesreport')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="DownloadApprovalImagePDF()"><a><i class="fa fa-download"></i>DownloadPDF</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchBulkBill()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box primary">
            <div class="box-body">

                <div class="col-md-3">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>SALE DATES</label>
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="dates" focusonenter="company">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid" focusid="company" focusonenter="location"></select>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>LOCATION</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id"
                                    ng-model="SearchCondition.locationid" focusid="location" focusonenter="appbillno"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>APP.BILL NO</label>
                            <input type="text" class="form-control input-sm" id="inputPassword3" placeholder="Bill No" ng-model="SearchCondition.billno" focusid="appbillno">
                        </div>
                    </div>
                    <div>&nbsp;</div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>PENDING BILLS ONLY</label>&nbsp; <input type="checkbox" class="icheckbox_flat-green pull-right" ng-model="SearchCondition.unsettled" />
                        </div>
                    </div>
                    <div>&nbsp;</div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>SHOW DETAILS</label>&nbsp; <input type="checkbox" class="icheckbox_flat-green pull-right" ng-model="SearchCondition.showdetail" />
                        </div>
                    </div>

                    <div class="col-md-12" ng-show="ShowImage">
                        <div style="height:150px;width:150px;display:inline;">
                            <a target="_blank" href="File/Show/{{UserInfo.OrganizationID}}/{{currentimageid}}">
                                <img style="height:150px;width:150px;padding-top:10px" ng-src="File/Show/{{UserInfo.OrganizationID}}/{{currentimageid}}" />
                            </a>
                        </div>
                    </div>
                </div>

                <div class="col-md-9 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>

                </div>

            </div>

        </div>

    </section>

</div>
