<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Job Work Inward Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'joboutward','joboutwardreport')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchJobInward()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box primary">
            <div class="box-body">
                <div class="col-md-3">
                    <div class="row">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' width="100%" ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid" focusid="first" focusonenter="supplier"></select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <label>JOB WORKER</label>
                            <div class="input-group-sm">
                                <select class="form-control input-sm" select2='Job Worker'
                                        ng-model="SearchCondition.supplierid" options="item.id as item.name for item in JobWorkers track by item.id" focusid="supplier" focusonenter="status"></select>
                            </div>
                        </div>
                    </div>
                   

                    <div class="row">
                        <div class="col-md-12">
                            <label>ENTRY DATE</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.entryfrom,SearchCondition.entryto" focusid="orderdate">
                            </div>
                        </div>
                    </div>
                    <br />
                </div>

                <div class="col-md-9 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>
                </div>
            </div>

        </div>

    </section>

</div>
