<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Sales Report - Cancelled Bill Report
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'sales report', 'cancelledsalereport')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchCancelledBill()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>

        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box primary">
            <div class="box-body">

                <div class="col-md-3">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>SALE DATES</label>
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="dates" focusonenter="company">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid" focusid="company" focusonenter="location"></select>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>LOCATION</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id"
                                    ng-model="SearchCondition.locationid" focusid="location" focusonenter="returnbill"></select>
                        </div>
                    </div>
                    <div>
                        &nbsp;
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <input type="radio" ng-model="SearchCondition.mode" style="padding-left:30px;" value="1" focusid="returnbill" focusonenter="cancelledreturnbill" /> RETURN BILL
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <input type="radio" ng-model="SearchCondition.mode" style="padding-left:30px;" value="2" focusid="cancelledreturnbill" focusonenter="unsettledbill" /> CANCELLED RETURN BILL
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <input type="radio" ng-model="SearchCondition.mode" style="padding-left:30px;" value="3" focusid="unsettledbill" focusonenter="cancelledunsettledbill" /> UN-SETTLED BILL
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <input type="radio" ng-model="SearchCondition.mode" style="padding-left:30px;" value="4" focusid="cancelledunsettledbill" focusonenter="cancelledsettledbill" /> CANCELLED UN-SETTLED BILL
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <input type="radio" ng-model="SearchCondition.mode" style="padding-left:30px;" value="6" focusid="cancelledsettledbill" focusonenter="all" /> CANCELLED SETTLED BILL
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <input type="radio" ng-model="SearchCondition.mode" style="padding-left:30px;" value="5" focusid="all" /> ALL
                        </div>
                    </div>
                    <br />
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <input type="checkbox" ng-model="SearchCondition.summary" style="padding-left:30px;" focusid="summary" /> MULTIPLE RETURN OFFSET
                        </div>
                    </div>
                </div>

                <div class="col-md-9 no-padding">

                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>

                </div>

            </div>

        </div>

    </section>

</div>
