<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->

           Sales / Stock Detail Report - Aging
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'Retail Stock', 'stockreport')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="SearchAgeStock()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>

    <!-- Main content -->
    <section class="content">

        <div class="box primary">

                <div class="col-md-3">

                            <div class="col-md-8">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Company track by item.id"

                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-4 control-label">LOCATION</label>

                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in RetailLocations track by item.id"

                            </div>
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <div class="form-group">

                            </div>
                        </div>
                    </div>

                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-4 control-label">PRODUCT GROUP</label>

                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-4 control-label">SECTION</label>
                            <div class="col-md-8">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Section track by item.id" ng-model="SearchCondition.sectionid" focusid="section" focusonenter="product"></select>
                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-4 control-label">PRODUCT</label>
                            <div class="col-md-8">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Product track by item.id" ng-model="SearchCondition.productid" focusid="product" focusonenter="supplier"></select>
                            </div>
                        </div>
                    </div>
                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <label for="inputEmail3" class="col-md-4 control-label">SUPPLIER</label>
                            <div class="col-md-8">
                                <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Supplier track by item.id" ng-model="SearchCondition.supplierid" focusid="supplier" focusonenter="purchasetype"></select>
                            </div>

                        <div class="form-group">

                        <div class="form-group">

                </div>

                <div class="col-md-9 no-padding">
