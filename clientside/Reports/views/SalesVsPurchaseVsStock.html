<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Sales Vs Purchase Vs Stock
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="igrid.ExportCSV(igrid.grid)"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="SearchSalesVsPurchaseVsStock()"><a><i class="fa fas fa-search-plus"></i>Search</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">
                <div class="col-md-2 no-padding">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>DATES</label>
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchConditionStkTrans.fromdate,SearchConditionStkTrans.todate" focusid="first" focusonenter="company">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchConditionStkTrans.companyid"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>LOCATION</label>
                            <select class="form-control" select2='Location' ng-options="item.id as item.name for item in Location track by item.id" ng-model="SearchConditionStkTrans.locationid"></select>
                        </div>
                    </div>


                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>PRODUCT GROUP</label>
                            <select class="form-control" select2='Location' ng-options="item.id as item.name for item in ProductGroups track by item.id" ng-model="SearchConditionStkTrans.productgroupid"></select>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>PRODUCT</label>
                            <select class="form-control" select2='Location' ng-options="item.id as item.name for item in Product track by item.id" ng-model="SearchConditionStkTrans.productid"></select>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>BRAND</label>
                            <select class="form-control" select2='Location' ng-options="item.id as item.name for item in Brand track by item.id" ng-model="SearchConditionStkTrans.brandid"></select>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>SUPPLIER</label>
                            <select class="form-control" select2='Condition' ng-options="item.id as item.name for item in Supplier track by item.id"
                                    ng-model="SearchConditionStkTrans.supplierid"></select>

                        </div>
                    </div>


                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>SECTION</label>
                            <select class="form-control" select2='Condition' ng-options="item.id as item.name for item in SalesCounter track by item.id"
                                    ng-model="SearchConditionStkTrans.sectionid"></select>

                        </div>
                    </div>


                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>ADDITIONAL FIELDS</label>
                            <div class="col-md-12 no-padding">
                                <div class="col-md-12 no-padding">
                                    <input type="checkbox" class="icheckbox_minimal-blue" ng-model="SearchConditionStkTrans.showlocation" />
                                    Location
                                </div>
                                <div class="col-md-12 no-padding">
                                    <input type="checkbox" class="icheckbox_minimal-blue" ng-model="SearchConditionStkTrans.showsupplier" />
                                    Supplier
                                </div>
                                <div class="col-md-12 no-padding">
                                    <input type="checkbox" class="icheckbox_minimal-blue" ng-model="SearchConditionStkTrans.showproduct" />
                                    Product
                                </div>
                                <div class="col-md-12 no-padding">
                                    <input type="checkbox" class="icheckbox_minimal-blue" ng-model="SearchConditionStkTrans.showdesign" />
                                    Design
                                </div>
                                <div class="col-md-12 no-padding">
                                    <input type="checkbox" class="icheckbox_minimal-blue" ng-model="SearchConditionStkTrans.showbrand" />
                                    Brand
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
                <div class="col-md-10 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>
                </div>
            </div>
        </div>

    </section>
</div>
