<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            Sales Summary Report
        </h1>
        <ol class="breadcrumb">
            <li><a href="#"><i class="fa fa-dashboard"></i> Reports</a></li>
            <li class="active">Sale Reports</li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">

        <div class="box primary">
            <div class="box-body">

                <div class="col-md-3">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>FROM DATE</label>
                            <div class="input-group date">
                                <div class="input-group-addon">
                                    <i class="fa fa-calendar"></i>
                                </div>
                                <input type="text" class="input-sm form-control datepicker" datemodule="SearchCondition.fromdate" ng-model="SearchCondition.fromdate">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">

                            <label>TO DATE</label>
                            <div class="input-group date">
                                <div class="input-group-addon">
                                    <i class="fa fa-calendar"></i>
                                </div>
                                <input type="text" class="input-sm form-control datepicker" datemodule="SearchCondition.todate" ng-model="SearchCondition.todate">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>LOCATION</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id"
                                    ng-model="SearchCondition.locationid"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding" ng-hide="true">
                        <div class="col-md-12">
                            <label>SUMMARY</label>
                            <div>
                                <input type="checkbox" class="icheckbox_flat-green" ng-model="SearchCondition.summary" ng-change="SalesResult=[]" />
                            </div>
                        </div>
                    </div>

                    <br />
                    <div class="row row-padbot-15">
                        <div class="form-group">
                            <div class="col-md-4" style="padding-top:15px;"></div>
                            <div class="col-md-2" style="padding-top:15px;">
                            </div>
                            <div class="col-md-2" style="padding-top:15px;">
                            </div>
                            <div class="col-md-3" style="padding-top:15px;">
                                <button type="button" class="btn btn-sm btn-success pull-right" ng-click="SearchSales()">Search</button>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="row col-md-12" ng-hide="SearchCondition.showdetail || SearchCondition.summary">
                            <label for="inputEmail3" class="col-md-4 control-label"><b>BILLS</b></label>
                            <label for="inputEmail3" class="col-md-8 control-label no-padding" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{billcount| number:0}}</b></label>
                        </div>
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-4 control-label"><b>QTY</b></label>
                            <label for="inputEmail3" class="col-md-8 control-label no-padding" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{saleqty| number:0}}</b></label>
                        </div>
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-4 control-label"><b>AMOUNT</b></label>
                            <label for="inputEmail3" class="col-md-8 control-label no-padding" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{saleamount| number:2}}</b></label>
                        </div>
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-4 control-label"><b>TAX</b></label>
                            <label for="inputEmail3" class="col-md-8 control-label no-padding" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{saletax| number:2}}</b></label>
                        </div>
                        <div class="row col-md-12">
                            <label for="inputEmail3" class="col-md-4 control-label"><b>DISCOUNT</b></label>
                            <label for="inputEmail3" class="col-md-8 control-label no-padding" style="vertical-align:top;font-size:large;color:brown;text-align:right"><b>{{salediscount| number:2}}</b></label>
                        </div>
                    </div>
                </div>

                <div class="col-md-9">
                    <div class="col-md-10"></div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-info btn-sm" ng-click="printDiv('report', 'Report')" data-widget="print" data-toggle="tooltip" title="Print"><i class="glyphicon glyphicon-print" aria-hidden="true"></i></button>
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn-primary btn btn-sm pull-right" ng-click="exporttoExcel(igrid,'LR')" data-toggle="tooltip" title="Download"><i class="fa fa-download"></i></button>

                    </div>
                    <div class="col-md-12">
                        <div class="box no-border">
                            <div class="box-body ">
                                <div class="row">
                                    <div class="col-md-12" id="report">
                                        <div class="col-md-12" id="gridContainer">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </section>

</div>
