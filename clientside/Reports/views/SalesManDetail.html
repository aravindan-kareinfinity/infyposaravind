<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            Sales Report - Sales man wise
        </h1>
        <ol class="breadcrumb">
            <li style="cursor:pointer" ng-click="ShowUpdateSalesmanDialog()" ng-show="selectedcount>0 && UserInfo.p_SALES.modify" ><a><i class="fa fa-save"></i>Update Salesman</a></li>
            <li style="cursor:pointer" ng-click="exporttoExcel(igrid,'sales man', 'salesmanwise')"><a><i class="fa fa-download"></i>Download</a></li>
            <li style="cursor:pointer" ng-click="printInfyGrid(igrid)"><a><i class="fa fa-print"></i>Print</a></li>
            <li style="cursor:pointer" ng-click="SearchSalesmanDetail()"><a><i class="fa fa-search-plus"></i>Search</a></li>

            <!--<li><a href="#"><i class="fa fa-dashboard"></i> Reports</a></li>
    <li class="active">Reports</li>-->
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="box primary">
            <div class="box-body">

                <div class="col-md-3">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>COMPANY</label>
                            <select class="form-control" select2='Company' ng-options="item.id as item.name for item in Company track by item.id" ng-model="SearchCondition.companyid" focusid="company" focusonenter="dates"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>DATES</label>
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="dates" focusonenter="location">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>LOCATION</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Location track by item.id"
                                    ng-model="SearchCondition.locationid" focusid="location" focusonenter="employee"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>EMPLOYEE</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.code for item in Employees track by item.id"
                                    ng-model="SearchCondition.employeeid" focusid="employee" focusonenter="section"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>SECTION</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Section track by item.id"
                                    ng-model="SearchCondition.sectionid" focusid="section" focusonenter="schemename"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>SCHEME NAME</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Promotions track by item.id"
                                    ng-model="SearchCondition.schemeid" focusid="schemename" focusonenter="markername"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>MARKER NAME</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in MarkerType track by item.id"
                                    ng-model="SearchCondition.stockmarkerid" focusid="markername" focusonenter="barcode"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>BARCODE</label>
                            <div class="input-group-sm">
                                <input type="text" class="form-control input-sm" id="inputPassword3" placeholder="Barcode" ng-model="SearchCondition.barcode" focusid="barcode">
                            </div>
                        </div>
                    </div>

                </div>

                <div class="col-md-9 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<script type="text/ng-template" id="UpdateSalesman">
    <h4 style="font-size:medium;color:brown">
        All the selected items will be Updated. 
    </h4>
    <div class="ngdialog-message">
        <div class="md-col-12 row">
            <div class="form-group">
                <label for="inputEmail3" class="col-md-3 control-label">Select Salesman</label>
                <div class="input-group input-group-sm col-sm-6 no-padding">
                    <select class="input-sm form-control" select2="" style="width: 100%;" options="item.id  as item.code for item in parent.Employees track by item.id" ng-model="parent.UpdateSalesmanCode.salesmanid"></select>
                </div>
            </div>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <div class="col-md-3">
            <button type="button" class="ngdialog-button ngdialog-button-primary pull-right" ng-click="UpdateSalesman()">Update</button>
        </div>
    </div>
    <div class="ngdialog-buttons">
        <div class="col-md-12">
            <button type="button" class="ngdialog-button ngdialog-button-info pull-right" ng-click="closeThisDialog()">Close</button>
        </div>
    </div>

</script>
