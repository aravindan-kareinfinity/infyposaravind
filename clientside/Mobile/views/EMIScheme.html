<div>
    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
        <!-- Content Header (Page header) -->
        <section class="content-header">
            <h1>
                <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
                Mobile  /   Buy Back
            </h1>
            <ol class="breadcrumb">
                <li style="cursor:pointer" ng-click="ShowSearch=false;New()"><a><i class="fa fa-file"></i>New</a></li>
                <li style="cursor:pointer" ng-hide="ShowSearch" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
                <li style="cursor:pointer" ng-hide="ShowSearch" ng-click="ShowSearch=true"><a><i class="fa fa-search"></i>Search</a></li>
                <li style="cursor:pointer" ng-show="ShowSearch" ng-click="Edit()"><a><i class="fa fa-edit"></i>Edit</a></li>
                <li style="cursor:pointer" ng-show="ShowSearch" ng-click="Delete()"><a><i class="fa fa-trash"></i>Delete</a></li>
            </ol>
        </section>
        <!-- Main content -->
        <section class="content">
            <!-- Your Page Content Here -->
            <div class="box box-primary" ng-hide="ShowSearch">
                <div class="box-body">
                    <div class="col-md-6">


                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Scheme Name</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="EMIScheme.name"
                                               focusid="schemename"
                                               focusonenter="loanprovider">
                                    </div>

                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Loan Provider</label>
                                    <div class="col-md-8">
                                        <select class="form-control input-sm" style="width: 100%;" select2=""
                                                ng-options="item.id as item.name for item in LoanProviders track by item.id"
                                                ng-model="EMIScheme.loanproviderid"
                                                focusid="loanprovider"></select>
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>


                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Rate Of Interest</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" ng-model="EMIScheme.rateofinterest"
                                               class="form-control pull-right input-sm">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Tenure</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" ng-model="EMIScheme.tenure" class="form-control pull-right input-sm">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>


                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Advance Months</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" ng-model="EMIScheme.minimumadvancemonth" class="form-control pull-right input-sm">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Minimum Value</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" ng-model="EMIScheme.minimumvalue" class="form-control pull-right input-sm">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Maximum Value</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" ng-model="EMIScheme.maximumvalue" class="form-control pull-right input-sm">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>


                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">From Date</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" class="form-control pull-right input-sm" datemodule="EMIScheme.validfrom" ng-model="EMIScheme.schemedate" focuid="first">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">To Date</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" class="form-control pull-right input-sm" datemodule="EMIScheme.validto" ng-model="EMIScheme.schemedate" focuid="first">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>


                        <!-- /.row -->




                    </div>

                    <div class="col-md-6">

                        <h4>Charges</h4>
                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">DBD In Percentage</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" ng-model="EMIScheme.dbdpercentage" class="form-control pull-right input-sm">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">DBD In Value</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" ng-model="EMIScheme.dbdvalue" class="form-control pull-right input-sm">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Document Charge (%)</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" ng-model="EMIScheme.documentchargepercentage" class="form-control pull-right input-sm">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Document Charge in Value</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" ng-model="EMIScheme.documentcharge" class="form-control pull-right input-sm">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">EMI Card Charge</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" ng-model="EMIScheme.emicardcharge" class="form-control pull-right input-sm">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>
                    </div>
                </div>
            </div>


            <div class="box box-primary" ng-show="ShowSearch">
                <div class="box-body">
                    <div class="row row-padbot-15">
                        <div class="col-md-4 col-sm-4">
                            <label for="inputEmail3" class="col-sm-3 col-md-3 control-label no-padding">Loan Provider</label>
                            <div class="col-sm-9 col-md-9">
                                <select class="form-control input-sm" select2='Supplier' ng-model="SearchRequest.loanproviderid"
                                        ng-options="item.id as item.name for item in LoanProviders track by item.id"></select>
                            </div>
                        </div>
                        <div class="col-md-8 col-sm-8">
                            <label for="inputEmail3" class="col-sm-1 col-md-1 control-label no-padding">Date</label>
                            <div class="col-sm-4 col-md-4">
                                <input type="text" daterange="SearchRequest.fromdate,SearchRequest.todate" class="form-control pull-right input-sm">
                            </div>
                            <div class="col-sm-2 col-md-2 no-padding">
                                <button type="button" class="btn btn-primary btn-sm btn-box pull-right" ng-click="SearchRegister()">Search</button>
                            </div>
                        </div>


                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12" id="gridContainer">



                        </div>
                    </div>

                </div>
            </div>
        </section>
    </div>
    <!-- /.content-wrapper -->
</div>
