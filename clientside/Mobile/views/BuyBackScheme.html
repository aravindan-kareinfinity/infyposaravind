<div>
    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
        <!-- Content Header (Page header) -->
        <section class="content-header">
            <h1>
                <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
                Mobile  /   Buy Back
            </h1>
            <ol class="breadcrumb">
                <li style="cursor:pointer" ng-click="ShowSearch=false;New()"><a><i class="fa fa-file"></i>New</a></li>
                <li style="cursor:pointer" ng-hide="ShowSearch" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
                <li style="cursor:pointer" ng-hide="ShowSearch" ng-click="ShowSearch=true"><a><i class="fa fa-search"></i>Search</a></li>
                <li style="cursor:pointer" ng-show="ShowSearch" ng-click="Edit()"><a><i class="fa fa-edit"></i>Edit</a></li>
                <li style="cursor:pointer" ng-show="ShowSearch" ng-click="Delete()"><a><i class="fa fa-trash"></i>Delete</a></li>
            </ol>
        </section>
        <!-- Main content -->
        <section class="content">
            <!-- Your Page Content Here -->
            <div class="box box-primary" ng-hide="ShowSearch">
                <div class="box-body">
                    <div class="col-md-6">

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group required control-label">Date</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" class="form-control pull-right input-sm" datemodule="BuyBackScheme.schemedate" ng-model="DOA.schemedate" focuid="first">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group required control-label">Scheme Name</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="BuyBackScheme.name"
                                               focusid="schemename"
                                               focusonenter="supplierid">
                                    </div>

                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Supplier</label>
                                    <div class="col-md-8">
                                        <select class="form-control input-sm" style="width: 100%;" select2=""
                                                ng-options="item.id as item.name for item in Suppliers track by item.id"
                                                ng-model="BuyBackScheme.supplierid"
                                                focusid="supplierid"
                                                focusonenter="productid"></select>
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Product</label>
                                    <div class="col-md-8">
                                        <select class="form-control input-sm" style="width: 100%;" select2=""
                                                ng-options="item.id as item.name for item in Products track by item.id"
                                                ng-model="BuyBackScheme.productid" ng-change="FilterItemList()"
                                                focusid="productid"
                                                focusonenter="brandid"></select>
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Brand</label>
                                    <div class="col-md-8">
                                        <select class="form-control input-sm" style="width: 100%;" select2=""
                                                ng-options="item.id as item.name for item in BrandName track by item.id"
                                                ng-model="BuyBackScheme.brandid" ng-change="FilterItemList()"
                                                focusid="brandid"
                                                focusonenter="itemid"></select>
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group required control-label">Scheme discount</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" ng-model="BuyBackScheme.schemediscount" class="form-control pull-right input-sm">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>


                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group required control-label">From Date</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" class="form-control pull-right input-sm"
                                               datemodule="BuyBackScheme.fromdate" ng-model="DOA.schemedate" focuid="first">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group required control-label">To Date</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" class="form-control pull-right input-sm" 
                                               datemodule="BuyBackScheme.todate" ng-model="DOA.schemedate" focuid="first">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>


                        <!-- /.row -->



                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Active</label>
                                    <div class="col-md-1">
                                        <label>
                                            <input type="checkbox" class="icheckbox_minimal-blue" 
                                                   ng-model="BuyBackScheme.isactive" focusid="isactive">
                                        </label>
                                    </div>
                                    <div class="col-md-4">


                                    </div>
                                </div>
                                <!-- /.col -->
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Items</label>
                                    <div class="col-md-8">
                                        <select class="form-control input-sm" style="width: 100%;" select2=""
                                                ng-options="item.id as item.printingname for item in ItemList track by item.id"
                                                ng-model="BuyBackScheme.itemid"
                                                focusid="itemid"
                                                focusonenter="dateselection"></select>
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Minimum</label>
                                    <div class="col-md-3">
                                        <input type="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="BuyBackScheme.minamt"
                                               focusid="minamt"
                                               focusonenter="maxamt">
                                    </div>

                                    <label for="inputEmail3" class="col-md-2 control-label no-padding">Maximum</label>
                                    <div class="col-md-3" style="padding-left:0px">


                                        <div class="input-group input-group-sm">
                                            <input type="text" class="form-control input-sm " style="width:100%;" ng-model="BuyBackScheme.maxamt"
                                                   focusid="maxid"
                                                   focusonenter="isactive">
                                            <span class="input-group-btn">
                                                <button type="button" class="btn btn-info btn-flat" ng-click="AddItem()">Add</button>
                                            </span>
                                        </div>

                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <table fixed-header="350px" class="fixed_table">
                                    <thead>

                                        <tr>
                                            <th style="width:35px">&nbsp;&nbsp;SNo</th>
                                            <th style="width:150px">Detail</th>
                                            <th style="width:60px">Minimum</th>
                                            <th style="width:60px">Maximum</th>
                                            <th style="width:60px">&nbsp;&nbsp;</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr ng-repeat="item in BuyBackScheme.items">
                                            <td>{{$index+1}}</td>
                                            <td>
                                                {{item.itemname}}
                                            </td>
                                            <td>{{item.min}}
                                            </td>
                                            <td>{{item.max}}</td>
                                            <td align="right" style="padding-right:5px">
                                                <button type="button" class="btn btn-primary btn-danger btn-xs" ng-click="DeleteItem(item)"><i class="fa fa-trash" aria-hidden="true"></i></button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


            <div class="box box-primary" ng-show="ShowSearch">
                <div class="box-body">
                    <div class="row row-padbot-15">
                        <div class="col-md-4 col-sm-4">
                            <label for="inputEmail3" class="col-sm-3 col-md-3 control-label no-padding">Supplier</label>
                            <div class="col-sm-9 col-md-9">
                                <select class="form-control input-sm" select2='Supplier' ng-model="SearchRequest.supplierid"
                                        ng-options="item.id as item.name for item in Suppliers track by item.id"></select>
                            </div>
                        </div>
                        <div class="col-md-8 col-sm-8">
                            <label for="inputEmail3" class="col-sm-1 col-md-1 control-label no-padding">Brand</label>
                            <div class="col-sm-4 col-md-4">
                                <select class="form-control input-sm" style="width: 100%;" select2=""
                                        ng-options="item.id as item.name for item in BrandName track by item.id"
                                        ng-model="SearchRequest.brandid"></select>
                            </div>
                            <label for="inputEmail3" class="col-sm-1 col-md-1 control-label no-padding">Date</label>
                            <div class="col-sm-4 col-md-4">
                                <input type="text" daterange="SearchRequest.fromdate,SearchRequest.todate" class="form-control pull-right input-sm">
                            </div>
                            <div class="col-sm-2 col-md-2 no-padding">
                                <button type="button" class="btn btn-primary btn-sm btn-box pull-right" ng-click="SearchRegister()">Search</button>
                            </div>
                        </div>


                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12" id="gridContainer">



                        </div>
                    </div>

                </div>
            </div>
        </section>
    </div>
    <!-- /.content-wrapper -->
</div>
