<div>
    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
        <!-- Content Header (Page header) -->
        <section class="content-header">
            <h1>
                <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
                Mobile  /   Recharge Schemes
            </h1>
            <ol class="breadcrumb">
                <li style="cursor:pointer" ng-click="ShowSearch=false;New()"><a><i class="fa fa-file"></i>New</a></li>
                <li style="cursor:pointer" ng-hide="ShowSearch" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
                <li style="cursor:pointer" ng-hide="ShowSearch" ng-click="ShowSearch=true"><a><i class="fa fa-search"></i>Search</a></li>
            </ol>
        </section>
        <!-- Main content -->
        <section class="content">
            <!-- Your Page Content Here -->
            <div class="box box-primary" ng-hide="ShowSearch">
                <div class="box-body">
                    <div class="col-md-4">

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group required control-label">Date</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" class="form-control pull-right input-sm" datemodule="DOA.schemedate" ng-model="DOA.schemedate" focuid="first">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group required control-label">Operator Name</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="RechargeScheme.name"
                                               focusid="schemename"
                                               focusonenter="supplierid">
                                    </div>

                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Supplier</label>
                                    <div class="col-md-8">
                                        <select class="form-control input-sm" style="width: 100%;" select2=""
                                                ng-options="item.id as item.name for item in Suppliers track by item.id"
                                                ng-model="RechargeScheme.supplierid"
                                                focusid="supplierid"
                                                focusonenter="productid"></select>
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Product</label>
                                    <div class="col-md-8">
                                        <select class="form-control input-sm" style="width: 100%;" select2=""
                                                ng-options="item.id as item.name for item in Products track by item.id"
                                                ng-model="RechargeScheme.productid" ng-change="FilterItemList()"
                                                focusid="productid"
                                                focusonenter="brandid"></select>
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Items</label>
                                    <div class="col-md-8">
                                        <select class="form-control input-sm" style="width: 100%;" select2=""
                                                ng-options="item.id as item.printingname for item in ItemList track by item.id"
                                                ng-model="RechargeScheme.itemid"
                                                focusid="itemid"
                                                focusonenter="dateselection"></select>
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>



                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Cash Back %</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" ng-model="RechargeScheme.cashbackinpercentage" class="form-control pull-right input-sm">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>


                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 control-label">Active</label>
                                    <div class="col-md-1">
                                        <label>
                                            <input type="checkbox" class="icheckbox_minimal-blue" ng-model="RechargeScheme.isactive" focusid="isactive">
                                        </label>
                                    </div>
                                    <div class="col-md-4">


                                    </div>
                                </div>
                                <!-- /.col -->
                            </div>
                        </div>

                        <div class="row row-padbot-15">
                            <h4>Options</h4>
                        </div>


                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group required control-label">Description</label>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control input-sm" style="width: 100%;"
                                               ng-model="RechargeScheme.description"
                                               focusid="schemename"
                                               focusonenter="supplierid">
                                    </div>

                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Active Dates</label>
                                    <div class="col-md-8">
                                        <input type="text" id="reservation" daterange="RechargeScheme.fromdate,RechargeScheme.todate" class="form-control pull-right input-sm">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>



                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Rate/Discount</label>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" ng-model="RechargeScheme.rate" class="form-control pull-right input-sm">
                                    </div>
                                    <div class="col-md-4">
                                        <input type="text" id="reservation" ng-model="RechargeScheme.discount" class="form-control pull-right input-sm">
                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>


                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="inputEmail3" class="col-md-4 form-group control-label">Cash Back</label>


                                    <div class="col-md-4 col-sm-4">

                                        <div class="input-group input-group-sm">
                                            <input type="text" id="reservation" ng-model="RechargeScheme.cashback" class="form-control pull-right input-sm">
                                            <span class="input-group-btn">
                                                <button class="btn btn-sm btn-primary btn-box" ng-click="AddItem()">
                                                    <i class="fa fa-plus"></i>
                                                </button>
                                            </span>
                                        </div>

                                    </div>
                                </div>
                            </div>
                            <!-- /.col -->
                        </div>

                    </div>

                    <div class="col-md-8">




                        <div class="row row-padbot-15">
                            <div class="col-md-12">
                                <table fixed-header="420px" class="fixed_table">
                                    <thead>

                                        <tr>
                                            <th style="width:35px">&nbsp;&nbsp;SNo</th>
                                            <th style="width:100px">Name</th>
                                            <th style="width:80px">Rate</th>
                                            <th style="width:100px">Active Dates</th>
                                            <th style="width:80px">Cashback</th>
                                            <th style="width:80px">Discount</th>
                                            <th style="width:80px">New Conn</th>
                                            <th style="width:80px">Unlimitted</th>
                                            <th style="width:80px">Rate-Cutter</th>
                                            <th style="width:80px">Active</th>
                                            <th style="width:30px">&nbsp;&nbsp;</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr ng-repeat="item in RechargeScheme.items">
                                            <td>{{$index+1}}</td>
                                            <td>
                                                {{item.description}}
                                            </td>
                                            <td>
                                                {{item.rate}}
                                            </td>
                                            <td>
                                                {{item.from |date:dd-MM-yyyy}} - {{item.to |date:dd-MM-yyyy}}
                                            </td>
                                            <td style="padding-right:10px">
                                                <input type="text"
                                                       ng-model="item.cashback" class="form-control pull-right input-sm">
                                            </td>
                                            <td style="padding-right:10px">
                                                <input type="text"
                                                       ng-model="item.discount" class="form-control pull-right input-sm">
                                            </td>
                                            <td>
                                                <input type="checkbox"
                                                       ng-model="item.isnewconnection" style="text-align:center" class="icheckbox_minimal-blue">
                                            </td>
                                            <td>
                                                <input type="checkbox"
                                                       ng-model="item.isunlimitted" style="text-align:center" class="icheckbox_minimal-blue">
                                            </td>
                                            <td>
                                                <input type="checkbox"
                                                       ng-model="item.isratecutter" style="text-align:center" class="icheckbox_minimal-blue">
                                            </td>
                                            <td>
                                                <input type="checkbox"
                                                       ng-model="item.isactive" style="text-align:center" class="icheckbox_minimal-blue">
                                            </td>
                                            <td align="right" style="padding-right:5px">
                                                <button type="button" class="btn btn-primary btn-danger btn-xs" ng-click="DeleteItem(item)"><i class="fa fa-trash" aria-hidden="true"></i></button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


            <div class="box box-primary" ng-show="ShowSearch">
                <div class="box-body">
                    <div class="row row-padbot-15">
                        <div class="col-md-4 col-sm-4">
                            <label for="inputEmail3" class="col-sm-3 col-md-3 control-label no-padding">Supplier</label>
                            <div class="col-sm-9 col-md-9">
                                <select class="form-control input-sm" select2='Supplier' ng-model="SearchRequest.supplierid"
                                        ng-options="item.id as item.name for item in Suppliers track by item.id"></select>
                            </div>
                        </div>
                        <div class="col-md-8 col-sm-8">
                            <label for="inputEmail3" class="col-sm-1 col-md-1 control-label no-padding">Product</label>
                            <div class="col-sm-4 col-md-4">
                                <select class="form-control input-sm" style="width: 100%;" select2=""
                                        ng-options="item.id as item.name for item in Products track by item.id"
                                        ng-model="SearchRequest.productid"></select>
                            </div>
                            <div class="col-sm-2 col-md-2 no-padding">
                                <button type="button" class="btn btn-primary btn-sm btn-box pull-right" ng-click="SearchRegister()">Search</button>
                            </div>
                        </div>


                    </div>
                    <div class="row row-padbot-15">
                        <div class="col-md-12" id="gridContainer">



                        </div>
                    </div>

                </div>
            </div>
        </section>
    </div>
    <!-- /.content-wrapper -->
</div>
