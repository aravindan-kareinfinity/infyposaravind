<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
        <h1>
            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            CRM / Feedback Configuration
        </h1>
        <ol class="breadcrumb">
            <li ng-show="Navigation.save" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
        </ol>
    </section>
    <!-- Main content -->
    <section class="content">
        <div class="row">

            <div class="box box-info">
                <div class="box-body">
                    


                    <div class="col-md-5 no-padding col-sm-12 ">
                        <div class="col-md-12 row-padbot-15">
                            Desktop Banner
                        </div>
                        <div class="col-md-12 row-padbot-15">
                            <div class="col-md-4">
                                Image
                            </div>
                            <div class="col-md-6">
                                <div class="col-md-6">
                                    <file-upload class="btn btn-sm btn-success btn-rad btn-trans file-upload"
                                                 resize="true" max-width="1280"
                                                 max-height="1280" preview="false" ng-model="Organization.desktopbanner"
                                                 filemodel="Organization.desktopbanner"
                                                 multiple="false">
                                        <i class="fa fa-upload"></i>
                                        <span>Upload</span>
                                    </file-upload>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-12 row-padbot-15">
                            <div class="col-md-4">
                                Size
                            </div>
                            <div class="col-md-4">
                                <div class="col-md-5">Width</div>
                                <div class="col-md-7 no-padding">
                                    <input type="number" class="form-control input-sm" style="width: 100%;"
                                           ng-model="Organization.desktopbannerwidth">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="col-md-5">Height</div>
                                <div class="col-md-7 no-padding">
                                    <input type="number" class="form-control input-sm" style="width: 100%;"
                                           ng-model="Organization.desktopbannerheight">
                                </div>
                            </div>

                        </div>

                        <div class="col-md-12 row-padbot-15">
                            Mobile Banner
                        </div>

                        <div class="col-md-12 row-padbot-15">
                            <div class="col-md-4">
                                Image
                            </div>
                            <div class="col-md-6">
                                <div class="col-md-6">
                                    <file-upload class="btn btn-sm btn-success btn-rad btn-trans file-upload"
                                                 resize="true" max-width="1280"
                                                 max-height="1280" preview="false" ng-model="Organization.mobilebanner"
                                                 filemodel="Organization.mobilebanner"
                                                 multiple="false">
                                        <i class="fa fa-upload"></i>
                                        <span>Upload</span>
                                    </file-upload>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-12 row-padbot-15">
                            <div class="col-md-4">
                                Size
                            </div>
                            <div class="col-md-4">
                                <div class="col-md-5">Width</div>
                                <div class="col-md-7 no-padding">
                                    <input type="number" class="form-control input-sm" style="width: 100%;"
                                           ng-model="Organization.mobilebannerwidth">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="col-md-5">Height</div>
                                <div class="col-md-7 no-padding">
                                    <input type="number" class="form-control input-sm" style="width: 100%;"
                                           ng-model="Organization.mobilebannerheight">
                                </div>
                            </div>

                        </div>


                        <div class="col-md-12 row-padbot-15">
                            Feedback Form Labels
                        </div>

                        <div class="col-md-12 row-padbot-15">
                            <div class="col-md-4">
                                Name
                            </div>
                            <div class="col-md-8">
                                <input type="text" class="form-control input-sm" style="width: 100%;"
                                       ng-model="Organization.feedbackname">
                            </div>
                        </div>

                        <div class="col-md-12 row-padbot-15">
                            <div class="col-md-4">
                                Mobile No
                            </div>
                            <div class="col-md-8">
                                <input type="text" class="form-control input-sm" style="width: 100%;"
                                       ng-model="Organization.feedbackmobileno">
                            </div>
                        </div>

                        <div class="col-md-12 row-padbot-15">
                            <div class="col-md-4">
                                Ratings
                            </div>
                            <div class="col-md-8">
                                <input type="text" class="form-control input-sm" style="width: 100%;"
                                       ng-model="Organization.feedbackrating">
                            </div>
                        </div>

                        <div class="col-md-12 row-padbot-15">
                            <div class="col-md-4">
                                Serial Number
                            </div>
                            <div class="col-md-8">
                                <input type="checkbox"
                                       ng-model="Organization.feedbackserialno" />
                            </div>
                        </div>

                        <div class="col-md-12 row-padbot-15">
                            <div class="col-md-4">
                                Complaints
                            </div>
                            <div class="col-md-2">
                                <input type="checkbox"
                                       ng-model="Organization.collectcomplaint" />
                            </div>
                            <div class="col-md-3" ng-show="Organization.collectcomplaint">
                                Lines
                            </div>
                            <div class="col-md-3" ng-show="Organization.collectcomplaint">
                                <input type="text" class="form-control input-sm" style="width: 100%;"
                                       ng-model="Organization.feedbackcomplaintheight">
                            </div>
                            <div class="col-md-12" style="margin-top:10px"  ng-show="Organization.collectcomplaint">
                                <input type="text" class="form-control input-sm" style="width: 100%;"
                                       ng-model="Organization.feedbackcomplaint">
                            </div>
                        </div>

                        <div class="col-md-12 row-padbot-15">
                            <div class="col-md-4">
                                Suggestion
                            </div>
                            <div class="col-md-2">
                                <input type="checkbox"
                                       ng-model="Organization.collectsuggestion" />
                            </div>
                            <div class="col-md-3" ng-show="Organization.collectsuggestion">
                                Lines
                            </div>
                            <div class="col-md-3" ng-show="Organization.collectsuggestion">
                                <input type="text" class="form-control input-sm" style="width: 100%;"
                                       ng-model="Organization.feedbacksuggestionheight">
                            </div>
                            <div class="col-md-12" style="margin-top:10px" ng-show="Organization.collectsuggestion">
                                <input type="text" class="form-control input-sm" style="width: 100%;"
                                       ng-model="Organization.feedbacksuggestion">
                            </div>
                        </div>

                    </div>

                    <div class="col-md-7 no-padding col-sm-12 ">
                        <div class="col-md-12">
                            Feedback -> Header
                        </div>
                        <div class="col-md-12 row-padbot-15">
                            <div></div>
                            <div id="headersummernote" name="headersummernote"><p></p></div>
                        </div>
                        <div class="col-md-12">
                            Feedback -> Response
                        </div>
                        <div class="col-md-12 row-padbot-15">
                            <div></div>
                            <div id="responsesummernote" name="responsesummernote"><p></p></div>
                        </div>
                    </div>
                </div>

                
            </div>



        </div>


    </section>
</div>
<!-- /.content-wrapper -->
