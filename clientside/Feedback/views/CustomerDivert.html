
<div class="content-wrapper">
    <!-- Content Header (Page header) -->

    <section class="content-header">

            <a href back-button><i class="fa fa-arrow-left" style="font-size:large"></i></a>
            CRM  /  Customer Divert
        </h1>
        <ol class="breadcrumb">
            <li ng-show="Navigation.create" style="cursor:pointer" ng-click="New()"><a><i class="fa fa-file"></i>New</a></li>
            <li ng-show="Navigation.save" style="cursor:pointer" ng-click="Save()"><a><i class="fa fa-save"></i>Save</a></li>
            <li ng-show="Navigation.delete" style="cursor:pointer" ng-click=""><a><i class="fa fa-trash"></i>Delete</a></li>
            <li ng-show="Navigation.search" style="cursor:pointer" ng-click="SwitchPanel();Navigation.SetMode('SEARCH')"><a><i class="fa fa-search"></i>Search</a></li>

        </ol>

    <!-- Main content -->
    <section class="content">
        <!-- Your Page Content Here -->
        <div class="box box-primary" ng-hide="ShowSearch">
            <div class="box-body no-border">

                <div class="col-md-12">
                    <div class="col-md-6">
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Date</label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control input-sm datepicker" datemodule="Customerdivert.diverton" ng-model="diverton" focusid="diverton" focusonenter="ccinchargeid">
                                </div>
                            </div>
                        </div>
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">CC Incharge</label>
                                <div class="col-md-8">
                                    <select class="form-control" select2=''
                                            ng-model="Customerdivert.ccinchargeid" style="width:100%"
                                            options="item.id as item.name for item in Employee track by item.id" focusid="ccinchargeid" focusonenter="sectionid"></select>
                                </div>
                            </div>
                        </div>
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Section</label>
                                <div class="col-md-8">
                                    <select class="form-control" select2=''
                                            ng-model="Customerdivert.sectionid" style="width:100%"
                                            options="item.id as item.name for item in Sections track by item.id" focusid="sectionid" focusonenter="customername"></select>
                                </div>
                            </div>
                        </div>
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Customer Name</label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control input-sm" id="inputEmail3" placeholder=""
                                           ng-model="Customerdivert.customername" focusid="customername" focusonenter="mobileno">
                                </div>
                            </div>
                        </div>
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Customer Mobileno</label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control input-sm" id="inputEmail3" placeholder=""
                                           ng-model="Customerdivert.mobileno" focusid="mobileno" focusonenter="customertypeid">
                                </div>
                            </div>
                        </div>

                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Customer Type</label>
                                <div class="col-md-8">
                                    <select class="form-control" select2=''
                                            ng-model="Customerdivert.customertypeid" style="width:100%"
                                            options="item.id as item.name for item in CustomerType track by item.id" focusid="customertypeid" focusonenter="reason"></select>
                                </div>
                            </div>
                        </div>
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Reason</label>
                                <div class="col-md-8">
                                    <textarea class="form-control input-sm" rows="4" ng-model="Customerdivert.reason" focusid="reason" focusonenter="sectioninchargeid"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Section Incharge</label>
                                <div class="col-md-8">
                                    <select class="form-control" select2=''
                                            ng-model="Customerdivert.sectioninchargeid" style="width:100%"
                                            options="item.id as item.name for item in Employee track by item.id" focusid="sectioninchargeid" focusonenter="sectionfeedback"></select>
                                </div>
                            </div>
                        </div>
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Section Response</label>
                                <div class="col-md-8">
                                    <textarea class="form-control input-sm" rows="4" ng-model="Customerdivert.sectionfeedback" focusid="sectionfeedback" focusonenter="actiontakenbyid"></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Action By</label>
                                <div class="col-md-8">
                                    <select class="form-control" select2=''
                                            ng-model="Customerdivert.actiontakenbyid" style="width:100%"
                                            options="item.id as item.name for item in Employee track by item.id" focusid="actiontakenbyid" focusonenter="actioncomments"></select>
                                </div>
                            </div>
                        </div>
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Final Response</label>
                                <div class="col-md-8">
                                    <textarea class="form-control input-sm" rows="4" ng-model="Customerdivert.actioncomments" focusid="actioncomments" focusonenter="actionstatus"></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="row row-padbot-15">
                            <div class="form-group">
                                <label for="inputEmail3" class="col-md-4 control-label">Status</label>
                                <div class="col-md-8">
                                    <select class="form-control" select2=''
                                            ng-model="Customerdivert.actionstatus" style="width:100%"
                                            options="item.id as item.name for item in DivertStatus track by item.id" focusid="actionstatus"></select>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
        <!-- /.row -->
        <div class="box box-primary" id="searchBox" ng-show="ShowSearch">
            <div class="box-body">
                <div class="col-md-3">
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>DATES</label>
                            <input type="text" class="form-control input-sm" style="width:100%" daterange="SearchCondition.fromdate,SearchCondition.todate" focusid="searchdate" focusonenter="company">
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>SECTION</label>
                            <select class="form-control" select2='Section' ng-options="item.id as item.name for item in Sections track by item.id" ng-model="SearchCondition.sectionid"></select>
                        </div>
                    </div>

                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>INCHARGE</label>
                            <select class="input-sm form-control" select2="" style="width: 100%;" ng-options="item.id  as item.name for item in Employee track by item.id"
                                    ng-model="SearchCondition.ccinchargeid"></select>
                        </div>
                    </div>
                    <div class="col-md-12 no-padding">
                        <div class="col-md-12">
                            <label>STATUS</label>
                            <select class="form-control" select2='Status' ng-options="item.id as item.name for item in DivertStatus track by item.id" ng-model="SearchCondition.actionstatus"></select>
                        </div>
                    </div>

                </div>
                <div class="col-md-9 no-padding">
                    <div class="col-md-12 no-padding" id="gridContainer">
                    </div>
                </div>

            </div>
        </div>
    </section>
</div>
